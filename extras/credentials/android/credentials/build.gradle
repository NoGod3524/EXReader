// Java entry for the Keystore-backed store; the C ABI comes from the
// independent CMake build of extras/credentials with the NDK toolchain.
plugins {
    id 'com.android.library'
}

android {
    namespace 'org.exreader.credentials'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}
