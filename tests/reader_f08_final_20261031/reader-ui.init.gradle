// Adds only the independent public-UI reader class to the existing helper APK.
gradle.beforeProject { suite ->
    if (suite.path == ':uitest') {
        suite.pluginManager.withPlugin('com.android.application') {
            def original = new File(suite.rootProject.projectDir,
                    '../../tests/reader_f08_final_20261031/ReaderF08UiTest.java')
            def generated = new File(suite.buildDir, 'generated/f08-reader-ui')
            def stage = suite.tasks.register('stageF08ReaderUi', Sync) {
                from original
                into generated
            }
            suite.android.sourceSets.androidTest.java.srcDir(generated)
            suite.tasks.matching { it.name.endsWith('AndroidTestJavaWithJavac') }.configureEach {
                dependsOn stage
            }
        }
    }
}
