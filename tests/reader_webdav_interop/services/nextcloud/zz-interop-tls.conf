# Mounted into the pinned Nextcloud apache image's conf-enabled directory.
# Apache terminates TLS itself with the per-run test CA; Nextcloud/SabreDAV
# serves WebDAV behind it unchanged. Ports 8443/9443 avoid Debian ports.conf
# conditional Listen 443. The access log never records Authorization.
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
Listen 8443
Listen 9443
LogFormat "%{%Y-%m-%dT%H:%M:%S}t\t%p\t%>s\t%{Depth}i\t%{If-None-Match}i\t%{User-Agent}i\t%B\t%r" interop
<VirtualHost *:8443>
  ServerName nextcloud.interop.test
  DocumentRoot /var/www/html
  SSLEngine on
  SSLCertificateFile /tls/trusted.crt
  SSLCertificateKeyFile /tls/trusted.key
  CustomLog /interop-logs/access.log interop
</VirtualHost>
<VirtualHost *:9443>
  ServerName nextcloud.interop.test
  DocumentRoot /var/www/html
  SSLEngine on
  SSLCertificateFile /tls/untrusted.crt
  SSLCertificateKeyFile /tls/untrusted.key
  CustomLog /interop-logs/access.log interop
</VirtualHost>
