# SPDX-License-Identifier: MIT
# Minimal Apache httpd mod_dav/mod_dav_fs service for job-local interop only.
# TLS is terminated by this server with a per-run test CA. The access log
# records method/raw request line/status and the If-None-Match/Depth request
# headers; it never records Authorization.
ServerRoot "/usr/local/apache2"
Listen 8443
Listen 9443
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
User daemon
Group daemon
ServerName apache.interop.test
ServerTokens Full
ErrorLog /srv/logs/error.log
LogLevel warn
LogFormat "%{%Y-%m-%dT%H:%M:%S}t\t%p\t%>s\t%{Depth}i\t%{If-None-Match}i\t%{User-Agent}i\t%B\t%r" interop
DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
  AllowOverride None
  Require all denied
</Directory>
DavLockDB "/srv/lock/DavLock"
Alias "/dav/" "/srv/dav/"
<Directory "/srv/dav">
  Dav On
  Options None
  AllowOverride None
  AuthType Basic
  AuthName "EXReader interop"
  AuthBasicProvider file
  AuthUserFile "/config/htpasswd"
  Require valid-user
</Directory>
<VirtualHost *:8443>
  ServerName apache.interop.test
  SSLEngine on
  SSLCertificateFile "/tls/trusted.crt"
  SSLCertificateKeyFile "/tls/trusted.key"
  CustomLog "/srv/logs/access.log" interop
</VirtualHost>
<VirtualHost *:9443>
  ServerName apache.interop.test
  SSLEngine on
  SSLCertificateFile "/tls/untrusted.crt"
  SSLCertificateKeyFile "/tls/untrusted.key"
  CustomLog "/srv/logs/access.log" interop
</VirtualHost>
