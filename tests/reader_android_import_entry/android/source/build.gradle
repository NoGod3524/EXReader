plugins { id 'com.android.application' }

android {
    namespace 'org.exreader.importprobe.source'
    compileSdk 35
    defaultConfig {
        applicationId 'org.exreader.importprobe.source'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError false; checkReleaseBuilds false }
}

// Two existing repository fixtures are served read-only through the DocumentsProvider.
def fixtureDir = layout.buildDirectory.dir('generated/fixtures')
tasks.register('copyFixtures', Copy) {
    from("${rootDir}/../../fixtures") { include 'cover-import.epub', 'pdf-public.pdf' }
    into fixtureDir
}
android.sourceSets.main.assets.srcDir fixtureDir
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { dependsOn 'copyFixtures' }
