[package]
name = "exreader"
version = "0.1.1"
description = "A local-first cross-platform ebook reader"
authors = ["EXReader contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "exreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
