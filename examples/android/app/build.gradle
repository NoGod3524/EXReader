plugins {
    id 'com.android.application'
}

def exrSdk = project.findProperty('exrSdk') ?: ''
def originalDiagnosticNative = project.findProperty('exrFrameMetricsOriginalNative') == 'true'

android {
    namespace 'org.exreader.host'
    compileSdk 35
    ndkVersion '27.0.12077973'
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'org.exreader.host'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'org.exreader.host.CatalogStoreTest'
        ndk {
            abiFilters 'x86_64'
        }
        if (!originalDiagnosticNative) externalNativeBuild {
            cmake {
                arguments "-DEXR_SDK=${exrSdk}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (!originalDiagnosticNative) externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    androidResources {
        noCompress += ['otf']
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
            if (originalDiagnosticNative) keepDebugSymbols += ['**/*.so']
        }
    }

    lint {
        abortOnError false
    }
}
