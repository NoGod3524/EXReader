plugins {
    id 'com.android.application'
}

def exrSdk = project.findProperty('exrSdk') ?: ''
def exrProduct = project.findProperty('exrProduct') ?: "${rootProject.projectDir}/../../stage/android-product"
def exrSync = project.findProperty('exrSync') == 'true'
def exrSearch = project.findProperty('exrSearch') == 'true'
def exrSearchPrefix = project.findProperty('exrSearchPrefix') ?: "${rootProject.projectDir}/../../stage/android-search"
def exrNavigation = project.findProperty('exrNavigation') == 'true'
def exrNavigationPrefix = project.findProperty('exrNavigationPrefix') ?: "${rootProject.projectDir}/../../stage/android-navigation"
def exrReading = project.findProperty('exrReading') == 'true'
def exrPreferences = project.findProperty('exrPreferences') == 'true'
def exrPageTheme = project.findProperty('exrPageTheme') == 'true'
def exrSelectorBytes = project.findProperty('exrSelectorBytes') == 'true'
def exrRecordInterop = project.findProperty('exrRecordInterop') == 'true'
def exrPreferencesPrefix = project.findProperty('exrPreferencesPrefix') ?: "${rootProject.projectDir}/../../stage/android-preferences"
def exrDav = project.findProperty('exrDav') ?: "${rootProject.projectDir}/../../stage/android-dav"
def exrSideload = project.findProperty('exrSideload') ?: "${rootProject.projectDir}/../../stage/android-sideload"

android {
    namespace 'org.exreader.host'
    compileSdk 35
    ndkVersion '27.0.12077973'
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'org.exreader.host'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'boolean', 'READER_SYNC', exrSync.toString()
        buildConfigField 'boolean', 'READER_SEARCH', exrSearch.toString()
        buildConfigField 'boolean', 'READER_NAVIGATION', exrNavigation.toString()
        buildConfigField 'boolean', 'READER_READING', exrReading.toString()
        buildConfigField 'boolean', 'READER_PREFERENCES', exrPreferences.toString()
        buildConfigField 'boolean', 'READER_PAGE_THEME', exrPageTheme.toString()
        buildConfigField 'boolean', 'READER_SELECTOR_BYTES_CANDIDATE', exrSelectorBytes.toString()
        testInstrumentationRunner (project.findProperty('exrTestRunner') ?: 'org.exreader.host.CatalogStoreTest')
        ndk {
            abiFilters 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DEXR_SDK=${exrSdk}", "-DEXR_PRODUCT=${exrProduct}", '-DANDROID_STL=c++_static'
                arguments "-DEXR_HOST_SYNC=${exrSync ? 'ON' : 'OFF'}", "-DEXR_DAV=${exrDav}", "-DEXR_SIDELOAD=${exrSideload}"
                arguments "-DEXR_HOST_SEARCH=${exrSearch ? 'ON' : 'OFF'}", "-DEXR_SEARCH_PREFIX=${exrSearchPrefix}"
                arguments "-DEXR_HOST_NAVIGATION=${exrNavigation ? 'ON' : 'OFF'}", "-DEXR_NAVIGATION_PREFIX=${exrNavigationPrefix}"
                arguments "-DEXR_HOST_READING=${exrReading ? 'ON' : 'OFF'}"
                arguments "-DEXR_HOST_PREFERENCES=${exrPreferences ? 'ON' : 'OFF'}", "-DEXR_PREFERENCES_PREFIX=${exrPreferencesPrefix}"
                arguments "-DEXR_HOST_PAGE_THEME=${exrPageTheme ? 'ON' : 'OFF'}"
                arguments "-DEXR_READER_SELECTOR_BYTES_CANDIDATE=${exrSelectorBytes ? 'ON' : 'OFF'}"
                arguments "-DEXR_ANDROID_RECORD_INTEROP_REVIEW=${exrRecordInterop ? 'ON' : 'OFF'}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    androidResources {
        noCompress += ['otf']
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
    if(exrSync) {
        sourceSets {
            debug {
                manifest.srcFile '../../../tests/reader_host_session_android/debug/AndroidManifest.xml'
                res.srcDir '../../../tests/reader_host_session_android/debug/res'
                java.srcDir '../../../tests/reader_host_session_android/debug/java'
            }
            androidTest {
                manifest.srcFile '../../../tests/reader_host_session_android/AndroidManifest.xml'
                java.srcDir (exrPageTheme ? '../../../build/android-page-theme/candidate/host-session/java' : '../../../tests/reader_host_session_android/java')
            }
        }
    }
    if(exrReading) {
        sourceSets {
            debug { java.srcDir '../../../tests/reader_android_reading/debug/java' }
            androidTest {
                java.srcDir '../../../tests/reader_android_reading/java'
                java.srcDir '../../../tests/reader_android_cbz_reading/java'
                java.srcDir '../../../tests/reader_android_fixed_pan/java'
            }
        }
    }
    if(exrPreferences) {
        sourceSets {
            debug { java.srcDir '../../../tests/reader_android_preferences/debug/java' }
            androidTest { java.srcDir (exrPageTheme ? '../../../build/android-page-theme/candidate/preferences/java' : '../../../tests/reader_android_preferences/java') }
        }
    }
    if(exrNavigation) {
        sourceSets {
            debug { java.srcDir '../../../tests/reader_android_navigation/debug/java' }
            androidTest { java.srcDir '../../../tests/reader_android_navigation/java' }
        }
    }
    if(exrSearch) {
        sourceSets {
            debug { java.srcDir '../../../tests/reader_android_search/debug/java' }
            androidTest { java.srcDir '../../../tests/reader_android_search/java' }
        }
    }
    if(project.findProperty('exrHostImport') == 'true') {
        sourceSets.androidTest.java.srcDir '../../../tests/reader_android_host_import/java'
    }
    if(exrPageTheme) { sourceSets.androidTest.java.srcDir '../../../tests/reader_android_page_theme/java' }
    if(exrRecordInterop) {
        sourceSets.debug.java.srcDir '../../../tests/reader_android_record_interop/debug/java'
        sourceSets.androidTest.java.srcDir '../../../tests/reader_android_record_interop/java'
        if(exrSelectorBytes) {
            sourceSets.debug.java.srcDir '../../../tests/reader_android_raw3/debug/java'
            sourceSets.androidTest.java.srcDir '../../../build/android-raw3/candidate/java'
        }
    }
}
dependencies {
    implementation project(':webdav')
    implementation project(':credentials')
    implementation project(':importentry')
}
