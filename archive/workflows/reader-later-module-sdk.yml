name: Exact SDK dependencies of later reader modules
on:
  push:
    branches: [codex/reader-hosts-341-final]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  modules:
    name: installed exact SDK modules (${{matrix.key}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux
          - os: windows-2022
            key: windows
          - os: macos-15
            key: macos
    runs-on: ${{matrix.os}}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux native network and XML dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libcurl4-openssl-dev libxml2-dev
      - name: Windows native compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c ('"{0}" >nul && set' -f $bat) | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apple native network and XML dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config
          sdkroot=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build/apple-pkgconfig
          version=$(/usr/bin/curl --version | awk 'NR==1 {print $2}')
          cat > build/apple-pkgconfig/libcurl.pc <<EOF
          prefix=${sdkroot}/usr
          Name: libcurl
          Description: Apple SDK system libcurl
          Version: ${version}
          Libs: -L\${prefix}/lib -lcurl
          Cflags:
          EOF
          echo "PKG_CONFIG_PATH=${PWD}/build/apple-pkgconfig" >> "$GITHUB_ENV"
      - name: Parse source only in Actions
        run: python3 -m py_compile tests/reader_hosts_341/later_modules.py
      - name: Build both real SDKs and installed modules then refuse wrong providers
        run: python3 tests/reader_hosts_341/later_modules.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-later-module-sdk-${{matrix.key}}-${{github.run_id}}-${{github.run_attempt}}
          path: |
            build/later-module-sdk/result.json
            build/later-module-sdk/*.log
            build/later-module-sdk/modules-*/lib/cmake/**
            build/later-module-sdk/consumer-*/later-sdk*
          if-no-files-found: error
