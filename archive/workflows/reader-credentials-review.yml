name: Strict credential evidence review
on:
  push:
    branches: [codex/reader-credentials-review]
    paths:
      - tests/reader_credentials/**
      - .github/workflows/reader-credentials.yml
      - .github/workflows/reader-credentials-review.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the frozen SDK and all five tested implementations
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 51df983235d37d30836f00071faf90b41670cf06 HEAD
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code e2247deb35b52615810508092441922c4e4f7913 HEAD -- extras/credentials tests/reader_credentials/check_credentials.py tests/reader_credentials/consumer tests/reader_credentials/android tests/reader_credentials/ios
      - name: Actual ZIP and report rejection regressions
        run: python3 tests/reader_credentials/check_aggregate.py --output build/credentials-review/rejections
      - name: Rehash original five archives and verify their complete identities
        run: python3 tests/reader_credentials/aggregate.py --run-id 40057087875 --attempt 1 --source-sha e2247deb35b52615810508092441922c4e4f7913 --downloads build/credentials-downloads --output build/credentials-review/strict
      - name: Preserve the strict verdict and rejection record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-credentials-strict-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/credentials-review/
          if-no-files-found: error
