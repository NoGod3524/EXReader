name: R4 retained PDF CMap diagnosis
on:
  push:
    branches: ['codex/r4-core-hotspots']
    paths: ['tests/r4_core/cmap_diagnose.py', '.github/workflows/r4-cmap-diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r2-real-corpus-39888135957-1
          run-id: 39888135957
          github-token: ${{ github.token }}
          path: build/r2
      - run: python3 -m pip install PyMuPDF==1.26.7
      - run: python3 tests/r4_core/cmap_diagnose.py build/r2/inputs/assets build/cmap-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-cmap-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/cmap-diagnostic
          if-no-files-found: error
