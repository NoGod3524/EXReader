name: R4 core anchor optimization
on:
  push:
    branches: ['codex/r4-core-hotspots']
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'tests/**'
      - '!tests/r4_core/cmap_diagnose.py'
      - '!tests/r4_core/real_pdf.py'
      - 'tools/r4_anchor_probe.c'
      - '.github/workflows/r4-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: paired unchanged-baseline and candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9bd2b2c3caf1f63dc4437e0af978247494e87145
          path: engine
      - name: Build baseline and candidate with identical reading options
        shell: bash
        run: |
          mkdir -p build
          for role in baseline candidate; do
            source=engine
            if [ "$role" = candidate ]; then source=.; fi
            cmake --preset reading-core -S "$source" -DEXR_BUILD_TESTS=ON -DCMAKE_C_FLAGS='-fno-omit-frame-pointer' -DCMAKE_INSTALL_PREFIX="$PWD/stage/$role"
            cmake --build "$source/build/reading-core" --parallel 4
            cmake --install "$source/build/reading-core"
            ctest --test-dir "$source/build/reading-core" --output-on-failure --no-tests=error -R 'native-(anchor|fixed-text|chapter|cfi)' --output-junit "$PWD/build/$role-native.xml"
            cmake -S tests/r4_core -B "build/probe-$role" -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$PWD/stage/$role" -DCMAKE_C_FLAGS='-fno-omit-frame-pointer'
            cmake --build "build/probe-$role" --parallel 4
            ctest --test-dir "build/probe-$role" --output-on-failure --no-tests=error --output-junit "$PWD/build/$role-regression.xml"
          done
          cc --version > build/compiler.txt
      - name: Compare alternating fresh-process anchor and page results
        run: python3 tests/r4_core/run.py --binary build/probe-candidate/r4-anchor-probe --baseline-binary build/probe-baseline/r4-anchor-probe --font engine/tests/fixtures/fonts/primary.ttf --engine . --baseline-engine engine --output build/evidence --profile release
      - name: Print same-run measurements
        if: always()
        run: |
          if [ -f build/evidence/summary.json ]; then cat build/evidence/summary.json; fi
      - name: Preserve same-source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-anchor-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/evidence/
            build/probe-baseline/
            build/probe-candidate/
            build/compiler.txt
            build/*-native.xml
            build/*-regression.xml
            build/reading-core/CMakeCache.txt
            engine/build/reading-core/CMakeCache.txt
          if-no-files-found: error
  sanitize:
    name: candidate ASan and UBSan
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native candidate regressions with sanitizers
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SANITIZE=ON -DEXR_ENABLE_AAC=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_JNI=OFF -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          cmake --build build/native --parallel 4
          ctest --test-dir build/native --output-on-failure --no-tests=error --output-junit "$PWD/build/sanitizer-native.xml"
          cmake --install build/native
          cmake -S tests/r4_core -B build/probe-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$PWD/stage" -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build/probe-sanitize --parallel 4
          ctest --test-dir build/probe-sanitize --output-on-failure --no-tests=error --output-junit "$PWD/build/sanitizer-r4.xml"
      - name: Preserve sanitizer regressions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-anchor-sanitizer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/sanitizer-*.xml
            build/native/Testing/Temporary/
            build/probe-sanitize/Testing/Temporary/
          if-no-files-found: error
