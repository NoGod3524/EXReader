name: Reader next C06 root review raw3 portable annotations
on:
  push:
    branches: [codex/reader-next-c06-root-review]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  c06:
    name: c06 raw3 portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing build tool version
        run: python -m pip install ninja==1.11.1.1
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build default, fixed-baseline and explicit raw0.2 installed families; judge with independent readers and the certified Mac records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_next_c06/run.py
      - name: Preserve builds' logs, probe transcripts, exports and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-next-c06-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/c06/*.log
            build/c06/result.json
            build/c06/probe-logs/
            build/c06/raw/out/
            build/c06/mac/out/
            build/c06/legacy-*/legacy.jsonl
            build/c06/legacy-*/legacy.md
            build/c06/raw-stage/
            build/c06/off-stage/
            build/c06/core-raw-stage/
            build/c06/raw-consumer/c06-probe*
            build/c06/raw-consumer/c06-link.map
            build/c06/off-consumer/c06-probe*
          if-no-files-found: error
  evidence:
    name: same-run artifact evidence
    needs: c06
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifact ids, bytes, digests, reports and cross-platform output identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_next_c06/check_artifacts.py build/c06-evidence
      - name: Preserve the artifact verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-next-c06-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/c06-evidence/
          if-no-files-found: error
