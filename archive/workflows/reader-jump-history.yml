name: Reader jump history
on:
  push:
    branches: [codex/reader-jump-history, codex/reader-jump-history-review]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  consumers:
    name: jump history consumers (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-2022
            platform: Windows
          - os: macos-15
            platform: macOS
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source, common start, protected SDK, schema1 and J07 ownership
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f43baf9182d75907c0cb5d6f77048f27bca8c950 HEAD
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code f32bb8aa18ed3de286900f19ce4230fd93435dd0 HEAD -- apps/reader/store/001_catalog.sql
          git diff --exit-code f43baf9182d75907c0cb5d6f77048f27bca8c950 HEAD -- apps/reader/reading-state apps/reader/revisions apps/reader/store apps/reader/sync apps/reader/commands docs/handoffs
          if git diff --name-only f43baf9182d75907c0cb5d6f77048f27bca8c950 HEAD | grep -v -E '^(apps/reader/jump-history/|tests/reader_jump_history/|\.github/workflows/reader-jump-history\.yml$|docs/READER-JUMP-HISTORY\.md$|docs/validation/reader-jump-history\.json$)'; then
            echo "files outside the J07 ownership list changed"; exit 1
          fi
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Reject foreign or failed upstream job identities in Actions
        run: |
          python3 -m py_compile tests/reader_jump_history/check_artifacts.py tests/reader_jump_history/check_jump_history.py
          python3 tests/reader_jump_history/check_artifacts.py --protocol-selftest
      - name: Install the product provider, the unchanged revisions and the reading-state adapter
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "JH_WS=$ws" >> "$GITHUB_ENV"
          echo "JH_PREFIX=$ws/build/jh-stage" >> "$GITHUB_ENV"
          echo "JH_SDK=$ws/build/reading-library/stage" >> "$GITHUB_ENV"
          mkdir -p build/jh-logs
          cmake -S apps/reader/store/native -B build/jh-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/jh-stage" 2>&1 | tee build/jh-logs/product-configure.log
          cmake --build build/jh-product --parallel 4 2>&1 | tee build/jh-logs/product-build.log
          cmake --install build/jh-product 2>&1 | tee build/jh-logs/product-install.log
          cmake -S apps/reader/revisions -B build/jh-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$ws/build/jh-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/jh-stage" 2>&1 | tee build/jh-logs/revisions-configure.log
          cmake --build build/jh-revisions --parallel 4 2>&1 | tee build/jh-logs/revisions-build.log
          cmake --install build/jh-revisions 2>&1 | tee build/jh-logs/revisions-install.log
          cmake --preset reading-library 2>&1 | tee build/jh-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/jh-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/jh-logs/sdk-install.log
          cmake -S apps/reader/reading-state -B build/jh-reading-state -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$ws/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$ws/build/jh-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/jh-stage" 2>&1 | tee build/jh-logs/reading-state-configure.log
          cmake --build build/jh-reading-state --parallel 4 2>&1 | tee build/jh-logs/reading-state-build.log
          cmake --install build/jh-reading-state 2>&1 | tee build/jh-logs/reading-state-install.log
      - name: Build and install the jump-history package from installed packages only
        run: |
          set -o pipefail
          cmake -S apps/reader/jump-history -B build/jh-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$JH_PREFIX;$JH_SDK" -DCMAKE_INSTALL_PREFIX="$JH_PREFIX" 2>&1 | tee build/jh-logs/package-configure.log
          cmake --build build/jh-package --verbose 2>&1 | tee build/jh-logs/package-build.log
          cmake --install build/jh-package 2>&1 | tee build/jh-logs/package-install.log
      - name: Compile the independent C and C++ consumers from installed packages
        run: |
          set -o pipefail
          cmake -S tests/reader_jump_history/consumer -B build/jh-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$JH_PREFIX;$JH_SDK" 2>&1 | tee build/jh-logs/consumer-configure.log
          cmake --build build/jh-consumer --verbose 2>&1 | tee build/jh-logs/consumer-build.log
      - name: Generate four real originals and judge the installed consumers
        env:
          JH_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          rm -rf build/jh-fixtures build/jh-evidence
          python3 tests/reader_jump_history/make_fixtures.py build/jh-fixtures 2>&1 | tee build/jh-logs/fixtures.log
          python3 tests/reader_jump_history/check_jump_history.py --probe "build/jh-consumer/jump-history-probe$exe" --c-consumer "build/jh-consumer/jump-history-c-consumer$exe" --fixtures build/jh-fixtures --font tests/fixtures/fonts/primary.ttf --installed build/jh-stage --platform "$JH_PLATFORM" --output build/jh-evidence 2>&1 | tee build/jh-logs/check.log
      - name: Preserve originals, evidence, installed package and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-jump-history-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/jh-logs/
            build/jh-fixtures/
            build/jh-evidence/
            build/jh-stage/include/reader_jump_history.h
            build/jh-stage/lib/*jump_history*
            build/jh-stage/lib/cmake/EXReaderJumpHistory/
            build/jh-consumer/jump-history-probe*
            build/jh-consumer/jump-history-c-consumer*
            build/jh-package/CMakeCache.txt
            build/jh-consumer/CMakeCache.txt
          if-no-files-found: error
  evidence:
    name: strict jump-history evidence
    needs: [consumers]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate all three same-run ZIPs and compare named outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_jump_history/check_artifacts.py build/jh-artifact-evidence
      - name: Preserve the artifact verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-jump-history-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/jh-artifact-evidence/
          if-no-files-found: error
