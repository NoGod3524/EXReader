name: Combined Windows WAL mapping profile
on:
  push:
    branches: [codex/combined-wal-candidate, codex/android-merge-prep, codex/windows-android-combined, codex/reader-all-combined]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Admit exact composition source
        shell: bash
        run: python tools/reader_composition/guard.py --source "$GITHUB_SHA" --report build/composition-wal-source.json
      - name: Build current public SDK and production catalog adapter
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/startup-profile-evidence
          git rev-parse HEAD | tee build/startup-profile-evidence/source.txt
          cmake --preset reading-library 2>&1 | tee build/startup-profile-evidence/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/startup-profile-evidence/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/startup-profile-evidence/sdk-install.log
          ws=$(cygpath -m "$PWD")
          cmake -S tests/reader_startup_profile -B build/startup-profile -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$ws/build/reading-library/stage" 2>&1 | tee build/startup-profile-evidence/configure.log
          cmake --build build/startup-profile --parallel 4 2>&1 | tee build/startup-profile-evidence/build.log
      - name: Seed the real 2202 originals and profile first repair and subsequent repair
        shell: bash
        run: |
          set -o pipefail
          build/startup-profile/seed_shelf.exe build/startup-profile-evidence/library.sqlite | tee build/startup-profile-evidence/seed.json
          for n in 1 2 3; do
            for mode in default persist; do
              cp build/startup-profile-evidence/library.sqlite "build/startup-profile-evidence/fresh-$mode-$n.sqlite"
              if [ "$mode" = persist ]; then export EXR_PROFILE_PERSIST=1; else unset EXR_PROFILE_PERSIST; fi
              build/startup-profile/startup_profile.exe "build/startup-profile-evidence/fresh-$mode-$n.sqlite" "build/startup-profile-evidence/product-$mode-$n.sqlite" first 2>&1 | tee "build/startup-profile-evidence/first-$mode-$n.json"
              build/startup-profile/startup_profile.exe "build/startup-profile-evidence/fresh-$mode-$n.sqlite" "build/startup-profile-evidence/product-$mode-$n.sqlite" repeat 2>&1 | tee "build/startup-profile-evidence/repeat-$mode-$n.json"
            done
          done
          sha256sum build/startup-profile/startup_profile.exe build/startup-profile/seed_shelf.exe build/startup-profile-evidence/library.sqlite | tee build/startup-profile-evidence/hashes.txt
          systeminfo > build/startup-profile-evidence/environment.txt
      - name: Run original catalog, cancellation, and process interruption checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/startup-profile/sdk-check build/startup-profile/native-check
          build/startup-profile/reader-desktop-catalog-check.exe "$PWD/build/startup-profile/sdk-check" "$PWD/tests/fixtures" 2>&1 | tee build/startup-profile-evidence/desktop-check.log
          build/startup-profile/reader-native-catalog-check.exe "$PWD/build/startup-profile/native-check" "$PWD/apps/reader/store/001_catalog.sql" 2>&1 | tee build/startup-profile-evidence/native-check.log
          python tests/reader_catalog/check_desktop_sdk.py build/startup-profile 2>&1 | tee build/startup-profile-evidence/recovery-check.log
      - name: Identify failing SQL and extended SQLite error
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/startup-profile/diagnostic-check
          build/startup-profile/reader-diagnostic-catalog-check.exe "$PWD/build/startup-profile/diagnostic-check" "$PWD/tests/fixtures" 2>&1 | tee build/startup-profile-evidence/diagnostic-check.log
      - name: Kill after committed WAL mapping and verify recovery
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee build/startup-profile-evidence/wal-crash.log
          import pathlib, queue, subprocess, threading
          folder = pathlib.Path('build/startup-profile/wal-kill').resolve()
          folder.mkdir()
          binary = pathlib.Path('build/startup-profile/reader-wal-crash-check.exe').resolve()
          process = subprocess.Popen([str(binary), str(folder), 'seed'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          lines = []
          ready = queue.Queue()
          def read():
              for line in process.stdout:
                  lines.append(line)
                  if line.strip() == 'READY_TO_KILL_COMMITTED_WAL': ready.put(True)
              ready.put(False)
          thread = threading.Thread(target=read, daemon=True)
          thread.start()
          try:
              assert ready.get(timeout=90), ''.join(lines)
              assert process.poll() is None
          finally:
              if process.poll() is None: process.kill()
              process.wait(timeout=20)
              thread.join(timeout=10)
          assert process.returncode != 0
          recovered = subprocess.run([str(binary), str(folder), 'recover'], capture_output=True, text=True, timeout=90)
          print(''.join(lines), recovered.stdout, recovered.stderr)
          assert recovered.returncode == 0 and 'RECOVERED_COMMITTED_WAL' in recovered.stdout
          PY
      - name: Preserve original profiling results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-mapping-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/composition-wal-source.json
            build/startup-profile-evidence/*.json
            build/startup-profile-evidence/*.txt
            build/startup-profile-evidence/*.log
            build/startup-profile/CMakeCache.txt
            build/startup-profile/sdk-check/sdk-result.json
            build/startup-profile/native-check/result.json
            build/startup-profile/verified.json
            build/startup-profile/kill-*/
            build/startup-profile/sdk-link.map
          if-no-files-found: warn
