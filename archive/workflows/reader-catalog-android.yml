name: Android product catalog
on:
  push:
    branches: [codex/reader-catalog-hosts]
  pull_request:
    paths:
      - apps/reader/store/**
      - examples/android/**
      - tools/reader_catalog_assets.py
      - tools/build_android_host.py
      - tools/check_reader_catalog_android.py
      - tools/android_host_evidence.py
      - tests/reader_catalog/**
      - .github/workflows/reader-catalog-android.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-assets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original migration and complete-statement packaging
        run: |
          python tests/reader_catalog/check_schema.py --output build/catalog-assets/schema.json
          python tests/reader_catalog/check_assets.py
          python tools/reader_catalog_assets.py --output build/catalog-assets/reader-catalog-v1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-catalog-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/catalog-assets/
          if-no-files-found: error
  android-catalog:
    needs: migration-assets
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_OWNERSHIP_HEAD: d0b205a56e4fcfbd5cca55a808327f00b25971ed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged frozen SDK
        run: git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures .github/workflows/native.yml .github/workflows/reliability.yml bindings
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android compiler and emulator
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-34;default;x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
          python -m pip install ninja==1.11.1.1
      - name: Build frozen SDK and native host with production migration asset
        run: |
          mkdir -p build/catalog-android
          git rev-parse HEAD > build/catalog-android/source.txt
          python tools/build_android_host.py --stage stage/android-x86_64 --build-dir build/android-host --gradle gradle 2>&1 | tee build/catalog-android/build.log
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Execute production catalog adapter on API34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop ro.build.version.sdk > build/catalog-android/device-api.txt
            adb shell getprop ro.product.cpu.abi > build/catalog-android/device-abi.txt
            gradle -p examples/android --no-daemon --stacktrace :app:connectedDebugAndroidTest -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -Pandroid.testInstrumentationRunnerArguments.class=org.exreader.host.CatalogStoreTest
      - name: Refuse failed, skipped or incomplete adapter tests
        run: python tools/check_reader_catalog_android.py --reports examples/android/app/build/outputs/androidTest-results/connected --output build/catalog-android/result.json
      - name: Preserve original test reports and packaged migration
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-catalog-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/catalog-android/
            examples/android/app/build/outputs/androidTest-results/
            examples/android/app/src/main/assets/reader-catalog-v1.json
            build/android-host/build.json
          if-no-files-found: error
