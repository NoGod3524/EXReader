name: Native reader composition source admission
on:
  push:
    branches: [codex/team24-composition]
  workflow_dispatch:
    inputs:
      production_windows:
        description: Build, test, package and authenticate the composed Windows production profile
        type: boolean
        default: false
      production_apple:
        description: Build, archive, unpack and launch the actual Apple production profile
        type: boolean
        default: false
      observe_performance:
        description: Record Windows and GTK performance observations on this source
        type: boolean
        default: false
      verify_organization_desktop:
        description: Verify installed organization projection on Windows and macOS
        type: boolean
        default: false
      inspect_apple_failure:
        description: Read the fixed failed Apple artifact without building or testing
        type: boolean
        default: false
      inspect_apple_latest:
        description: Inspect three authenticated Apple UI failures from run 40369175290
        type: boolean
        default: false
      inspect_apple_new_mac:
        description: Inspect the macOS UI failure from run 40380039862
        type: boolean
        default: false
      inspect_apple_new_mobile:
        description: Inspect the iPhone and iPad UI failures from run 40380039862
        type: boolean
        default: false
      inspect_android_failure:
        description: Read the fixed Android path-candidate failure without rebuilding
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Source guard negative controls
        run: python tests/reader_composition/test_guard.py
      - name: Parse canonical production Apple build tools in Actions
        run: python -m py_compile tools/apple_swift.py tools/build_apple_product.py tools/build_apple_host.py tools/check_apple_product.py tools/reader_composition/apple_build.py
      - name: Exact composition source admission
        run: python tools/reader_composition/guard.py --source "$GITHUB_SHA" --report build/composition-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-source-${{ github.sha }}
          path: build/composition-source.json
          if-no-files-found: error
  observe-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.observe_performance }}
    needs: source
    uses: ./.github/workflows/reader-composition-perf-windows.yml
  observe-gtk:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.observe_performance }}
    needs: source
    uses: ./.github/workflows/reader-composition-perf-gtk.yml
  organization-desktop:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_organization_desktop }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
        raw: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install real product catalog and revision packages
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = Windows ]; then workspace=$(cygpath -m "$PWD"); else workspace="$PWD"; fi
          echo "ORG_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          cmake -S apps/reader/store/native -B build/product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$workspace/build/product-stage"
          cmake --build build/product --parallel 4
          ctest --test-dir build/product --output-on-failure --no-tests=error
          cmake --install build/product
          cmake -S apps/reader/revisions -B build/revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$workspace/build/product-stage" -DCMAKE_INSTALL_PREFIX="$workspace/build/revision-stage" -DEXR_READER_SELECTOR_BYTES_CANDIDATE=${{ matrix.raw }}
          cmake --build build/revisions --parallel 4
          cmake --install build/revisions
      - name: Run installed consumer against a real product database
        run: |
          set -euxo pipefail
          cmake -S tests/reader_organization_projection -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ORG_WORKSPACE/build/revision-stage;$ORG_WORKSPACE/build/product-stage"
          cmake --build build/consumer --parallel 4
          exe=build/consumer/organization-consumer
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          python tests/reader_organization_projection/check.py "$exe" build/organization-evidence
      - name: Run original projection regression
        if: matrix.raw == 'OFF'
        run: |
          set -euxo pipefail
          cmake -S tests/reader_revisions/consumer -B build/original-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ORG_WORKSPACE/build/revision-stage;$ORG_WORKSPACE/build/product-stage"
          cmake --build build/original-consumer --parallel 4
          exe=build/original-consumer/revision-consumer
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          python tests/reader_projection/check_projection.py --consumer "$exe" --output build/original-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organization-desktop-${{ matrix.os }}-${{ matrix.raw }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/organization-evidence/
            build/original-evidence/
            build/product/Testing/
          if-no-files-found: warn
  inspect-apple:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.inspect_apple_failure || inputs.inspect_android_failure) }}
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate and inspect only the selected fixed failure artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_ANDROID: ${{ inputs.inspect_android_failure }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, re, subprocess, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from check_parallel_integration import fetch, download_artifact_zip
          android = os.environ['INSPECT_ANDROID'] == 'true'
          if android:
              artifact, run_id, expected_bytes = 12671293390, 40364381911, 143609682
              source = '3afaec0d70285b28e115e5258d2f7984d8d1826e'
              digest = 'd4f6210fc22638ffbf76545b62415c5d4a7e853e5c8fc5de6ffe8d71e8a4d1fb'
          else:
              artifact, run_id, expected_bytes = 12666310175, 40350153254, 467513155
              source = 'd9ca5805952f8069ecbdb7a724af43662d9b0a6e'
              digest = '9d1f1ff7cba7c4f4c3a1b7a3e068a12e891aa99e2b4fae16a8ad7e2a493b7f10'
          item = fetch('actions/artifacts/' + str(artifact))
          assert item['workflow_run']['id'] == run_id and item['workflow_run']['head_sha'] == source
          assert not item['expired'] and item['size_in_bytes'] == expected_bytes
          assert item['digest'] == 'sha256:' + digest
          raw = download_artifact_zip(artifact)
          assert len(raw) == item['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == digest
          excerpts = []
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for info in archive.infolist():
                  if not info.filename.endswith(('.log', '.txt')) or info.file_size > 50 * 1024 * 1024:
                      continue
                  lines = archive.read(info).decode('utf-8', errors='replace').splitlines()
                  failures = [index for index, line in enumerate(lines)
                              if re.search(r'XCTAssert|Assertion|error:|failed -|failed \(|avc: denied|linkat|open nofollow|RFL_|ROE_', line)]
                  indices = sorted({at for index in failures for at in range(index, min(index + 100, len(lines)))})
                  selected = [lines[index] for index in indices]
                  if selected:
                      excerpts.append({'member': info.filename, 'sha256': hashlib.sha256(archive.read(info)).hexdigest(),
                                       'lines': selected[:800], 'matching_lines': len(selected)})
          assert excerpts, 'no actual failure diagnostics found'
          result = {'source': source, 'run': run_id, 'attempt': 1, 'artifact': artifact,
                    'artifact_sha256': digest, 'excerpts': excerpts, 'acceptance': False}
          out = Path('build/reader-failure-inspection'); out.mkdir(parents=True, exist_ok=True)
          (out / 'excerpts.json').write_text(json.dumps(result, indent=2) + '\n')
          for entry in excerpts:
              print(entry['member'])
              print('\n'.join(entry['lines']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-fixed-failure-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-failure-inspection/
          if-no-files-found: error
  inspect-apple-latest:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.inspect_apple_latest || inputs.inspect_apple_new_mac || inputs.inspect_apple_new_mobile) }}
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.inspect_apple_new_mobile && '[{"platform":"iphone","artifact":12681063497,"size":409141929,"digest":"35291c3dca64c1ffd295d98a07c41fe16d12770a7685833c8a5182f94506a29c"},{"platform":"ipad","artifact":12681414046,"size":505271639,"digest":"f716803d1857d0e87be7290f186c968c226d3ed6bbdf513e5a198ebbd0721362"}]' || inputs.inspect_apple_new_mac && '[{"platform":"macos","artifact":12679269750,"size":431624139,"digest":"807e03579d69fceb864b7bfd3a029efd6b8d67355430d4507bd85f4a01c859f4"}]' || '[{"platform":"macos","artifact":12672428758,"size":436669306,"digest":"f82acc84c61a169f79b2ab0a8ed0b2aa6455619a78726288c6c3cb5a08129c64"},{"platform":"iphone","artifact":12676671407,"size":489564113,"digest":"bb9e875a8e95cd9a3b7252e4e7ff65f8d2ea09120fa2285dc57e35d10c5a105c"},{"platform":"ipad","artifact":12675650371,"size":486370049,"digest":"766162ec750cee367095cd8cfa59a255f78d2450db00709bc3f628d99fc395cb"}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate original artifact and extract concise diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          EXPECTED_SIZE: ${{ matrix.size }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
          PLATFORM: ${{ matrix.platform }}
          INSPECT_NEW_MAC: ${{ inputs.inspect_apple_new_mac }}
          INSPECT_NEW_MOBILE: ${{ inputs.inspect_apple_new_mobile }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from check_parallel_integration import fetch, download_artifact_zip
          artifact = int(os.environ['ARTIFACT'])
          new_round = os.environ['INSPECT_NEW_MAC'] == 'true' or os.environ['INSPECT_NEW_MOBILE'] == 'true'
          source = '7189a5b55cda1bc8680d35a8350bd0bae4fe7c37' if new_round else '2978d5ace765ac7fcc3c309be5b32ce7a7ff2bef'
          run_id = 40380039862 if new_round else 40369175290
          digest = os.environ['EXPECTED_DIGEST']
          item = fetch('actions/artifacts/' + str(artifact))
          assert item['workflow_run']['id'] == run_id and item['workflow_run']['head_sha'] == source
          assert not item['expired'] and item['size_in_bytes'] == int(os.environ['EXPECTED_SIZE'])
          assert item['digest'] == 'sha256:' + digest
          raw = subprocess.run(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{artifact}/zip'], check=True, stdout=subprocess.PIPE, timeout=360).stdout
          assert len(raw) == int(os.environ['EXPECTED_SIZE']) and hashlib.sha256(raw).hexdigest() == digest
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              candidates = [x for x in archive.infolist() if (x.filename == 'result.json' or x.filename.endswith('/result.json')) and x.file_size < 50_000_000]
              reports = []
              for member in candidates:
                  try:
                      report = json.loads(archive.read(member))
                  except (ValueError, UnicodeDecodeError):
                      continue
                  if report.get('source_sha') == source and str(report.get('run_id')) == str(run_id) and report.get('platform') == os.environ['PLATFORM']:
                      reports.append(report)
              assert len(reports) == 1, len(reports)
              report = reports[0]
              summary = {'platform': report['platform'], 'source': source, 'run': run_id, 'attempt': report['attempt'],
                         'artifact': artifact, 'artifact_sha256': digest, 'accepted': report['accepted'], 'failure': report.get('failure'), 'phases': []}
              for phase in report.get('phases', []):
                  cases = [{'name': c.get('name'), 'result': c.get('result'), 'steps': c.get('steps', [])} for c in phase.get('cases', []) if c.get('result') != 'Passed']
                  summary['phases'].append({'mode': phase.get('mode'), 'accepted': phase.get('accepted'), 'failure': phase.get('failure'), 'total': len(phase.get('cases', [])), 'failed': cases})
              snippets, actions = [], []
              for member in archive.infolist():
                  if not member.filename.endswith('.log') or member.file_size > 50_000_000:
                      continue
                  lines = archive.read(member).decode('utf-8', errors='replace').splitlines()
                  for i, line in enumerate(lines):
                      if re.search(r'XCTAssert|error:|failed -|failed \(', line):
                          snippets.append({'file': member.filename, 'lines': lines[max(0, i-150):min(len(lines), i+80)]})
                      if re.search(r'Tap.*features\.(font\.fixture|preview\.discard)|Swipe', line, re.I):
                          actions.append({'file': member.filename, 'lines': lines[max(0, i-3):min(len(lines), i+5)]})
              summary['failure_snippets'] = snippets[:40]
              summary['action_snippets'] = actions[-150:]
              out = Path('build/apple-latest-inspection'); out.mkdir(parents=True, exist_ok=True)
              (out / (os.environ['PLATFORM'] + '.json')).write_text(json.dumps(summary, indent=2, ensure_ascii=False) + '\n')
              print(json.dumps(summary, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-latest-inspection-${{ matrix.platform }}-${{ github.run_id }}
          path: build/apple-latest-inspection/
          if-no-files-found: error
  production-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_windows }}
    needs: source
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      EXR_COMPOSITION_CONTENT_BOUND: '1'
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Admit the exact composed source on this runner
        shell: pwsh
        run: |
          python tools/reader_composition/guard.py --source "$env:GITHUB_SHA" --report build/windows-source-admission.json
          if ($LASTEXITCODE) { throw 'Composition source admission failed' }
      - name: Build raw SDK and modules, the wave-3 host, run retained and new native checks, package the ZIP
        shell: pwsh
        run: |
          python tests/reader_wave3_c09/build.py
          if ($LASTEXITCODE) { throw 'C09 Windows build or native checks failed' }
      - name: Preserve the ZIP and complete diagnostic evidence, including failures
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c09-windows-wave3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/c09/report.json
            build/c09/desktop.json
            build/c09/EXReader-wave3-windows.zip
            build/c09/wave3-ui/
            build/c09/compact22/
            build/c09/retained26/
            build/c09/extracted-ui/
            build/c09/fixtures/
            build/c09/package/build.json
            build/c09/package/report.json
            build/c09/raw-owner-suite/
            build/c09/wave3-host/windows-host.map
            build/c09/logs/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-windows-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-source-admission.json
          if-no-files-found: warn
  authenticate-windows:
    needs: production-windows
    if: always() && needs.production-windows.result != 'skipped'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c09-windows-wave3-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/c09-download
      - name: Bind report, ZIP, program hash and artifact identity to this run and attempt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.production-windows.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.production-windows.outputs.artifact_digest }}
          WINDOWS_RESULT: ${{ needs.production-windows.result }}
        run: python3 tests/reader_wave3_c09/identity.py
      - name: Require successful Windows job, accepted report and exact outer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RESULT: ${{ needs.production-windows.result }}
          ARTIFACT_ID: ${{ needs.production-windows.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.production-windows.outputs.artifact_digest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          identity = json.loads(Path('build/c09-authentication/identity.json').read_text())
          assert os.environ['WINDOWS_RESULT'] == 'success'
          assert identity['verified'] and identity['report']['accepted'] is True
          assert not identity['report']['failures']
          report = json.loads(Path('build/c09-download/report.json').read_text())
          assert report['cloud_content_bound'] is True
          artifact = identity['artifact']
          assert str(artifact['id']) == os.environ['ARTIFACT_ID']
          assert not artifact['expired'] and artifact['digest'] == 'sha256:' + os.environ['ARTIFACT_DIGEST']
          api = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact['id']}"
          metadata = json.loads(subprocess.check_output(['gh', 'api', api], text=True))
          assert str(metadata['workflow_run']['id']) == os.environ['GITHUB_RUN_ID']
          assert metadata['workflow_run']['head_sha'] == os.environ['GITHUB_SHA']
          raw = subprocess.run(['gh', 'api', api + '/zip'], stdout=subprocess.PIPE, check=True, timeout=360).stdout
          assert len(raw) == artifact['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == os.environ['ARTIFACT_DIGEST']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c09-authentication-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/c09-authentication/
          if-no-files-found: warn
  production-apple:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_apple }}
    needs: source
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit the exact composed source on this runner
        run: python tools/reader_composition/guard.py --source "$GITHUB_SHA" --report build/apple-source-admission.json
      - name: Build and launch the actual unpacked production profile
        run: python tools/reader_composition/apple_build.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-apple-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/composition-apple/${{ matrix.target }}/production-startup.json
            build/composition-apple/${{ matrix.target }}/delivery-*/
            build/composition-apple/${{ matrix.target }}/startup-*/
            build/composition-apple/${{ matrix.target }}/payload/build.json
            build/composition-apple/${{ matrix.target }}/payload/product-link*
            build/apple-source-admission.json
          if-no-files-found: error
