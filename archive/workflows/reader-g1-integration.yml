name: Reviewed G1 common-source integration
on:
  push:
    branches: [codex/reader-g1-integration]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  START_SHA: f43baf9182d75907c0cb5d6f77048f27bca8c950
  FROZEN_SDK: 9854061be331fe603a1822d9b2b36ee357154927
  COMPOSITION_TESTS: tests/reader_module_composition
jobs:
  compose:
    name: one-prefix composition (${{matrix.key}})
    runs-on: ${{matrix.os}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux
          - os: windows-2022
            key: windows
          - os: macos-15
            key: macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate reviewed input trees and explicit integration edits
        run: python3 tests/reader_g1_integration/guard.py
      - name: Install Linux native TLS XML keyring and SHA dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev libsecret-1-dev pkg-config ninja-build
      - name: Use Apple system native TLS XML and platform frameworks
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config openssl@3
          sdkroot=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build/apple-pkgconfig
          version=$(/usr/bin/curl --version | awk 'NR==1 {print $2}')
          cat > build/apple-pkgconfig/libcurl.pc <<EOF
          prefix=${sdkroot}/usr
          Name: libcurl
          Description: Apple SDK system libcurl
          Version: ${version}
          Libs: -L\${prefix}/lib -lcurl
          Cflags:
          EOF
          echo "PKG_CONFIG_PATH=${PWD}/build/apple-pkgconfig" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix openssl@3)/bin:${PATH}" >> "$GITHUB_ENV"
          /usr/bin/curl --version
      - name: Enter Windows native compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c ('"{0}" >nul && set' -f $bat) | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and install the default reading SDK into the composition prefix
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "COMP_WS=$ws" >> "$GITHUB_ENV"
          mkdir -p build/composition/logs
          prefix="$ws/build/prefix"
          echo "COMP_PREFIX=$prefix" >> "$GITHUB_ENV"
          cmake --preset reading-library -DCMAKE_INSTALL_PREFIX="$prefix" 2>&1 | tee build/composition/logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/composition/logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/composition/logs/sdk-install.log
      - name: Record the SDK-only snapshot of the prefix
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os, shutil
          prefix = os.environ['COMP_PREFIX']
          snapshot = os.environ['COMP_WS'] + '/build/prefix-sdk-only'
          shutil.copytree(prefix, snapshot)
          print('sdk-only snapshot at', snapshot)
          PY
          python3 "$COMPOSITION_TESTS/check_prefix.py" --manifest "$COMP_PREFIX" \
            --manifest-output build/composition/install-sdk.json
      - name: Install every optional module into the same prefix
        run: |
          set -o pipefail
          prefix="$COMP_PREFIX"
          logs=build/composition/logs
          build_module() {
            name="$1"; source="$2"; shift 2
            cmake -S "$source" -B "build/module-$name" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix" "$@" \
              2>&1 | tee "$logs/$name-configure.log"
            cmake --build "build/module-$name" --verbose 2>&1 | tee "$logs/$name-build.log"
            cmake --install "build/module-$name" 2>&1 | tee "$logs/$name-install.log"
          }
          build_module product apps/reader/store/native
          build_module revisions apps/reader/revisions -DREADER_PRODUCT_PREFIX="$prefix"
          build_module webdav extras/webdav
          build_module sideload extras/sideload -DEXR_SDK="$prefix"
          build_module credentials extras/credentials
          build_module search apps/reader/search -DEXR_SDK="$prefix"
          build_module preferences apps/reader/preferences
          build_module batch-import apps/reader/batch-import -DEXR_SDK="$prefix"
          build_module sync apps/reader/sync
          build_module commands apps/reader/commands
          build_module metadata apps/reader/desktop-metadata
          build_module session apps/reader/session
          build_module reading-state apps/reader/reading-state -DEXR_SDK="$prefix"
          build_module thumbnails apps/reader/thumbnails -DEXR_SDK="$prefix"
          build_module reading-commands apps/reader/reading-commands
          build_module annotation-view apps/reader/annotation-view
          build_module annotation-export apps/reader/annotation-export
          build_module local-downloads apps/reader/local-downloads -DEXR_SDK="$prefix"
      - name: Audit the composed prefix and the default reading snapshot
        run: |
          set -o pipefail
          python3 "$COMPOSITION_TESTS/check_prefix.py" --manifest "$COMP_PREFIX" \
            --manifest-output build/composition/install-all.json
          source_root="$COMP_WS"
          python3 "$COMPOSITION_TESTS/check_prefix.py" --prefix "$COMP_PREFIX" --source-root "$source_root" \
            --expect clean --scan-output build/composition/prefix-scan.json
          cmake -S "$COMPOSITION_TESTS/consumer/sdk_only" -B build/sdk-only -G Ninja \
            -DEXR_MODULE_PREFIX="$COMP_WS/build/prefix-sdk-only"
          cmake --build build/sdk-only --verbose
          python3 "$COMPOSITION_TESTS/check_prefix.py" --sdk-snapshot "$COMP_WS/build/prefix-sdk-only" \
            --sdk-report build/sdk-only/sdk-only-report.json --snapshot-output build/composition/sdk-only.json
      - name: Build the fresh-directory C11 and C++ consumers from the installed prefix only
        run: |
          set -o pipefail
          mkdir -p build/fresh
          cp -R "$COMPOSITION_TESTS/consumer" build/fresh/consumer
          cmake -S build/fresh/consumer -B build/fresh/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEXR_MODULE_PREFIX="$COMP_PREFIX" 2>&1 | tee build/composition/logs/consumer-configure.log
          cmake --build build/fresh/build --verbose 2>&1 | tee build/composition/logs/consumer-build.log
          cp build/fresh/build/composition-interface.json build/composition/interface.json
          cp build/fresh/build/composition-link.map build/composition/composition-link.map
          cp build/fresh/build/composition-c-link.map build/composition/composition-c-link.map
      - name: Original new-module judges and real five-module chain from the composed prefix
        run: python3 tests/reader_g1_integration/run_suites.py --prefix "$COMP_PREFIX"
      - name: Relocate the prefix and rebuild the same consumers from the new path
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os, shutil
          prefix = os.environ['COMP_PREFIX']
          relocated = os.environ['COMP_WS'] + '/build/prefix-relocated'
          shutil.move(prefix, relocated)
          print('relocated prefix at', relocated)
          PY
          echo "COMP_PREFIX_RELOCATED=$COMP_WS/build/prefix-relocated" >> "$GITHUB_ENV"
          mkdir -p build/relocated
          cp -R "$COMPOSITION_TESTS/consumer" build/relocated/consumer
          cmake -S build/relocated/consumer -B build/relocated/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEXR_MODULE_PREFIX="$COMP_WS/build/prefix-relocated" \
            2>&1 | tee build/composition/logs/relocated-configure.log
          cmake --build build/relocated/build --verbose 2>&1 | tee build/composition/logs/relocated-build.log
          cp build/relocated/build/composition-interface.json build/composition/interface-relocated.json
      - name: Rebuild and run the new chain after the original prefix is removed
        run: python3 tests/reader_g1_integration/run_suites.py --prefix "$COMP_PREFIX_RELOCATED" --relocated
      - name: Judge the composed flow with a real TLS WebDAV fixture
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          python3 "$COMPOSITION_TESTS/check_composition.py" \
            --c-consumer "build/fresh/build/composition-c$exe" \
            --cxx-consumer "build/fresh/build/composition-cxx$exe" \
            --relocated-c-consumer "build/relocated/build/composition-c$exe" \
            --relocated-cxx-consumer "build/relocated/build/composition-cxx$exe" \
            --link-map build/fresh/build/composition-link.map \
            --c-link-map build/fresh/build/composition-c-link.map \
            --prefix "$COMP_PREFIX" \
            --relocated-prefix "$COMP_PREFIX_RELOCATED" \
            --fixtures tests/fixtures \
            --interface build/composition/interface-relocated.json \
            --manifest build/composition/install-all.json \
            --output build/composition/evidence
      - name: Reject a broken target, an absent dependency, a second SQLite and a leaked include
        run: |
          set -o pipefail
          python3 "$COMPOSITION_TESTS/check_gates.py" \
            --prefix "$COMP_PREFIX_RELOCATED" \
            --consumer-source build/fresh/consumer \
            --source-root "$COMP_WS" \
            --scratch build/composition/scratch \
            --generator Ninja \
            --output build/composition/gates
      - name: Preserve this attempt's evidence, logs and installed packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-module-composition-${{matrix.key}}-${{github.run_id}}-${{github.run_attempt}}
          path: |
            build/composition/
            !build/composition/**/*.key
            !build/composition/**/scratch/
          if-no-files-found: error
  aggregate:
    name: strict same-source composition report
    needs: [compose]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete, failing, foreign-source or duplicate summaries
        run: python3 tests/reader_g1_integration/aggregate.py --self-test
      - name: Authenticate every platform ZIP and bind each summary to this run
        env:
          GH_TOKEN: ${{github.token}}
        run: python3 tests/reader_g1_integration/aggregate.py --downloads build/composition-zips --output build/composition-aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-module-composition-report-${{github.run_id}}-${{github.run_attempt}}
          path: build/composition-aggregate/
          if-no-files-found: error


  account:
    name: Win32 account sync receive and retained product suites
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate reviewed input trees and explicit integration edits
        run: python3 tests/reader_g1_integration/guard.py
      - name: Enter native Windows compiler environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install one product provider and every native module the host consumes
        run: |
          ws=$(cygpath -m "$PWD")
          prefix="$ws/build/account-stage"
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "ACCOUNT_PREFIX=$prefix" >> "$GITHUB_ENV"
          mkdir -p build/account-logs
          cmake -S apps/reader/store/native -B build/account-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-product --parallel 4
          ctest --test-dir build/account-product --output-on-failure --no-tests=error --timeout 180
          cmake --install build/account-product
          cmake -S extras/webdav -B build/account-dav -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-dav --parallel 4
          cmake --install build/account-dav
          cmake -S apps/reader/revisions -B build/account-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-revisions --parallel 4
          cmake --install build/account-revisions
          for module in commands desktop-metadata sync session; do
            cmake -S "apps/reader/$module" -B "build/account-$module" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "build/account-$module" --parallel 4
            cmake --install "build/account-$module"
          done
          cmake -S extras/credentials -B build/account-credentials -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-credentials --parallel 4
          cmake --install build/account-credentials
          cmake -S tests/reader_commands/consumer -B build/account-command-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/account-command-consumer --parallel 4
          cmake -S tests/reader_revisions/consumer -B build/account-revision-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/account-revision-consumer --parallel 4
      - name: Build and install the unmodified reading-library SDK and public original export module
        run: |
          cmake --preset reading-library 2>&1 | tee build/account-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/account-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/account-logs/sdk-install.log
          cmake -S extras/sideload -B build/account-sideload -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$ACCOUNT_PREFIX"
          cmake --build build/account-sideload --parallel 4
          cmake --install build/account-sideload
      - name: Build the installed reading-state adapter and the account capture consumer
        run: |
          cmake -S apps/reader/reading-state -B build/account-reading-state -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$ACCOUNT_PREFIX" -DCMAKE_INSTALL_PREFIX="$ACCOUNT_PREFIX" 2>&1 | tee build/account-logs/reading-state-configure.log
          cmake --build build/account-reading-state --parallel 4 2>&1 | tee build/account-logs/reading-state-build.log
          cmake --install build/account-reading-state 2>&1 | tee build/account-logs/reading-state-install.log
          cmake -S tests/reader_windows_account/consumer -B build/account-capture -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ACCOUNT_PREFIX;$WS/build/reading-library/stage" 2>&1 | tee build/account-logs/capture-configure.log
          cmake --build build/account-capture --parallel 4 2>&1 | tee build/account-logs/capture-build.log
          test -f build/account-capture/reading-capture-probe.exe
          test -f build/account-capture/reading-capture-link.map
      - name: Build the actual Win32 host with account integration from examples/reader.c
        run: |
          cmake -S apps/reader/windows-account -B build/account-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DREADER_METADATA_PREFIX="$ACCOUNT_PREFIX" -DREADER_ACCOUNT_PREFIX="$ACCOUNT_PREFIX" 2>&1 | tee build/account-logs/host-configure.log
          cmake --build build/account-host --parallel 4 --verbose 2>&1 | tee build/account-logs/host-build.log
          test -f build/account-host/EXReaderProduct.exe
          test -f build/account-host/EXReaderShelfReview.exe
          test -f build/account-host/windows-host.map
      - name: Package the lightweight static product and generate fixtures
        run: |
          python3 tools/build_windows_host.py --sdk build/reading-library/stage --binary build/account-host/EXReaderProduct.exe --output build/account-package --static-reading
          python3 tests/windows_host/make_fixtures.py --output build/account-fixtures
          python3 tests/reader_reading_state/make_fixtures.py build/account-reading-fixtures
          test -f build/account-reading-fixtures/manifest.json
      - name: Original evidence rejection cases plus static SDK provider refusals
        run: python3 tests/windows_host/check_evidence.py --package build/account-package/EXReader --sdk build/reading-library/stage --manifest build/account-package/build.json --fixtures build/account-fixtures --selftest-report build/account-package/report.json --consumer-binary build/account-host/EXReaderProduct.exe --static-link-map build/account-host/windows-host.map --output build/account-negative
      - name: Original 158 Windows UI actions and eight bound screenshots on this source
        env:
          EXREADER_HOST_ACCEPTANCE: '1'
        run: python3 tools/check_windows_host.py --package build/account-package/EXReader --output build/account-ui158 --sdk build/reading-library/stage --manifest build/account-package/build.json --steps tests/windows_host --fixtures build/account-fixtures --selftest-report build/account-package/report.json --consumer-binary build/account-host/EXReaderProduct.exe --static-link-map build/account-host/windows-host.map
      - name: Original ten product checks
        run: python3 tests/reader_catalog/check_windows_product.py --package build/account-package/EXReader --original-evidence build/account-ui158 --fixtures build/account-fixtures --output build/account-product10
      - name: Original five worker checks
        run: python3 tests/windows_host/check_shelf_worker.py --candidate build/account-host/EXReaderShelfReview.exe --package build/account-package/EXReader --output build/account-worker5
      - name: Original thirteen 2202-book bookshelf UI checks
        run: python3 tests/reader_windows_account/run_retained_shelf.py --candidate build/account-package/EXReader/EXReader.exe --seed build/account-host/reader-windows-shelf-seed.exe --package build/account-package/EXReader --output build/account-shelf-ui
      - name: Retained typed metadata edit and recovery checks
        run: python3 tests/windows_host/check_metadata_ui.py --candidate build/account-package/EXReader/EXReader.exe --package build/account-package/EXReader --command-consumer build/account-command-consumer/command-consumer.exe --output build/account-metadata-ui
      - name: Real Win32 account controls, native HTTPS, two devices, retry, isolation and close barriers
        run: python3 tests/reader_windows_account/check_account_ui.py --candidate build/account-package/EXReader/EXReader.exe --package build/account-package/EXReader --fixtures build/account-fixtures --revision-consumer build/account-revision-consumer/revision-consumer.exe --capture-probe build/account-capture/reading-capture-probe.exe --reading-fixtures build/account-reading-fixtures --reading-font tests/fixtures/fonts/primary.ttf --link-map build/account-host/windows-host.map --output build/account-ui
      - name: Real keyboard and UI Automation regression on the packaged host
        run: |
          python3 -m pip install "uiautomation==2.0.29" 2>&1 | tee build/account-logs/a11y-pip.log
          python3 tests/reader_windows_account/check_a11y_ui.py --candidate build/account-package/EXReader/EXReader.exe --package build/account-package/EXReader --fixtures build/account-reading-fixtures --output build/account-a11y 2>&1 | tee build/account-logs/a11y-ui.log
      - name: Preserve source-bound evidence, packaged EXE and link graph
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-account-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/account-logs/
            build/account-host/windows-host.map
            build/account-capture/reading-capture-probe.exe
            build/account-capture/reading-capture-link.map
            build/account-reading-fixtures/
            build/account-host/CMakeCache.txt
            build/account-package/
            build/account-negative/
            build/account-ui158/
            build/account-product10/
            build/account-worker5/
            build/account-shelf-ui/
            build/account-metadata-ui/
            build/account-ui/
            build/account-a11y/
            !build/**/*.key
            !build/**/profile/**/*.sqlite
          if-no-files-found: error
  windows-summary:
    name: strict same-source summary
    needs: account
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the account job result and its uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ACCOUNT_RESULT: ${{ needs.account.result }}
          ARTIFACT_ID: ${{ needs.account.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.account.outputs.artifact_digest }}
        run: |
          test "$ACCOUNT_RESULT" = success
          test -n "$ARTIFACT_ID"
          python3 tests/reader_windows_account/verify_summary.py --artifact-id "$ARTIFACT_ID" --upload-digest "$ARTIFACT_DIGEST" --account-checks 32 --a11y-checks 24 --output build/account-summary
      - name: Preserve strict summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-account-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/account-summary/verified.json
          if-no-files-found: warn


  integrated-summary:
    name: bounded common-source acceptance
    needs: [compose, aggregate, account, windows-summary]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate this attempt and both strict summaries
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: '${{ toJSON(needs) }}'
        run: python3 tests/reader_g1_integration/final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-g1-integration-summary-${{github.run_id}}-${{github.run_attempt}}
          path: build/g1-summary/
          if-no-files-found: error
