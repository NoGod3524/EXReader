name: Reader annotation export
on:
  push:
    branches: [codex/reader-annotation-export]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  export:
    name: annotation export (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen SDK, schema1, unchanged shared modules and package path ownership
        run: |
          START=f43baf9182d75907c0cb5d6f77048f27bca8c950
          K=9854061be331fe603a1822d9b2b36ee357154927
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$START" HEAD
          git diff --exit-code "$K" HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code "$START" HEAD -- apps/reader/store apps/reader/revisions apps/reader/reading-state apps/reader/sync apps/reader/commands docs/READER-REVISION-WIRE.md
          allowed='^(apps/reader/annotation-export/|tests/reader_annotation_export/|\.github/workflows/reader-annotation-export\.yml$|docs/READER-ANNOTATION-EXPORT\.md$|docs/validation/reader-annotation-export\.json$)'
          changed=$(git diff --name-only "$START" HEAD)
          bad=$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "unowned path: $bad"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing build tool version
        run: python -m pip install ninja==1.11.1.1
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the one product SQLite provider and the unchanged revision module
        run: |
          mkdir -p build/ae-logs
          git rev-parse HEAD > build/ae-logs/source.txt
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "AE_WS=$ws" >> "$GITHUB_ENV"
          echo "AE_PRODUCT=$ws/build/ae-product-stage" >> "$GITHUB_ENV"
          echo "AE_STAGE=$ws/build/ae-stage" >> "$GITHUB_ENV"
          echo "AE_SDK=$ws/build/reading-library/stage" >> "$GITHUB_ENV"
          echo "AE_EXPORT=$ws/build/ae-export-stage" >> "$GITHUB_ENV"
          cmake -S apps/reader/store/native -B build/ae-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/ae-product-stage" 2>&1 | tee build/ae-logs/product-configure.log
          cmake --build build/ae-product --parallel 4 2>&1 | tee build/ae-logs/product-build.log
          cmake --install build/ae-product 2>&1 | tee build/ae-logs/product-install.log
          cmake -S apps/reader/revisions -B build/ae-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$ws/build/ae-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/ae-stage" 2>&1 | tee build/ae-logs/revisions-configure.log
          cmake --build build/ae-revisions --parallel 4 2>&1 | tee build/ae-logs/revisions-build.log
          cmake --install build/ae-revisions 2>&1 | tee build/ae-logs/revisions-install.log
      - name: Build and install the frozen reading SDK once
        run: |
          set -o pipefail
          cmake --preset reading-library 2>&1 | tee build/ae-logs/sdk-configure.log
          cmake --build --preset reading-library --parallel 4 2>&1 | tee build/ae-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/ae-logs/sdk-install.log
      - name: Install the unchanged reading-state decoder and the optional export package
        run: |
          set -o pipefail
          cmake -S apps/reader/reading-state -B build/ae-adapter -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$AE_SDK" -DCMAKE_PREFIX_PATH="$AE_STAGE;$AE_PRODUCT" -DCMAKE_INSTALL_PREFIX="$AE_STAGE" 2>&1 | tee build/ae-logs/adapter-configure.log
          cmake --build build/ae-adapter --verbose 2>&1 | tee build/ae-logs/adapter-build.log
          cmake --install build/ae-adapter 2>&1 | tee build/ae-logs/adapter-install.log
          cmake -S apps/reader/annotation-export -B build/ae-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AE_STAGE;$AE_PRODUCT;$AE_SDK" -DCMAKE_INSTALL_PREFIX="$AE_EXPORT" 2>&1 | tee build/ae-logs/export-configure.log
          cmake --build build/ae-package --verbose 2>&1 | tee build/ae-logs/export-build.log
          cmake --install build/ae-package 2>&1 | tee build/ae-logs/export-install.log
      - name: Compile independent C and C++ consumers from installed packages only
        run: |
          set -o pipefail
          cmake -S tests/reader_annotation_export/consumer -B build/ae-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AE_EXPORT;$AE_STAGE;$AE_PRODUCT;$AE_SDK" 2>&1 | tee build/ae-logs/consumer-configure.log
          cmake --build build/ae-consumer --verbose 2>&1 | tee build/ae-logs/consumer-build.log
      - name: Generate the corpus and judge exports with independent readers
        run: |
          set -o pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          python tests/reader_annotation_export/make_fixtures.py build/ae-fixtures 2>&1 | tee build/ae-logs/fixtures.log
          python tests/reader_annotation_export/check_export.py --probe "build/ae-consumer/annotation-export-probe$exe" --c-consumer "build/ae-consumer/annotation-export-c-consumer$exe" --fixtures build/ae-fixtures --output build/ae-evidence 2>&1 | tee build/ae-logs/checks.log
      - name: Preserve source-bound corpus, databases, outputs, packages and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-annotation-export-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ae-logs/
            build/ae-fixtures/
            build/ae-evidence/
            build/ae-export-stage/
            build/ae-consumer/annotation-export-probe*
            build/ae-consumer/annotation-export-c-consumer*
            build/ae-consumer/annotation-export-link.map
            build/ae-package/CMakeCache.txt
          if-no-files-found: error
  evidence:
    name: same-run artifact evidence
    needs: export
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifact ids, bytes, digests, reports and cross-platform output identity in the cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_annotation_export/check_artifacts.py build/ae-artifact-evidence
      - name: Preserve the artifact verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-annotation-export-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ae-artifact-evidence/
          if-no-files-found: error
