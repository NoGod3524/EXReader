name: GTK Android organization driver diagnosis only
on:
  push:
    branches: [codex/dot-gtk-android-org-diagnostic]
  workflow_dispatch:
permissions: {contents: read, actions: read}
defaults:
  run: {shell: bash}
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Authenticate existing producer artifacts and product tree equality
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -o pipefail
          mkdir -p build/diagnostic
          python3 tests/gtk_android_organization/diagnostic/prepare.py 2>&1 | tee build/diagnostic/prepare.log
          cp -a build/org-gtk-first/profile build/diagnostic-input/profile
      - name: Install only Java build and native GTK runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libsecret-1-0 gnome-keyring libcurl4 libxml2 libssl3 xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x build/package/bin/exreader-linux build/package/received-sdk-inspect
      - name: Compile Java instrumentation only, never rebuild or install host stub
        run: |
          set -o pipefail
          mkdir -p tests/reader_host_session_android/debug/res/raw
          cp build/wave3/network-fixture/public/ca.crt tests/reader_host_session_android/debug/res/raw/host_sync_fixture_ca.crt
          python3 tests/gtk_android_organization/diagnostic/stub.py
          gradle -p examples/android --no-daemon --stacktrace -PexrSync=true -PexrTestRunner=org.exreader.host.OrganizationRelayTest :app:assembleDebugAndroidTest 2>&1 | tee build/diagnostic/instrumentation-build.log
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/wave3/artifacts/relay-debug-androidTest.apk
          python3 tests/gtk_android_organization/diagnostic/sign.py
      - run: sudo chmod 666 /dev/kvm
      - name: Diagnose both Android stages and GTK return with verified producer payloads
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/relay-debug-androidTest.apk
            python3 tests/gtk_android_organization/android/run.py --phase android --previous build/diagnostic-input/state.json --output build/org-android --fixture build/wave3/network-fixture
            xvfb-run -a -s '-screen 0 1440x2000x24' dbus-run-session -- bash -euc 'openbox >build/openbox.log 2>&1 & trap "kill $! || true" EXIT; python3 tests/gtk_android_organization/gtk.py --phase gtk-return --previous build/org-android/state.json --origin build/diagnostic-input --out build/org-gtk-return --package build/package --inspect build/package/received-sdk-inspect'
            python3 tests/gtk_android_organization/android/run.py --phase android-final --previous build/org-gtk-return/state.json --output build/org-android-final --fixture build/wave3/network-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DRIVER-DIAGNOSTIC-NOT-ACCEPTANCE-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/diagnostic/*.json
            build/diagnostic/*.log
            build/org-gtk-first/
            build/diagnostic-input/
            build/org-android/
            build/org-gtk-return/
            build/org-android-final/
            !build/**/key.pem
          if-no-files-found: error
