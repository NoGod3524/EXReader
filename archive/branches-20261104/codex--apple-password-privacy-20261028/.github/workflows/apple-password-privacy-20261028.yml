name: Apple real Remember update restart privacy slice
on:
  push:
    branches: [codex/apple-password-privacy-20261028]
permissions:
  contents: read
  actions: read
env:
  EXR_APPLE_SDK_VERSION: '3.42.0'
  EXR_APPLE_PAGE_THEME: 'ON'
jobs:
  capture-profile:
    name: Retained capture parity and profile (not native acceptance)
    if: contains(github.event.head_commit.message, '[privacy-capture-profile]')
    needs: contract
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare complete pinned streams against historical capture and attribution
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B tests/apple_password_privacy_20261028/inspect_continuation_failure.py --capture-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-capture-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-password-capture-profile/summary.json
          if-no-files-found: error
          retention-days: 30
  prior-diagnostic:
    name: Inspect prior setup failure (not acceptance)
    if: "!contains(github.event.head_commit.message, '[privacy-capture-profile]') && (contains(github.event.head_commit.message, '[privacy-diagnostic]') || contains(github.event.head_commit.message, '[privacy-native-diagnostic]') || contains(github.event.head_commit.message, '[privacy-continuation-diagnostic]'))"
    needs: contract
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate and print only the retained precredential project failure
        if: "!contains(github.event.head_commit.message, '[privacy-native-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-continuation-diagnostic]')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_password_privacy_20261028/inspect_prior.py
      - name: Authenticate retained native failures and print only static source locations
        if: contains(github.event.head_commit.message, '[privacy-native-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-continuation-diagnostic]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_password_privacy_20261028/inspect_native.py
      - name: Diagnose pinned continuation failure without repeating SDK or native work
        if: contains(github.event.head_commit.message, '[privacy-continuation-diagnostic]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_password_privacy_20261028/inspect_continuation_failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-prior-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-password-privacy-prior/
            build/apple-password-privacy-native-diagnostic/diagnostic.json
            build/apple-password-continuation-diagnostic/diagnostic.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  contract:
    name: Privacy oracle rejection controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject mixed capture profile modes
        run: python3 -B tests/apple_password_privacy_20261028/continuation_log_capture.py --check-mode
      - run: python3 tests/apple_password_privacy_20261028/contract.py
      - run: python3 tests/apple_password_privacy_20261028/test_privacy_scan.py
      - run: python3 tests/apple_password_privacy_20261028/test_native_diagnostic.py
      - run: python3 tests/apple_password_privacy_20261028/test_log_evidence.py
      - run: python3 tests/apple_password_privacy_20261028/test_continuation_contract.py
      - run: python3 tests/apple_password_privacy_20261028/test_continuation_diagnostic.py
      - run: python3 tests/apple_password_privacy_20261028/test_ui_observations.py
  sdk:
    name: Privacy SDK ${{ matrix.target }}
    if: "!contains(github.event.head_commit.message, '[privacy-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-native-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-continuation-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-capture-profile]')"
    needs: contract
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/apple_password_privacy_20261028/contract.py
      - run: python3 tests/apple_sdk342_package/run.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-sdk342/${{ matrix.target }}/identity.json
            build/apple-sdk342/${{ matrix.target }}/sdk/
            build/apple-sdk342/${{ matrix.target }}/products/
          if-no-files-found: error
          retention-days: 30
  native:
    name: Privacy native ${{ matrix.platform }}
    if: "!contains(github.event.head_commit.message, '[privacy-continuation]') && !contains(github.event.head_commit.message, '[privacy-capture-profile]')"
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            target: macos
          - platform: iphone
            target: iphonesimulator
          - platform: ipad
            target: iphonesimulator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: password-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/password-sdk-input/password-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Reject invalid flags and preserve xcodeproj String/Array settings
        run: ruby tests/apple_password_privacy_20261028/test_project_flags.rb
      - name: Real account Remember, restart, uncheck and Update, restart
        run: python3 tests/apple_password_privacy_20261028/run.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-native-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-password-privacy/${{ matrix.platform }}/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  authenticate:
    name: Authenticate original privacy evidence
    needs: [contract, sdk, native]
    if: always() && !contains(github.event.head_commit.message, '[privacy-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-native-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-continuation-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-continuation]') && !contains(github.event.head_commit.message, '[privacy-capture-profile]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently reread original ZIPs, xcresult and all private bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_password_privacy_20261028/authenticate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-password-privacy-summary/
          if-no-files-found: error
          retention-days: 30
  continuation:
    name: Privacy diagnostic continuation ${{ matrix.platform }}
    if: contains(github.event.head_commit.message, '[privacy-continuation]') && !contains(github.event.head_commit.message, '[privacy-capture-profile]')
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            target: macos
          - platform: iphone
            target: iphonesimulator
          - platform: ipad
            target: iphonesimulator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: password-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/password-sdk-input/password-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - run: ruby tests/apple_password_privacy_20261028/test_project_flags.rb
      - name: Diagnostic sequence only; record every strict privacy failure
        run: python3 tests/apple_password_privacy_20261028/continuation_run.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-continuation-native-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-password-continuation/${{ matrix.platform }}/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  continuation-authenticate:
    name: Authenticate diagnostic continuation (not acceptance)
    needs: [contract, sdk, continuation]
    if: always() && contains(github.event.head_commit.message, '[privacy-continuation]') && !contains(github.event.head_commit.message, '[privacy-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-native-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-continuation-diagnostic]') && !contains(github.event.head_commit.message, '[privacy-capture-profile]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify probe bytes and preserve failed strict verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_password_privacy_20261028/authenticate_continuation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-continuation-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-password-continuation-summary/summary.json
          if-no-files-found: error
          retention-days: 30
