name: F08 Windows preserved product ETL replay
on:
  push:
    branches: [codex/dot-f08-windows-product-replay-20261031]
permissions:
  contents: read
  actions: read
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
jobs:
  replay:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse additive read-only auditor
        run: python -m py_compile tests/reader_f08_windows_product_frames_20261031/replay.py
      - name: Authenticate and replay every original product ETL
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_f08_windows_product_frames_20261031/replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-windows-product-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f08-windows-product-replay/result.json
            build/f08-windows-product-replay/metadata.json
            build/f08-windows-product-replay/trace-*/
          if-no-files-found: error
