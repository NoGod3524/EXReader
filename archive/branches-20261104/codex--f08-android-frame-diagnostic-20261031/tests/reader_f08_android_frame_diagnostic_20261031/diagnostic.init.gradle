// Adds only a second test runner to the same-certificate Release test APK.
gradle.beforeProject { suite ->
    if (suite.path == ':app') {
        suite.pluginManager.withPlugin('com.android.application') {
            suite.androidComponents.finalizeDsl { extension ->
                def root = new File(suite.rootProject.projectDir, '../../tests/reader_f08_android_frame_diagnostic_20261031')
                extension.sourceSets.androidTest.java.srcDir(new File(root, 'java'))
                extension.sourceSets.androidTest.manifest.srcFile(new File(root, 'AndroidManifest.xml'))
            }
        }
    }
}
