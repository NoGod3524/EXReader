name: F08 LAP25002 native GPU capture
on:
  push:
    branches: [codex/f08-lap25002-native-20261031]
permissions:
  contents: read
  actions: read
concurrency:
  group: f08-lap25002-native
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
defaults:
  run:
    shell: pwsh
jobs:
  capture:
    runs-on: [f08-lap25002-native]
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.raw.outputs.artifact-id }}
      digest: ${{ steps.raw.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the unchanged native UI automation dependency
        run: python -m pip install uiautomation==2.0.29
      - name: Run authenticated product and observer on the physical GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_f08_lap25002_20261031/run.py capture
      - uses: actions/upload-artifact@v4
        id: raw
        if: always()
        with:
          name: f08-windows-product-pixels-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-windows-product-pixels/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-device-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-device-observer/device.json
          if-no-files-found: warn
  audit:
    needs: capture
    if: always() && needs.capture.outputs.artifact != ''
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently replay device pixels and verify runner identity
        env:
          GH_TOKEN: ${{ github.token }}
          F08_ARTIFACT_ID: ${{ needs.capture.outputs.artifact }}
          F08_ARTIFACT_DIGEST: ${{ needs.capture.outputs.digest }}
        run: python tests/reader_f08_lap25002_20261031/run.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-lap25002-native-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-windows-product-pixels-audit/audit.json
          if-no-files-found: error
