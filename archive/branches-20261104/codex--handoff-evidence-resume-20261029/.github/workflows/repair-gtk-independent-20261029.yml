name: Independent focused GTK repair evidence
on:
  push:
    branches: [codex/handoff-evidence-resume-20261029]
    paths: ['tools/reader_composition/repair_gtk_independent_20261029.py', '.github/workflows/repair-gtk-independent-20261029.yml']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/reader_composition/repair_gtk_independent_20261029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-gtk-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/repair-gtk-independent/
          if-no-files-found: error
