name: F07 Windows and macOS installed provider evidence
on:
  push:
    branches: [codex/dot-f07-desktop-provider-20261031]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Installed static SDK and real Windows package
        shell: pwsh
        run: python tests/reader_f07_desktop_provider_20261031/build_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f07-desktop-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f07-desktop/evidence/*
          if-no-files-found: error
          retention-days: 14
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Native build tools
        run: brew install ninja
      - name: Installed shared SDK and real macOS bundle
        run: python3 tests/reader_f07_desktop_provider_20261031/build_macos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f07-desktop-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f07-desktop/evidence/*
          if-no-files-found: error
          retention-days: 14
  audit:
    needs: [windows, macos]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Independent PE and Mach-O readers
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Authenticate original two artifacts and semantic controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_f07_desktop_provider_20261031/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f07-desktop-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f07-desktop-audit/
          if-no-files-found: error
          retention-days: 14
