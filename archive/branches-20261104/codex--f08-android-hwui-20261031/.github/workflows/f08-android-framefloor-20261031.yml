name: F08 Android HWUI pipeline controls
on:
  push:
    branches: [codex/f08-android-hwui-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gpu: [swiftshader_indirect]
        hwui: [skiagl, skiavk]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check parser controls and syntax
        run: |
          python3 -m py_compile tests/reader_f08_android_framefloor_20261031/run.py
          python3 tests/reader_f08_android_framefloor_20261031/run.py controls
      - name: Prepare emulator tools
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "emulator" "system-images;android-34;default;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe system UI on the declared renderer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu ${{ matrix.gpu }} -camera-back none
          disable-animations: false
          script: python3 tests/reader_f08_android_framefloor_20261031/run.py '${{ matrix.gpu }}' '${{ matrix.hwui }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-android-hwui-${{ matrix.hwui }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-android-framefloor/
          if-no-files-found: error
          retention-days: 30
