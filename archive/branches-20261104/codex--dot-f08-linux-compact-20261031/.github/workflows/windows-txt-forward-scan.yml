name: Windows TXT current-page forward scan
on:
  push:
    branches: [codex/dot-windows-txt-forward-ot, codex/reader-font-forward-composition-20261028]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      EXR_COMPOSITION_CONTENT_BOUND: '1'
      EXR_COMPOSITION_TXT_PROGRESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify source and exact authorized SDK exception
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 5447b05a6b942d6ad568f65179c43a946c2890e3 HEAD
          test -z "$(git diff 5447b05a6b942d6ad568f65179c43a946c2890e3 HEAD -- src include ':!src/opentype.c')"
          test "$(git rev-parse HEAD:src/opentype.c)" = 8cab9b949b29c73ff54c6f9e5385edd351edf460
          test "$(git rev-parse 5b7a34ee4f1ce38cf3bcd7cf0220575f4ecf7da9:src/opentype.c)" = 8cab9b949b29c73ff54c6f9e5385edd351edf460
          echo "Authorized exact OpenType source: 5b7a34ee4f1ce38cf3bcd7cf0220575f4ecf7da9; combined source: $GITHUB_SHA"
      - name: Prepare native Windows display
        run: python tests/reader_native_owner_repairs/display.py
      - name: Build and run unchanged composed-host regression gates
        id: retained
        run: python tests/reader_wave3_c09/build.py
      - name: Build same-source from-first reference host
        if: always() && steps.retained.outcome != 'skipped'
        shell: pwsh
        run: |
          $prefix = "$pwd/build/c09/raw-stage;$pwd/build/c09/product-stage;$pwd/build/c09/sdk-stage"
          cmake -S apps/reader/desktop -B build/txt-scan-reference -G Ninja "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_PREFIX_PATH=$prefix" "-DEXR_SDK=$pwd/build/c09/sdk-stage" "-DEXR_SDK_VERSION=3.41.0" "-DREADER_METADATA_PREFIX=$pwd/build/c09/raw-stage" "-DREADER_ACCOUNT_PREFIX=$pwd/build/c09/raw-stage" "-DEXR_READER_WINDOWS_WAVE3=ON" "-DEXR_READER_WINDOWS_CLOUD_CONTENT_BOUND=ON" "-DEXR_READER_WINDOWS_TXT_PROGRESS=ON" "-DCMAKE_C_FLAGS=/DEXR_TXT_SCAN_FROM_FIRST=1"
          if ($LASTEXITCODE) { throw 'reference configure failed' }
          cmake --build build/txt-scan-reference --target EXReaderWave3 --parallel 4 --verbose
          if ($LASTEXITCODE) { throw 'reference build failed' }
      - name: Real native search equivalence and scan measurements
        if: always() && steps.retained.outcome != 'skipped'
        run: python tests/windows_txt_forward_scan/check_ui.py --candidate build/c09/package/EXReader/EXReader.exe --reference build/txt-scan-reference/EXReaderWave3.exe --font build/host-font-cache/Reader.otf --output build/txt-forward-scan
      - name: Same-source installed SDK public regression tests
        if: always() && steps.retained.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/windows_txt_forward_scan/sdk -B build/txt-scan-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/c09/sdk-stage"
          cmake --build build/txt-scan-sdk --parallel 4
          ctest --test-dir build/txt-scan-sdk --output-on-failure --no-tests=error
      - name: Preserve same-round reports and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-txt-forward-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/txt-forward-scan/
            build/c09/report.json
            build/c09/txt-progress/report.json
            build/c09/logs/
            build/c09/compact22/report.json
            build/c09/raw-owner-suite/report-*.json
            build/c09/extracted-ui/
            build/c09/package/build.json
            build/native-owner-preflight/display.json
            build/txt-scan-sdk/Testing/
          if-no-files-found: error
