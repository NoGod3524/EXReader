name: Reader wave3 S18 joint install acceptance
on:
  push:
    branches: [codex/reader-wave3-s18]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    name: joint install preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate the fixed seed, the owned paths and actual mutation refusals
        run: |
          python -m py_compile tests/reader_wave3_s18/guard.py tests/reader_wave3_s18/runtime.py tests/reader_wave3_s18/strict.py
          python tests/reader_wave3_s18/guard.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s18-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s18/source.json
          if-no-files-found: error
  strict:
    needs: preflight
    name: source receipt strict
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate the same-attempt source receipt ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_wave3_s18/guard.py strict
      - uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s18-source-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s18/strict.json
          if-no-files-found: error
  runtime:
    needs: preflight
    name: shared install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the pinned build and fixture tools
        run: python -m pip install ninja==1.11.1.1 fonttools==4.58.0
      - name: Native Linux transport dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev pkg-config
      - name: Native macOS transport dependencies
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for formula in pkg-config openssl@3; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then brew install "$formula"; fi
          done
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
          } >> "$GITHUB_ENV"
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build both family installs and replay every original business judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile tests/reader_wave3_s18/runtime.py
          python tests/reader_wave3_s18/runtime.py
      - name: Preserve every log, program, report and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s18-runtime-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s18/runtime/
          if-no-files-found: error
  runtime-strict:
    needs: [runtime, strict]
    if: always()
    name: runtime strict
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate all three runtime ZIPs, programs, reports and 15 mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_wave3_s18/strict.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-wave3-s18-runtime-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s18/runtime-strict.json
          if-no-files-found: error
