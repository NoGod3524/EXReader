name: F08 Mac26 native reader capability
on:
  push:
    branches: [codex/f08-apple-reader26-agent-20261031]
permissions:
  contents: read
  actions: read
env:
  EXR_APPLE_SDK_VERSION: '3.42.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare existing generator
        run: gem list -i xcodeproj || gem install xcodeproj --no-document
      - name: Original reader11 and reader12 with actual setup Window
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_f08_apple_reader26_20261031/run.py native --platform macos
      - name: Seal failures and missing native metrics
        id: seal
        if: always()
        run: python3 tests/reader_f08_apple_reader26_20261031/run.py seal --platform macos
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outcome == 'success'
        with:
          name: f08-apple-reader26-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-apple-reader26/macos/evidence/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.seal.outcome != 'success'
        with:
          name: f08-apple-reader26-unsealed-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-apple-reader26/macos/control/UNSEALED.json
          if-no-files-found: error
  audit:
    needs: native
    if: always()
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independently authenticate bytes and reparse native reader metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_f08_apple_reader26_20261031/run.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-apple-reader26-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-apple-reader26-audit/report.json
          if-no-files-found: error
