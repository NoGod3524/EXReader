name: F08 macOS26 independent native metric capability
on:
  push:
    branches: [codex/f08-apple-cap26-agent-20261031]
permissions:
  contents: read
  actions: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  EXR_APPLE_SDK_VERSION: '3.42.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare existing project generator
        run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Authenticate original programs and run the bounded capability
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_f08_apple_cap26_20261031/run.py native
      - name: Seal all observations including failures
        if: always()
        run: python3 tests/reader_f08_apple_cap26_20261031/run.py seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-apple-cap26-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-apple-cap26/evidence/
          include-hidden-files: true
          if-no-files-found: error
  audit:
    needs: native
    if: always()
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independently authenticate program and native result bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_f08_apple_cap26_20261031/run.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-apple-cap26-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-apple-cap26-audit/report.json
          if-no-files-found: error
