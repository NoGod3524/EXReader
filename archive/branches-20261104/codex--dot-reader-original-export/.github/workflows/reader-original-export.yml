name: Reader original export
on:
  push:
    branches: [codex/dot-reader-original-export]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  export:
    name: original export (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard fixed start, SDK, schema and exact D03 ownership
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          START=a826a65c9c66e43620eff61b49cb79f941a3c953
          SDK=9854061be331fe603a1822d9b2b36ee357154927
          git merge-base --is-ancestor "$START" HEAD
          git diff --exit-code "$SDK" HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          bad=$(git diff --name-only "$START" HEAD | grep -Ev '^(apps/reader/original-export/|tests/reader_original_export/|\.github/workflows/reader-original-export\.yml$|docs/READER-ORIGINAL-EXPORT\.md$|docs/validation/reader-original-export\.json$)' || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ninja==1.11.1.1
      - name: Native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment missing' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install frozen SDK and unchanged product packages
        run: |
          mkdir -p build/oe-logs
          git rev-parse HEAD > build/oe-logs/source.txt
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "OE_WS=$ws" >> "$GITHUB_ENV"
          echo "OE_SDK=$ws/build/reading-library/stage" >> "$GITHUB_ENV"
          echo "OE_PRODUCT=$ws/build/oe-product-stage" >> "$GITHUB_ENV"
          echo "OE_STAGE=$ws/build/oe-stage" >> "$GITHUB_ENV"
          cmake --preset reading-library 2>&1 | tee build/oe-logs/sdk-configure.log
          cmake --build --preset reading-library --parallel 4 2>&1 | tee build/oe-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/oe-logs/sdk-install.log
          cmake -S apps/reader/store/native -B build/oe-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/oe-product-stage"
          cmake --build build/oe-product --parallel 4
          cmake --install build/oe-product
          cmake -S apps/reader/revisions -B build/oe-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$ws/build/oe-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/oe-product-stage"
          cmake --build build/oe-revisions --parallel 4
          cmake --install build/oe-revisions
          cmake -S apps/reader/commands -B build/oe-commands -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ws/build/oe-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/oe-product-stage"
          cmake --build build/oe-commands --parallel 4
          cmake --install build/oe-commands
      - name: Install opt-in static C ABI and compile fresh installed consumers
        run: |
          cmake -S apps/reader/original-export -B build/oe-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$OE_SDK" -DCMAKE_INSTALL_PREFIX="$OE_STAGE" 2>&1 | tee build/oe-logs/package-configure.log
          cmake --build build/oe-package --verbose 2>&1 | tee build/oe-logs/package-build.log
          cmake --install build/oe-package 2>&1 | tee build/oe-logs/package-install.log
          mkdir -p "$RUNNER_TEMP/oe-fresh-consumer"
          cp tests/reader_original_export/consumer/* "$RUNNER_TEMP/oe-fresh-consumer/"
          cmake -S "$RUNNER_TEMP/oe-fresh-consumer" -B build/oe-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$OE_STAGE;$OE_SDK;$OE_PRODUCT" 2>&1 | tee build/oe-logs/consumer-configure.log
          cmake --build build/oe-consumer --verbose 2>&1 | tee build/oe-logs/consumer-build.log
      - name: Nine original formats, fault/kill/retry and public invariants
        run: |
          exe=""; module="$OE_STAGE/lib/libreader_original_export.a"
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; module="$OE_STAGE/lib/reader_original_export.lib"; fi
          python tests/reader_original_export/make_fixtures.py build/oe-fixtures
          python tests/reader_original_export/check_export.py "build/oe-consumer/original-export-probe$exe" "build/oe-consumer/original-export-c-consumer$exe" build/oe-fixtures build/oe-evidence "$module" 2>&1 | tee build/oe-logs/checks.log
      - name: Preserve every real result, binary and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-original-export-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/oe-logs/
            build/oe-fixtures/
            build/oe-evidence/
            build/oe-stage/
            build/oe-consumer/original-export-link.map
          if-no-files-found: error
  evidence:
    name: strict original-export evidence
    needs: export
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard evidence source and ownership
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a826a65c9c66e43620eff61b49cb79f941a3c953 HEAD
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          bad=$(git diff --name-only a826a65c9c66e43620eff61b49cb79f941a3c953 HEAD | grep -Ev '^(apps/reader/original-export/|tests/reader_original_export/|\.github/workflows/reader-original-export\.yml$|docs/READER-ORIGINAL-EXPORT\.md$|docs/validation/reader-original-export\.json$)' || true)
          test -z "$bad"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate actual artifacts, binaries and negative verifier cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_original_export/check_artifacts.py build/oe-artifact-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-original-export-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/oe-artifact-evidence/
          if-no-files-found: error
