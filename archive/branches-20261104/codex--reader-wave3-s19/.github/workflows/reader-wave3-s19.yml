name: Reader wave3 S19 single SDK and store closure
on:
  push:
    branches: [codex/reader-wave3-s19]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  S19_SEED: d263ce5228838ac90c0a0dc13a5193d4a7739681
  S19_SDK: edddc463c06ed5731195cdb8f06b2df6dff7699e
jobs:
  guard:
    name: fixed source and owned paths
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse any source outside this package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$S19_SEED" HEAD
          git merge-base --is-ancestor "$S19_SDK" HEAD
          git diff --exit-code "$S19_SDK" HEAD -- src include cmake CMakeLists.txt bindings tools/layers.json
          git diff --exit-code "$S19_SEED" HEAD -- apps/reader/store apps/reader/revisions \
            apps/reader/reading-state apps/reader/sync apps/reader/session apps/reader/desktop \
            apps/reader/font-library apps/reader/original-export apps/reader/jump-history \
            apps/reader/sync-status-view apps/reader/annotation-import apps/reader/annotation-export \
            extras examples tests/fixtures docs/handoffs
          allowed='^(apps/reader/host-feature-link/|tests/reader_wave3_s19/|docs/reader-wave3-s19/|tools/reader_host_feature_link\.cmake$|\.github/workflows/reader-wave3-s19\.yml$|HANDOFF-RESULT-S19\.md$)'
          changed=$(git diff --name-only "$S19_SEED" HEAD | sed '/^$/d')
          bad=$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "unowned path: $bad"; exit 1; }
          python -m py_compile tests/reader_wave3_s19/run.py tests/reader_wave3_s19/pe.py \
            tests/reader_wave3_s19/verify.py
          echo "guard accepted $(printf '%s\n' "$changed" | wc -l) owned paths"
  host:
    name: one SDK and one store (${{ matrix.key }})
    needs: guard
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux
          - os: windows-2022
            key: windows
          - os: macos-15
            key: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing build tool and Linux native TLS/XML packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja==1.11.1.1
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config ninja-build
          fi
      - name: Use the Apple native TLS/XML packages through pkg-config
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config openssl@3
          sdkroot=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build/apple-pkgconfig
          version=$(/usr/bin/curl --version | awk 'NR==1 {print $2}')
          cat > build/apple-pkgconfig/libcurl.pc <<EOF
          prefix=${sdkroot}/usr
          Name: libcurl
          Description: Apple SDK system libcurl
          Version: ${version}
          Libs: -L\${prefix}/lib -lcurl
          Cflags:
          EOF
          echo "PKG_CONFIG_PATH=${PWD}/build/apple-pkgconfig" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix openssl@3)/bin:${PATH}" >> "$GITHUB_ENV"
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c ('"{0}" >nul && set' -f $bat) | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: One installed SDK, five installed packages, one DSO, one host
        run: |
          set -o pipefail
          mkdir -p build
          python tests/reader_wave3_s19/run.py 2>&1 | tee build/s19-driver.log
      - name: Upload the same-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s19-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s19/artifact
          if-no-files-found: error
          retention-days: 90
  evidence:
    name: same-run identities and artifact digests
    needs: host
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: reader-wave3-s19-*
          path: build/reader-wave3-s19/downloaded
          merge-multiple: false
      - name: Record the tool versions of this runner
        run: |
          mkdir -p build/reader-wave3-s19
          {
            echo "cmake $(cmake --version | head -n1)"
            echo "python $(python --version 2>&1)"
            echo "uname $(uname -a)"
            echo "source $GITHUB_SHA run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          } > build/reader-wave3-s19/toolchain.txt
          cat build/reader-wave3-s19/toolchain.txt
      - name: Query the artifact metadata of this very attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > build/reader-wave3-s19/artifacts-api.json
          python - <<'PY'
          import json
          data = json.load(open('build/reader-wave3-s19/artifacts-api.json'))
          mine = [item for item in data['artifacts']
                  if item['name'].startswith('reader-wave3-s19-') and 'evidence' not in item['name']]
          assert len(mine) == 3, [item['name'] for item in mine]
          json.dump({'artifacts': mine}, open('build/reader-wave3-s19/artifacts.json', 'w'), indent=2)
          for item in mine:
              print(item['name'], item['size_in_bytes'], item['digest'], item['expires_at'])
          PY
      - name: Recompute every identity and refuse a partial run
        run: |
          set -o pipefail
          python tests/reader_wave3_s19/verify.py --root build/reader-wave3-s19/downloaded \
            --artifacts build/reader-wave3-s19/artifacts.json \
            --output build/reader-wave3-s19/evidence.json \
            --expect-source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee build/reader-wave3-s19/verify.log
      - name: Upload the strict evidence
        uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s19-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reader-wave3-s19/evidence.json
            build/reader-wave3-s19/artifacts.json
            build/reader-wave3-s19/toolchain.txt
          if-no-files-found: error
          retention-days: 90
