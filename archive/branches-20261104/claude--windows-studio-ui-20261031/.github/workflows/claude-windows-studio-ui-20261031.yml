name: Windows Studio UI build, launch smoke and UI drive
# Approved standing budget for the remaining work: at most 6 more runs in total, one
# windows job of 60 minutes each; fixes and reruns count toward the 6.
on:
  push:
    branches: [claude/windows-studio-ui-20261031]
    paths:
      - apps/reader/windows-studio/**
      - .github/workflows/claude-windows-studio-ui-20261031.yml
permissions:
  contents: read
jobs:
  studio:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the framework baseline and owned paths only
        shell: bash
        run: |
          BASE=8ca964fc4adc572cf2da303f5d88100a5e844ccb
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          allowed='^(apps/reader/windows-studio/|[.]github/workflows/claude-windows-studio-ui-20261031[.]yml$)'
          bad=$(git diff --name-only "$BASE" HEAD | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "unowned path: $bad"; exit 1; }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and install the reading-library SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/studio-logs | Out-Null
          cmake --preset reading-library 2>&1 | Tee-Object build/studio-logs/sdk-configure.log
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset reading-library 2>&1 | Tee-Object build/studio-logs/sdk-build.log
          if ($LASTEXITCODE) { exit 1 }
          cmake --install build/reading-library 2>&1 | Tee-Object build/studio-logs/sdk-install.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Build EXReader Studio
        shell: pwsh
        run: |
          cmake -S apps/reader/windows-studio -B build/studio -G Ninja -DCMAKE_BUILD_TYPE=Release "-DEXR_SDK=$PWD/build/reading-library/stage" 2>&1 | Tee-Object build/studio-logs/studio-configure.log
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build/studio --verbose 2>&1 | Tee-Object build/studio-logs/studio-build.log
          if ($LASTEXITCODE) { exit 1 }
      - name: Launch smoke with a temporary library
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'studio-data'
          $books = @('tests/fixtures/cover-import.epub', 'tests/fixtures/pdf-blend/flat.pdf', 'tests/fixtures/comic.cbz') |
            ForEach-Object { (Resolve-Path $_).Path }
          $app = Start-Process -FilePath build/studio/exreader-studio.exe -ArgumentList (@('--data', "`"$data`"") + ($books | ForEach-Object { "`"$_`"" })) -PassThru
          Start-Sleep -Seconds 20
          $app.Refresh()
          $alive = -not $app.HasExited
          "alive_after_20s=$alive" | Tee-Object build/studio-logs/smoke.txt
          if (-not $alive) { "exit_code=$($app.ExitCode)" | Tee-Object -Append build/studio-logs/smoke.txt; exit 1 }
          $db = Join-Path $data 'library.sqlite'
          "library_exists=$(Test-Path $db)" | Tee-Object -Append build/studio-logs/smoke.txt
          taskkill /PID $app.Id | Out-Null
          if (-not $app.WaitForExit(15000)) { Stop-Process -Id $app.Id -Force; "graceful_close=False" | Tee-Object -Append build/studio-logs/smoke.txt; exit 1 }
          "graceful_close=True exit_code=$($app.ExitCode)" | Tee-Object -Append build/studio-logs/smoke.txt
          if (-not (Test-Path $db)) { exit 1 }
          $count = python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('select count(*) from books').fetchone()[0])" $db
          "imported_books=$count expected=3" | Tee-Object -Append build/studio-logs/smoke.txt
          if ($count -ne '3') { exit 1 }
      - name: Drive the UI through EPUB, PDF and CBZ
        shell: pwsh
        run: |
          $probes = Join-Path $env:RUNNER_TEMP 'studio-probes'
          python -I apps/reader/windows-studio/tests/make-probes.py $probes
          if ($LASTEXITCODE) { exit 1 }
          $books = @("$probes/probe.epub", "$probes/probe.pdf", 'tests/fixtures/comic.cbz', 'tests/fixtures/cover-import.epub',
            "$probes/long-title.epub") |
            ForEach-Object { (Resolve-Path $_).Path }
          ./apps/reader/windows-studio/tests/drive.ps1 -Exe build/studio/exreader-studio.exe `
            -Data (Join-Path $env:RUNNER_TEMP 'studio-drive-data') -Out build/studio-logs/drive -Books $books
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-studio-ui-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/studio/exreader-studio.exe
            build/studio-logs/
