name: Pinned original Sync Android cache diagnostic
on:
  push:
    branches: [codex/reader-sync-public-hash-cache-diagnostic-20261029]
permissions:
  contents: read
  actions: read
concurrency:
  group: sync-public-hash-cache-diagnostic-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-cache-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact two-addition scope and diagnostic rejection controls
        run: python3 tests/reader_sync_public_hash_cache_diagnostic_20261029.py --self-test
      - name: Authenticate and inspect original Android cache metadata only
        run: python3 tests/reader_sync_public_hash_cache_diagnostic_20261029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-public-hash-cache-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sync-public-hash-cache-diagnostic/report.json
          if-no-files-found: error
