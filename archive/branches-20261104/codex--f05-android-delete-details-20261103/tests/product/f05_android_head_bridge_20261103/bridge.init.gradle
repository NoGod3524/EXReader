import groovy.json.JsonOutput
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.afterEvaluate {
            def extra = new File(project.rootProject.projectDir, '../../tests/product/f05_android_head_bridge_20261103/java').canonicalFile
            def before = project.android.sourceSets.androidTest.java.srcDirs.collect { it.canonicalFile }
            if (before.contains(extra)) throw new GradleException('Bridge source already present')
            project.android.sourceSets.androidTest.java.srcDir(extra)
            def actual = project.android.sourceSets.androidTest.java.srcDirs.collect { it.canonicalFile }
            if (actual != before + [extra]) throw new GradleException('Unexpected bridge sourceSet')
            def boundary = project.findProperty('f05Boundary') == 'true'
            def proof = boundary ? new File(project.findProperty('f05EvidenceDir').toString(), 'boundary-source-sets.json') :
                new File(project.rootProject.projectDir, '../../build/f05-bridge/bridge-source-sets.json')
            if (boundary && !project.rootProject.projectDir.canonicalPath.endsWith('/build/f05-boundary-stage/examples/android'))
                throw new GradleException('Boundary probe must use isolated source tree')
            proof.parentFile.mkdirs()
            proof.text = JsonOutput.prettyPrint(JsonOutput.toJson([before: before.collect { it.path }, after: actual.collect { it.path }, added: extra.path]))
        }
    }
}
