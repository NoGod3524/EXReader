name: F06 same-source six-platform application packages
on:
  push:
    branches: [codex/dot-six-platform-package-identity]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  EXR_APPLE_SDK_VERSION: '3.41.0'
  EXR_APPLE_RAW3: 'ON'
  EXR_APPLE_PAGE_THEME: 'ON'
  C11_NDK: '27.0.12077973'
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 -m py_compile tests/reader_f06_packages/*.py
          python3 tests/reader_f06_packages/identity.py guard
      - uses: actions/upload-artifact@v4
        with:
          name: f06-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/source.json
          if-no-files-found: error
  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python tests/reader_f06_packages/build.py windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-windows-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/windows-build/logs/
  linux:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config ninja-build
      - run: python3 tests/reader_f06_packages/build.py linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/linux/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-linux-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/gtk-raw-wave3/*.log
            build/gtk-raw-wave3/*.json
  apple:
    needs: source
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphone]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tests/reader_f06_packages/build.py '${{ matrix.target }}'
      - name: Install exact archive bytes on iPhone simulator
        if: matrix.target == 'iphone'
        run: python3 tests/reader_f06_packages/identity.py apple iphone
      - name: Package the same universal application for iPad and install it
        if: matrix.target == 'iphone'
        run: |
          python3 tests/reader_f06_packages/identity.py package ipad build/f06/iphone-payload
          python3 tests/reader_f06_packages/identity.py apple ipad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'iphone'
        with:
          name: f06-ipad-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/ipad/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-apple-${{ matrix.target }}-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f06/*-payload/*.json
            build/f06/*-payload/*.map
            build/f06/*-build/*/CMakeCache.txt
  android:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          python3 -m pip install 'PyYAML==6.0.3'
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;${C11_NDK}" "emulator" "system-images;android-34;default;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 tests/reader_f06_packages/build.py android
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: python3 tests/reader_f06_packages/identity.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/android/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-android-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/wave3/logs/
            build/f06/android-build-step-*.sh
  authenticate:
    if: always()
    needs: [source, windows, linux, apple, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: f06-*
          path: f06-input
      - run: python3 tests/reader_f06_packages/identity.py summary
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f06-authenticated-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/summary.json
          if-no-files-found: error
