name: iPhone annotation original evidence audit
on:
  push:
    branches: [codex/gpt-iphone-annotation-evidence-20261031]
permissions:
  contents: read
  actions: read
concurrency:
  group: gpt-iphone-annotation-evidence-20261031
  cancel-in-progress: false
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Select available original xcresult reader
        shell: bash
        run: |
          if [ -d /Applications/Xcode_26.2.app/Contents/Developer ]; then
            echo DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer >> "$GITHUB_ENV"
          fi
      - name: Authenticate original ZIP and map seven frozen-test operations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile tools/reader_composition/iphone_annotation_evidence_20261031.py
          python3 tools/reader_composition/iphone_annotation_evidence_20261031.py
      - name: Preserve original archive and separate scoped evidence on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-annotation-original-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/iphone-annotation-evidence/*.json
            build/iphone-annotation-evidence/*.txt
            build/iphone-annotation-evidence/target-native-ui.log
            build/iphone-annotation-evidence/original.zip
            build/iphone-annotation-evidence/attachments/
          include-hidden-files: true
          if-no-files-found: error
