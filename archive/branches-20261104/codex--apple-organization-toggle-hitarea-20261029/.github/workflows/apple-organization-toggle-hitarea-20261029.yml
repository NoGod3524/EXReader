name: Original iPhone organization on compact native toggle
on:
  push:
    branches: [codex/apple-organization-toggle-hitarea-20261029]
permissions:
  contents: read
  actions: read
env:
  EXR_APPLE_SDK_VERSION: '3.42.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
jobs:
  sdk:
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen original organization tests and checker remain exact
        run: |
          git diff --exit-code 329d676880c9c5f653b48f2ed6179bd1d7f97b28 HEAD -- tests tools/check_apple_product.py
          python3 -m compileall -q tests/apple_sdk342_host tools/build_apple_product.py
      - name: Same-source frozen SDK and public product installations
        run: python3 tests/apple_sdk342_host/build.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team24-apple-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            build/raw3-ios-sdk/${{ matrix.target }}/sdk/
            build/raw3-ios-sdk/${{ matrix.target }}/raw-products/
            build/raw3-ios-sdk/${{ matrix.target }}/*.json
          retention-days: 30
          if-no-files-found: error
  original-six:
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: team24-apple-sdk-*
          path: sdk-input
      - name: Original project generator dependency
        run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Original six organization cases and original budgets
        run: python3 tests/apple_sdk342_host/supplemental.py --platform iphone --suite organization
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-toggle-original-six-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-sdk342-supplemental/iphone/organization/
          retention-days: 30
          if-no-files-found: error
