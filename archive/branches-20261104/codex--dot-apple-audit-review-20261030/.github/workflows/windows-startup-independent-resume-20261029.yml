name: Independent Windows startup public-source evidence
on:
  push:
    branches: [codex/handoff-evidence-resume-20261029]
    paths: ['tools/reader_composition/windows_startup_independent.py', '.github/workflows/windows-startup-independent-resume-20261029.yml']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Independently verify original archive, exact cases, preserved fixtures and product bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/reader_composition/windows_startup_independent.py
          --run 40946894259 --source 343bb94eb6513beaf5b344e7828342f6602a3b7b
          --job 123704514919 --artifact 12928599895 --bytes 4195369
          --sha256 47c3fdbce8c111709e08ec280622a3da1657b3342f39bb172f1c31d0336286d2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-startup-independent/
          if-no-files-found: error
