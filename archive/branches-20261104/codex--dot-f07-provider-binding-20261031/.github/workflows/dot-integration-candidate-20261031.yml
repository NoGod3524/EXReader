name: Independent same-source integration candidate
on:
  push:
    branches: [codex/dot-integration-candidate-20261031]
permissions: {contents: read}
defaults:
  run:
    shell: bash
concurrency:
  group: dot-integration-candidate
  cancel-in-progress: false
jobs:
  privacy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Independent exact integration admission
        run: python tests/dot_integration_candidate_20261031/guard.py
      - name: Build installed dependencies and untouched old consumers
        run: |
          set -euo pipefail
          python -m pip install ninja==1.11.1.1
          mkdir -p build/private-logs
          S="$PWD/build/private-stage"
          SDK="$PWD/build/reading-library/stage"
          mkdir -p build/private-hash-stage
          export EXREADER_ORIGINAL_HASH_PREFIX="$(cd build/private-hash-stage && pwd -P)"
          cmake -S extras/opds -B build/private-hash -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON -DCMAKE_INSTALL_PREFIX="$EXREADER_ORIGINAL_HASH_PREFIX"
          cmake --build build/private-hash --parallel 4
          cmake --install build/private-hash
          cmake -S apps/reader/store/native -B build/private-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$S"
          cmake --build build/private-product --parallel 4
          cmake --install build/private-product
          cmake -S apps/reader/revisions -B build/private-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$S" -DCMAKE_INSTALL_PREFIX="$S"
          cmake --build build/private-revisions --parallel 4
          cmake --install build/private-revisions
          cmake --preset reading-library
          cmake --build --preset reading-library --parallel 4
          cmake --install build/reading-library
          cmake -S apps/reader/reading-state -B build/private-state -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$SDK" -DEXR_SDK_VERSION=3.42.0 -DCMAKE_PREFIX_PATH="$S" -DCMAKE_INSTALL_PREFIX="$S"
          cmake --build build/private-state --parallel 4
          cmake --install build/private-state
          cmake -E env ZERO_AR_DATE=1 cmake -S apps/reader/annotation-export -B build/private-export -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$S;$SDK" -DCMAKE_INSTALL_PREFIX="$S"
          cmake -E env ZERO_AR_DATE=1 cmake --build build/private-export --parallel 4 --verbose
          cat build/private-export/cmake_install.cmake
          cmake -E env ZERO_AR_DATE=1 cmake --install build/private-export
          cmake -S tests/reader_annotation_export/consumer -B build/private-old -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$S;$SDK"
          cmake --build build/private-old --parallel 4
          cmake -S tests/reader_annotation_export_posix_private_20261031 -B build/private-new -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$S;$SDK" -DSOURCE_SHA="$GITHUB_SHA"
          cmake --build build/private-new --parallel 4
      - name: Unchanged original regression
        run: |
          set -euo pipefail
          python tests/reader_annotation_export/make_fixtures.py build/private-fixtures
          python tests/reader_annotation_export/check_export.py --probe build/private-old/annotation-export-probe --c-consumer build/private-old/annotation-export-c-consumer --fixtures build/private-fixtures --output build/private-old-evidence | tee build/private-logs/original.log
      - name: New installed-consumer permission and exec cases
        run: |
          set -euo pipefail
          python tests/reader_annotation_export_posix_private_20261031/run.py --probe build/private-new/annotation-private --old-probe build/private-old/annotation-export-probe --fixtures build/private-fixtures --work build/private-evidence | tee build/private-logs/new.log
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          built=pathlib.Path('build/private-export/libreader_annotation_export.a').read_bytes()
          installed=pathlib.Path('build/private-stage/lib/libreader_annotation_export.a').read_bytes()
          def sha(data):return hashlib.sha256(data).hexdigest()
          def members(data):
              assert data[:8]==b'!<arch>\n'
              result=[];offset=8
              while offset<len(data):
                  header=data[offset:offset+60]
                  assert len(header)==60 and header[58:60]==b'\x60\n'
                  size=int(header[48:58]);start=offset+60;end=start+size
                  assert size>=0 and end<=len(data)
                  name=header[:16].decode('ascii').strip();payload=data[start:end]
                  if name.startswith('#1/'):
                      n=int(name[3:]);assert 0<=n<=len(payload)
                      name=payload[:n].rstrip(b'\0').decode('utf-8');payload=payload[n:]
                  result.append(dict(offset=offset,name=name,header_hex=header.hex(),raw_size=size,payload_size=len(payload),payload_sha256=sha(payload)))
                  offset=end+(size%2)
              assert offset==len(data)
              return result
          cache={}
          for line in pathlib.Path('build/private-export/CMakeCache.txt').read_text().splitlines():
              if '=' in line and not line.startswith(('#','//')):
                  key,value=line.split('=',1);cache[key.split(':')[0]]=value
          def probe(argv):
              try:
                  v=subprocess.run(argv,capture_output=True,text=True,timeout=15)
                  return dict(argv=argv,returncode=v.returncode,stdout=v.stdout,stderr=v.stderr)
              except (OSError,subprocess.TimeoutExpired) as e:
                  return dict(argv=argv,error=type(e).__name__+': '+str(e))
          tools={}
          for key in ('CMAKE_AR','CMAKE_RANLIB','CMAKE_CXX_COMPILER'):
              path=cache.get(key)
              if path:
                  versions=[]
                  for flag in ('--version','-V'):
                      versions.append(probe([path,flag]))
                  tools[key]=dict(path=path,realpath=str(pathlib.Path(path).resolve()),versions=versions)
          ar_lists={}
          for label,path in (('built','build/private-export/libreader_annotation_export.a'),('installed','build/private-stage/lib/libreader_annotation_export.a')):
              ar_lists[label]=probe([cache['CMAKE_AR'],'-tv',path])
          diff=[i for i,(a,b) in enumerate(zip(built,installed)) if a!=b]
          evidence=dict(source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        equal=built==installed,built_size=len(built),installed_size=len(installed),
                        built_sha256=sha(built),installed_sha256=sha(installed),
                        differing_common_bytes=len(diff),first_difference_offsets=diff[:256],
                        built_members=members(built),installed_members=members(installed),tools=tools,ar_lists=ar_lists,
                        ZERO_AR_DATE=os.environ.get('ZERO_AR_DATE'),archive_subprocess_environment={'ZERO_AR_DATE':'1','scope':'annotation-export configure/build/install only'},cmake_version=probe(['cmake','--version']))
          pathlib.Path('build/private-evidence/archive-diagnostic.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('PRIVATE-ARCHIVE-DIAGNOSTIC '+json.dumps(evidence),flush=True)
          assert built==installed
          source=pathlib.Path('apps/reader/annotation-export/src/annotation_export.cpp').read_bytes()
          r=dict(source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],archive_sha256=hashlib.sha256(installed).hexdigest(),source_sha256=hashlib.sha256(source).hexdigest())
          pathlib.Path('build/private-evidence/installed.json').write_text(json.dumps(r,indent=2)+'\n')
          print('PRIVATE-INSTALLED '+json.dumps(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10-annotation-private-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/private-logs/
            build/private-old-evidence/
            build/private-evidence/
            build/private-new/private.map
            build/private-old/annotation-export-link.map
            build/private-stage/lib/libreader_annotation_export.a
            build/private-export/libreader_annotation_export.a
            build/private-export/cmake_install.cmake
            build/private-export/CMakeCache.txt
          if-no-files-found: warn
  webdav-import:
    name: WebDAV import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact integration admission
        run: python tests/dot_integration_candidate_20261031/guard.py
      - name: Install build and fixture tooling
        run: |
          mkdir -p build/wi-logs
          python -m pip install ninja==1.11.1.1
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev libxml2-dev pkg-config
          elif [ "$RUNNER_OS" = macOS ]; then
            brew install openssl@3
            echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure and build the frozen reading library
        run: |
          set -o pipefail
          git rev-parse HEAD > build/wi-logs/source.txt
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "WI_PREFIX=$ws/build/wi-prefix" >> "$GITHUB_ENV"
          echo "WI_SDK=$ws/build/wi-frozen/build/reading-library/stage" >> "$GITHUB_ENV"
          git worktree add --detach build/wi-frozen 9854061be331fe603a1822d9b2b36ee357154927
          cd build/wi-frozen
          cmake --preset reading-library 2>&1 | tee "$ws/build/wi-logs/sdk-configure.log"
          cmake --build --preset reading-library --parallel 4 2>&1 | tee "$ws/build/wi-logs/sdk-build.log"
          cmake --install build/reading-library 2>&1 | tee "$ws/build/wi-logs/sdk-install.log"
      - name: Build unchanged sideload and one-line WebDAV candidate
        run: |
          set -o pipefail
          apple=OFF
          if [ "$RUNNER_OS" = macOS ]; then apple=ON; fi
          cmake -S extras/sideload -B build/wi-sideload -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WI_SDK" -DCMAKE_INSTALL_PREFIX="$WI_PREFIX" 2>&1 | tee build/wi-logs/sideload-configure.log
          cmake --build build/wi-sideload --parallel 4 2>&1 | tee build/wi-logs/sideload-build.log
          cmake --install build/wi-sideload 2>&1 | tee build/wi-logs/sideload-install.log
          cmake -S extras/webdav -B build/wi-webdav -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_WEBDAV_APPLE_URLSESSION=$apple -DCMAKE_INSTALL_PREFIX="$WI_PREFIX" 2>&1 | tee build/wi-logs/webdav-configure.log
          cmake --build build/wi-webdav --parallel 4 2>&1 | tee build/wi-logs/webdav-build.log
          cmake --install build/wi-webdav 2>&1 | tee build/wi-logs/webdav-install.log
      - name: Build and install EXReaderCloudImport against installed packages only
        run: |
          set -o pipefail
          cmake -S apps/reader/cloud-import -B build/wi-adapter -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WI_SDK" -DCMAKE_PREFIX_PATH="$WI_PREFIX;$WI_SDK" -DCMAKE_INSTALL_PREFIX="$WI_PREFIX" 2>&1 | tee build/wi-logs/adapter-configure.log
          cmake --build build/wi-adapter --parallel 4 --verbose 2>&1 | tee build/wi-logs/adapter-build.log
          cmake --install build/wi-adapter 2>&1 | tee build/wi-logs/adapter-install.log
      - name: Compile the independent C and C++ consumers from installed packages
        run: |
          set -o pipefail
          mkdir -p build/wi-include/a/b
          python - <<'PY'
          from pathlib import Path
          root=Path.cwd().resolve()
          original=root/'tests/reader_webdav_import/consumer/../../../..//apps/reader/cloud-import/src/cloud_import.c'
          assert not original.exists() and not original.is_symlink()
          anchor=root/'build/wi-include/a/b'
          source=(anchor/'../../../..//apps/reader/cloud-import/src/cloud_import.c').resolve(strict=True)
          assert source==root/'apps/reader/cloud-import/src/cloud_import.c' and source.is_file()
          print('REVIEW-INCLUDE-ANCHOR',anchor,'SOURCE',source)
          PY
          cmake -S tests/reader_webdav_import/consumer -B build/wi-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-I$PWD/build/wi-include/a/b" -DCMAKE_PREFIX_PATH="$WI_PREFIX;$WI_SDK" 2>&1 | tee build/wi-logs/consumer-configure.log
          cmake --build build/wi-consumer --parallel 4 2>&1 | tee build/wi-logs/consumer-build.log
      - name: Real native TLS WebDAV download, SDK import and independent SDK readback
        run: |
          set -o pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          python3 tests/reader_webdav_import/check_cloud_import.py --probe "build/wi-consumer/cloud-probe$exe" --cxx "build/wi-consumer/cloud-cpp-consumer$exe" --review-probe "build/wi-consumer/cloud-review-probe$exe" --fixtures tests/fixtures --module-prefix build/wi-prefix --output build/wi-evidence 2>&1 | tee build/wi-logs/checks.log
      - name: Original 77-case TLS regression without wrappers
        run: |
          set -euo pipefail
          cmake -S tests/webdav/consumer -B build/cleanup-old -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WI_PREFIX"
          cmake --build build/cleanup-old --parallel 4
          python tests/webdav/check_tls.py --consumer build/cleanup-old/webdav-consumer --module-prefix build/wi-prefix --output build/cleanup-old-evidence | tee build/wi-logs/old77.log
      - name: Seven real HTTPS bounded-cleanup cases on installed module
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cmake -S tests/webdav_temp_cleanup_retry_20261031 -B build/cleanup-new -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WI_PREFIX" -DSOURCE_SHA="$GITHUB_SHA"
          cmake --build build/cleanup-new --parallel 4 --verbose | tee build/wi-logs/retry-build.log
          python tests/webdav_temp_cleanup_retry_20261031/run.py --probe build/cleanup-new/webdav-cleanup-retry --output build/cleanup-retry-evidence | tee build/wi-logs/retry.log
      - name: Source and installed module identity
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path('build/wi-logs');out.mkdir(parents=True,exist_ok=True)
          paths=['extras/webdav/src/webdav.cpp','extras/webdav/include/exr_webdav.h','build/wi-webdav/libexr_webdav.a','build/wi-prefix/lib/libexr_webdav.a']
          r=dict(source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],sdk_source='9854061be331fe603a1822d9b2b36ee357154927',files={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths if pathlib.Path(p).is_file()})
          (out/'binding.json').write_text(json.dumps(r,indent=2)+'\n')
          print('CLEANUP-RETRY-BINDING '+json.dumps(r))
          PY
      - name: Preserve source-bound logs, installed files and every case record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdav-cleanup-retry-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/wi-logs/
            build/wi-evidence/
            !build/wi-evidence/certificates/*.key
            build/cleanup-old-evidence/
            !build/cleanup-old-evidence/certificates/*.key
            build/cleanup-retry-evidence/
            !build/cleanup-retry-evidence/*.key
            build/cleanup-new/retry.map
            build/wi-prefix/
            build/wi-consumer/cloud-probe*
            build/wi-consumer/cloud-cpp-consumer*
            build/wi-consumer/cloud-review-probe*
            build/wi-consumer/CMakeCache.txt
            build/wi-adapter/CMakeCache.txt
          if-no-files-found: error
  compare:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Independent exact integration admission
        run: python tests/dot_integration_candidate_20261031/guard.py
      - name: Four independent actual UIA observations
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/dot_integration_candidate_20261031/f09_driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f09-escape-routing/*.json
            build/f09-escape-routing/baseline-managed/*.log
            build/f09-escape-routing/baseline-managed/*.json
            build/f09-escape-routing/candidate-managed/*.log
            build/f09-escape-routing/candidate-managed/*.json
            build/f09-escape-routing/baseline-native/*.log
            build/f09-escape-routing/baseline-native/*.json
            build/f09-escape-routing/candidate-native/*.log
            build/f09-escape-routing/candidate-native/*.json
            build/f09-escape-routing/baseline-package/build.json
            build/f09-escape-routing/candidate-package/build.json
            build/f09-escape-routing/baseline-package/report.json
            build/f09-escape-routing/candidate-package/report.json
          if-no-files-found: error
  probe:
    name: token and spawn feasibility probe (no host)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Independent exact integration admission
        run: python tests/dot_integration_candidate_20261031/guard.py
      - name: Network-logon token, spawn route and same-token Credential Manager probe
        run: python tests/claude_h02_credential_refusal/check_refusal.py --probe --output build/h02-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-h02-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/h02-probe/
          if-no-files-found: error
  host:
    name: real host under network-logon token
    needs: probe
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      EXR_ACCOUNT_COMPACT_PICKER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Independent exact integration admission
        run: python tests/dot_integration_candidate_20261031/guard.py
      - name: Prepare native display
        run: python tests/reader_native_owner_repairs/display.py
      - name: Install UI automation
        run: python -m pip install uiautomation==2.0.29
      - name: Build and install the OPDSHash prefix required by the product configure (correction 3)
        run: |
          H="$(cygpath -m "$GITHUB_WORKSPACE")/build/h02-hash"
          cmake -S extras/opds -B "$H/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DEXREADER_OPDS_HASH_ONLY=ON "-DCMAKE_INSTALL_PREFIX=$H/prefix"
          cmake --build "$H/build" --parallel 4
          cmake --install "$H/build"
          echo "EXREADER_ORIGINAL_HASH_PREFIX=$H/prefix" >> "$GITHUB_ENV"
      - name: Build and package the current native host with the repository builder
        run: python tests/windows_sdk342/build.py
      - name: Drive the real account dialog under the network-logon token
        run: python tests/claude_h02_credential_refusal/check_refusal.py --candidate build/windows-sdk342/package/EXReader/EXReader.exe --package build/windows-sdk342/package/EXReader --output build/h02-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-h02-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/h02-run/report.json
            build/h02-run/dev/application.log
          if-no-files-found: warn
