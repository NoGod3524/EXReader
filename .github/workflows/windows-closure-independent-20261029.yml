name: Independent closure Windows and recovery evidence
on:
  push:
    branches: [codex/handoff-evidence-resume-20261029]
    paths: ['tools/reader_composition/windows_closure_independent.py', '.github/workflows/windows-closure-independent-20261029.yml']
permissions: {contents: read, actions: read}
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Independently rehash original current-package evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/reader_composition/windows_closure_independent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-closure-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/windows-closure-independent/
          if-no-files-found: error
