name: Apple account sync focused validation
on:
  push:
    branches: [codex/terra-wave-apple-sync]
permissions:
  contents: read
env:
  EXR_APPLE_SDK_VERSION: '3.41.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
jobs:
  account:
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, iphone, ipad]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build frozen SDK and product modules
        run: |
          target=iphonesimulator
          if test '${{ matrix.platform }}' = macos; then target=macos; fi
          python3 tests/reader_team24_apple/build.py --target "$target"
      - name: Native session terminal and retry review
        if: matrix.platform == 'macos'
        run: |
          mkdir -p build/account-terminal
          python3 - <<'PY'
          import subprocess, sys
          sys.path.insert(0, 'tools')
          from apple_swift import flags
          sdk = 'build/raw3-ios-sdk/macos/sdk'
          product = 'build/raw3-ios-sdk/macos/raw-products'
          sources = ['examples/apple/HostSDK.swift', 'examples/apple/HostCatalog.swift',
                     'examples/apple/HostAccount.swift', 'tests/reader_team24_apple/AccountTerminalReview.swift']
          subprocess.run(['xcrun', 'swiftc', '-swift-version', '5', '-parse-as-library', '-O',
                          '-I', sdk + '/include', '-L', sdk + '/lib', '-lexreader',
                          '-Xlinker', '-rpath', '-Xlinker', sdk + '/lib', *sources,
                          '-o', 'build/account-terminal/account-terminal', *flags(sdk, product, True)], check=True)
          PY
          python3 tests/reader_team24_apple/run_account_terminal.py
      - name: Run account UI against the TLS fixture
        run: |
          set -o pipefail
          platform='${{ matrix.platform }}'
          target=iphonesimulator; scheme=EXReaderHost-iOS; signing=NO
          destination=platform=macOS; udid=unused
          if test "$platform" = macos; then
            target=macos; scheme=EXReaderHost-macOS; signing=YES
          else
            udid=$(python3 - "$platform" <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          prefix = 'iPhone' if sys.argv[1] == 'iphone' else 'iPad'
          print(max((runtime, d['name'], d['udid']) for runtime, devices in data['devices'].items()
                    for d in devices if d.get('isAvailable') and d['name'].startswith(prefix))[2])
          PY
            )
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            destination="platform=iOS Simulator,id=$udid"
          fi
          python3 tests/apple_host/prepare_fixtures.py --resources build/account-resources
          ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby tests/reader_team24_apple/make_project.rb build/account-project build/account-resources tests/apple_host/account/ui base
          sdk="$PWD/build/raw3-ios-sdk/$target/sdk"
          products="$PWD/build/raw3-ios-sdk/$target/raw-products"
          python3 tests/apple_host/account/run_account_ui.py --platform "$platform" --udid "$udid" \
            --resources build/account-resources --output build/account-ui -- \
            xcodebuild test -project build/account-project/EXReaderHost.xcodeproj -scheme "$scheme" \
            -destination "$destination" -derivedDataPath build/AccountDerivedData \
            -resultBundlePath "build/account-ui/$platform.xcresult" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            EXR_SDK_DIR="$sdk" EXR_PRODUCTS_DIR="$products" CODE_SIGNING_ALLOWED="$signing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-sync-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/account-ui/
            build/account-terminal/
            build/raw3-ios-sdk/*/wave3-packages.json
          retention-days: 30
