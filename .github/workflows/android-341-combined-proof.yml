name: Verify Android 3.41 combined evidence
on:
  push:
    branches: [codex/android-341-combined-proof]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate combined run and inspect original reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, sys, zipfile
          sys.path.insert(0, 'tools')
          from check_parallel_integration import fetch, download_artifact_zip
          source = '31d34f87b2013ef18201268b50db5b6b1ccafd71'
          run_id, artifact, size = 40422822774, 12699742758, 156525577
          digest = '704fb5b0c696241589a8e4a3d78173a4352ba112154625bdbd985eeb3f07563f'
          run = fetch(f'actions/runs/{run_id}')
          assert run['head_sha'] == source and run['run_attempt'] == 1
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          item = fetch(f'actions/artifacts/{artifact}')
          assert item['workflow_run']['id'] == run_id and item['workflow_run']['head_sha'] == source
          assert not item['expired'] and item['size_in_bytes'] == size and item['digest'] == 'sha256:' + digest
          raw = download_artifact_zip(artifact)
          assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names))
              def data(suffix):
                  found = [name for name in names if name.endswith(suffix)]
                  assert len(found) == 1, (suffix, found)
                  return archive.read(found[0])
              def report(suffix):
                  value = json.loads(data(suffix))
                  assert value['source_sha'] == source and value['run_id'] == str(run_id) and value['attempt'] == '1'
                  return value
              apk = hashlib.sha256(data('/artifacts/app-debug.apk')).hexdigest()
              for suffix in ('/evidence/reading-installed.apk', '/evidence/wave3/installed.apk', '/evidence/organization-sync/installed-host.apk'):
                  assert hashlib.sha256(data(suffix)).hexdigest() == apk
              org = report('/evidence/organization-sync/result.json')
              assert org['accepted'] and org['device']['passed'] and org['device']['count'] == 5 and org['host_apk_sha256'] == apk
              picker = report('/evidence/picker-process-recovery/result.json')
              assert picker['accepted'] and picker['app_sha256'] == apk and picker['pid_before_kill'] != picker['pid_after_result']
              summary = {}
              for suite, minimum in (('wave3',20), ('navigation',18), ('reading',19), ('original-sync',16), ('sync-341',16)):
                  value = report('/evidence/' + suite + '/result.json')
                  assert value['accepted'] is True and value['checks'] >= minimum
                  assert sum(phase['count'] for phase in value['phases']) == value['checks']
                  assert all(phase['passed'] is True and all(check['pass'] is True for check in phase['checks']) for phase in value['phases'])
                  summary[suite] = value['checks']
              walk = report('/evidence/walkthrough/execution.json')
              assert walk['completed'] and not walk['errors'] and walk['app_sha256'] == walk['installed_sha256'] == apk
              print(json.dumps({'source': source, 'run': run_id, 'artifact': artifact,
                    'sha256': digest, 'apk_sha256': apk, 'checks': summary,
                    'organization_checks': 5, 'real_system_picker_after_process_kill': True,
                    'physical_device': False, 'complete_product': False}, ensure_ascii=False))
          PY
