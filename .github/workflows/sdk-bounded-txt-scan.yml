name: Bounded TXT projection candidate
on:
  push:
    branches: [codex/sdk-bounded-txt-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projection:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and install SDK candidate
        shell: bash
        run: |
          cmake --preset reading-core
          cmake --build --preset reading-core
          cmake --install build/reading-core
      - name: Run installed public API projection checks
        shell: bash
        run: |
          cmake -S tests/bounded_txt_scan -B build/bounded-txt-scan -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/reading-core/stage"
          cmake --build build/bounded-txt-scan
          ctest --test-dir build/bounded-txt-scan --output-on-failure --no-tests=error
      - name: Scan the original failure fixture and verify its bytes
        shell: bash
        run: python tests/bounded_txt_scan/large.py
