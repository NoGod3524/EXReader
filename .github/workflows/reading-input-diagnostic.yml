name: Android FrameMetrics retained failure audit only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retained-failure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned A1 timeout and reproduce the three completed observations
        run: python3 tools/android_frame_metrics_ab.py audit
      - name: Preserve exact selected raw evidence and audit without acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-frame-metrics-retained-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/android-frame-metrics-audit/
          if-no-files-found: error
          retention-days: 30
