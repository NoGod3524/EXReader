name: Android ABBA conflict readback only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  conflict-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned ABBA archive and inspect retained conflict fields
        run: python3 tools/android_raster_conflict_audit.py
      - name: Preserve raw JSON, metadata and audit without acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-raster-conflict-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/android-raster-conflict-audit/
          if-no-files-found: error
          retention-days: 30
