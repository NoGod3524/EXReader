name: Retained Android frame diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retained-android-frame:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install retained image inspector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
      - name: Verify the failed artifact and inspect retained Android frames without execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/android_frame_diagnostic.py
      - name: Preserve original archive and retained frame diagnostic without an acceptance grant
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-frame-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/android-frame-diagnostic/
          if-no-files-found: error
          retention-days: 30
