name: GTK original navigation frame pixel diagnosis

on:
  workflow_dispatch:
    inputs:
      original_run:
        description: Original immutable common-host run to authenticate
        type: string
        required: true
        default: '40177143143'

permissions:
  contents: read
  actions: read

jobs:
  original:
    name: Authenticate original GTK program state and exact pixel ROI
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard isolated test-only source and compile diagnostic syntax in Actions
        run: |
          git merge-base --is-ancestor 07ebe8786434ef384c97ccdb451242d3c6aee6cb HEAD
          git diff --exit-code 07ebe8786434ef384c97ccdb451242d3c6aee6cb HEAD -- examples apps src include cmake CMakeLists.txt bindings tests/fixtures
          python3 -m py_compile tests/reader_hosts_integration/probe_navigation.py
          python3 -m pip install 'Pillow==11.3.0'
      - name: Authenticate preserved original ZIP program failure state and exact screenshot crops
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
        run: python3 tests/reader_hosts_integration/probe_navigation.py "$ORIGINAL_RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-gtk-navigation-original-frame-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/navigation-probe/input.json
            build/navigation-probe/original-report.json
            build/navigation-probe/original-pixel-difference.json
            build/navigation-probe/original-state.ini
            build/navigation-probe/original-*.png
          if-no-files-found: error
