name: Apple Android real native original and location relay
on:
  push:
    branches: [codex/dot-apple-android-relay, codex/reader-apple-android-composition]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  C11_NDK: '27.0.12077973'
  EXR_APPLE_SDK_VERSION: '3.41.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
jobs:
  prior-failure:
    name: Preserve and diagnose original failed relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Authenticate original failed ZIP and expose runtime text
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_android_relay/prior_failure.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      runtime_ready: ${{ steps.handoff.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit exact composition source
        run: python3 tests/apple_android_relay/guard.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare existing C11 candidate test sources
        run: python3 tests/reader_wave3_c11/candidate.py
      - name: Install the Android platform CMake NDK and API34 image
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;${C11_NDK}" "emulator" \
            "system-images;android-34;default;x86_64"
      - name: Build and install the composed 3.41 SDK candidate for x86_64
        run: |
          set -o pipefail
          ws="$PWD/build/wave3"
          mkdir -p "$ws/logs"
          toolchain="$ANDROID_HOME/ndk/${C11_NDK}/build/cmake/android.toolchain.cmake"
          echo "C11_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "C11_STAGE=$ws/stage" >> "$GITHUB_ENV"
          echo "C11_SDK_STAGE=$ws/sdk-stage" >> "$GITHUB_ENV"
          cmake -S . -B "$ws/sdk" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ws/sdk-stage" -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF \
            -DEXR_BUILD_JNI=ON -DEXR_ENABLE_LIBRARY=ON -DEXR_ENABLE_AUDIO=ON -DEXR_ENABLE_PDF=ON \
            -DEXR_ENABLE_PDF_EDIT=OFF -DEXR_ENABLE_PDF_CRYPTO=OFF -DEXR_ENABLE_AAC=OFF \
            -DEXR_ENABLE_TEXT_INDEX=OFF -DEXR_BUILD_TEXT_INDEX=OFF -DEXR_ENABLE_IMAGE_WEBP=OFF \
            -DEXR_ENABLE_IMAGE_TIFF=OFF -DEXR_ENABLE_IMAGE_AVIF=OFF -DEXR_BUILD_SHARED_COMPAT=ON \
            2>&1 | tee "$ws/logs/sdk-configure.log"
          cmake --build "$ws/sdk" --parallel 4 --target install 2>&1 | tee "$ws/logs/sdk-build.log"
          test -f "$ws/sdk-stage/lib/libexreader_jni.so"
      - name: Install the raw0.2 product and reviewed wave3 packages into one prefix
        run: |
          set -o pipefail
          ws="$PWD/build/wave3"
          stage="$ws/stage"
          sdk="$ws/sdk-stage"
          mkdir -p "$ws/logs"
          build_module() {
            name="$1"; source="$2"; shift 2
            cmake -S "$source" -B "$ws/module-$name" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$C11_TOOLCHAIN" \
              -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DEXR_SDK="$sdk" -DEXR_SDK_VERSION=3.41.0 \
              -DEXR_READER_SELECTOR_BYTES_CANDIDATE=ON -DREADER_PRODUCT_PREFIX="$stage" \
              -DCMAKE_PREFIX_PATH="$stage;$sdk" -DCMAKE_INSTALL_PREFIX="$stage" "$@" \
              2>&1 | tee "$ws/logs/$name-configure.log"
            cmake --build "$ws/module-$name" --parallel 4 --target install 2>&1 | tee "$ws/logs/$name-build.log"
          }
          build_module product apps/reader/store/native
          build_module webdav extras/webdav
          build_module sideload extras/sideload
          build_module revisions apps/reader/revisions
          build_module commands apps/reader/commands
          build_module sync apps/reader/sync
          build_module session apps/reader/session
          build_module reading-state apps/reader/reading-state -DEXR_READER_PURE_CAPTURE_CANDIDATE=ON
          test -f "$stage/include/reader_reading_state_capture_raw_candidate.h"
          "$ANDROID_HOME/ndk/${C11_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            --defined-only "$stage/lib/libreader_reading_state_codec.a" | grep -F 'reader_rs_encode_capture_raw_candidate'
          build_module reading-commands apps/reader/reading-commands
          build_module annotation-view apps/reader/annotation-view
          build_module annotation-import apps/reader/annotation-import -DREADER_ANNOTATION_IMPORT_BUILD=ON
          build_module annotation-export apps/reader/annotation-export
          build_module jump-history apps/reader/jump-history
          build_module sync-status-view apps/reader/sync-status-view
          build_module font-library apps/reader/font-library -DREADER_FONT_LIBRARY_BUILD=ON
          build_module original-export apps/reader/original-export
          build_module search apps/reader/search
          build_module navigation apps/reader/navigation
          build_module preferences apps/reader/preferences
      - name: Author the deterministic fixtures and the bundled font
        run: |
          set -o pipefail
          ws="$PWD/build/wave3"
          python3 tests/webdav_android/fixture.py prepare --output "$ws/network-fixture"
          mkdir -p tests/reader_host_session_android/debug/res/raw
          cp "$ws/network-fixture/public/ca.crt" tests/reader_host_session_android/debug/res/raw/host_sync_fixture_ca.crt
          python3 tests/reader_wave3_c11/fixtures.py --output "$ws/fixtures"
          python3 tests/reader_android_navigation/fixtures.py "$ws/navigation-fixtures"
          python3 tests/reader_android_reading/fixtures.py "$ws/reading-fixtures"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from build_android_host import write_fixtures
          write_fixtures(Path('build/wave3/download'))
          PY
          python3 tools/reader_catalog_assets.py --output examples/android/app/src/main/assets/reader-catalog-v1.json
          python3 - <<'PY'
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from host_font import fetch
          folder = fetch(Path('build/wave3/font'))
          assets = Path('examples/android/app/src/main/assets')
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(folder / 'Reader.otf', assets / 'Reader.otf')
          shutil.copyfile(folder / 'OFL.txt', assets / 'OFL.txt')
          PY
          mkdir -p examples/android/app/src/main/jniLibs/x86_64
          cp "$ws/sdk-stage/lib/libexreader_jni.so" examples/android/app/src/main/jniLibs/x86_64/libexreader_jni.so
      - name: Build the real wave3 host with search directory reading settings and sync
        run: |
          set -o pipefail
          ws="$PWD/build/wave3"
          stage="$ws/stage"
          mkdir -p "$ws/artifacts"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/reader_wave3_c11/candidate.init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.Wave3UiTest \
            :app:assembleDebug :app:assembleDebugAndroidTest :uitest:assembleDebug :uitest:assembleDebugAndroidTest \
            2>&1 | tee "$ws/logs/gradle.log"
          cp examples/android/app/build/outputs/apk/debug/app-debug.apk "$ws/artifacts/app-debug.apk"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/app-debug-androidTest.apk"
          cp examples/android/uitest/build/outputs/apk/debug/uitest-debug.apk "$ws/artifacts/uitest-debug.apk"
          cp examples/android/uitest/build/outputs/apk/androidTest/debug/uitest-debug-androidTest.apk "$ws/artifacts/uitest-debug-androidTest.apk"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/reader_wave3_c11/candidate.init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.NavigationUiTest \
            :app:assembleDebugAndroidTest 2>&1 | tee "$ws/logs/navigation-runner-gradle.log"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/navigation-debug-androidTest.apk"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/reader_wave3_c11/candidate.init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.ReadingUiTest \
            :app:assembleDebugAndroidTest 2>&1 | tee "$ws/logs/reading-runner-gradle.log"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/reading-debug-androidTest.apk"
          sha256sum "$ws"/artifacts/*.apk | tee "$ws/artifacts/sha256.txt"
      - name: Build independent organization sync instrumentation
        run: |
          set -o pipefail
          python3 -m py_compile tests/reader_android_organization_sync/run.py tests/reader_android_organization_sync/prepare_sync_341.py
          python3 tests/reader_android_organization_sync/prepare_sync_341.py
          python3 -m py_compile tests/reader_android_organization_sync/host_sync_341.py
          ws="$PWD/build/wave3"; stage="$ws/stage"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/reader_android_organization_sync/init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.OrganizationSyncTest \
            :app:assembleDebugAndroidTest 2>&1 | tee "$ws/logs/organization-runner-gradle.log"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/organization-debug-androidTest.apk"
          git rev-parse HEAD > "$ws/artifacts/source.txt"
          sha256sum "$ws/artifacts/app-debug.apk" "$ws/artifacts/organization-debug-androidTest.apk" > "$ws/artifacts/organization-sha256.txt"
      - name: Build version-parameterized sync UI runner
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only }}
        run: |
          set -o pipefail
          ws="$PWD/build/wave3"; stage="$ws/stage"
          python3 tests/reader_reading_state/make_fixtures.py "$ws/sync-reading-fixtures"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/reader_android_organization_sync/init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.HostSyncTest \
            :app:assembleDebugAndroidTest 2>&1 | tee "$ws/logs/original-sync-runner-gradle.log"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/original-sync-debug-androidTest.apk"
      - name: Build strict 3.41 sync UI adapter
        id: sync_runners
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only }}
        run: |
          set -o pipefail
          ws="$PWD/build/wave3"; stage="$ws/stage"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/reader_android_organization_sync/init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.HostSync341Test \
            :app:assembleDebugAndroidTest 2>&1 | tee "$ws/logs/sync-341-runner-gradle.log"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/sync-341-debug-androidTest.apk"
          sha256sum "$ws/artifacts/sync-341-debug-androidTest.apk" > "$ws/artifacts/sync-341-sha256.txt"
      - name: Build D22 explicit receive runner
        run: |
          set -o pipefail
          python3 -m py_compile tests/reader_android_receive_d22/run.py
          ws="$PWD/build/wave3"; stage="$ws/stage"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/reader_android_receive_d22/init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.D22ReceiveTest \
            :app:assembleDebugAndroidTest 2>&1 | tee "$ws/logs/d22-runner-gradle.log"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/d22-debug-androidTest.apk"
          sha256sum "$ws"/artifacts/*.apk > "$ws/artifacts/d22-all-apks.sha256"
      - name: Build real cross-platform relay instrumentation
        run: |
          set -o pipefail
          ws="$PWD/build/wave3"; stage="$ws/stage"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/apple_android_relay/android/init.gradle" \
            -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" \
            -PexrNavigationPrefix="$stage" -PexrPreferencesPrefix="$stage" -PexrDav="$stage" \
            -PexrSideload="$stage" -PexrTestRunner=org.exreader.host.RelayAndroidTest \
            :app:assembleDebugAndroidTest 2>&1 | tee "$ws/logs/relay-runner-gradle.log"
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$ws/artifacts/relay-debug-androidTest.apk"
      - name: Enable emulator accelerator
        run: sudo chmod 666 /dev/kvm
      - name: Execute organization sync on the actual host
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/organization-debug-androidTest.apk
            python3 tests/reader_android_organization_sync/run.py --fixture build/wave3/network-fixture --output build/wave3/evidence/organization-sync
      - name: Execute D22 missing original cancellation integrity retry and offline restart
        if: ${{ !cancelled() && steps.sync_runners.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/d22-debug-androidTest.apk
            python3 tests/reader_android_receive_d22/run.py --sdk-version 3.41.0 --fixture build/wave3/network-fixture --reading-fixtures build/wave3/sync-reading-fixtures --output build/wave3/evidence/d22-receive
      - name: Seal same-run runtime handoff
        if: ${{ !cancelled() && steps.sync_runners.outcome == 'success' }}
        run: |
          cd build/wave3/artifacts
          sha256sum *.apk > runtime-apks.sha256
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > runtime-identity.txt
      - name: Preserve same-run runtime for retained suites
        id: handoff
        if: ${{ !cancelled() && steps.sync_runners.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: d22-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/wave3/artifacts/
            build/wave3/candidate/provenance.json
            build/wave3/fixtures/
            build/wave3/navigation-fixtures/
            build/wave3/reading-fixtures/
            build/wave3/sync-reading-fixtures/
            build/wave3/network-fixture/
            build/wave3/download/
          if-no-files-found: error
      - name: Preserve build and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d22-android-receive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/android-composition-source.json
            build/wave3/logs/
            build/wave3/artifacts/
            build/wave3/evidence/
            build/android-organization-sync/candidate/provenance.json
          if-no-files-found: error
  retained:
    needs: android
    if: ${{ !cancelled() && needs.android.outputs.runtime_ready == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: d22-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/wave3
      - name: Verify exact same-source same-run APK handoff
        id: identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd build/wave3/artifacts
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > expected-identity.txt
          cmp runtime-identity.txt expected-identity.txt
          test "$(cat source.txt)" = "$GITHUB_SHA"
          sha256sum -c runtime-apks.sha256
      - name: Prepare unchanged strict adapter and emulator
        run: |
          python3 tests/reader_android_organization_sync/prepare_sync_341.py
          sudo chmod 666 /dev/kvm
      - name: Save an original after real system picker and background process kill
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            python3 tests/reader_wave3_c11/picker_process_recovery.py --fixtures build/wave3/fixtures --app build/wave3/artifacts/app-debug.apk --test-apk build/wave3/artifacts/app-debug-androidTest.apk --output build/wave3/evidence/picker-process-recovery
      - name: Execute original C11 navigation and reading suites
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell pm clear org.exreader.host || true
            bash tests/reader_wave3_c11/device.sh "$PWD/build/wave3"
      - name: Execute sync UI and session regression with exact SDK 3.41
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/original-sync-debug-androidTest.apk
            python3 tests/reader_host_session_android/run_ui.py --sdk-version 3.41.0 --fixture build/wave3/network-fixture --reading-fixtures build/wave3/sync-reading-fixtures --output build/wave3/evidence/original-sync
      - name: Execute strict 3.41 sync UI adapter
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/sync-341-debug-androidTest.apk
            python3 tests/reader_android_organization_sync/host_sync_341.py --sdk-version 3.41.0 --fixture build/wave3/network-fixture --reading-fixtures build/wave3/sync-reading-fixtures --output build/wave3/evidence/sync-341
      - name: Preserve retained same-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d22-retained-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/wave3/artifacts/runtime-identity.txt
            build/wave3/artifacts/runtime-apks.sha256
            build/wave3/evidence/
          if-no-files-found: error
  apple-sdk:
    name: Relay Apple installed ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 tests/apple_android_relay/guard.py
      - run: python3 tests/reader_team24_apple/build.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: team24-apple-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/raw3-ios-sdk/${{ matrix.target }}/sdk/
            build/raw3-ios-sdk/${{ matrix.target }}/raw-products/
            build/raw3-ios-sdk/${{ matrix.target }}/*.json
          if-no-files-found: error
  apple-retained:
    name: Relay retained iPhone native suites
    needs: apple-sdk
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: team24-apple-sdk-*
          path: sdk-input
      - uses: actions/download-artifact@v4
        with:
          name: team24-apple-sdk-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/raw3-ios-sdk/macos
      - run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Retain D21 iPhone receive and native owner suite
        run: python3 tests/reader_d21_apple_receive/run_receive.py --platform iphone
      - name: Retain reading navigation search themes and product checks
        if: ${{ !cancelled() }}
        run: python3 tests/reader_team24_apple/run_ui.py --platform iphone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-apple-retained-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/d21-receive/iphone/*.json
            build/d21-receive/iphone/*.log
            build/d21-receive/iphone/receive.xcresult/
            build/team24-apple/iphone/evidence/
          if-no-files-found: error
  apple-first:
    name: Apple imports reads and uploads original and position
    needs: apple-sdk
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: team24-apple-sdk-*
          path: sdk-input
      - uses: actions/download-artifact@v4
        with:
          name: team24-apple-sdk-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/raw3-ios-sdk/macos
      - run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Obtain pinned F5 real publication without modifying bytes
        run: python3 tests/apple_android_relay/prepare.py
      - name: Actual iPhone import read save position and sync
        run: python3 tests/apple_android_relay/apple/run.py --phase apple-first --original build/apple-android/original/epub-alice.epub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-apple-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-android/apple-first/*.json
            build/apple-android/apple-first/*.log
            build/apple-android/apple-first/cert.pem
            build/apple-android/apple-first/checkpoint-error.txt
            build/apple-android/apple-first/relay.xcresult/
            build/apple-android/apple-first/program.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: relay-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-android/original/
          if-no-files-found: error
  android-relay:
    name: Android receives resolves moves and syncs back
    needs: [android, apple-first]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: d22-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/wave3
      - uses: actions/download-artifact@v4
        with:
          name: relay-apple-first-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-android/input/apple-first
      - name: Verify exact same-source same-run native APKs
        run: |
          cd build/wave3/artifacts
          printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > expected-identity.txt
          cmp runtime-identity.txt expected-identity.txt
          sha256sum -c runtime-apks.sha256
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/relay-debug-androidTest.apk
            python3 tests/apple_android_relay/android/run.py --previous build/apple-android/input/apple-first/state.json --output build/apple-android/android/evidence --fixture build/wave3/network-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-android/android/evidence/
          if-no-files-found: error
  apple-return:
    name: Apple receives Android position and resolves in public SDK
    needs: android-relay
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: team24-apple-sdk-*
          path: sdk-input
      - uses: actions/download-artifact@v4
        with:
          name: team24-apple-sdk-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/raw3-ios-sdk/macos
      - uses: actions/download-artifact@v4
        with:
          name: relay-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-android/input/android
      - uses: actions/download-artifact@v4
        with:
          name: relay-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-android/original
      - run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Actual iPhone receive and explicit public resolution
        run: python3 tests/apple_android_relay/apple/run.py --phase apple-return --previous build/apple-android/input/android/state.json --original build/apple-android/original/epub-alice.epub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-apple-return-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-android/apple-return/*.json
            build/apple-android/apple-return/*.log
            build/apple-android/apple-return/cert.pem
            build/apple-android/apple-return/checkpoint-error.txt
            build/apple-android/apple-return/relay.xcresult/
            build/apple-android/apple-return/program.zip
          if-no-files-found: error
  authenticate:
    name: Authenticate real app relay and preserved suites
    needs: [apple-first, android-relay, apple-return, apple-retained, retained]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Original ZIP digests source attempt and location-chain audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_android_relay/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-authentication-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-android/summary.json
          if-no-files-found: error
