name: F09 legacy C API versus COM and managed consumers
on:
  push:
    branches: [codex/dot-f09-legacy-uia-20261031]
permissions:
  contents: read
concurrency:
  group: f09-legacy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Six independent actual UIA observations
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/reader_f09_legacy_uia/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-legacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f09-legacy-uia/*.json
            build/f09-legacy-uia/baseline-managed/*.log
            build/f09-legacy-uia/baseline-managed/*.json
            build/f09-legacy-uia/candidate-managed/*.log
            build/f09-legacy-uia/candidate-managed/*.json
            build/f09-legacy-uia/baseline-native/*.log
            build/f09-legacy-uia/baseline-native/*.json
            build/f09-legacy-uia/candidate-native/*.log
            build/f09-legacy-uia/candidate-native/*.json
            build/f09-legacy-uia/baseline-legacy/*.log
            build/f09-legacy-uia/baseline-legacy/*.json
            build/f09-legacy-uia/baseline-legacy/*.txt
            build/f09-legacy-uia/candidate-legacy/*.log
            build/f09-legacy-uia/candidate-legacy/*.json
            build/f09-legacy-uia/candidate-legacy/*.txt
            build/f09-legacy-uia/baseline-package/build.json
            build/f09-legacy-uia/candidate-package/build.json
            build/f09-legacy-uia/baseline-package/report.json
            build/f09-legacy-uia/candidate-package/report.json
          if-no-files-found: error
