name: Apple native original save and readback
on:
  push:
    branches: [codex/terra-wave-apple-export]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  EXR_APPLE_SDK_VERSION: '3.41.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
jobs:
  native:
    if: ${{ !contains(github.event.head_commit.message, '[original diagnostic]') }}
    name: Native original save (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, iphone, ipad]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install project generator
        run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Build installed Apple SDK and feature packages
        shell: bash
        run: |
          target=iphonesimulator
          if [ '${{ matrix.platform }}' = macos ]; then target=macos; fi
          python3 tests/reader_team24_apple/build.py --target "$target"
      - name: Drive system picker and compare saved bytes
        run: python3 tests/apple_native_original/run.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-native-original-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-native-original/${{ matrix.platform }}/*.log
            build/apple-native-original/${{ matrix.platform }}/result.json
            build/apple-native-original/${{ matrix.platform }}/native.xcresult/
            build/apple-native-original/${{ matrix.platform }}/source.epub
            build/apple-native-original/${{ matrix.platform }}/saved.epub
          retention-days: 30
          if-no-files-found: warn
  inspect-prior-failure:
    if: ${{ contains(github.event.head_commit.message, '[original diagnostic]') }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        platform: [macos, ipad]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apple-native-original-${{ matrix.platform }}-40627102091-1
          run-id: 40627102091
          github-token: ${{ github.token }}
          path: evidence
      - name: Report retained failure
        run: |
          cat evidence/result.json
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('evidence/native.log').read_text(errors='replace').splitlines()
          for i, line in enumerate(lines):
              if 'OriginalSaveUITests.swift:' in line and 'error:' in line:
                  print('\n'.join(lines[max(0, i-12):i+400]))
          PY
