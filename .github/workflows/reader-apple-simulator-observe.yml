name: Diagnostic native simulator appearance readiness
on:
  push:
    branches: [codex/reader-apple-reading-inspect25]
    paths: [.github/workflows/reader-apple-simulator-observe.yml, tests/reader_apple_reading_inspect/simulator.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Observe original45s command before and after native Simulator launch
        run: python3 tests/reader_apple_reading_inspect/simulator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-simulator-appearance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-simulator-observation/
          if-no-files-found: error
