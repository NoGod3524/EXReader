name: Migration POSIX new-target recovery 20261029
on:
  push:
    branches: [codex/migration-new-target-recovery-20261029]
    paths:
      - extras/migration/**
      - tests/migration/new_target_recovery_20261029/**
      - .github/workflows/migration-new-target-recovery-20261029.yml
permissions:
  contents: read
concurrency:
  group: migration-new-target-recovery-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  TESTED_BASE: e1cbfb31ac965fd34dd7d96356c157746a399418
  REPAIR_BASE: be328fc8eabeb7a5b3b6c4de22015f5dd7faee7b
  OLD_SDK_REF: c2d23c29a3b2096c2236fdb414dcd1e66d3243b4
jobs:
  integration:
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, label: linux, minutes: 45, py: python3, dir: '', suffix: ''}
          - {os: macos-15, label: macos, minutes: 45, py: python3, dir: '', suffix: ''}
          - {os: windows-latest, label: windows, minutes: 20, py: python, dir: 'Release/', suffix: '.exe'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit exact ten-path new-target delta and unchanged predecessor assertions
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          git fetch --no-tags --depth=1 origin "$TESTED_BASE"
          test "$(git rev-parse FETCH_HEAD)" = "$TESTED_BASE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$REPAIR_BASE"
          test "$(git rev-parse FETCH_HEAD)" = "$REPAIR_BASE"
          ${{ matrix.py }} - <<'PYGUARD'
          import hashlib,json,os,subprocess
          from pathlib import Path
          modified=['extras/migration/CMakeLists.txt','extras/migration/src/lm_main.c',
            'extras/migration/src/lm_recovery.c','extras/migration/src/lm_recovery.h',
            'extras/migration/src/lm_recovery_worker.c']
          added=['extras/migration/src/lm_new_target.c','extras/migration/src/lm_new_target.h',
            'tests/migration/new_target_recovery_20261029/run.py',
            '.github/workflows/migration-new-target-recovery-20261029.yml',
            'docs/MIGRATION-NEW-TARGET-RECOVERY-20261029.md']
          delta=subprocess.check_output(['git','diff','--no-renames','--name-status',os.environ['TESTED_BASE'],'HEAD'],text=True).splitlines()
          assert set(delta)=={'M\t'+p for p in modified}|{'A\t'+p for p in added},delta
          repair=subprocess.check_output(['git','diff','--no-renames','--name-status',os.environ['REPAIR_BASE'],'HEAD'],text=True).splitlines()
          assert set(repair)=={'M\t'+p for p in ['tests/migration/new_target_recovery_20261029/run.py','.github/workflows/migration-new-target-recovery-20261029.yml','docs/MIGRATION-NEW-TARGET-RECOVERY-20261029.md']},repair
          Path('build/evidence/source-identity.json').write_text(json.dumps({
            'sha':os.environ['GITHUB_SHA'],'base':os.environ['TESTED_BASE'],'run_id':os.environ['GITHUB_RUN_ID'],
            'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'exact_delta':delta,
            'hashes':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in modified+added},
            'repair_base':os.environ['REPAIR_BASE'],'exact_repair_delta':repair,'production_source_unchanged_in_repair':True,
            'all_unlisted_predecessor_bytes_unchanged':True,'old_sdk':os.environ['OLD_SDK_REF'],
            'unchanged_existing_groups':198,'new_posix_groups_each':36,'total_groups':270,
            'round_minutes':110,'max_rounds':2,'configured_total_minutes':220,
            'historical_existing_run':40840574068,'same_sha_companion_run_claimed':False,
            'full_p0_acceptance':False,'formal_new_credit':0,'windows_recovery_accepted':False,
            'physical_power_loss_accepted':False,'new_target_profile':'POSIX owned private DELETE only',
          },indent=2)+'\n')
          PYGUARD
      - name: Calibrate selected Python numeric BUSY and complete private token publication
        run: |
          set -euo pipefail
          ${{ matrix.py }} tests/migration/recovery_integration_20261029/run.py --harness-preflight build/harness-admission 2>&1 | tee build/evidence/harness-admission.txt
      - name: Build and install unchanged SDK and separate candidate targets
        id: native
        run: |
          set -euo pipefail
          cmake -S . -B build/sdk -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_JNI=OFF -DEXR_BUILD_SHARED_COMPAT=OFF -DEXR_ENABLE_AAC=OFF -DEXR_ENABLE_AUDIO=OFF -DEXR_BUILD_TEXT_INDEX=OFF -DEXR_ENABLE_PDF_EDIT=OFF -DEXR_ENABLE_IMAGE_WEBP=OFF -DEXR_ENABLE_IMAGE_TIFF=OFF -DEXR_ENABLE_IMAGE_AVIF=OFF 2>&1 | tee build/evidence/sdk-configure.txt
          cmake --build build/sdk --config Release --parallel 4 2>&1 | tee build/evidence/sdk-build.txt
          cmake --install build/sdk --config Release --prefix "$GITHUB_WORKSPACE/stage" 2>&1 | tee build/evidence/sdk-install.txt
          cmake -S extras/migration -B build/migration -DEXR_SDK="$GITHUB_WORKSPACE/stage" -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build/evidence/migration-configure.txt
          cmake --build build/migration --config Release --parallel 4 2>&1 | tee build/evidence/migration-build.txt
          cmake --install build/migration --config Release --prefix "$GITHUB_WORKSPACE/migration-stage" 2>&1 | tee build/evidence/migration-install.txt
          cmake -S tests/migration/recovery_integration_20261029 -B build/integration -DEXR_SDK="$GITHUB_WORKSPACE/stage" -DSQLITE_HEADER_DIR="$GITHUB_WORKSPACE/build/migration/_deps/migration_sqlite_header-src" -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build/evidence/consumer-configure.txt
          cmake --build build/integration --config Release --parallel 4 2>&1 | tee build/evidence/consumer-build.txt
      - name: Build actual frozen SDK3.40 and original schema6 producer
        if: ${{ !cancelled() && steps.native.outcome == 'success' && matrix.label != 'windows' }}
        id: old
        run: |
          set -euo pipefail
          mkdir -p build/old-source build/old-migration-source
          git fetch --no-tags --depth=1 origin "$OLD_SDK_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$OLD_SDK_REF"
          git archive FETCH_HEAD | tar -xf - -C build/old-source
          git archive FETCH_HEAD -- extras/migration | tar -xf - -C build/old-migration-source
          cmake -S build/old-source -B build/old-sdk -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_JNI=OFF -DEXR_BUILD_SHARED_COMPAT=OFF -DEXR_ENABLE_AAC=OFF -DEXR_ENABLE_AUDIO=OFF -DEXR_BUILD_TEXT_INDEX=OFF -DEXR_ENABLE_PDF_EDIT=OFF -DEXR_ENABLE_IMAGE_WEBP=OFF -DEXR_ENABLE_IMAGE_TIFF=OFF -DEXR_ENABLE_IMAGE_AVIF=OFF 2>&1 | tee build/evidence/old-configure.txt
          cmake --build build/old-sdk --config Release --parallel 4 2>&1 | tee build/evidence/old-build.txt
          cmake --install build/old-sdk --config Release --prefix "$GITHUB_WORKSPACE/old-stage" 2>&1 | tee build/evidence/old-install.txt
          cmake -S build/old-migration-source/extras/migration -B build/old-migration -DEXR_SDK="$GITHUB_WORKSPACE/old-stage" -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build/evidence/old-tool-configure.txt
          cmake --build build/old-migration --config Release --parallel 4 2>&1 | tee build/evidence/old-tool-build.txt
      - name: Exact installed binaries and expected provider graph corroboration
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          ${{ matrix.py }} - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          suffix='.exe' if os.name=='nt' else ''
          items={}
          for name in ['exreader-legacy-migrate','exreader-legacy-migrate-tx','exreader-legacy-migrate-recovery']+([] if os.name=='nt' else ['exreader-migration-recovery-worker']):
            p=Path('migration-stage/bin')/(name+suffix)
            q=Path('build/migration')/('Release' if os.name=='nt' else '')/(name+suffix)
            assert p.read_bytes()==q.read_bytes(),name
            items[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          if os.name!='nt':
            closure=Path('build/integration/frozen-handoff/frozen-preflight/link-closure.txt').read_text()
            providers=sorted(set(re.findall(r'^(\S*sqlite\S*) TYPE=(\S+)$',closure,re.M|re.I)))
            assert providers==[('EXReader::vendor_exr_sqlite','INTERFACE_LIBRARY'),('EXReader::vendor_file_exr_sqlite','STATIC_LIBRARY')],providers
            for p in [Path('build/migration/recovery-worker-provider.map'),Path('build/integration/frozen-handoff/provider.map'),Path('build/integration/frozen-handoff/frozen-preflight/provider.map')]:
              text=p.read_text(errors='replace')
              assert all(s in text for s in ['sqlite3_open_v2','sqlite3_backup_init','sqlite3.c']) and re.search(r'(?:lib)?exr_vendor_exr_sqlite\.a',text,re.I)
          Path('build/evidence/installed-provider.json').write_text(json.dumps({'installed_hashes':items,'frozen_provider_inventory_preserved':True,'map_check_is_expected_input_corroboration_not_symbol_member_uniqueness':True,'worker_checks_exact_header_runtime_source_id':os.name!='nt'},indent=2)+'\n')
          PY
      - name: Unchanged 41-case POSIX preflight prerequisite
        if: ${{ !cancelled() && steps.old.outcome == 'success' && matrix.label != 'windows' }}
        run: |
          set -euo pipefail
          python3 tests/migration/recovery_preflight_20261029/run.py --probe build/integration/frozen-handoff/frozen-preflight/migration-recovery-preflight --tool build/migration/exreader-legacy-migrate-tx --old-tool build/old-migration/exreader-legacy-migrate --work build/recovery-preflight 2>&1 | tee build/evidence/preflight.txt
      - name: Unchanged 22-case POSIX handoff prerequisite
        if: ${{ !cancelled() && steps.old.outcome == 'success' && matrix.label != 'windows' }}
        run: |
          set -euo pipefail
          python3 tests/migration/recovery_handoff_20261029/run.py --handoff build/integration/frozen-handoff/migration-recovery-handoff --probe build/integration/frozen-handoff/frozen-preflight/migration-recovery-preflight --tool build/migration/exreader-legacy-migrate-tx --old-tool build/old-migration/exreader-legacy-migrate --work build/recovery-handoff 2>&1 | tee build/evidence/handoff.txt
      - name: Actual installed recovery importer or Windows unsupported boundary
        if: ${{ !cancelled() && steps.native.outcome == 'success' && (matrix.label == 'windows' || steps.old.outcome == 'success') }}
        run: |
          set -euo pipefail
          OLD=build/old-migration/exreader-legacy-migrate
          if [ '${{ matrix.label }}' = windows ]; then OLD=build/migration/Release/exreader-legacy-migrate.exe; fi
          ${{ matrix.py }} tests/migration/recovery_integration_20261029/run.py --candidate "migration-stage/bin/exreader-legacy-migrate-recovery${{ matrix.suffix }}" --tool "build/migration/${{ matrix.dir }}exreader-legacy-migrate-tx${{ matrix.suffix }}" --old-tool "$OLD" --fixture "build/integration/${{ matrix.dir }}migration-recovery-fixture${{ matrix.suffix }}" --font tests/fixtures/fonts/primary.ttf --fixtures tests/fixtures --harness-admission build/harness-admission/admission.json --work build/recovery-integration 2>&1 | tee build/evidence/integration.txt
      - name: Actual new-target importer and no-overwrite restart controls
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.old.outcome == 'success' && matrix.label != 'windows' }}
        run: |
          set -euo pipefail
          python3 tests/migration/new_target_recovery_20261029/run.py --candidate migration-stage/bin/exreader-legacy-migrate-recovery --tool build/migration/exreader-legacy-migrate-tx --old-tool build/old-migration/exreader-legacy-migrate --fixture build/integration/migration-recovery-fixture --font tests/fixtures/fonts/primary.ttf --fixtures tests/fixtures --harness-admission build/harness-admission/admission.json --work build/new-target-recovery 2>&1 | tee build/evidence/new-target.txt
      - name: Require exact counts without converting skipped/failed cases into passes
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          ${{ matrix.py }} - <<'PY'
          import json,os
          from pathlib import Path
          checks=[('build/recovery-integration/evidence.json',8 if os.name=='nt' else 32)]
          if os.name!='nt':checks+=[('build/recovery-preflight/result.json',41),('build/recovery-handoff/evidence.json',22),('build/new-target-recovery/evidence.json',36)]
          for path,count in checks:
            data=json.loads(Path(path).read_text())
            assert len(data['cases'])==count and data['passed'] and all(c['passed'] for c in data['cases']),(path,sum(c['passed'] for c in data['cases']))
            assert data['full_p0_acceptance'] is False
            print(path,str(count)+'/'+str(count),'full_p0_acceptance=false',flush=True)
          PY
      - name: Preserve special-node evidence in bounded typed archive and replay
        if: ${{ !cancelled() && matrix.label != 'windows' && steps.native.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - <<'PYEVIDENCE'
          import hashlib,io,json,os,resource,signal,stat,tarfile,time
          assert os.environ.get('GITHUB_ACTIONS')=='true'
          MAX=4*1024**3;FILE=1024**3;NAMES=30000;PREFIX='new-target-recovery'
          D=os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC
          R=os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK|os.O_CLOEXEC
          cwd=os.open('.',D);build=os.open('build',D,dir_fd=cwd)
          root=os.open(PREFIX,D,dir_fd=build);out=os.open('evidence',D,dir_fd=build)
          def inode(s):return [s.st_dev,s.st_ino]
          def ident(s):return [s.st_dev,s.st_ino,s.st_mode,s.st_nlink,s.st_size,s.st_mtime_ns,s.st_ctime_ns]
          roots=[inode(os.fstat(x)) for x in (cwd,build,root,out)]
          def roots_exact():
              assert inode(os.stat('.',follow_symlinks=False))==roots[0]
              assert inode(os.stat('build',dir_fd=cwd,follow_symlinks=False))==roots[1]
              assert inode(os.stat(PREFIX,dir_fd=build,follow_symlinks=False))==roots[2]
              assert inode(os.stat('evidence',dir_fd=build,follow_symlinks=False))==roots[3]
          def write_exclusive(name,data):
              assert len(data)<=32*1024**2
              fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600,dir_fd=out)
              try:
                  offset=0
                  while offset<len(data):
                      written=os.write(fd,data[offset:]);assert written>0;offset+=written
                  os.fsync(fd)
              finally:os.close(fd)
              os.fsync(out)
          roots_exact()
          write_exclusive('new-target-archive-INCOMPLETE.json',json.dumps(dict(source_sha=os.environ['GITHUB_SHA'],status='incomplete unless matching verified receipt exists',hard_timeout_signal='SIGALRM',partial_archive_is_not_verified=True)).encode())
          # A hard native timer also bounds blocking gzip/read/write calls. Its abrupt
          # failure deliberately leaves the immutable INCOMPLETE receipt and partial data.
          resource.setrlimit(resource.RLIMIT_CPU,(120,120))
          resource.setrlimit(resource.RLIMIT_FSIZE,(128*1024**2,128*1024**2))
          def arm_hard_timer(seconds):
              signal.signal(signal.SIGALRM,signal.SIG_DFL);signal.setitimer(signal.ITIMER_REAL,seconds)
          arm_hard_timer(300)
          started=time.monotonic()
          def tick():assert time.monotonic()-started<300,'archive wall deadline'
          def open_dir(relative,dirs,root_fd=root):
              fd=os.dup(root_fd);part=''
              try:
                  assert inode(os.fstat(fd))==dirs['']
                  if relative:
                      pieces=relative.split('/');assert len(pieces)<=64 and all(x not in ('','.','..') for x in pieces)
                      for piece in pieces:
                          tick();new=os.open(piece,D,dir_fd=fd);os.close(fd);fd=new;part=part+'/'+piece if part else piece
                          assert inode(os.fstat(fd))==dirs[part]
                  return fd
              except BaseException:os.close(fd);raise
          
          def hash_fd(fd,size):
              assert 0<=size<=FILE;h=hashlib.sha256();left=size
              while left:
                  tick();chunk=os.read(fd,min(65536,left));assert chunk,'short regular file';left-=len(chunk);h.update(chunk)
              assert not os.read(fd,1),'regular file grew beyond declared reservation'
              return h.hexdigest()
          def walk():
              entries={};total=0;dirs={'':inode(os.fstat(root))};pending=[''];count=1
              st=os.fstat(root);entries[PREFIX]=dict(identity=ident(st),uid=st.st_uid,gid=st.st_gid,mode=stat.S_IMODE(st.st_mode),kind='dir')
              while pending:
                  relative=pending.pop();dfd=open_dir(relative,dirs)
                  try:
                      with os.scandir(dfd) as listing:
                          for item in listing:
                              tick();count+=1;assert count<=NAMES,'bounded before materialization'
                              child=relative+'/'+item.name if relative else item.name;name=PREFIX+'/'+child
                              st=os.stat(item.name,dir_fd=dfd,follow_symlinks=False)
                              row=dict(identity=ident(st),uid=st.st_uid,gid=st.st_gid,mode=stat.S_IMODE(st.st_mode))
                              if stat.S_ISDIR(st.st_mode):
                                  row['kind']='dir';dirs[child]=inode(st);pending.append(child)
                              elif stat.S_ISREG(st.st_mode):
                                  assert 0<=st.st_size<=FILE;total+=st.st_size;assert total<=MAX
                                  row['kind']='file';fd=os.open(item.name,R,dir_fd=dfd)
                                  try:
                                      assert ident(os.fstat(fd))==ident(st)
                                      row['sha256']=hash_fd(fd,st.st_size)
                                      assert ident(os.fstat(fd))==ident(st)
                                  finally:os.close(fd)
                              elif stat.S_ISLNK(st.st_mode):row.update(kind='symlink',link=os.readlink(item.name,dir_fd=dfd))
                              elif stat.S_ISFIFO(st.st_mode):row['kind']='fifo'
                              else:raise AssertionError(('unsupported retained node',name,st.st_mode))
                              assert ident(os.stat(item.name,dir_fd=dfd,follow_symlinks=False))==ident(st)
                              assert name not in entries;entries[name]=row
                  finally:os.close(dfd)
              roots_exact();return entries,total,dirs
          # Exercise the exact helpers under the same global wall budget. This child
          # has no SDK/SQLite handles and is used only to calibrate native termination.
          controls={};os.mkdir('archive-controls',0o700,dir_fd=out)
          control=os.open('archive-controls',D,dir_fd=out)
          try:
              os.mkdir('ancestor',0o700,dir_fd=control)
              expected={'':inode(os.fstat(control)),'ancestor':inode(os.stat('ancestor',dir_fd=control,follow_symlinks=False))}
              os.rename('ancestor','original-ancestor',src_dir_fd=control,dst_dir_fd=control);os.mkdir('ancestor',0o700,dir_fd=control)
              try:
                  unexpected=open_dir('ancestor',expected,control);os.close(unexpected)
              except AssertionError:controls['replaced_ancestor_refused']=True
              assert controls.get('replaced_ancestor_refused') is True
              overflow=os.open('size-plus-one',os.O_RDWR|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600,dir_fd=control)
              try:
                  assert os.write(overflow,b'abcd')==4;os.fsync(overflow);os.lseek(overflow,0,os.SEEK_SET)
                  try:hash_fd(overflow,3)
                  except AssertionError as error:controls['declared_size_plus_one_refused']=str(error)=='regular file grew beyond declared reservation'
                  assert controls.get('declared_size_plus_one_refused') is True
              finally:os.close(overflow)
              pid=os.fork()
              if pid==0:
                  arm_hard_timer(0.05);signal.pause();os._exit(77)
              waited,status=os.waitpid(pid,0)
              controls['native_timer_SIGALRM']=waited==pid and os.WIFSIGNALED(status) and os.WTERMSIG(status)==signal.SIGALRM
              assert controls['native_timer_SIGALRM'];os.fsync(control)
          finally:os.close(control)
          write_exclusive('new-target-archive-controls.json',(json.dumps(controls,sort_keys=True)+'\n').encode())
          entries,total,dirs=walk()
          manifest=json.dumps(dict(source_sha=os.environ['GITHUB_SHA'],entries=entries,logical_bytes=total,no_symlink_follow=True,no_FIFO_read=True,no_extraction=True),sort_keys=True,separators=(',',':')).encode()
          write_exclusive('new-target-node-manifest.json',manifest)
          archive_name='new-target-evidence.tar.gz';afd=os.open(archive_name,os.O_RDWR|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o600,dir_fd=out);archive_inode=inode(os.fstat(afd));seen={};types={};links={}
          class CheckedReader:
              def __init__(self,fd,size):self.fd=fd;self.left=size
              def read(self,n):
                  tick();assert 0<=n<=self.left;data=os.read(self.fd,n);self.left-=len(data);return data
          try:
              with os.fdopen(afd,'w+b',closefd=False) as raw:
                  with tarfile.open(fileobj=raw,mode='w:gz',compresslevel=1,format=tarfile.PAX_FORMAT,dereference=False) as tar:
                      for name,row in sorted(entries.items()):
                          tick();relative=name[len(PREFIX):].lstrip('/');parent,_,leaf=relative.rpartition('/');dfd=open_dir(parent,dirs)
                          try:
                              st=os.stat(leaf,dir_fd=dfd,follow_symlinks=False) if relative else os.fstat(root);assert ident(st)==row['identity']
                              info=tarfile.TarInfo(name);info.mode=row['mode'];info.uid=row['uid'];info.gid=row['gid'];info.mtime=0;kind=row['kind'];key=tuple(row['identity'][:2])
                              if kind=='dir':info.type=tarfile.DIRTYPE
                              elif kind=='fifo':info.type=tarfile.FIFOTYPE
                              elif kind=='symlink':info.type=tarfile.SYMTYPE;info.linkname=row['link'];assert os.readlink(leaf,dir_fd=dfd)==row['link']
                              elif key in seen:info.type=tarfile.LNKTYPE;info.linkname=seen[key]
                              else:info.type=tarfile.REGTYPE;info.size=st.st_size;seen[key]=name
                              types[name]=info.type;links[name]=info.linkname
                              if info.isreg():
                                  fd=os.open(leaf,R,dir_fd=dfd)
                                  try:
                                      assert ident(os.fstat(fd))==row['identity'];reader=CheckedReader(fd,st.st_size);tar.addfile(info,reader)
                                      assert reader.left==0 and not os.read(fd,1) and ident(os.fstat(fd))==row['identity']
                                  finally:os.close(fd)
                              else:tar.addfile(info)
                              assert ident(os.stat(leaf,dir_fd=dfd,follow_symlinks=False) if relative else os.fstat(root))==row['identity']
                          finally:os.close(dfd)
                      info=tarfile.TarInfo('node-manifest.json');info.size=len(manifest);info.mode=0o600;tar.addfile(info,io.BytesIO(manifest))
                  raw.flush();os.fsync(afd)
              os.fsync(out);assert inode(os.stat(archive_name,dir_fd=out,follow_symlinks=False))==archive_inode
              # Read the exact retained fd; never extract members or follow archive links.
              os.lseek(afd,0,os.SEEK_SET);actual=set()
              with os.fdopen(os.dup(afd),'rb') as raw,tarfile.open(fileobj=raw,mode='r:gz') as tar:
                  for member in tar:
                      tick();name=member.name;assert name not in actual and len(actual)<=NAMES;actual.add(name)
                      if name=='node-manifest.json':assert member.isfile() and member.size==len(manifest) and tar.extractfile(member).read()==manifest;continue
                      assert name in entries;row=entries[name]
