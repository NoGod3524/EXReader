name: Inspect retained Android C11 failure
on:
  push:
    branches: [codex/android-c11-failure-inspect]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate retained run and inspect its test output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, re, sys, zipfile
          sys.path.insert(0, 'tools')
          from check_parallel_integration import fetch, download_artifact_zip
          run_id = 40420011803
          source = '3dd099b882749ed2bb5a1a31ef7db6af6164d931'
          artifact = 12698172710
          digest = '10a6d0b5e7bff742b9479c2e2b62ecb4d6f3fdb61e890b1d13d3e2f7b9fd48fd'
          run = fetch(f'actions/runs/{run_id}')
          assert run['head_sha'] == source and run['run_attempt'] == 1
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          item = fetch(f'actions/artifacts/{artifact}')
          assert item['workflow_run']['id'] == run_id and item['workflow_run']['head_sha'] == source
          assert not item['expired'] and item['size_in_bytes'] == 136413367
          assert item['digest'] == 'sha256:' + digest
          raw = download_artifact_zip(artifact)
          assert len(raw) == item['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == digest
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              report = json.loads(archive.read('wave3/evidence/reading/first-report.json'))
              print('READING_FAILURE', json.dumps({key: report.get(key) for key in
                    ('passed', 'count', 'failed_check', 'failure_class', 'failure', 'failure_trace')}))
              for name in ('wave3/evidence/reading/result.json',
                           'wave3/evidence/reading/first-instrumentation.txt'):
                  print('FOCUSED', name)
                  print(archive.read(name).decode('utf-8', errors='replace'))
              for info in archive.infolist():
                  if 'evidence/' not in info.filename and 'logs/' not in info.filename:
                      continue
                  if not info.filename.endswith(('.json', '.log', '.txt', '.xml')) or info.file_size > 20_000_000:
                      continue
                  content = archive.read(info).decode('utf-8', errors='replace').splitlines()
                  matches = [i for i, line in enumerate(content)
                             if re.search(r'FAILURES!!!|INSTRUMENTATION_FAILED|AssertionError|Exception:|"passed"\s*:\s*false|"ok"\s*:\s*false|FAIL:', line)]
                  if matches:
                      print('DIAGNOSTIC', info.filename, 'sha256', hashlib.sha256(archive.read(info)).hexdigest())
                      indices = sorted({j for i in matches for j in range(max(0, i - 2), min(len(content), i + 12))})
                      for i in indices[:300]:
                          print(content[i][:1200])
          PY
