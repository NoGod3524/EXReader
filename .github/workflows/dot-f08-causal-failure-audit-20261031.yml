name: F08 retained causal failure audit
on:
  push:
    branches: [codex/dot-f08-causal-failure-audit-20261031]
    paths:
      - tests/reader_f08_causal_failure_audit_20261031/audit.py
      - .github/workflows/dot-f08-causal-failure-audit-20261031.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: f08-causal-failure-audit-20261031
  cancel-in-progress: false
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
jobs:
  audit:
    name: Authenticate and inspect retained failure only
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Audit original ZIP and exercise 1 positive plus 12 negative controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 tests/reader_f08_causal_failure_audit_20261031/audit.py
      - name: Preserve original ZIP, metadata, full inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-causal-failure-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-causal-failure-audit/
          if-no-files-found: error
