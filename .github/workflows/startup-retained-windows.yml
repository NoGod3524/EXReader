name: Startup mapping retained Windows regression
on:
  push:
    branches: [codex/reader-startup-mapping, codex/reader-startup-root-cause]
    paths: ['.github/workflows/startup-retained-windows.yml', '.github/workflows/reader-composition-perf-windows.yml', 'tests/reader_startup_profile/**', 'apps/reader/store/native/**', 'apps/reader/desktop/catalog_sdk.c']
permissions:
  contents: read
jobs:
  retained:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      EXR_COMPOSITION_CONTENT_BOUND: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Run unmodified C09 full product build and original regressions
        shell: pwsh
        run: |
          python tests/reader_wave3_c09/build.py
          if ($LASTEXITCODE) { throw 'C09 Windows build or native checks failed' }
      - name: Retain original product and all reports, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-retained-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/c09/report.json
            build/c09/desktop.json
            build/c09/EXReader-wave3-windows.zip
            build/c09/wave3-ui/
            build/c09/compact22/
            build/c09/retained26/
            build/c09/extracted-ui/
            build/c09/package/build.json
            build/c09/package/report.json
            build/c09/raw-owner-suite/
            build/c09/wave3-host/windows-host.map
            build/c09/logs/
          if-no-files-found: warn
