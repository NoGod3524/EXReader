name: OpenType miss cache independent acceptance
on:
  push:
    branches: [codex/dot-ot-cache-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 5b7a34ee4f1ce38cf3bcd7cf0220575f4ecf7da9
          path: sdk-candidate
      - uses: actions/checkout@v4
        with:
          ref: 25c2ef86c5c1c4e72b2c9d9daf8c47873c49bcab
          path: sdk-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install fixture authoring tools
        run: python -m pip install fonttools==4.61.1 ninja==1.13.0
      - name: Enforce immutable SDK and source provenance
        run: python tests/opentype_cache_acceptance/run.py guard
      - name: Build both installed SDKs and unchanged retained consumers
        run: python tests/opentype_cache_acceptance/run.py build
      - name: Generate dedicated fonts and run public API correctness comparison
        if: ${{ !cancelled() }}
        run: python tests/opentype_cache_acceptance/run.py verify
      - name: Seal full evidence including failures
        if: always()
        run: python tests/opentype_cache_acceptance/run.py seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ot-cache-correctness-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ot-cache-acceptance/
          if-no-files-found: error
  authenticate:
    needs: correctness
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ot-cache-correctness-*
          path: build/ot-cache-collected
      - name: Authenticate all three operating systems and same-round evidence
        env:
          MATRIX_RESULT: ${{ needs.correctness.result }}
        run: python tests/opentype_cache_acceptance/run.py aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ot-cache-authentication-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ot-cache-authentication.json
          if-no-files-found: error
