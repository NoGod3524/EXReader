name: Representative reading performance
on:
  push:
    branches: ['codex/r3-real-performance', 'codex/r3-frozen-baseline']
    paths:
      - '.github/workflows/reading-real.yml'
      - 'tools/reading_real_benchmark.c'
      - 'tools/measure_reading_real.py'
      - 'tools/reading_real_environments.py'
      - 'tools/host_font.py'
      - 'tools/reading_corpus/**'
      - 'tests/reading_corpus/check_collect.py'
      - 'tests/reading_real/**'
      - 'tests/check_reading_real_baseline.py'
      - 'tests/check_reading_real_baseline_report.py'
      - 'tests/check_reading_real_environments.py'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  workflow_dispatch:
    inputs:
      require_budgets:
        description: Require committed numeric and reviewed pixel budgets
        type: boolean
        default: false
      baseline_only:
        description: Collect one independent 40-process baseline without granting acceptance
        type: boolean
        default: false
      expected_cpu:
        description: Optional exact CPU for an independent baseline; refuse a different allocation before building
        type: string
        default: ''
  workflow_call:
    inputs:
      require_budgets:
        type: boolean
        default: true
    outputs:
      artifact_name:
        value: ${{ jobs.reading-performance.outputs.artifact_name }}
      source_sha:
        value: ${{ jobs.reading-performance.outputs.source_sha }}
permissions:
  contents: read
  actions: read
jobs:
  reading-performance:
    name: reading-performance
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a different CPU allocation for the requested independent baseline
        if: inputs.expected_cpu != ''
        env:
          EXPECTED_CPU: ${{ inputs.expected_cpu }}
          BASELINE_ONLY: ${{ inputs.baseline_only }}
          REQUIRE_BUDGETS: ${{ inputs.require_budgets }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$BASELINE_ONLY" = true
          test "$REQUIRE_BUDGETS" != true
          actual=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -n 1)
          printf 'Observed CPU: %s\nExpected CPU: %s\n' "$actual" "$EXPECTED_CPU"
          test "$actual" = "$EXPECTED_CPU"
      - name: Bind caller source and artifact identity
        id: identity
        run: |
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=reading-real-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code f32bb8aa18ed3de286900f19ce4230fd93435dd0 HEAD -- \
            tests/reading_real/budgets.json tests/reading_real/contract.json \
            docs/validation/reading-real-pixel-review.json
          if test '${{ inputs.baseline_only }}' = true; then
            test '${{ github.event_name }}' = workflow_dispatch
            test '${{ inputs.require_budgets }}' != true
          fi
          if test '${{ inputs.require_budgets }}' = true && ! test -f tests/reading_real/budgets.json; then
            echo 'Strict performance gate requires frozen budgets before collection or build.'
            exit 1
          fi
      - name: Install independent PDF reference and pixel inspector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils python3-pil
      - name: Refuse fabricated baseline metadata before sampling
        run: |
          python3 tests/check_reading_real_baseline.py
          python3 tests/check_reading_real_baseline_report.py
          python3 tests/check_reading_real_review.py
          python3 tests/check_reading_real_environments.py
      - name: Verify bounded collector retry and download refusals
        run: python3 tests/reading_corpus/check_collect.py
      - name: Recover eight frozen originals and verify current publisher licenses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/reading_corpus/collect.py cached tools/reading_corpus/real-v1.json build/reading-real-inputs
      - name: Fetch the existing pinned native host font and license
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); from host_font import fetch; fetch('build/reading-real-font')"
      - name: Build and install unchanged reading SDK
        run: |
          cmake --preset reading-core -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build --preset reading-core
          cmake --install build/reading-core
      - name: Build the actual installed public SDK consumer
        run: |
          cmake -S tests/reading_real -B build/reading-real-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$PWD/build/reading-core/stage" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/reading-real-consumer --parallel 4
      - name: Measure fresh processes, selected reference pixels and evidence refusals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          budget_args=()
          if test '${{ inputs.baseline_only }}' = true; then
            echo 'Independent baseline collection; no performance acceptance is granted.'
          elif test -f tests/reading_real/budgets.json; then
            budget_args=(--frozen-budgets)
          elif test '${{ inputs.require_budgets }}' = true; then
            echo 'Strict performance gate requires a committed baseline and numeric budgets.'
            exit 1
          fi
          python3 tools/measure_reading_real.py build/reading-real-consumer/reading-real-benchmark tools/reading_corpus/real-v1.json build/reading-real-inputs/assets build/reading-real --sdk build/reading-core/stage --source-sha "$GITHUB_SHA" "${budget_args[@]}"
      - name: Require complete baseline collection without acceptance
        if: inputs.baseline_only == true
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('build/reading-real/summary.json').read_text())
          assert report['source_sha'] == os.environ['GITHUB_SHA']
          assert report['run_id'] == os.environ['GITHUB_RUN_ID']
          assert report['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert report['measurement_valid'] is True and report['accepted'] is False
          assert report['budget_sha256'] is None
          assert len(report['attempts']) == 40 and len(report['references']) == 12
          print(json.dumps({'baseline_only': True, 'accepted': False,
              'measurement_valid': True, 'source_sha': report['source_sha'],
              'run_id': report['run_id'], 'run_attempt': report['run_attempt'],
              'environment': report['environment']}))
          PY
      - name: Arrange the fixed artifact report path
        if: always()
        run: |
          mkdir -p build/reading-real-artifact/reading-real build/reading-real-artifact/identity
          if test -d build/reading-real; then cp -a build/reading-real/. build/reading-real-artifact/reading-real/; fi
          for path in build/reading-real-inputs/manifest.json build/reading-real-inputs/licenses build/reading-real-font build/reading-real-consumer build/reading-core/CMakeCache.txt build/reading-core/compile_commands.json tests/reading_real/contract.json tests/reading_real/budgets.json tests/reading_real/environments.json tests/reading_real/environments tools/reading_corpus/real-v1.json; do
            if test -e "$path"; then cp -a --parents "$path" build/reading-real-artifact/identity/; fi
          done
      - name: Preserve every raw sample, failure and reference comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: build/reading-real-artifact/
          if-no-files-found: error
          retention-days: 30
