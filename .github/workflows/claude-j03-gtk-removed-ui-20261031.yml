name: J03 GTK Removed books real UI paging
on:
  push:
    branches: [codex/claude-j03-gtk-removed-ui-20261031]
    paths:
      - tools/validation/claude-j03-gtk-removed-ui-20261031/**
      - .github/workflows/claude-j03-gtk-removed-ui-20261031.yml
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  gtk-removed-ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require frozen GTK baseline and owned paths only
        run: |
          BASE=7f15fe49374cd9389e2106837351d4bbd5e56113
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          allowed='^(tools/validation/claude-j03-gtk-removed-ui-20261031/|docs/validation/claude-j03-gtk-removed-ui-20261031/|[.]github/workflows/claude-j03-gtk-removed-ui-20261031[.]yml$)'
          bad=$(git diff --name-only "$BASE" HEAD | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "unowned path: $bad"; exit 1; }
          git rev-parse 2938e0af7632f8316808f238afe1d301d528015e
      - name: Install native GTK, accessibility and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev gnome-keyring libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config ninja-build at-spi2-core libatk-adaptor python3-gi gir1.2-atspi-2.0 xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil dbus-x11
      - name: Build unchanged product, revision, command and session modules
        run: |
          mkdir -p build/j03-logs
          prefix="$PWD/build/j03-stage"
          echo "ACCOUNT_PREFIX=$prefix" >> "$GITHUB_ENV"
          cmake -S extras/opds -B build/j03-hash -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON -DCMAKE_INSTALL_PREFIX="$PWD/build/j03-hash-stage"
          cmake --build build/j03-hash
          cmake --install build/j03-hash
          echo "EXREADER_ORIGINAL_HASH_PREFIX=$PWD/build/j03-hash-stage" >> "$GITHUB_ENV"
          cmake -S apps/reader/store/native -B build/j03-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/j03-product --parallel 4
          cmake --install build/j03-product
          cmake -S extras/webdav -B build/j03-dav -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/j03-dav --parallel 4
          cmake --install build/j03-dav
          cmake -S apps/reader/revisions -B build/j03-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/j03-revisions --parallel 4
          cmake --install build/j03-revisions
          for module in commands desktop-metadata sync session; do
            cmake -S "apps/reader/$module" -B "build/j03-$module" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "build/j03-$module" --parallel 4
            cmake --install "build/j03-$module"
          done
          cmake -S extras/credentials -B build/j03-credentials -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/j03-credentials --parallel 4
          cmake --install build/j03-credentials
      - name: Build the typed-command tombstone seeder
        run: |
          cmake -S tools/validation/claude-j03-gtk-removed-ui-20261031 -B build/j03-seed -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ACCOUNT_PREFIX"
          cmake --build build/j03-seed
      - name: Install the repository SDK and build the actual GTK host
        run: |
          cmake --preset reading-library 2>&1 | tee build/j03-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/j03-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/j03-logs/sdk-install.log
          cmake -S extras/sideload -B build/j03-sideload -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$PWD/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$ACCOUNT_PREFIX"
          cmake --build build/j03-sideload --parallel 4
          cmake --install build/j03-sideload
          cmake -S apps/reader/reading-state -B build/j03-reading-state -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK_VERSION=3.42.0 -DEXR_SDK="$PWD/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$ACCOUNT_PREFIX;$PWD/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$ACCOUNT_PREFIX"
          cmake --build build/j03-reading-state --parallel 4
          cmake --install build/j03-reading-state
          cmake -S apps/reader/desktop -B build/j03-desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK_VERSION=3.42.0 -DEXR_SDK="$PWD/build/reading-library/stage" -DREADER_METADATA_PREFIX="$ACCOUNT_PREFIX" -DREADER_ACCOUNT_PREFIX="$ACCOUNT_PREFIX" -DCMAKE_PREFIX_PATH="$ACCOUNT_PREFIX;$PWD/build/reading-library/stage" -DEXR_READER_GTK_ACCOUNT=ON -DEXR_READER_BUILD_GTK=ON -DEXR_READER_FIXTURES="$PWD/tests/fixtures" 2>&1 | tee build/j03-logs/host-configure.log
          cmake --build build/j03-desktop --parallel 4 --verbose 2>&1 | tee build/j03-logs/host-build.log
          python3 tools/build_linux_host.py --sdk build/reading-library/stage --sdk-version 3.42.0 --binary build/j03-desktop/gtk-host/exreader-linux --output build/j03-package
      - name: Drive the real Removed books dialog
        run: |
          xvfb-run -a -s '-screen 0 1440x3600x24' dbus-run-session -- bash -euc '
            openbox >build/j03-logs/openbox.log 2>&1 &
            wm=$!
            trap "kill $wm || true" EXIT
            python3 -I tools/validation/claude-j03-gtk-removed-ui-20261031/check_removed_ui.py --payload build/j03-package/EXReader-Linux --seed build/j03-seed/j03-seed --output build/j03-evidence
          '
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j03-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/j03-evidence/
            build/j03-logs/
            build/j03-package/build.json
            !build/**/*.key
          if-no-files-found: warn
