name: Android 3.42 actual 3.41 wire semantic probe
on:
  workflow_call:
  push:
    branches: [codex/android-sdk342-record-evidence-20261028]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  C11_NDK: '27.0.12077973'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Authenticate sources and install Android tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 503c36e8073c12cd8837184b142b7704da51c961 HEAD
          test "$(git rev-parse HEAD:examples/android/app/src/main/java/org/exreader/host/ReadingParserPolicy.java)" = "$(git rev-parse bdca8c4bfbcae5566cebd569be1d4e56d1cc2872:examples/android/app/src/main/java/org/exreader/host/ReadingParserPolicy.java)"
          git diff --exit-code 8357eafa28423a7ab93ba08b823af80f01ad1505 HEAD -- src include cmake CMakeLists.txt bindings
          git diff --name-only 503c36e8073c12cd8837184b142b7704da51c961 HEAD | while IFS= read -r path; do
            case "$path" in tests/reader_f06_packages/identity.py|tests/gtk_sdk342_package/run.py|tests/android_sdk342_package/run.py|tests/apple_sdk342_package/authenticate.py|tests/sdk342_aggregate/*|.github/workflows/f06-windows-sdk342.yml|.github/workflows/gtk-sdk342-package.yml|.github/workflows/android-sdk342-package.yml|.github/workflows/android-sdk342-record-probe.yml|.github/workflows/apple-sdk342-package.yml|.github/workflows/sdk342-aggregate.yml) ;; *) exit 1 ;; esac
          done
          mkdir -p build/android-sdk342-record/evidence
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/40181402323 > build/android-sdk342-record/evidence/sender-run.json
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12594712144 > build/android-sdk342-record/evidence/sender-artifact.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/android-sdk342-record/evidence')
          r=json.loads((p/'sender-run.json').read_text()); a=json.loads((p/'sender-artifact.json').read_text())
          assert r['head_sha']=='b93b4a2f9ac24d7d0fc4d48c917dae11bec4baf7' and r['run_attempt']==1 and r['conclusion']=='success'
          assert a['id']==12594712144 and a['workflow_run']['id']==40181402323 and a['workflow_run']['head_sha']==r['head_sha']
          assert a['digest']=='sha256:08ce264db1a6e6083e15ddd20a60f6f088b7d82afe24e4d44aa8681e6551cac3' and not a['expired']
          PY
          python3 -m pip install 'PyYAML==6.0.3'
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;${C11_NDK}" "emulator" "system-images;android-34;default;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: reader-android-record-bundle-40181402323-1
          path: build/android-sdk342-record/input
          run-id: 40181402323
          github-token: ${{ github.token }}
      - name: Build SDK 3.42 and test-only receiver
        run: |
          mkdir -p build/f06
          javac -d build/android-sdk342-record/policy-classes examples/android/app/src/main/java/org/exreader/host/ReadingParserPolicy.java tests/apple_host/record_compatibility/ParserPolicyCheck.java tests/android_sdk342_record/Policy342Check.java
          java -cp build/android-sdk342-record/policy-classes org.exreader.host.ParserPolicyCheck
          java -cp build/android-sdk342-record/policy-classes org.exreader.host.Policy342Check
          python3 tests/android_sdk342_package/run.py build
          python3 tests/android_sdk342_record/prepare.py
          ws="$PWD/build/wave3"; stage="$ws/stage"
          gradle -p examples/android --no-daemon --stacktrace -I "$PWD/tests/android_sdk342_record/receiver.init.gradle" \
            -PexrSdkVersion=3.42.0 -PexrSdk="$ws/sdk-stage" -PexrProduct="$stage" -PexrSync=true -PexrSearch=true \
            -PexrNavigation=true -PexrReading=true -PexrPreferences=true -PexrSelectorBytes=true -PexrRecordInterop=true \
            -PexrWave3=true -PexrWave3Prefix="$stage" -PexrSearchPrefix="$stage" -PexrNavigationPrefix="$stage" \
            -PexrPreferencesPrefix="$stage" -PexrDav="$stage" -PexrSideload="$stage" \
            -PexrTestRunner=org.exreader.host.Sdk342WireProbe :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: python3 tests/android_sdk342_record/receive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sdk342-record-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/android-sdk342-record/
            build/wave3/logs/
            build/f06/android/
            examples/android/app/build/outputs/apk/
          if-no-files-found: error
