name: Native reader composition source admission
on:
  push:
    branches: [codex/team24-composition]
  workflow_dispatch:
    inputs:
      production_apple:
        description: Build, archive, unpack and launch the actual Apple production profile
        type: boolean
        default: false
      inspect_apple_failure:
        description: Read the fixed failed Apple artifact without building or testing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Source guard negative controls
        run: python tests/reader_composition/test_guard.py
      - name: Parse canonical production Apple build tools in Actions
        run: python -m py_compile tools/apple_swift.py tools/build_apple_product.py tools/build_apple_host.py tools/check_apple_product.py tools/reader_composition/apple_build.py
      - name: Exact composition source admission
        run: python tools/reader_composition/guard.py --source "$GITHUB_SHA" --report build/composition-source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-source-${{ github.sha }}
          path: build/composition-source.json
          if-no-files-found: error
  inspect-apple:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_apple_failure }}
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate and inspect only the fixed failed Mac artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, io, json, re, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from check_parallel_integration import fetch, download_artifact_zip
          artifact = 12666310175
          source = 'd9ca5805952f8069ecbdb7a724af43662d9b0a6e'
          item = fetch('actions/artifacts/' + str(artifact))
          assert item['workflow_run']['id'] == 40350153254
          assert item['workflow_run']['head_sha'] == source and not item['expired']
          assert item['size_in_bytes'] == 467513155
          digest = '9d1f1ff7cba7c4f4c3a1b7a3e068a12e891aa99e2b4fae16a8ad7e2a493b7f10'
          assert item['digest'] == 'sha256:' + digest
          raw = download_artifact_zip(artifact)
          assert len(raw) == item['size_in_bytes'] and hashlib.sha256(raw).hexdigest() == digest
          excerpts = []
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for info in archive.infolist():
                  if not info.filename.endswith('.log') or info.file_size > 50 * 1024 * 1024:
                      continue
                  lines = archive.read(info).decode('utf-8', errors='replace').splitlines()
                  failures = [index for index, line in enumerate(lines)
                              if re.search(r'XCTAssert|Assertion|error:|failed -|failed \(', line)]
                  indices = sorted({at for index in failures for at in range(index, min(index + 100, len(lines)))})
                  selected = [lines[index] for index in indices]
                  if selected:
                      excerpts.append({'member': info.filename, 'sha256': hashlib.sha256(archive.read(info)).hexdigest(),
                                       'lines': selected[:800], 'matching_lines': len(selected)})
          assert excerpts, 'no actual failure diagnostics found'
          result = {'source': source, 'run': 40350153254, 'attempt': 1, 'artifact': artifact,
                    'artifact_sha256': digest, 'excerpts': excerpts, 'acceptance': False}
          out = Path('build/apple-failure-inspection'); out.mkdir(parents=True, exist_ok=True)
          (out / 'excerpts.json').write_text(json.dumps(result, indent=2) + '\n')
          for entry in excerpts:
              print(entry['member'])
              print('\n'.join(entry['lines']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-fixed-failure-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-failure-inspection/
          if-no-files-found: error
  production-apple:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_apple }}
    needs: source
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Admit the exact composed source on this runner
        run: python tools/reader_composition/guard.py --source "$GITHUB_SHA" --report build/apple-source-admission.json
      - name: Build and launch the actual unpacked production profile
        run: python tools/reader_composition/apple_build.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-apple-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/composition-apple/${{ matrix.target }}/production-startup.json
            build/composition-apple/${{ matrix.target }}/delivery-*/
            build/composition-apple/${{ matrix.target }}/startup-*/
            build/composition-apple/${{ matrix.target }}/payload/build.json
            build/composition-apple/${{ matrix.target }}/payload/product-link*
            build/apple-source-admission.json
          if-no-files-found: error
