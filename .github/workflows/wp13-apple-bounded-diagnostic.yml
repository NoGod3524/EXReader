name: Apple bounded consumer diagnostic
on:
  push:
    branches: ['codex/r5-apple-bounded-diagnostic']
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [bounded, shelf, shelf-ui, shelf-anchor, shelf-traversal]
        default: bounded
permissions:
  contents: read
  actions: read
env:
  H9_SDK_BASELINE: 9854061be331fe603a1822d9b2b36ee357154927
jobs:
  diagnose:
    if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.scope, 'shelf')
    strategy:
      fail-fast: false
      matrix:
        window: [16384, 65536]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen SDK trees
        run: |
          git fetch --no-tags --depth=1 origin "$H9_SDK_BASELINE"
          git diff --exit-code "$H9_SDK_BASELINE" HEAD -- src include cmake CMakeLists.txt \
            tests/fixtures bindings licenses tools/layers.json \
            .github/workflows/native.yml .github/workflows/reliability.yml
      - name: Build the installed macOS SDK
        run: |
          cmake -S . -B build/diagnostic-sdk -DCMAKE_BUILD_TYPE=Release \
            -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_ENABLE_AAC=OFF
          cmake --build build/diagnostic-sdk --parallel 4
          cmake --install build/diagnostic-sdk --prefix stage/macos
      - name: Generate declared fixtures in cloud
        run: python3 tests/apple_host/prepare_fixtures.py --resources build/apple-resources
      - name: Diagnose the consumer with a smaller nonacceptance budget
        id: probe
        continue-on-error: true
        env:
          H9_DIAGNOSTIC_REPEATED_WINDOW: ${{ matrix.window }}
        run: |
          python3 tests/apple_host/run_bounded_review.py --sdk stage/macos \
            --resources build/apple-resources --output build/apple-diagnostic --timeout 180
      - name: Mark the run as diagnostic only
        if: always()
        run: |
          mkdir -p build/apple-diagnostic
          printf '%s\n' '{"diagnostic_only":true,"accepted":false,"runtime_budget_seconds":180}' > build/apple-diagnostic/scope.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXReader-R5-Apple-Diagnostic-${{ matrix.window }}
          path: build/apple-diagnostic/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve the failure status
        if: steps.probe.outcome != 'success'
        run: exit 1
  shelf:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.scope, 'shelf')
    uses: ./.github/workflows/reader-apple-shelf-diagnostic.yml
    with:
      mode: ${{ inputs.scope == 'shelf-traversal' && 'traversal' || inputs.scope == 'shelf-anchor' && 'anchor' || inputs.scope == 'shelf-ui' && 'ui' || 'native' }}
