name: Independent CPU baseline export
on:
  push:
    branches: [codex/reading-cpu-baseline-export]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    name: export-${{ matrix.environment }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: amd-epyc-9v45
            run_id: '40010390609'
          - environment: intel-xeon-8573c
            run_id: '40010395155'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record immutable exporter and preserve original SDK and budget
        run: |
          mkdir -p build/cpu-baseline-export
          git rev-parse HEAD > build/cpu-baseline-export/source.txt
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures .github/workflows/native.yml .github/workflows/reliability.yml bindings
          git diff --exit-code 9442e84d60469de5551de7ce7e62191a0059d9d1 HEAD -- tests/reading_real/budgets.json
      - name: Install retained image-byte auditor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
      - name: Retain original review refusals and check exact-byte inheritance
        run: |
          python3 tests/check_reading_real_review.py
          python3 tests/check_reading_cpu_export.py
      - name: Independently verify and derive this one seed only
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_ENVIRONMENT: ${{ matrix.environment }}
          BASELINE_RUN: ${{ matrix.run_id }}
        run: |
          set -o pipefail
          python3 tools/export_reading_cpu_baseline.py --baseline-source-sha 9442e84d60469de5551de7ce7e62191a0059d9d1 --baseline-run-id "$BASELINE_RUN" --environment-id "$CPU_ENVIRONMENT" --output build/cpu-baseline-export/result 2>&1 | tee build/cpu-baseline-export/export.log
          git diff --exit-code 9442e84d60469de5551de7ce7e62191a0059d9d1 HEAD -- tests/reading_real/budgets.json
          git diff --exit-code -- tests/reading_real/budgets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-baseline-export-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/cpu-baseline-export/
          if-no-files-found: error
          retention-days: 30
