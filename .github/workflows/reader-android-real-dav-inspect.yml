name: Inspect Android real WebDAV failure
on:
  push:
    branches: [codex/reader-webdav-two-device]
    paths: ['.github/workflows/reader-android-real-dav-inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Download exact failed run evidence in Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40384258547 --repo "$GITHUB_REPOSITORY" --name reader-android-real-dav-40384258547-1 --dir evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          for pattern in ('**/sync-report.json', '**/sync-instrumentation.txt', '**/server/**/http/access.log', '**/result.json'):
              for path in Path('evidence').glob(pattern):
                  if 'sender/' in str(path):
                      continue
                  print('\n===', path, '===')
                  data = path.read_text(errors='replace')
                  print(data[-20000:])
          PY
