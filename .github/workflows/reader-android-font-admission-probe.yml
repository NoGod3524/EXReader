name: D23 common-source Windows admission probe
on:
  push:
    branches: [codex/reader-android-font-admission-probe]
permissions:
  contents: read
jobs:
  d23-admission:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 700af40fed2eeb0492baf4d500e2063af9987cb7
          fetch-depth: 0
      - name: Execute actual D23 Windows source admission
        shell: pwsh
        run: |
          $env:GITHUB_SHA = '700af40fed2eeb0492baf4d500e2063af9987cb7'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'candidate mismatch' }
          $lines = Get-Content .github/workflows/reader-d23-relay.yml
          $start = [Array]::IndexOf($lines, '      - name: Confirm exact base and unchanged product paths')
          if ($start -lt 0 -or $lines[$start + 2] -ne '        run: |') { throw 'D23 admission step missing' }
          $body = @()
          for ($i = $start + 3; $i -lt $lines.Length -and $lines[$i] -notmatch '^      - name:'; $i++) {
            if ($lines[$i] -notmatch '^          ') { throw 'Unexpected D23 admission structure' }
            $body += $lines[$i].Substring(10)
          }
          if ($body.Count -eq 0) { throw 'Empty D23 admission step' }
          $script = Join-Path $env:RUNNER_TEMP 'd23-admission.ps1'
          Set-Content -Path $script -Value $body -Encoding UTF8
          & $script
  platform-admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 700af40fed2eeb0492baf4d500e2063af9987cb7
          fetch-depth: 0
      - name: Check exact common-source platform guards
        shell: bash
        run: |
          candidate=700af40fed2eeb0492baf4d500e2063af9987cb7
          test "$(git rev-parse HEAD)" = "$candidate"
          export GITHUB_SHA="$candidate"
          python3 tests/android_font_reader/guard.py
          python3 tests/reader_d21_apple_receive/guard.py
          python3 tests/reader_android_receive_d22/guard.py
          python3 -c "import runpy; runpy.run_path('tests/reader_d25_real_formats/run.py')['materialize']()"
