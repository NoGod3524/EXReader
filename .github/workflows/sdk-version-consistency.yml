name: SDK version consistency
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The version guard resolves the immutable evidence commits recorded in
          # tools/version_literal_exceptions.json; those pins live on origin as tags.
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_version_consistency.py
      - run: python tests/check_version_consistency.py
  reject-version-drift:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The version guard resolves the immutable evidence commits recorded in
          # tools/version_literal_exceptions.json; those pins live on origin as tags.
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_version_consistency.py --self-test
