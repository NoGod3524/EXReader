name: Apple file entry
on:
  push:
    branches: [codex/dot-apple-file-entry-review]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  START_SHA: 3c355b4ea3faab974861f4863893c6018653740c
  FROZEN_SDK: 9854061be331fe603a1822d9b2b36ee357154927
jobs:
  guard:
    name: scope and negative regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen trees and package-only changes
        run: bash tests/reader_apple_file_entry/check_scope.sh
      - name: Run named evidence-verifier positive and negative regressions
        working-directory: tests/reader_apple_file_entry
        run: python3 check_aggregate.py --output "$GITHUB_WORKSPACE/build/regressions"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-apple-file-entry-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/regressions/
          if-no-files-found: error

  sdk:
    name: SDK ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and install the unchanged public SDK
        run: |
          set -o pipefail
          bash tests/reader_apple_file_entry/check_scope.sh
          mkdir -p build/logs
          target='${{ matrix.target }}'
          flags=()
          if test "$target" = iphonesimulator; then
            flags=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO)
          fi
          cmake -S . -B build/sdk -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_ENABLE_AAC=OFF "${flags[@]}" 2>&1 | tee build/logs/sdk-configure.log
          cmake --build build/sdk --parallel 4 2>&1 | tee build/logs/sdk-build.log
          cmake --install build/sdk --prefix "$PWD/stage/sdk" 2>&1 | tee build/logs/sdk-install.log
      - name: Build and install the standalone sideload module against the installed SDK
        run: |
          set -o pipefail
          target='${{ matrix.target }}'
          flags=()
          if test "$target" = iphonesimulator; then
            flags=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_FIND_ROOT_PATH="$PWD/stage/sdk")
          fi
          cmake -S extras/sideload -B build/sideload -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$PWD/stage/sdk" -DCMAKE_INSTALL_PREFIX="$PWD/stage/sideload" "${flags[@]}" 2>&1 | tee build/logs/sideload-configure.log
          cmake --build build/sideload --parallel 4 2>&1 | tee build/logs/sideload-build.log
          cmake --install build/sideload 2>&1 | tee build/logs/sideload-install.log
          ls -R stage/sideload | tee build/logs/sideload-tree.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-apple-file-entry-stage-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage/
            build/logs/
          include-hidden-files: true
          if-no-files-found: error

  native:
    name: native ${{ matrix.platform }}
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            target: macos
          - platform: iphone
            target: iphonesimulator
          - platform: ipad
            target: iphonesimulator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen trees and package-only changes
        run: bash tests/reader_apple_file_entry/check_scope.sh
      - uses: actions/download-artifact@v4
        with:
          name: reader-apple-file-entry-stage-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk-artifact
      - name: Build and install the component for this SDK
        run: |
          set -o pipefail
          root="$PWD/build/file-entry/${{ matrix.platform }}"
          mkdir -p "$root/logs"
          xcodebuild -version | tee "$root/logs/xcode.log"
          bash extras/apple-file-entry/install.sh "$root/prefix" '${{ matrix.target }}' 2>&1 | tee "$root/logs/install.log"
          find "$root/prefix" -type f | sort | tee "$root/logs/installed-files.log"
      - name: Native probe and installed-package consumer
        run: |
          set -o pipefail
          root="$PWD/build/file-entry/${{ matrix.platform }}"
          python3 tests/reader_apple_file_entry/run_native.py --platform '${{ matrix.platform }}' \
            --prefix "$root/prefix" --sdk "$PWD/sdk-artifact/stage/sdk" --sideload "$PWD/sdk-artifact/stage/sideload" \
            --out "$root/out" 2>&1 | tee "$root/logs/run-native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-apple-file-entry-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/file-entry/${{ matrix.platform }}/
          if-no-files-found: error

  report:
    name: same-source report
    needs: [guard, sdk, native]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen trees and package-only changes
        run: bash tests/reader_apple_file_entry/check_scope.sh
      - name: Strictly bind reports, installed modules and actual ZIPs to this run
        working-directory: tests/reader_apple_file_entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 aggregate.py --downloads "$GITHUB_WORKSPACE/build/zips" --output "$GITHUB_WORKSPACE/build/aggregate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-apple-file-entry-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/aggregate/
          if-no-files-found: error
