name: Android composition shelf performance observation
on:
  push:
    branches: [codex/terra-wave-product-performance]
    paths:
      - '.github/workflows/reader-composition-perf-android.yml'
      - 'tests/reader_perf_android/**'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ANDROID_CANDIDATE_SDK_BASE: ${{ github.sha }}
      ANDROID_OWNERSHIP_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Install pinned compiler and emulator
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-34;default;x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
          python -m pip install ninja==1.11.1.1
      - name: Build current SDK, host and UI instrumentation
        run: |
          set -o pipefail
          mkdir -p build/perf-android
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD:src HEAD:include HEAD:apps/reader HEAD:examples/android HEAD:extras/android-import-entry | tee build/perf-android/source-identities.txt
          printf 'run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee -a build/perf-android/source-identities.txt
          python -m py_compile tools/run_reader_shelf_ui.py tests/reader_perf_android/build_host.py tests/reader_perf_android/verify_observation.py
          python tests/reader_perf_android/build_host.py --stage stage/android-x86_64 --build-dir build/android-host --gradle gradle 2>&1 | tee build/perf-android/build.log
          mkdir -p examples/android/app/src/androidTest/assets/mapping
          cp build/android-host/fixtures/Sample.epub examples/android/app/src/androidTest/assets/mapping/
          gradle -p examples/android --no-daemon --stacktrace :app:assembleDebugAndroidTest -PexrSdk="$GITHUB_WORKSPACE/stage/android-x86_64" -PexrTestRunner=org.exreader.host.ShelfCatalogTest 2>&1 | tee build/perf-android/test-apk-build.log
      - name: Check filename handling and legacy title behavior
        run: |
          set -o pipefail
          gradle -p examples/android --no-daemon --stacktrace :importentry:testDebugUnitTest 2>&1 | tee build/perf-android/filename-tests.log
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Observe real shelf, completed frames and process PSS on API34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tests/reader_perf_android/run_observation.sh
      - name: Preserve raw observations and build identities, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-composition-perf-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/perf-android/
            build/android-host/build.json
            build/android-host/artifacts/
            build/android-host/fixtures/
            extras/android-import-entry/android/importentry/build/test-results/
            examples/android/app/build/outputs/apk/androidTest/debug/
          if-no-files-found: warn
