name: Inspect Apple macOS failed UI result
on:
  push:
    branches: [codex/reader-apple-404304-inspect]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Read the original failed UI log inside Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          api = f'repos/{repo}/actions/artifacts/12703032200'
          item = json.loads(subprocess.check_output(['gh', 'api', api]))
          assert item['workflow_run']['id'] == 40430452658
          assert item['workflow_run']['head_sha'] == '937f61057b06c5c9de3b562046e52c91b5be62b9'
          assert not item['expired'] and item['size_in_bytes'] == 430870483
          digest = '2ee04448f3065f98e869805d99c68b96a536db92e5d7342d85a141fd24a285a3'
          assert item['digest'] == 'sha256:' + digest
          with open('artifact.zip', 'wb') as out:
              subprocess.run(['gh', 'api', api + '/zip'], stdout=out, check=True)
          with open('artifact.zip', 'rb') as source:
              h = hashlib.sha256()
              for block in iter(lambda: source.read(1024 * 1024), b''):
                  h.update(block)
          assert h.hexdigest() == digest
          with zipfile.ZipFile('artifact.zip') as archive:
              names = [n for n in archive.namelist() if n.endswith('wave3-native-ui.log')]
              assert len(names) == 1, names
              lines = archive.read(names[0]).decode('utf-8', 'replace').splitlines()
              hits = [i for i, line in enumerate(lines) if
                      'features.share' in line or 'Type key' in line or 'escape' in line.lower()]
              for i in hits:
                  print('--- line', i + 1, '---')
                  print('\n'.join(lines[max(0, i-5):i+12]))
              print('diagnostic_hit_count', len(hits))
          PY
