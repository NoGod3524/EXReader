name: Inspect Apple macOS failed UI result
on:
  push:
    branches: [codex/reader-apple-404352-inspect]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Read the original failed UI log inside Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          api = f'repos/{repo}/actions/artifacts/12703884617'
          item = json.loads(subprocess.check_output(['gh', 'api', api]))
          assert item['workflow_run']['id'] == 40435233965
          assert item['workflow_run']['head_sha'] == '691e40ec29f20e2bf51b0ea5ea841f04e3d75617'
          assert not item['expired'] and item['size_in_bytes'] == 433762355
          digest = 'e6165137f45c5cf28a264f603de3170f987e9ceb565e08d3daf307e57b0bf984'
          assert item['digest'] == 'sha256:' + digest
          with open('artifact.zip', 'wb') as out:
              subprocess.run(['gh', 'api', api + '/zip'], stdout=out, check=True)
          with open('artifact.zip', 'rb') as source:
              h = hashlib.sha256()
              for block in iter(lambda: source.read(1024 * 1024), b''):
                  h.update(block)
          assert h.hexdigest() == digest
          with zipfile.ZipFile('artifact.zip') as archive:
              names = [n for n in archive.namelist() if n.endswith('wave3-native-ui.log')]
              assert len(names) == 1, names
              lines = archive.read(names[0]).decode('utf-8', 'replace').splitlines()
              hits = [i for i, line in enumerate(lines) if
                      'testBorrowedFontRollbackOriginalExportAndReadOnlySnapshot' in line or 'error:' in line.lower() or 'features.share' in line or 'Type key' in line or 'escape' in line.lower() or 'Assertion Failure' in line]
              for i in hits:
                  print('--- line', i + 1, '---')
                  print('\n'.join(lines[max(0, i-5):i+12]))
              print('diagnostic_hit_count', len(hits))
              print('evidence_entries', '\n'.join(archive.namelist()))
          PY
