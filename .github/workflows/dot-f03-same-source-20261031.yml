name: Reader parameterized suite
on:
  push:
    branches: [dot/reader-suite-20261101]
  workflow_dispatch:
    inputs:
      case:
        type: choice
        options: [f03/gtk-android, f03/diagnose-round2, f04/windows-android, f04/diagnose-round2, f04/windows-import-only, f04/six-host, f04/macos-state-diagnostic]
        default: f03/gtk-android
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: reader-suite-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  ANDROID_CANDIDATE_SDK_BASE: 94fb236a4a2da87dfbaf4f1dd2a47885d615a230
  ANDROID_OWNERSHIP_HEAD: 94fb236a4a2da87dfbaf4f1dd2a47885d615a230
jobs:
  gtk:
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f03/gtk-android' || github.event_name == 'push' && contains(github.event.head_commit.message, '[A11-200-ONE-RUN]')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact approved candidate and source admission
        run: |
          python -m pip install PyYAML Pillow
          python -c "import sys; sys.path.insert(0,'tests/dot_f03_same_source_20261031'); from identity import identity; print(identity())"
      - name: Retained GTK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev gnome-keyring libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil ninja-build
      - name: Build actual GTK and retained native build tests
        run: python tests/dot_f03_same_source_20261031/build.py --host gtk --output build/f03-gtk-build.json
      - name: Retain original GTK organization assertions
        run: |
          xvfb-run -a -s '-screen 0 1440x2000x24' dbus-run-session -- bash -euc '
            openbox >build/f03-retained-openbox.log 2>&1 & trap "kill $! || true" EXIT
            python tests/dot_f03_same_source_20261031/gtk.py --mode retained --package build/package/EXReader-Linux --command-consumer build/command-consumer/command-consumer --output build/f03-retained-gtk
          '
      - name: Actual six-phase native author lifecycle
        run: |
          python tests/dot_f03_same_source_20261031/fixtures.py --output build/f03-originals
          xvfb-run -a -s '-screen 0 1440x2000x24' dbus-run-session -- bash -euc '
            openbox >build/f03-openbox.log 2>&1 & trap "kill $! || true" EXIT
            python tests/dot_f03_same_source_20261031/gtk.py --mode author --phase create --profile build/f03-author-profile --book build/f03-originals/gtk-organization.txt --package build/package/EXReader-Linux --output build/f03-author/create
            previous=create
            for phase in delete restore member-remove member-restore restart; do
              python tests/dot_f03_same_source_20261031/gtk.py --mode author --phase "$phase" --profile build/f03-author-profile --book build/f03-originals/gtk-organization.txt --package build/package/EXReader-Linux --output "build/f03-author/$phase" --previous "build/f03-author/$previous/wire/state.json"
              previous="$phase"
            done
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-suite-f03-gtk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f03-author/
            build/f03-retained-gtk/
            build/f03-originals/
            build/f03-gtk-build.json
            build/package/EXReader-Linux/
            build/f03-*.log
            !build/**/key.pem
            !build/**/private/**
            !build/**/connection.json
          if-no-files-found: error
  android:
    needs: gtk
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/download-artifact@v4
        with:
          name: reader-suite-f03-gtk-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f03-input
      - name: Exact candidate admission
        run: |
          python -m pip install PyYAML ninja==1.11.1.1
          python -c "import sys; sys.path.insert(0,'tests/dot_f03_same_source_20261031'); from identity import identity; print(identity())"
      - name: Install pinned Android compiler and emulator
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-34;default;x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
      - name: Build one actual APK and unchanged original owner producer
        run: python tests/dot_f03_same_source_20261031/build.py --host android --output build/f03-android-build.json
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Original all-exits and six real native receives on same APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python tests/dot_f03_same_source_20261031/build.py --host android --android-retained --output build/f03-android-retained-driver.json
            for phase in create delete restore member-remove member-restore restart; do
              python tests/dot_f03_same_source_20261031/android.py --mode receive --host-apk build/android-host/artifacts/app-debug.apk --owner-test-apk build/organization-android/apks/app-debug-androidTest.apk --ui-apk build/android-host/artifacts/uitest-debug.apk --ui-test-apk build/android-host/artifacts/uitest-debug-androidTest.apk --wire "build/f03-input/f03-author/$phase/wire/state.json" --tls-fixture build/wave3/network-fixture --expectations "build/f03-input/f03-author/$phase/expected-groups.json" --projection-expectations "build/f03-input/f03-author/$phase/projection.json" --output "build/f03-android/$phase"
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-suite-f03-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f03-android/
            build/f03-android-build.json
            build/f03-android-retained-driver.json
            build/f03-android-original-steps.json
            build/organization-android/
            build/owner-android/
            build/shelf-android/
            build/import-android/
            build/android-host/
            build/wave3/network-fixture/public/
            !build/**/key.pem
            !build/**/private/**
            !build/**/connection.json
          if-no-files-found: error
  audit:
    if: ${{ always() && needs.gtk.result != 'skipped' }}
    needs: [gtk, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate original artifacts and partial two-host evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/dot_f03_same_source_20261031/verify.py --partial --evidence build/f03-evidence --output build/f03-partial-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-suite-f03-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f03-partial-result.json
            build/f03-evidence/api-originals/
          if-no-files-found: error

  diagnose:
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f03/diagnose-round2' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F03-DIAG-10-ONE-RUN]')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read only the fixed original round 2 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/dot_f03_same_source_20261031/verify.py --diagnose-original --output build/f03-diagnostic/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-suite-f03-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f03-diagnostic/
          if-no-files-found: error

  f04_windows_android:
    name: F04 windows-android
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f04/windows-android' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F04-120-ONE-RUN]')) }}
    uses: ./.github/workflows/dot-f04-reading-sync-20261031.yml
    with:
      case: f04/windows-android
      controller_sha: ${{ github.sha }}

  f04_diagnose_fixed:
    name: F04 fixed diagnostic
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f04/diagnose-round2' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F04-DIAG-5-ONE-RUN]')) }}
    uses: ./.github/workflows/dot-f04-reading-sync-20261031.yml
    with:
      case: f04/diagnose-round2
      controller_sha: ${{ github.sha }}

  f04_windows_import_only:
    name: F04 Windows import only
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f04/windows-import-only' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F04-IMPORT-10-ONE-RUN]')) }}
    uses: ./.github/workflows/dot-f04-reading-sync-20261031.yml
    with:
      case: f04/windows-import-only
      controller_sha: ${{ github.sha }}

  f04_six_host:
    name: F04 six-host
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f04/six-host' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F04-SIX-230-ONE-RUN]')) }}
    uses: ./.github/workflows/dot-f04-reading-sync-20261031.yml
    with:
      case: f04/six-host
      controller_sha: ${{ github.sha }}

  f04_macos_state_diagnostic:
    name: F04 macOS diagnostic
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f04/macos-state-diagnostic' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F04-MAC-DIAG-15-ONE-RUN]')) }}
    uses: ./.github/workflows/dot-f04-reading-sync-20261031.yml
    with:
      case: f04/macos-state-diagnostic
      controller_sha: ${{ github.sha }}
