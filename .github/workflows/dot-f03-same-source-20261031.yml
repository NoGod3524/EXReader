  f03_gtk_ready_diagnostic:
    if: ${{ github.ref == 'refs/heads/dot/f03-gtk-ready-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f03/gtk-ready-diagnostic' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F03-GTK-READY-20-ONE-RUN]')) }}
