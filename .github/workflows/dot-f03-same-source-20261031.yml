    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (github.event_name == 'workflow_dispatch' && inputs.case == 'f04/android-ready-diagnostic' || github.event_name == 'push' && contains(github.event.head_commit.message, '[F04-ANDROID-READY-25-ONE-RUN]')) }}
