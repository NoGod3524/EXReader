name: F09 frozen observations plus legacy handle-method differential
on:
  push:
    branches: [codex/dot-f09-handle-diff-20261031]
permissions:
  contents: read
concurrency:
  group: f09-handle-diff-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Eight frozen observations then six handle-method processes
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/reader_f09_handle_diff_20261031/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-handle-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f09-handle-diff/*.json
            build/f09-handle-diff/*-managed/*.log
            build/f09-handle-diff/*-managed/*.json
            build/f09-handle-diff/*-native/*.log
            build/f09-handle-diff/*-native/*.json
            build/f09-handle-diff/*-legacy/*.log
            build/f09-handle-diff/*-legacy/*.json
            build/f09-handle-diff/*-legacy/*.txt
            build/f09-handle-diff/*-visible/*.log
            build/f09-handle-diff/*-visible/*.json
            build/f09-handle-diff/*-visible/*.txt
            build/f09-handle-diff/*-handle-*/*.log
            build/f09-handle-diff/*-handle-*/*.json
            build/f09-handle-diff/*-handle-*/*.txt
            build/f09-handle-diff/baseline-package/build.json
            build/f09-handle-diff/candidate-package/build.json
            build/f09-handle-diff/baseline-package/report.json
            build/f09-handle-diff/candidate-package/report.json
          if-no-files-found: error
