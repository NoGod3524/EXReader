  evidence:
    name: Authenticate native file input ZIP and retain actual palette failures
    needs: account
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate finished same-source attempt and every bound report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_gtk_drop_import/aggregate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-gtk-drop-summary-${{ github.run_id }}-${{ github.run_attempt }}
