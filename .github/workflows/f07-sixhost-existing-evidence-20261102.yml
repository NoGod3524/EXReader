name: F07 existing sixhost evidence audit
on:
  push:
    branches: [audit/f07-sixhost-existing-evidence-20261102]
    paths:
      - tools/f07_sixhost_existing_evidence_20261102.py
      - .github/workflows/f07-sixhost-existing-evidence-20261102.yml
      - docs/reader-total-progress/F07_SIXHOST_EXISTING_EVIDENCE_20261102.md
permissions:
  contents: read
  actions: read
concurrency:
  group: f07-existing-evidence-20261102
  cancel-in-progress: false
jobs:
  audit:
    if: github.run_attempt == 1 && contains(github.event.head_commit.message, '[F07-EXISTING-ARTIFACTS-ONE-RUN]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Audit fixed historical artifacts without executing payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/f07_sixhost_existing_evidence_20261102.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f07-existing-sixhost-${{ github.run_id }}-${{ github.run_attempt }}
          path: f07-existing-evidence/
          if-no-files-found: error
