name: Android SDK 3.42 F07 installed closure capture
on:
  push:
    branches: [codex/android-f07-capture-20261028]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  C11_NDK: '27.0.12077973'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Guard additive source and inspect capture contract
        run: |
          python3 tests/reader_android_f07_capture_20261028/run.py guard
          python3 -m pip install 'PyYAML==6.0.3'
          python3 -m py_compile tests/reader_android_f07_capture_20261028/*.py
          python3 -m unittest discover -s tests/reader_android_f07_capture_20261028 -p 'test_*.py'
      - name: Prepare unchanged Android toolchain and emulator
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;${C11_NDK}" "emulator" "system-images;android-34;default;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Invoke unchanged common-source SDK 3.42 producer
        run: python3 tests/android_sdk342_package/run.py build
      - name: Original F06 actual install byte identity and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: python3 tests/reader_f06_packages/identity.py android
      - name: Retain installed prefixes final maps commands and actual APK ELF
        run: python3 tests/reader_android_f07_capture_20261028/run.py capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-f07-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/android-f07-capture/
            build/f06/android/
            build/f06/android-payload/build.json
            build/f06/android-sdk342-build-step-*.sh
            build/wave3/logs/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: f06-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/android/
          if-no-files-found: error
