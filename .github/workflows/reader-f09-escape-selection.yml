name: F09 native Windows Escape selection event
on:
  push:
    branches: [codex/dot-f09-escape-selection-20261031]
permissions:
  contents: read
concurrency:
  group: f09-escape-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Baseline and candidate native UIA event regression
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/reader_f09_escape_selection/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-escape-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f09-escape/source.json
            build/f09-escape/verdict.json
            build/f09-escape/baseline/*.log
            build/f09-escape/baseline/*.json
            build/f09-escape/candidate/*.log
            build/f09-escape/candidate/*.json
            build/f09-escape/baseline-package/build.json
            build/f09-escape/candidate-package/build.json
            build/f09-escape/baseline-package/report.json
            build/f09-escape/candidate-package/report.json
            build/f09-escape/baseline-package/application.log
            build/f09-escape/candidate-package/application.log
          if-no-files-found: error
