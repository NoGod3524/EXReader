name: Team24 core SDK S18 binding and S19 provider
on:
  push:
    branches: [codex/team24-core]
  workflow_dispatch:
    inputs:
      protocol_only:
        description: Run only the bounded source guard and receipt binding
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  preflight:
    name: joint install preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate the fixed seed, the owned paths and actual mutation refusals
        run: |
          python -m py_compile tests/reader_wave3_s18/guard.py tests/reader_wave3_s18/runtime.py tests/reader_wave3_s18/strict.py tests/reader_wave3_s18/bindings.py tests/reader_wave3_s19/run.py tests/reader_wave3_s19/verify.py tests/reader_wave3_s19/protocol.py
          python tests/reader_wave3_s18/guard.py preflight
      - uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s18-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s18/source.json
          if-no-files-found: error
  strict:
    needs: preflight
    name: source receipt strict
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate the same-attempt source receipt ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_wave3_s18/guard.py strict
      - uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s18-source-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s18/strict.json
          if-no-files-found: error
  runtime:
    if: github.event.inputs.protocol_only != 'true'
    needs: preflight
    name: shared install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the pinned build and fixture tools
        run: python -m pip install ninja==1.11.1.1 fonttools==4.58.0
      - name: Native Linux transport dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev pkg-config
      - name: Native macOS transport dependencies
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          for formula in pkg-config openssl@3; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then brew install "$formula"; fi
          done
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
          } >> "$GITHUB_ENV"
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the focused S16 producer with both actual families
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile tests/reader_wave3_s18/runtime.py
          python tests/reader_wave3_s18/runtime.py --s16-only
      - name: Preserve every log, program, report and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s18-runtime-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s18/runtime/
          if-no-files-found: error
  runtime-strict:
    needs: [runtime, strict]
    if: always() && github.event.inputs.protocol_only != 'true'
    name: runtime strict
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate all three runtime ZIPs, programs, reports and 15 mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/reader_wave3_s18/strict.py --s16-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-wave3-s18-runtime-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reader-wave3-s18/runtime-strict.json
            build/reader-wave3-s18/original-zips/
          if-no-files-found: error
  host:
    if: github.event.inputs.protocol_only != 'true'
    name: one SDK and one store (${{ matrix.key }})
    needs: preflight
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux
          - os: windows-2022
            key: windows
          - os: macos-15
            key: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing build tool and Linux native TLS/XML packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja==1.11.1.1
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config ninja-build
          fi
      - name: Use the Apple native TLS/XML packages through pkg-config
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config openssl@3
          sdkroot=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build/apple-pkgconfig
          version=$(/usr/bin/curl --version | awk 'NR==1 {print $2}')
          cat > build/apple-pkgconfig/libcurl.pc <<EOF
          prefix=${sdkroot}/usr
          Name: libcurl
          Description: Apple SDK system libcurl
          Version: ${version}
          Libs: -L\${prefix}/lib -lcurl
          Cflags:
          EOF
          echo "PKG_CONFIG_PATH=${PWD}/build/apple-pkgconfig" >> "$GITHUB_ENV"
          echo "PATH=$(brew --prefix openssl@3)/bin:${PATH}" >> "$GITHUB_ENV"
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c ('"{0}" >nul && set' -f $bat) | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: One installed SDK, five installed packages, one DSO, one host
        id: s19_driver
        run: |
          set -o pipefail
          mkdir -p build
          python tests/reader_wave3_s19/run.py 2>&1 | tee build/s19-driver.log
      - name: Preserve real partial evidence even when configure or linking fails
        if: always()
        env:
          S19_DRIVER_OUTCOME: ${{ steps.s19_driver.outcome }}
        run: python tests/reader_wave3_s19/run.py --stage-only
      - name: Upload the same-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s19-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-wave3-s19/artifact
          if-no-files-found: error
          retention-days: 90
  evidence:
    name: same-run identities and artifact digests
    needs: host
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: reader-wave3-s19-*
          path: build/reader-wave3-s19/downloaded
          merge-multiple: false
      - name: Record the tool versions of this runner
        run: |
          mkdir -p build/reader-wave3-s19
          {
            echo "cmake $(cmake --version | head -n1)"
            echo "python $(python --version 2>&1)"
            echo "uname $(uname -a)"
            echo "source $GITHUB_SHA run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          } > build/reader-wave3-s19/toolchain.txt
          cat build/reader-wave3-s19/toolchain.txt
      - name: Bind the original platform ZIP bytes to the API and extracted programs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > build/reader-wave3-s19/artifacts-api.json
          python - <<'PY'
          import hashlib, io, json, os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from check_parallel_integration import download_artifact_zip
          sys.path.insert(0, 'tests/reader_wave3_s19')
          from protocol import platform_artifacts
          data = json.load(open('build/reader-wave3-s19/artifacts-api.json'))
          required = {'reader-wave3-s19-' + platform + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
                      for platform in ('linux', 'windows', 'macos')}
          mine = [item for item in data['artifacts']
                  if item['name'] in required]
          assert len(mine) == 3, [item['name'] for item in mine]
          platform_artifacts(mine, os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
          originals = Path('build/reader-wave3-s19/original-zips')
          originals.mkdir(parents=True, exist_ok=True)
          for item in mine:
              raw = download_artifact_zip(item['id'])
              assert len(raw) == item['size_in_bytes']
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == item['digest']
              (originals / (item['name'] + '.zip')).write_bytes(raw)
              folder = Path('build/reader-wave3-s19/downloaded') / item['name']
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  members = [name for name in archive.namelist() if not name.endswith('/')]
                  assert len(members) == len(set(members))
                  assert set(members) == {file.relative_to(folder).as_posix() for file in folder.rglob('*') if file.is_file()}
                  for name in members:
                      assert not name.startswith('/') and '..' not in name.split('/') and '\\' not in name
                      assert archive.read(name) == (folder / name).read_bytes(), name
          json.dump({'artifacts': mine}, open('build/reader-wave3-s19/artifacts.json', 'w'), indent=2)
          for item in mine:
              print(item['name'], item['size_in_bytes'], item['digest'], item['expires_at'])
          PY
      - name: Recompute every identity and refuse a partial run
        run: |
          set -o pipefail
          python tests/reader_wave3_s19/verify.py --root build/reader-wave3-s19/downloaded \
            --artifacts build/reader-wave3-s19/artifacts.json \
            --output build/reader-wave3-s19/evidence.json \
            --expect-source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee build/reader-wave3-s19/verify.log
      - name: Upload the strict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-wave3-s19-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reader-wave3-s19/evidence.json
            build/reader-wave3-s19/artifacts.json
            build/reader-wave3-s19/toolchain.txt
            build/reader-wave3-s19/verify.log
            build/reader-wave3-s19/original-zips/
          if-no-files-found: error
          retention-days: 90
