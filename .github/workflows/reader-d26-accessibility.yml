          if-no-files-found: error

  authenticate:
    name: Strict current acceptance and explicit historical outcomes
    needs: [gtk, regressions, retained-account]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's own artifact and authenticate it
        env:
          GH_TOKEN: ${{ github.token }}
          D26_GTK_RESULT: ${{ needs.gtk.result }}
          D26_REGRESSION_RESULT: ${{ needs.regressions.result }}
          D26_ACCOUNT_RESULT: ${{ needs['retained-account'].result }}
        run: |
          mkdir -p build/c10-artifact
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"reader-wave3-c10-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\") | .id")
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/c10-original.zip
          unzip -q build/c10-original.zip -d build/c10-artifact
          account_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"reader-d26-account-retained-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\") | .id")
          test -n "$account_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$account_id/zip" > build/d26-account-original.zip
          unzip -q build/d26-account-original.zip -d build/d26-account-artifact
          python3 tests/reader_d26_accessibility/identity_current.py --artifact build/c10-artifact \
            --archive build/c10-original.zip --account-artifact build/d26-account-artifact \
            --account-archive build/d26-account-original.zip --output build/c10-authentication/identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-d26-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/c10-authentication/identity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-d26-original-zip-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/c10-original.zip
          if-no-files-found: error

  retained-account:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install original GTK account suite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev gnome-keyring libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config at-spi2-core libatk-adaptor python3-gi gir1.2-atspi-2.0 xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil xdg-desktop-portal xdg-desktop-portal-gtk gsettings-desktop-schemas dbus-x11 ninja-build
      - name: Unchanged raw legacy owner account HTTPS and reading recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_gtk_raw3/run.py --mode full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-d26-account-retained-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/gtk-raw3/
          include-hidden-files: true
          if-no-files-found: error
