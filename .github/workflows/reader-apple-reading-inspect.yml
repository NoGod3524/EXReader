name: Read-only original Apple reading failure inspection
on:
  push:
    branches: [codex/reader-apple-reading-inspect25]
    paths: [.github/workflows/reader-apple-reading-inspect.yml, tests/reader_apple_reading_inspect/inspect.py, tests/reader_apple_reading_inspect/read_images.swift]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [records, fast-import, theme-iphone]
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate and inspect the original failed iPhone result in Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_apple_reading_inspect/inspect.py '${{ matrix.target }}'
      - name: Read text from the original failed case screenshots with system Vision
        run: |
          set -o pipefail
          if test -d build/apple-reading-original-inspect/attachments; then
            swift tests/reader_apple_reading_inspect/read_images.swift build/apple-reading-original-inspect/attachments | tee build/apple-reading-original-inspect/failure-image-text.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-reading-original-failure-inspection-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-reading-original-inspect/
          if-no-files-found: error
