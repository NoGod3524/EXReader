name: Artifact retry protocol only
on:
  push:
    branches: [codex/reading-artifact-retry-protocol]
    paths: ['.github/workflows/reading-pixel-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Original and new fake transport protocols without artifact downloads
        run: |
          set -o pipefail
          mkdir -p build/artifact-retry-protocol
          python3 tests/check_reading_release_plan.py | tee build/artifact-retry-protocol/release-plan.log
          python3 tests/reading_corpus/check_collect.py 2>&1 | tee build/artifact-retry-protocol/collector.log
          python3 tests/check_reading_real_baseline.py | tee build/artifact-retry-protocol/baseline.log
          python3 tests/check_reading_real_baseline_report.py | tee build/artifact-retry-protocol/baseline-report.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-retry-protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/artifact-retry-protocol/
          if-no-files-found: error
