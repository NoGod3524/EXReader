name: Reader annotation view
on:
  push:
    branches: [codex/reader-annotation-view]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumers:
    name: annotation view consumers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source, fixed start, protected SDK and schema trees, shared modules and path ownership
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f43baf9182d75907c0cb5d6f77048f27bca8c950 HEAD
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code f32bb8aa18ed3de286900f19ce4230fd93435dd0 HEAD -- apps/reader/store/001_catalog.sql
          git diff --exit-code f43baf9182d75907c0cb5d6f77048f27bca8c950 HEAD -- apps/reader/store apps/reader/revisions apps/reader/reading-state
          if git diff --name-only f43baf9182d75907c0cb5d6f77048f27bca8c950 HEAD | grep -v -E '^(apps/reader/annotation-view/|tests/reader_annotation_view/|\.github/workflows/reader-annotation-view\.yml$|docs/READER-ANNOTATION-VIEW\.md$|docs/validation/reader-annotation-view\.json$)'; then
            echo "files outside the G04 ownership list changed"; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing build tool version
        run: python -m pip install ninja==1.11.1.1
      - name: Enter Windows native compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the one product SQLite provider and the unchanged revision module
        run: |
          mkdir -p build/av-logs
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "AV_WS=$ws" >> "$GITHUB_ENV"
          cmake -S apps/reader/store/native -B build/av-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/av-product-stage" 2>&1 | tee build/av-logs/product-configure.log
          cmake --build build/av-product --parallel 4 2>&1 | tee build/av-logs/product-build.log
          cmake --install build/av-product 2>&1 | tee build/av-logs/product-install.log
          cmake -S apps/reader/revisions -B build/av-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$ws/build/av-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/av-stage" 2>&1 | tee build/av-logs/revisions-configure.log
          cmake --build build/av-revisions --parallel 4 2>&1 | tee build/av-logs/revisions-build.log
          cmake --install build/av-revisions 2>&1 | tee build/av-logs/revisions-install.log
      - name: Build and install the frozen reading SDK once
        run: |
          cmake --preset reading-library 2>&1 | tee build/av-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/av-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/av-logs/sdk-install.log
      - name: Install the unchanged reading-state adapter and the optional annotation-view package
        run: |
          cmake -S apps/reader/reading-state -B build/av-adapter -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$AV_WS/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$AV_WS/build/av-stage;$AV_WS/build/av-product-stage" -DCMAKE_INSTALL_PREFIX="$AV_WS/build/av-stage" 2>&1 | tee build/av-logs/adapter-configure.log
          cmake --build build/av-adapter --verbose 2>&1 | tee build/av-logs/adapter-build.log
          cmake --install build/av-adapter 2>&1 | tee build/av-logs/adapter-install.log
          cmake -S apps/reader/annotation-view -B build/av-module -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AV_WS/build/av-stage;$AV_WS/build/av-product-stage;$AV_WS/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$AV_WS/build/av-view-stage" 2>&1 | tee build/av-logs/module-configure.log
          cmake --build build/av-module --verbose 2>&1 | tee build/av-logs/module-build.log
          cmake --install build/av-module 2>&1 | tee build/av-logs/module-install.log
      - name: Compile isolated C and C++ consumers from the installed packages only
        run: |
          cmake -S tests/reader_annotation_view/consumer -B build/av-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AV_WS/build/av-view-stage;$AV_WS/build/av-stage;$AV_WS/build/av-product-stage;$AV_WS/build/reading-library/stage" 2>&1 | tee build/av-logs/consumer-configure.log
          cmake --build build/av-consumer --verbose 2>&1 | tee build/av-logs/consumer-build.log
      - name: Run the installed consumers against generated history and judge the real report
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          python3 tests/reader_annotation_view/check_annotation_view.py --probe "build/av-consumer/annotation-view-probe$exe" --c-consumer "build/av-consumer/annotation-view-c-consumer$exe" --link-map build/av-consumer/annotation-view-link.map --output build/av-evidence
      - name: Preserve source-bound packages, databases and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-annotation-view-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/av-logs/
            build/av-evidence/
            build/av-view-stage/
            build/av-consumer/annotation-view-probe*
            build/av-consumer/annotation-view-c-consumer*
            build/av-consumer/annotation-view-link.map
            build/av-module/CMakeCache.txt
          if-no-files-found: error
  sanitizer:
    name: annotation view sanitizer diagnosis (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing build tool version
        run: python -m pip install ninja==1.11.1.1
      - name: Install the product SQLite, revisions, frozen SDK and adapter without sanitizers
        run: |
          mkdir -p build/av-logs build/av-san-logs
          cmake -S apps/reader/store/native -B build/av-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/av-product-stage" 2>&1 | tee build/av-logs/product-configure.log
          cmake --build build/av-product --parallel 4 2>&1 | tee build/av-logs/product-build.log
          cmake --install build/av-product 2>&1 | tee build/av-logs/product-install.log
          cmake -S apps/reader/revisions -B build/av-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$PWD/build/av-product-stage" -DCMAKE_INSTALL_PREFIX="$PWD/build/av-stage" 2>&1 | tee build/av-logs/revisions-configure.log
          cmake --build build/av-revisions --parallel 4 2>&1 | tee build/av-logs/revisions-build.log
          cmake --install build/av-revisions 2>&1 | tee build/av-logs/revisions-install.log
          cmake --preset reading-library 2>&1 | tee build/av-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/av-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/av-logs/sdk-install.log
          cmake -S apps/reader/reading-state -B build/av-adapter -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$PWD/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$PWD/build/av-stage;$PWD/build/av-product-stage" -DCMAKE_INSTALL_PREFIX="$PWD/build/av-stage" 2>&1 | tee build/av-logs/adapter-configure.log
          cmake --build build/av-adapter --parallel 4 2>&1 | tee build/av-logs/adapter-build.log
          cmake --install build/av-adapter 2>&1 | tee build/av-logs/adapter-install.log
      - name: Rebuild the optional package and the consumers with AddressSanitizer and UBSan
        run: |
          san='-fsanitize=address,undefined -fno-omit-frame-pointer -g'
          cmake -S apps/reader/annotation-view -B build/av-san-module -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS="$san" -DCMAKE_CXX_FLAGS="$san" -DCMAKE_PREFIX_PATH="$PWD/build/av-stage;$PWD/build/av-product-stage;$PWD/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$PWD/build/av-san-stage" 2>&1 | tee build/av-san-logs/module-configure.log
          cmake --build build/av-san-module --verbose 2>&1 | tee build/av-san-logs/module-build.log
          cmake --install build/av-san-module 2>&1 | tee build/av-san-logs/module-install.log
          cmake -S tests/reader_annotation_view/consumer -B build/av-san-consumer -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_FLAGS="$san" -DCMAKE_CXX_FLAGS="$san" -DCMAKE_EXE_LINKER_FLAGS="$san" -DCMAKE_PREFIX_PATH="$PWD/build/av-san-stage;$PWD/build/av-stage;$PWD/build/av-product-stage;$PWD/build/reading-library/stage" 2>&1 | tee build/av-san-logs/consumer-configure.log
          cmake --build build/av-san-consumer --verbose 2>&1 | tee build/av-san-logs/consumer-build.log
      - name: Run the sanitized consumers on the same fixture and record the real fault
        run: |
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:print_stacktrace=1
          export UBSAN_OPTIONS=print_stacktrace=1
          python3 tests/reader_annotation_view/check_annotation_view.py --probe build/av-san-consumer/annotation-view-probe --c-consumer build/av-san-consumer/annotation-view-c-consumer --link-map build/av-san-consumer/annotation-view-link.map --output build/av-san-evidence 2>&1 | tee build/av-san-logs/sanitized-report.log
      - name: Preserve the sanitizer diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-annotation-view-asan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/av-san-logs/
            build/av-san-evidence/
          if-no-files-found: error
  evidence:
    name: strict annotation view evidence
    needs: consumers
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate all platform ZIPs and compare their outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_annotation_view/check_artifacts.py build/av-artifact-evidence
      - name: Preserve the artifact verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-annotation-view-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/av-artifact-evidence/
          if-no-files-found: error
