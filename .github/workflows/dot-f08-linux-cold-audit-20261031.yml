name: F08 retained Linux cold-start diagnosis
on:
  push:
    branches: [codex/dot-f08-linux-cold-audit-20261031]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate and inspect all original startup timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile tests/reader_f08_linux_cold_audit_20261031/audit.py
          python3 tests/reader_f08_linux_cold_audit_20261031/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-linux-cold-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f08-linux-cold-audit/audit.json
            build/f08-linux-cold-audit/input/original.zip
          if-no-files-found: error
