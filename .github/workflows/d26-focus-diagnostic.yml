name: D26 original focus evidence
on:
  push:
    branches: [codex/d26-focus-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reader-d26-current-40546423134-1
          run-id: 40546423134
          github-token: ${{ github.token }}
          path: evidence
      - name: Read original search landing observation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('evidence/d26-tools-current/result.json').read_text())
          assert result['source_sha'] == '838cc41f799580bf98d0015c800446a000365068'
          assert result['run_id'] == '40546423134' and result['attempt'] == '1'
          print(json.dumps({'source_sha':result['source_sha'],'accepted':result['accepted'],'checks':result['checks'],'failure':result.get('failure')},ensure_ascii=False))
          tree = json.loads(Path('evidence/d26-tools-current/atspi-tree.json').read_text())
          def walk(node):
              if node.get('name','').startswith(('Search result 1:', 'In-book results', 'Search within book', 'In-book query')):
                  print(json.dumps(node,ensure_ascii=False))
              for child in node.get('children',[]):
                  walk(child)
          walk(tree)
          PY
