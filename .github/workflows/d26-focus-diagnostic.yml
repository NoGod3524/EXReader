name: TXT host exit evidence
on:
  push:
    branches: [codex/d26-focus-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: txt-progress-host-40548185504-1
          run-id: 40548185504
          github-token: ${{ github.token }}
          path: evidence
      - name: Read exact original report and worker breadcrumbs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('evidence').rglob('report.json'))
          assert reports, 'no original report'
          for path in reports:
              r = json.loads(path.read_text(encoding='utf-8'))
              if r.get('source_sha') == 'f4ff78423ecdf87a7a17efa71797892c0f2a79ca':
                  print(json.dumps({'path': str(path), 'source_sha': r['source_sha'],
                        'accepted': r.get('accepted'), 'host_exit_code': r.get('host_exit_code'),
                        'error': r.get('error'), 'checks': r.get('checks')}, ensure_ascii=False))
          for path in Path('evidence').rglob('txt-progress-trace.log'):
              print('TRACE', path, path.read_text(encoding='utf-8', errors='replace')[-4000:])
          PY
