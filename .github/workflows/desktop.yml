name: Desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --project=chromium
      - name: Windows portable
        if: runner.os == 'Windows'
        run: npm run portable
      - name: Desktop bundles
        if: runner.os != 'Windows'
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-${{ runner.os }}
          path: |
            release/*.zip
            src-tauri/target/release/bundle/**
