# Framework default-branch entry point: build and check the reader application branch.
name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reader-app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os != 'Windows'
      - run: npm test -- --project=chromium
      - name: Windows portable
        if: runner.os == 'Windows'
        run: npm run portable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          npm run tauri -- build --bundles appimage,deb
          mkdir -p release
          deb_path=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          dpkg-deb -x "$deb_path" release/linux-system-package
          python3 scripts/portable-linux.py --binary release/linux-system-package/usr/bin/exreader
          appimage_dir=src-tauri/target/release/bundle/appimage
          appimage_path=$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -print -quit)
          tar -czf release/EXReader-Linux-x64-portable.tar.gz -C "$appimage_dir" "$(basename "$appimage_path")" -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_NOTICES.md -C "$GITHUB_WORKSPACE/public" licenses
          cp src-tauri/target/release/bundle/deb/*.deb release/
      - name: macOS universal packages
        if: runner.os == 'macOS'
        run: |
          npm run tauri -- build --target universal-apple-darwin --bundles app,dmg
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/EXReader.app release/EXReader-macOS-universal.app.zip
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release/
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-${{ runner.os }}
          path: release/*.*
          if-no-files-found: error
          retention-days: 30
