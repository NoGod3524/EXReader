name: Claude H04 paging anchor evidence
on:
  push:
    branches: [codex/claude-h04-anchor-evidence-20261030]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  anchor:
    name: installed removed-page anchor semantics
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed base and package path ownership
        run: |
          BASE=7f15fe49374cd9389e2106837351d4bbd5e56113
          git merge-base --is-ancestor "$BASE" HEAD
          allowed='^(tests/claude_h04_anchor_evidence/.*|[.]github/workflows/claude-h04-anchor-evidence-20261030[.]yml|docs/CLAUDE-H04-.*[.]md)$'
          bad=$(git diff --name-only "$BASE" HEAD | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "unowned path: $bad"; exit 1; }
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libsecret-1-dev libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config ninja-build
      - name: Build unchanged product catalog, revisions and commands modules
        run: |
          prefix="$PWD/build/h04-stage"
          echo "ACCOUNT_PREFIX=$prefix" >> "$GITHUB_ENV"
          cmake -S extras/opds -B build/h04-hash -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON -DCMAKE_INSTALL_PREFIX="$PWD/build/h04-hash-stage"
          cmake --build build/h04-hash
          cmake --install build/h04-hash
          echo "EXREADER_ORIGINAL_HASH_PREFIX=$PWD/build/h04-hash-stage" >> "$GITHUB_ENV"
          export EXREADER_ORIGINAL_HASH_PREFIX="$PWD/build/h04-hash-stage"
          cmake -S apps/reader/store/native -B build/h04-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/h04-product --parallel 4
          cmake --install build/h04-product
          cmake -S extras/webdav -B build/h04-dav -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/h04-dav --parallel 4
          cmake --install build/h04-dav
          cmake -S apps/reader/revisions -B build/h04-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/h04-revisions --parallel 4
          cmake --install build/h04-revisions
          cmake -S apps/reader/commands -B build/h04-commands -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/h04-commands --parallel 4
          cmake --install build/h04-commands
      - name: Anchor evidence
        id: anchor
        run: |
          cmake -S tests/claude_h04_anchor_evidence -B build/h04-anchor -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ACCOUNT_PREFIX"
          cmake --build build/h04-anchor --parallel 4
          mkdir -p build/h04-evidence
          build/h04-anchor/anchor-evidence build/h04-evidence/catalog.sqlite | tee build/h04-evidence/result.json
      - name: Bind receipts without hiding failures
        if: always()
        env:
          ANCHOR_OUTCOME: ${{ steps.anchor.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('build/h04-evidence')
          root.mkdir(parents=True,exist_ok=True)
          files={}
          for name in ('calls.jsonl','catalog.sqlite','result.json'):
              path=root/name
              if path.is_file():
                  data=path.read_bytes()
                  files[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          record={'schema':1,'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'claim_scope':'installed_synthetic_api',
                  'gtk_claim':False,'sdk_original_claim':False,'anchor_outcome':os.environ['ANCHOR_OUTCOME'],
                  'files':files,'complete':len(files)==3}
          (root/'manifest.json').write_text(json.dumps(record,sort_keys=True)+'\n')
          print(json.dumps(record,sort_keys=True))
          if os.environ['ANCHOR_OUTCOME']=='success':
              assert record['complete'],'successful run lacks receipt files'
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-h04-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/h04-evidence/
          if-no-files-found: error
