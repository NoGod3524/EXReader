name: Android APK and emulator check
on:
  workflow_dispatch:
    inputs:
      package_type:
        description: Optimized signed preview or debug package
        type: choice
        options: [preview, debug]
        default: preview
      existing_debug_run:
        description: Optional prior run ID to test its APK without rebuilding
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  apk:
    if: inputs.existing_debug_run == ''
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - run: npm ci
      - name: Stable preview signing key
        env:
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_PREVIEW_KEYSTORE_BASE64"
          umask 077
          mkdir -p "$HOME/.android"
          echo "$ANDROID_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build APKs
        env:
          PACKAGE_TYPE: ${{ inputs.package_type }}
        run: |
          if [ "$PACKAGE_TYPE" = "preview" ]; then
            npm run tauri -- android build --ci --apk --split-per-abi --target aarch64 x86_64
          else
            npm run tauri -- android build --ci --debug --apk --split-per-abi --target aarch64 x86_64
          fi
      - name: Sign optimized preview APKs
        if: inputs.package_type == 'preview'
        run: |
          mkdir -p release
          for arch in arm64 x86_64; do
            apk_path=$(find src-tauri/gen/android/app/build/outputs/apk -name "*$arch*release*unsigned.apk" -print -quit)
            test -n "$apk_path"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$apk_path" "release/$arch-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "release/EXReader-Android-$arch-preview.apk" "release/$arch-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "release/EXReader-Android-$arch-preview.apk"
            rm "release/$arch-aligned.apk"
          done
      - uses: actions/upload-artifact@v4
        if: inputs.package_type == 'debug'
        with:
          name: EXReader-Android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: inputs.package_type == 'preview'
        with:
          name: EXReader-Android-preview
          path: release/*preview.apk
          if-no-files-found: error
          retention-days: 30
  emulator:
    timeout-minutes: 20
    needs: apk
    if: always() && (needs.apk.result == 'success' || inputs.existing_debug_run != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.existing_debug_run || github.run_id }}
          name: EXReader-Android-${{ inputs.package_type }}
          path: android-apks
      - run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node scripts/smoke-android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXReader-Android-emulator-check
          path: test-results/android/
          retention-days: 30
