name: Android SDK 3.42 exact package identity
on:
  workflow_call:
  push:
    branches: [codex/android-sdk342-package-20261028]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  C11_NDK: '27.0.12077973'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Guard exact source and prepare Android tools
        run: |
          python3 tests/android_sdk342_package/run.py guard
          python3 -m pip install 'PyYAML==6.0.3'
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;${C11_NDK}" "emulator" "system-images;android-34;default;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build exact installed SDK and package
        run: python3 tests/android_sdk342_package/run.py build
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: python3 tests/reader_f06_packages/identity.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sdk342-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f06/android-source.json
            build/f06/android/
            build/f06/android-payload/build.json
            build/f06/android-sdk342-build-step-*.sh
            build/wave3/logs/
            build/wave3/artifacts/sha256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/sdk342-six-source-20261028') }}
        with:
          name: f06-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f06/android/
          if-no-files-found: error
