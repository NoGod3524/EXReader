name: Reader WebDAV download and sideload import
on:
  push:
    branches: [codex/reader-webdav-import]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  webdav-import:
    name: WebDAV import (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, protected-tree and path guards with their own positive and negative selftest
        run: |
          mkdir -p build/wi-logs
          python3 tests/reader_webdav_import/check_guards.py --fixed f43baf9182d75907c0cb5d6f77048f27bca8c950 --freeze 9854061be331fe603a1822d9b2b36ee357154927 --output build/wi-guards 2>&1 | tee build/wi-logs/guards.log
      - name: Install build and fixture tooling
        run: |
          python -m pip install ninja==1.11.1.1
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev libxml2-dev pkg-config
          elif [ "$RUNNER_OS" = macOS ]; then
            brew install openssl@3
            echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          fi
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure and build the frozen reading library
        run: |
          set -o pipefail
          git rev-parse HEAD > build/wi-logs/source.txt
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "WI_PREFIX=$ws/build/wi-prefix" >> "$GITHUB_ENV"
          echo "WI_SDK=$ws/build/reading-library/stage" >> "$GITHUB_ENV"
          cmake --preset reading-library 2>&1 | tee build/wi-logs/sdk-configure.log
          cmake --build --preset reading-library --parallel 4 2>&1 | tee build/wi-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/wi-logs/sdk-install.log
      - name: Build and install the unchanged sideload and WebDAV source packages
        run: |
          set -o pipefail
          apple=OFF
          if [ "$RUNNER_OS" = macOS ]; then apple=ON; fi
          cmake -S extras/sideload -B build/wi-sideload -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WI_SDK" -DCMAKE_INSTALL_PREFIX="$WI_PREFIX" 2>&1 | tee build/wi-logs/sideload-configure.log
          cmake --build build/wi-sideload --parallel 4 2>&1 | tee build/wi-logs/sideload-build.log
          cmake --install build/wi-sideload 2>&1 | tee build/wi-logs/sideload-install.log
          cmake -S extras/webdav -B build/wi-webdav -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_WEBDAV_APPLE_URLSESSION=$apple -DCMAKE_INSTALL_PREFIX="$WI_PREFIX" 2>&1 | tee build/wi-logs/webdav-configure.log
          cmake --build build/wi-webdav --parallel 4 2>&1 | tee build/wi-logs/webdav-build.log
          cmake --install build/wi-webdav 2>&1 | tee build/wi-logs/webdav-install.log
      - name: Build and install EXReaderCloudImport against installed packages only
        run: |
          set -o pipefail
          cmake -S apps/reader/cloud-import -B build/wi-adapter -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WI_SDK" -DCMAKE_PREFIX_PATH="$WI_PREFIX;$WI_SDK" -DCMAKE_INSTALL_PREFIX="$WI_PREFIX" 2>&1 | tee build/wi-logs/adapter-configure.log
          cmake --build build/wi-adapter --parallel 4 --verbose 2>&1 | tee build/wi-logs/adapter-build.log
          cmake --install build/wi-adapter 2>&1 | tee build/wi-logs/adapter-install.log
      - name: Compile the independent C and C++ consumers from installed packages
        run: |
          set -o pipefail
          cmake -S tests/reader_webdav_import/consumer -B build/wi-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WI_PREFIX;$WI_SDK" 2>&1 | tee build/wi-logs/consumer-configure.log
          cmake --build build/wi-consumer --parallel 4 2>&1 | tee build/wi-logs/consumer-build.log
      - name: Real native TLS WebDAV download, SDK import and independent SDK readback
        run: |
          set -o pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          python3 tests/reader_webdav_import/check_cloud_import.py --probe "build/wi-consumer/cloud-probe$exe" --cxx "build/wi-consumer/cloud-cpp-consumer$exe" --fixtures tests/fixtures --module-prefix build/wi-prefix --output build/wi-evidence 2>&1 | tee build/wi-logs/checks.log
      - name: Preserve source-bound logs, installed files and every case record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-webdav-import-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/wi-logs/
            build/wi-guards/
            build/wi-evidence/
            !build/wi-evidence/certificates/*.key
            build/wi-prefix/
            build/wi-consumer/cloud-probe*
            build/wi-consumer/cloud-cpp-consumer*
            build/wi-consumer/CMakeCache.txt
            build/wi-adapter/CMakeCache.txt
          if-no-files-found: error
  evidence:
    name: same-run artifact evidence
    needs: webdav-import
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifact ids, bytes, digests, run identity and strict reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_webdav_import/check_artifacts.py --output build/wi-artifact-evidence
      - name: Preserve the artifact verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-webdav-import-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/wi-artifact-evidence/
          if-no-files-found: error
