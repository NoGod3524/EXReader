name: Reader external link policy
on:
  push:
    branches: [codex/reader-external-link-policy]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  link-policy:
    name: link policy consumers (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-2022
            platform: Windows
          - os: macos-15
            platform: macOS
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen SDK, unchanged product schema and package path ownership
        run: |
          FIXED=f43baf9182d75907c0cb5d6f77048f27bca8c950
          K=9854061be331fe603a1822d9b2b36ee357154927
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FIXED" HEAD
          git diff --exit-code "$K" HEAD -- src include cmake CMakeLists.txt tests/fixtures .github/workflows/native.yml .github/workflows/reliability.yml bindings
          git diff --exit-code "$FIXED" HEAD -- apps/reader/store apps/reader/session apps/reader/commands apps/reader/revisions apps/reader/sync apps/reader/desktop apps/reader/desktop-metadata apps/reader/reading-state apps/reader/preferences apps/reader/search apps/reader/batch-import extras/sideload extras/opds docs/handoffs
          allowed='^(apps/reader/link-policy/|tests/reader_external_link_policy/|\.github/workflows/reader-external-link-policy\.yml$|docs/READER-EXTERNAL-LINK-POLICY\.md$|docs/validation/reader-external-link-policy\.json$)'
          changed=$(git diff --name-only "$FIXED" HEAD)
          bad=$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "unowned path: $bad"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing build tool version
        run: python -m pip install ninja==1.11.1.1
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vs = & (Join-Path $root 'Microsoft Visual Studio\Installer\vswhere.exe') -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          $line = '"' + $bat + '" >nul && set'
          cmd /c $line | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Record source and build the unchanged frozen SDK
        run: |
          set -o pipefail
          mkdir -p build/link-logs
          git rev-parse HEAD > build/link-logs/source.txt
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "LINK_PREFIX=$ws/build/link-prefix" >> "$GITHUB_ENV"
          echo "LINK_SDK=$ws/build/reading-library/stage" >> "$GITHUB_ENV"
          cmake --preset reading-library 2>&1 | tee build/link-logs/sdk-configure.log
          cmake --build --preset reading-library --parallel 4 2>&1 | tee build/link-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/link-logs/sdk-install.log
      - name: Build and install the link policy package
        run: |
          set -o pipefail
          cmake -S apps/reader/link-policy -B build/link-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$LINK_PREFIX" 2>&1 | tee build/link-logs/package-configure.log
          cmake --build build/link-package --parallel 4 --verbose 2>&1 | tee build/link-logs/package-build.log
          cmake --install build/link-package 2>&1 | tee build/link-logs/package-install.log
      - name: Compile independent consumers from the installed packages only
        run: |
          set -o pipefail
          cmake -S tests/reader_external_link_policy/consumer -B build/link-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$LINK_PREFIX;$LINK_SDK" \
            -DEXR_LINK_POLICY_SOURCE="$WS/apps/reader/link-policy/src" \
            -DEXR_LINK_POLICY_INCLUDE="$WS/apps/reader/link-policy/include" 2>&1 | tee build/link-logs/consumer-configure.log
          cmake --build build/link-consumer --parallel 4 --verbose 2>&1 | tee build/link-logs/consumer-build.log
      - name: Judge fixed fixtures, lifetimes, failures and the SDK hand-off
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          control=$(ls build/link-consumer/*link-unsafe-control* | head -n 1)
          python3 tests/reader_external_link_policy/check_link_policy.py \
            --probe "build/link-consumer/link-probe$exe" \
            --cpp "build/link-consumer/link-cpp-consumer$exe" \
            --worker "build/link-consumer/link-worker$exe" \
            --sdk "build/link-consumer/link-sdk-consumer$exe" \
            --control-lib "$control" \
            --prefix "$LINK_PREFIX" \
            --epub tests/fixtures/navigation-epub3.epub \
            --source apps/reader/link-policy/src/policy.c \
            --source-header apps/reader/link-policy/include/reader_link_policy.h \
            --installed-header "$LINK_PREFIX/include/reader_link_policy.h" \
            --output build/link-evidence \
            --platform "${{ matrix.platform }}" 2>&1 | tee build/link-logs/check.log
      - name: Preserve installed package, consumers, evidence and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-external-link-policy-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/link-logs/
            build/link-evidence/
            build/link-prefix/
            build/link-consumer/
            build/link-package/CMakeCache.txt
          if-no-files-found: error
  evidence:
    name: strict same-run link policy evidence
    needs: [link-policy]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifact ids, bytes, digests and reports in the cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_external_link_policy/check_artifacts.py --output build/link-artifacts
      - name: Preserve the artifact verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-external-link-policy-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/link-artifacts/
          if-no-files-found: error
