name: Apple retained navigation native diagnostic
on:
  push:
    branches: [codex/reader-apple-search-evidence]
    paths: [.github/workflows/reader-apple-search-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the hash-verified failed native report in Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'tools')
          from check_parallel_integration import fetch,download_artifact_zip,require
          require(os.environ.get('GITHUB_ACTIONS')=='true','Actions only')
          source='eb123aa82140eafbe5143f7b67a7f2f65e8544f0'
          run,job,artifact,size=40130739432,120982314033,12575235245,1415543
          digest='sha256:498b10832c9408338461e8e4a01010f964c5aaf993a1bc9f29bf36de4497e8b6'
          producer=fetch('actions/jobs/'+str(job))
          require(producer['run_id']==run and producer['head_sha']==source and
                  producer['name']=='Native navigation and container contracts' and producer['conclusion']=='failure','producer differs')
          metadata=fetch('actions/artifacts/'+str(artifact))
          require(metadata['name']=='apple-navigation-native-40130739432-1' and
                  metadata['workflow_run']['id']==run and metadata['workflow_run']['head_sha']==source and
                  not metadata['expired'] and metadata['size_in_bytes']==size and metadata['digest']==digest,'metadata differs')
          raw=download_artifact_zip(artifact)
          require(len(raw)==size and 'sha256:'+hashlib.sha256(raw).hexdigest()==digest,'ZIP differs')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              require(len(archive.namelist())==len(set(archive.namelist())),'duplicate member')
              info=archive.getinfo('consumer/navigation-review.json')
              require(0<info.file_size<=4*1024*1024,'native report size')
              data=archive.read(info)
              value=json.loads(data)
              print(json.dumps({'retained_native_report':value},indent=2,sort_keys=True))
              require(value['source_sha']==source and value['run_id']==str(run) and
                      value['attempt']=='1','native report identity differs')
              names=[name for name in archive.namelist() if name.endswith('.json')]
          output=Path('build/apple-search-evidence')
          output.mkdir(parents=True)
          (output/'native-report.json').write_bytes(data)
          report={'diagnostic_only':True,'accepted':False,'origin_source':source,'origin_run':run,
                  'artifact':metadata,'json_members':names,'native_report':value}
          (output/'diagnostic.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-container-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-search-evidence/
          if-no-files-found: error
