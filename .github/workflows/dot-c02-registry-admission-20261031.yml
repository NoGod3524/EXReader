name: C02 trusted Windows registry and actual product admission
on:
  push:
    branches: [codex/dot-c02-native-journal-20261030]
    paths:
      - extras/migration/windows_coordinator_native_journal_20261030/**
      - tests/migration/windows_registry_admission_20261031/**
      - examples/reader.c
      - apps/reader/desktop/CMakeLists.txt
      - .github/workflows/dot-c02-registry-admission-20261031.yml
permissions: {contents: read}
defaults:
  run: {shell: bash}
jobs:
  registry_and_product:
    runs-on: windows-2022
    timeout-minutes: 35
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Frozen SDK and original coordinator contracts
        run: |
          set -euo pipefail
          git diff --exit-code 8357eafa28423a7ab93ba08b823af80f01ad1505 HEAD -- src include cmake CMakeLists.txt bindings
          git diff --exit-code a8d0b162d8c21617e4c2c837e3eb2b2174bbf69b HEAD -- extras/migration/windows_coordinator_hardening_20261030 tests/migration/windows_coordinator_hardening_20261030 extras/migration/windows_coordinator_cas_20261030 tests/migration/windows_coordinator_cas_20261030
          mkdir -p evidence/build-logs
      - name: Install native admission and exact unchanged SDK
        run: |
          set -euo pipefail
          cmake -S extras/migration/windows_coordinator_hardening_20261030 -B build/lib2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/lib2 --config Release
          cmake --install build/lib2 --config Release --prefix "$GITHUB_WORKSPACE/stage"
          cmake -S extras/migration/windows_coordinator_cas_20261030 -B build/lib3 -DCMAKE_BUILD_TYPE=Release -DWH_PREFIX="$GITHUB_WORKSPACE/stage"
          cmake --build build/lib3 --config Release
          cmake --install build/lib3 --config Release --prefix "$GITHUB_WORKSPACE/stage"
          cmake -S extras/migration/windows_coordinator_native_journal_20261030 -B build/native -DWH_PREFIX="$GITHUB_WORKSPACE/stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release 2>&1 | tee evidence/build-logs/admission-build.log
          cmake --install build/native --config Release --prefix "$GITHUB_WORKSPACE/stage"
          cmake --preset reading-library -B build/sdk-build -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/sdk"
          cmake --build build/sdk-build --parallel 4 2>&1 | tee evidence/build-logs/sdk-build.log
          cmake --install build/sdk-build
          cmake -S extras/migration/windows_coordinator_native_journal_20261030 -B build/native -DWH_PREFIX="$GITHUB_WORKSPACE/stage" -DWH3_BUILD_SDK_TOOL=ON -DEXR_SDK="$GITHUB_WORKSPACE/build/sdk"
          cmake --build build/native --target exreader-c02-admission --config Release 2>&1 | tee evidence/build-logs/admission-command-build.log
          cmake --install build/native --config Release --prefix "$GITHUB_WORKSPACE/stage"
      - name: Build separate installed registry consumer and actual product
        run: |
          set -euo pipefail
          cmake -S tests/migration/windows_registry_admission_20261031 -B build/registry -DCMAKE_BUILD_TYPE=Release -DWH_PREFIX="$GITHUB_WORKSPACE/stage" -DEXR_SDK="$GITHUB_WORKSPACE/build/sdk" -DSOURCE_SHA="$GITHUB_SHA"
          cmake --build build/registry --config Release 2>&1 | tee evidence/build-logs/registry-build.log
          cmake -S extras/opds -B build/hash -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON
          cmake --build build/hash --parallel 4
          cmake --install build/hash --prefix "$GITHUB_WORKSPACE/build/hash-prefix"
          HASH_PREFIX=$(cygpath -m "$GITHUB_WORKSPACE/build/hash-prefix")
          C02_PREFIX=$(cygpath -m "$GITHUB_WORKSPACE/stage")
          cmake -S apps/reader/desktop -B build/product -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$GITHUB_WORKSPACE/build/sdk" -DEXR_SDK_VERSION=3.42.0 -DREADER_ORIGINAL_HASH_PREFIX:PATH="$HASH_PREFIX" -DREADER_C02_PREFIX:PATH="$C02_PREFIX"
          cmake --build build/product --target EXReaderProduct --parallel 4 2>&1 | tee evidence/build-logs/product-build.log
      - name: Actual registry custody and SDK publication proof
        run: |
          set -euo pipefail
          EXE=$(find build/registry -type f -name coordinator-registry-check.exe | head -1)
          "$EXE" 2>&1 | tee evidence/registry.log
          python - <<'PY'
          import json,os,pathlib
          rows=[json.loads(line) for line in pathlib.Path('evidence/registry.log').read_text().splitlines() if line.startswith('{"source":')]
          assert len(rows)==1
          r=rows[0]
          assert r['source']==os.environ['GITHUB_SHA'] and r['cases']==32 and r['checks']>=270 and r['failed']==0 and r['passed'] is True
          assert r['actual_sdk'] is True and r['trusted_registry'] is True
          assert r['production_coordinator'] is False and r['full_c02_acceptance'] is False
          PY
      - name: Installed production enrollment command
        run: |
          set -euo pipefail
          EXE=$(find build/registry -type f -name coordinator-registry-check.exe | head -1)
          python tests/migration/windows_registry_admission_20261031/admission_cli_check.py --tool stage/bin/exreader-c02-admission.exe --consumer "$EXE" --output evidence/admission-command 2>&1 | tee evidence/admission-command.log
      - name: Actual product before-SDK refusal and last-owner release
        run: |
          set -euo pipefail
          EXE=$(find build/registry -type f -name coordinator-registry-check.exe | head -1)
          python tests/reader_native_owner_repairs/display.py
          python tests/migration/windows_registry_admission_20261031/host_check.py --host build/product/EXReaderProduct.exe --consumer "$EXE" --font tests/fixtures/fonts/primary.ttf --output evidence/product 2>&1 | tee evidence/host.log
      - name: Preserve raw state and provenance
        if: always()
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path('evidence')
          registry=subprocess.run(['reg.exe','export',r'HKCU\Software\EXReaderC02Admission',str(p/'registration.reg'),'/y'],capture_output=True)
          (p/'registry-export.json').write_text(json.dumps(dict(exit=registry.returncode,stdout=registry.stdout.decode(errors='replace'),stderr=registry.stderr.decode(errors='replace')),indent=2)+'\n')
          (p/'receipt.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],frozen_sdk='8357eafa28423a7ab93ba08b823af80f01ad1505',full_c02_acceptance=False),indent=2)+'\n')
          rows=[dict(path=f.relative_to(p).as_posix(),bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest()) for f in sorted(p.rglob('*')) if f.is_file()]
          (p/'file-hashes.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-registry-product-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
