name: F09 frozen observations plus Microsoft RichEdit reference host
on:
  push:
    branches: [codex/dot-f09-reference-host-20261031]
permissions:
  contents: read
concurrency:
  group: f09-reference-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Frozen EXReader observations then the same consumers on a RichEdit host
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/reader_f09_reference_host_20261031/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-reference-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f09-reference-host/*.json
            build/f09-reference-host/*-managed/*.log
            build/f09-reference-host/*-managed/*.json
            build/f09-reference-host/*-native/*.log
            build/f09-reference-host/*-native/*.json
            build/f09-reference-host/*-legacy/*.log
            build/f09-reference-host/*-legacy/*.json
            build/f09-reference-host/*-legacy/*.txt
            build/f09-reference-host/*-visible/*.log
            build/f09-reference-host/*-visible/*.json
            build/f09-reference-host/*-visible/*.txt
            build/f09-reference-host/*-handle-*/*.log
            build/f09-reference-host/*-handle-*/*.json
            build/f09-reference-host/*-handle-*/*.txt
            build/f09-reference-host/*-control-*/*.log
            build/f09-reference-host/*-control-*/*.json
            build/f09-reference-host/*-control-*/*.txt
            build/f09-reference-host/baseline-package/build.json
            build/f09-reference-host/candidate-package/build.json
            build/f09-reference-host/baseline-package/report.json
            build/f09-reference-host/candidate-package/report.json
          if-no-files-found: error
