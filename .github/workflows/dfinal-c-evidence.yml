name: D-FINAL-C model and mobile build evidence
on:
  push:
    branches: [codex/dfinal-c-evidence, codex/dfinal-c-audit-20261114]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'bindings/**'
      - 'apps/**'
      - 'extras/**'
      - 'examples/android/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/dfinal-c-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same pinned Calibri substitute as native CI
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import urlopen
          source = 'https://raw.githubusercontent.com/google/fonts/605c9f29dd5770762bd7ee8ea8ac4ae7664b2b7b/ofl/carlito/'
          directory = Path.home() / '.local/share/fonts'
          directory.mkdir(parents=True, exist_ok=True)
          for name, checksum in (
              ('Carlito-Regular.ttf', 'f6418f708baede9789daef5d458c0f53d2a888af9820e8062934e504fedc6595'),
              ('OFL.txt', '58402f82a7c332a700294988fe7554fbb0a63a8d27ccc1ee3bbc640311990a00'),
          ):
              with urlopen(source + name, timeout=60) as response:
                  data = response.read()
              assert sha256(data).hexdigest() == checksum, name
              (directory / ('Carlito-OFL.txt' if name == 'OFL.txt' else name)).write_bytes(data)
          PY
      - name: Build and install current SDK
        run: |
          set -euo pipefail
          mkdir -p evidence/dfinal-c-actions
          git rev-parse HEAD | tee evidence/dfinal-c-actions/source.txt
          python tests/test_dfinal_c_artifacts.py 2>&1 | tee evidence/dfinal-c-actions/artifact-checker-tests.txt
          python tests/test_dfinal_c_android_abi.py -v 2>&1 | tee evidence/dfinal-c-actions/android-abi-tests.txt
          python tests/check_reading_licenses.py 2>&1 | tee evidence/dfinal-c-actions/license-checker-tests.txt
          cmake -S . -B build/dfinal-sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_ENABLE_AAC=OFF -DCMAKE_INSTALL_PREFIX="$PWD/build/dfinal-stage" 2>&1 | tee evidence/dfinal-c-actions/configure.txt
          cmake --build build/dfinal-sdk --parallel 4 2>&1 | tee evidence/dfinal-c-actions/build.txt
          cmake --install build/dfinal-sdk 2>&1 | tee evidence/dfinal-c-actions/install.txt
      - name: Old library upgrade and SDK annotation regressions
        run: |
          set -euo pipefail
          ctest --test-dir build/dfinal-sdk -V -R '^(native-library-epub-storage|native-annotation)$' --no-tests=error 2>&1 | tee evidence/dfinal-c-actions/regressions.txt
      - name: Full CTest excluding only release and doc coverage
        run: |
          set -euo pipefail
          ctest --test-dir build/dfinal-sdk -E '^(sdk-release|sdk-doc-coverage)$' --show-only=json-v1 > evidence/dfinal-c-actions/ctest-inventory.json
          ctest --test-dir build/dfinal-sdk -E '^(sdk-release|sdk-doc-coverage)$' --output-on-failure --parallel 4 --no-tests=error --output-junit "$PWD/evidence/dfinal-c-actions/ctest-full.xml" 2>&1 | tee evidence/dfinal-c-actions/ctest-full.txt
      - name: Installed raw3 model export import preview confirmation and rejection
        run: |
          set -euo pipefail
          python tools/run_dfinal_c_models.py --sdk build/dfinal-stage --build build/dfinal-models 2>&1 | tee evidence/dfinal-c-actions/models.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfinal-c-models-${{ github.sha }}
          path: |
            evidence/dfinal-c-actions/
            build/dfinal-models/consumer/results/
            build/dfinal-models/model-tests.xml
          if-no-files-found: error
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: android-arm64-v8a
          - os: macos-15
            target: iphoneos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android-arm64-v8a'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.target == 'android-arm64-v8a'
        with:
          gradle-version: '8.9'
      - name: Install the pinned Android host toolchain
        if: matrix.target == 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build and install mobile SDK (build evidence only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mobile-evidence
          git rev-parse HEAD | tee build/mobile-evidence/source.txt
          if [ '${{ matrix.target }}' = android-arm64-v8a ]; then
            ndk="$ANDROID_HOME/ndk/27.0.12077973"
            test -f "$ndk/build/cmake/android.toolchain.cmake"
            cat "$ndk/source.properties" | tee build/mobile-evidence/toolchain.txt
            flags=(-DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DEXR_BUILD_JNI=ON -DEXR_BUILD_SHARED_COMPAT=ON)
          else
            xcodebuild -version | tee build/mobile-evidence/toolchain.txt
            flags=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO)
          fi
          cmake --preset reading-library -B build/mobile -DCMAKE_INSTALL_PREFIX="$PWD/build/mobile-stage" "${flags[@]}" 2>&1 | tee build/mobile-evidence/configure.txt
          cmake --build build/mobile --parallel 4 2>&1 | tee build/mobile-evidence/build.txt
          cmake --install build/mobile 2>&1 | tee build/mobile-evidence/install.txt
      - name: Build and inspect the arm64 development host APK
        if: matrix.target == 'android-arm64-v8a'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mobile-host
          python3 tools/build_dfinal_c_android_host.py --sdk build/mobile-stage --output build/mobile-host 2>&1 | tee build/mobile-host/build.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/mobile-host/host-debug-arm64-v8a.apk 2>&1 | tee build/mobile-host/signature.txt
      - name: Hash the final installed mobile SDK files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          stage = Path('build/mobile-stage')
          files = {str(p.relative_to(stage)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(stage.rglob('*')) if p.is_file()}
          assert files and any(p.endswith('.a') for p in files)
          Path('build/mobile-evidence/manifest.json').write_text(json.dumps({
              'source': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
              'target': '${{ matrix.target }}', 'tier': 'sdk-build-only',
              'host_deployed': False, 'physical_device_verified': False, 'files': files}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfinal-c-${{ matrix.target }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            build/mobile-evidence/
            build/mobile-stage/
            build/mobile-host/host-debug-arm64-v8a.apk
            build/mobile-host/host-manifest.json
            build/mobile-host/build.txt
            build/mobile-host/signature.txt
          if-no-files-found: error
