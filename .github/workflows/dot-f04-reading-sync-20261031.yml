name: F04 reading sync preparation (disabled pending CI approval)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  disabled-preparation:
    # Only a separately approved commit may activate a producer matrix.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit fixed source and exclusive paths
        run: python3 tests/dot_f04_reading_sync_20261031/admission.py
# Expanded Windows/GTK/macOS/iPad adapters are preparation only.
# No six-host producer jobs, dispatch budget, or automatic retry is authorized.
