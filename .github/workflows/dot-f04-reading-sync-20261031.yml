name: F04 reusable real Windows Android roundtrip
on:
  workflow_call:
    inputs:
      case:
        required: true
        type: string
      controller_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  EXR_APPLE_SDK_VERSION: '3.42.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
  C11_NDK: '27.0.12077973'
  PYTHONUTF8: '1'
  F04_SCOPE: ${{ inputs.case }}
  F04_CONTROLLER_SHA: ${{ inputs.controller_sha }}
# No independent trigger. Canonical owner selects the sole approved case once.
jobs:
  windows_seed:
    name: F04 Windows seed
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/windows-android' && inputs.controller_sha == github.sha }}
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      build: ${{ steps.build.outputs.artifact-id }}
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare Python dependencies
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
      - name: Admission and syntax before actual build
        run: |
          python3 tests/dot_f04_reading_sync_20261031/admission.py
          python3 -m py_compile tests/dot_f04_reading_sync_20261031/*.py
          python3 tests/dot_f04_reading_sync_20261031/run.py prepare
          python3 -m py_compile build/f04-driver/*.py
      - name: Same-source Windows build
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py build-windows
          python3 tests/dot_f04_reading_sync_20261031/run.py package-build --platform windows
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: f04-build-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-build-windows/
          if-no-files-found: error
      - name: Native display and UI prerequisites
        shell: bash
        run: |
          python3 -m pip install uiautomation==2.0.29
          python3 tests/reader_native_owner_repairs/display.py
      - name: Fixed original
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - name: Real Windows seed
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py windows --phase windows-seed --candidate build/f04-build-windows/package/EXReader/EXReader.exe --font build/f04-build-windows/Reader.otf --original build/apple-android/original/epub-alice.epub --title "Alice's Adventures in Wonderland" --output build/phase
          python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/phase --build-receipt build/f04-build-windows/build-receipt.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-windows-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase/state.json
            build/phase/result.json
            build/phase/report.json
            build/phase/requests.json
            build/phase/cert.pem
            build/phase/program.bin
            build/phase/build-receipt.json
            build/phase/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-windows_seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/windows/
          if-no-files-found: warn
          retention-days: 30

  android_peer:
    name: F04 android peer
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/windows-android' && inputs.controller_sha == github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [windows_seed]
    outputs:
      build: ${{ steps.build.outputs.artifact-id }}
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Python dependencies
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows_seed.outputs.phase }}
          path: build/incoming
          merge-multiple: true
      - name: Admission and syntax before actual Android build
        run: |
          python3 tests/dot_f04_reading_sync_20261031/admission.py
          python3 -m py_compile tests/dot_f04_reading_sync_20261031/*.py
          python3 tests/dot_f04_reading_sync_20261031/run.py prepare
          python3 -m py_compile build/f04-driver/*.py
      - name: Fixed original
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install exact Android prerequisites
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973" "emulator" "system-images;android-34;default;x86_64"
          sudo chmod 666 /dev/kvm
      - name: Same-job Android build and public handoff
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py build-android
          python3 tests/dot_f04_reading_sync_20261031/run.py package-build --platform android
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: f04-build-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f04-build-android
          if-no-files-found: error
          retention-days: 30
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/relay-debug-androidTest.apk
            python3 tests/dot_f04_reading_sync_20261031/run.py android-peer --previous build/incoming/state.json --fixture build/wave3/network-fixture --output build/phase --incoming-prefix F04_WINDOWS
            python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/phase --build-receipt build/f04-driver/build-android.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-android-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase/state.json
            build/phase/result.json
            build/phase/report.json
            build/phase/requests.json
            build/phase/cert.pem
            build/phase/program.bin
            build/phase/build-receipt.json
            build/phase/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-android_peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/android/
          if-no-files-found: warn
          retention-days: 30

  windows_return_android:
    name: F04 Windows return (android)
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/windows-android' && inputs.controller_sha == github.sha }}
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [windows_seed, android_peer]
    outputs:
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare Python dependencies
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
      - name: Native display and UI prerequisites
        shell: bash
        run: |
          python3 -m pip install uiautomation==2.0.29
          python3 tests/reader_native_owner_repairs/display.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows_seed.outputs.build }}
          path: build/input/windows
          merge-multiple: true
      - name: Fixed original
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android_peer.outputs.phase }}
          path: build/incoming
          merge-multiple: true
      - name: Fresh Windows receiver
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py windows --phase windows-return --candidate build/input/windows/package/EXReader/EXReader.exe --font build/input/windows/Reader.otf --original build/apple-android/original/epub-alice.epub --title "Alice's Adventures in Wonderland" --output build/phase --previous build/incoming/state.json --incoming-prefix F04_ANDROID
          python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/phase --build-receipt build/input/windows/build-receipt.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-windows-return-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase/state.json
            build/phase/result.json
            build/phase/report.json
            build/phase/requests.json
            build/phase/cert.pem
            build/phase/program.bin
            build/phase/build-receipt.json
            build/phase/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-windows_return_android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/windows/
          if-no-files-found: warn
          retention-days: 30

  retained_linux:
    name: F04 original 18 and 121 (linux)
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/windows-android' && inputs.controller_sha == github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      retained: ${{ steps.retained.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config ninja-build
      - name: Original retained checks on fixed SDK
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 tests/dot_f04_reading_sync_20261031/run.py retained-protocol
      - uses: actions/upload-artifact@v4
        id: retained
        with:
          name: f04-retained-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f04-driver/retained-receipt.json
            build/v2-sdk-evidence/result.json
            build/v2-sdk-evidence/probe.json
            build/v2-sdk-evidence/legacy/summary.json
            build/v2-sdk-evidence/legacy/report.json
            build/v2-webdav-evidence/result.json
            build/v2-webdav-evidence/probe.json
            build/v2-webdav-evidence/native-requests.json
            build/v2-consumer/reading-v2-probe*
            build/v2-webdav-consumer/reading-v2-probe*
            build/v1-consumer/reading-state-probe*
            build/v1-consumer/reading-state-c-consumer*
            build/v1-consumer/reading-state-link.map
            build/v1-product/CMakeCache.txt
            build/v1-revisions/CMakeCache.txt
            build/v1-adapter/CMakeCache.txt
            build/v1-consumer/CMakeCache.txt
          if-no-files-found: error
          retention-days: 30
      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind retained
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-retained_linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/retained/
          if-no-files-found: warn
          retention-days: 30

  audit:
    name: F04 graph and original retained authentication
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/windows-android' && inputs.controller_sha == github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [windows_seed, android_peer, windows_return_android, retained_linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate exact upload IDs and unchanged original evidence
        env:
          GH_TOKEN: ${{ github.token }}
          F04_ARTIFACT_IDS: '{"f04-windows-seed":${{ needs.windows_seed.outputs.phase }},"f04-android-peer":${{ needs.android_peer.outputs.phase }},"f04-windows-return-android":${{ needs.windows_return_android.outputs.phase }}}'
          F04_BUILD_IDS: '{"f04-build-windows":${{ needs.windows_seed.outputs.build }},"f04-build-android":${{ needs.android_peer.outputs.build }}}'
          F04_RETAINED_IDS: '{"f04-retained-linux":${{ needs.retained_linux.outputs.retained }}}'
        run: |
          python3 tests/dot_f04_reading_sync_20261031/audit.py --authenticate-graph
          python3 tests/dot_f04_reading_sync_20261031/audit.py --authenticate-retained
      - uses: actions/upload-artifact@v4
        with:
          name: f04-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f04-graph-auth/
            build/f04-retained-auth/
          if-no-files-found: error

      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/audit/
          if-no-files-found: warn
          retention-days: 30

  diagnose_fixed:
    name: F04 fixed failure diagnostic only
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/diagnose-round2' && inputs.controller_sha == github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read pinned failure evidence without executing product
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/dot_f04_reading_sync_20261031/audit.py --diagnose-fixed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-fixed-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-fixed-diagnostic/
          if-no-files-found: error
          retention-days: 30
