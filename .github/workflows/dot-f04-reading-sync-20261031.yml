name: F04 reusable real Windows Android roundtrip
on:
  workflow_call:
    inputs:
      case:
        required: true
        type: string
      controller_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  EXR_APPLE_SDK_VERSION: '3.42.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
  C11_NDK: '27.0.12077973'
  PYTHONUTF8: '1'
  F04_SCOPE: ${{ inputs.case }}
  F04_CONTROLLER_SHA: ${{ inputs.controller_sha }}
# No independent trigger. Canonical owner selects the sole approved case once.
jobs:
  windows_seed:
    name: F04 Windows seed
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (inputs.case == 'f04/windows-android' || inputs.case == 'f04/six-host') && inputs.controller_sha == github.sha }}
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.case == 'f04/six-host' && 20 || 30 }}
    outputs:
      build: ${{ steps.build.outputs.artifact-id }}
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare Python dependencies
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
      - name: Admission and syntax before actual build
        run: |
          python3 tests/dot_f04_reading_sync_20261031/admission.py
          python3 -m py_compile tests/dot_f04_reading_sync_20261031/*.py
          python3 tests/dot_f04_reading_sync_20261031/run.py prepare
          python3 -m py_compile build/f04-driver/*.py
      - name: Same-source Windows build
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py build-windows
          python3 tests/dot_f04_reading_sync_20261031/run.py package-build --platform windows
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: f04-build-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-build-windows/
          if-no-files-found: error
      - name: Native display and UI prerequisites
        shell: bash
        run: |
          python3 -m pip install uiautomation==2.0.29
          python3 tests/reader_native_owner_repairs/display.py
      - name: Fixed original
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - name: Real Windows seed
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py windows --phase windows-seed --candidate build/f04-build-windows/package/EXReader/EXReader.exe --font build/f04-build-windows/Reader.otf --original build/apple-android/original/epub-alice.epub --title "Alice's Adventures in Wonderland" --output build/phase
          python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/phase --build-receipt build/f04-build-windows/build-receipt.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-windows-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase/state.json
            build/phase/result.json
            build/phase/report.json
            build/phase/requests.json
            build/phase/cert.pem
            build/phase/program.bin
            build/phase/build-receipt.json
            build/phase/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-windows_seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/windows/
          if-no-files-found: warn
          retention-days: 30

  android_peer:
    name: F04 android peer
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (inputs.case == 'f04/windows-android' || inputs.case == 'f04/six-host') && inputs.controller_sha == github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.case == 'f04/six-host' && 25 || 45 }}
    needs: [windows_seed]
    outputs:
      build: ${{ steps.build.outputs.artifact-id }}
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Python dependencies
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows_seed.outputs.phase }}
          path: build/incoming
          merge-multiple: true
      - name: Admission and syntax before actual Android build
        run: |
          python3 tests/dot_f04_reading_sync_20261031/admission.py
          python3 -m py_compile tests/dot_f04_reading_sync_20261031/*.py
          python3 tests/dot_f04_reading_sync_20261031/run.py prepare
          python3 -m py_compile build/f04-driver/*.py
      - name: Fixed original
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install exact Android prerequisites
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973" "emulator" "system-images;android-34;default;x86_64"
          sudo chmod 666 /dev/kvm
      - name: Same-job Android build and public handoff
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py build-android
          python3 tests/dot_f04_reading_sync_20261031/run.py package-build --platform android
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: f04-build-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f04-build-android
          if-no-files-found: error
          retention-days: 30
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/relay-debug-androidTest.apk
            python3 tests/dot_f04_reading_sync_20261031/run.py android-peer --previous build/incoming/state.json --fixture build/wave3/network-fixture --output build/phase --incoming-prefix F04_WINDOWS
            python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/phase --build-receipt build/f04-driver/build-android.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-android-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase/state.json
            build/phase/result.json
            build/phase/report.json
            build/phase/requests.json
            build/phase/cert.pem
            build/phase/program.bin
            build/phase/build-receipt.json
            build/phase/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-android_peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/android/
          if-no-files-found: warn
          retention-days: 30

  windows_return_android:
    name: F04 Windows return (android)
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && (inputs.case == 'f04/windows-android' || inputs.case == 'f04/six-host') && inputs.controller_sha == github.sha }}
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.case == 'f04/six-host' && 10 || 15 }}
    needs: [windows_seed, android_peer]
    outputs:
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare Python dependencies
        shell: bash
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
      - name: Native display and UI prerequisites
        shell: bash
        run: |
          python3 -m pip install uiautomation==2.0.29
          python3 tests/reader_native_owner_repairs/display.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows_seed.outputs.build }}
          path: build/input/windows
          merge-multiple: true
      - name: Fixed original
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android_peer.outputs.phase }}
          path: build/incoming
          merge-multiple: true
      - name: Fresh Windows receiver
        shell: bash
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py windows --phase windows-return --candidate build/input/windows/package/EXReader/EXReader.exe --font build/input/windows/Reader.otf --original build/apple-android/original/epub-alice.epub --title "Alice's Adventures in Wonderland" --output build/phase --previous build/incoming/state.json --incoming-prefix F04_ANDROID
          python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/phase --build-receipt build/input/windows/build-receipt.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-windows-return-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/phase/state.json
            build/phase/result.json
            build/phase/report.json
            build/phase/requests.json
            build/phase/cert.pem
            build/phase/program.bin
            build/phase/build-receipt.json
            build/phase/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Collect safe diagnostic evidence
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-windows_return_android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/windows/
          if-no-files-found: warn
          retention-days: 30

  build_macos:
    name: F04 build macos
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/six-host' && inputs.controller_sha == github.sha }}
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      build: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated Python environment and toolchain identity
        run: |
          python3 -m venv "$RUNNER_TEMP/f04-python"
          echo "$RUNNER_TEMP/f04-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/f04-python/bin/python" -c "import sys; assert sys.version_info[:2] == (3,12) and sys.prefix != sys.base_prefix; print(sys.executable, sys.version)"
          "$RUNNER_TEMP/f04-python/bin/python" -m pip --version
          command -v ruby
          ruby --version
          command -v cmake
          cmake --version
          xcode-select -p
          xcodebuild -version
      - name: Build exact same-source SDK and product installation
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 tests/dot_f04_reading_sync_20261031/run.py build-macos
          python3 tests/dot_f04_reading_sync_20261031/run.py package-build --platform macos
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build/f04-build-macos")
          allowed = {"sdk/examples/android/.gitignore"}
          assert root.is_dir() and not root.is_symlink(), "ordinary upload root required"
          assert not any(p.is_symlink() for p in root.rglob("*")), "symlinks forbidden in upload root"
          hidden = {p.relative_to(root).as_posix() for p in root.rglob("*")
                    if any(part.startswith(".") for part in p.relative_to(root).parts)}
          assert hidden == allowed, ("unexpected or missing hidden upload paths", sorted(hidden))
          for name in allowed:
              path = root / name
              assert path.is_file() and not path.is_symlink(), "hidden upload must be an ordinary file"
          print("F04 public hidden upload paths:", sorted(hidden))
          PY
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: f04-build-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-build-macos/
          include-hidden-files: true
          if-no-files-found: error

  build_iphonesimulator:
    name: F04 build iphonesimulator
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/six-host' && inputs.controller_sha == github.sha }}
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      build: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated Python environment and toolchain identity
        run: |
          python3 -m venv "$RUNNER_TEMP/f04-python"
          echo "$RUNNER_TEMP/f04-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/f04-python/bin/python" -c "import sys; assert sys.version_info[:2] == (3,12) and sys.prefix != sys.base_prefix; print(sys.executable, sys.version)"
          "$RUNNER_TEMP/f04-python/bin/python" -m pip --version
          command -v ruby
          ruby --version
          command -v cmake
          cmake --version
          xcode-select -p
          xcodebuild -version
      - name: Build exact same-source SDK and product installation
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 tests/dot_f04_reading_sync_20261031/run.py build-iphonesimulator
          python3 tests/dot_f04_reading_sync_20261031/run.py package-build --platform iphonesimulator
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build/f04-build-iphonesimulator")
          allowed = {"sdk/examples/android/.gitignore"}
          assert root.is_dir() and not root.is_symlink(), "ordinary upload root required"
          assert not any(p.is_symlink() for p in root.rglob("*")), "symlinks forbidden in upload root"
          hidden = {p.relative_to(root).as_posix() for p in root.rglob("*")
                    if any(part.startswith(".") for part in p.relative_to(root).parts)}
          assert hidden == allowed, ("unexpected or missing hidden upload paths", sorted(hidden))
          for name in allowed:
              path = root / name
              assert path.is_file() and not path.is_symlink(), "hidden upload must be an ordinary file"
          print("F04 public hidden upload paths:", sorted(hidden))
          PY
      - uses: actions/upload-artifact@v4
        id: build
        with:
          name: f04-build-iphonesimulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-build-iphonesimulator/
          include-hidden-files: true
          if-no-files-found: error

  macos_peer:
    name: F04 macos peer
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/six-host' && inputs.controller_sha == github.sha }}
    runs-on: macos-15
    timeout-minutes: 15
    needs: [android_peer, build_macos]
    outputs:
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated Python environment and toolchain identity
        run: |
          python3 -m venv "$RUNNER_TEMP/f04-python"
          echo "$RUNNER_TEMP/f04-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/f04-python/bin/python" -c "import sys; assert sys.version_info[:2] == (3,12) and sys.prefix != sys.base_prefix; print(sys.executable, sys.version)"
          "$RUNNER_TEMP/f04-python/bin/python" -m pip --version
          command -v ruby
          ruby --version
          command -v cmake
          cmake --version
          xcode-select -p
          xcodebuild -version
      - name: Python and original fixture
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android_peer.outputs.phase }}
          path: build/incoming
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build_macos.outputs.build }}
          path: sdk-input/team24-apple-sdk-macos-f04
          merge-multiple: true
      - name: Original Apple project dependency
        run: ruby -e "require 'xcodeproj'" || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Real macos application receives Android records and republishes
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py macos-peer --phase macos-peer --previous build/incoming/state.json --original build/apple-android/original/epub-alice.epub --incoming-prefix F04_ANDROID
          python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/apple-android/macos-peer --build-receipt sdk-input/team24-apple-sdk-macos-f04/build-receipt.json --installed-identity sdk-input/team24-apple-sdk-macos-f04/sdk342-installed-identity.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-macos-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-android/macos-peer/state.json
            build/apple-android/macos-peer/result.json
            build/apple-android/macos-peer/report.json
            build/apple-android/macos-peer/requests.json
            build/apple-android/macos-peer/cert.pem
            build/apple-android/macos-peer/program.bin
            build/apple-android/macos-peer/build-receipt.json
            build/apple-android/macos-peer/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Safe diagnostic text
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/macos/
          if-no-files-found: warn

  iphone_peer:
    name: F04 iphone peer
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/six-host' && inputs.controller_sha == github.sha }}
    runs-on: macos-15
    timeout-minutes: 20
    needs: [android_peer, build_iphonesimulator]
    outputs:
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated Python environment and toolchain identity
        run: |
          python3 -m venv "$RUNNER_TEMP/f04-python"
          echo "$RUNNER_TEMP/f04-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/f04-python/bin/python" -c "import sys; assert sys.version_info[:2] == (3,12) and sys.prefix != sys.base_prefix; print(sys.executable, sys.version)"
          "$RUNNER_TEMP/f04-python/bin/python" -m pip --version
          command -v ruby
          ruby --version
          command -v cmake
          cmake --version
          xcode-select -p
          xcodebuild -version
      - name: Python and original fixture
        run: |
          python3 -m pip install PyYAML==6.0.2 pillow
          python3 tests/dot_f04_reading_sync_20261031/fixtures.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android_peer.outputs.phase }}
          path: build/incoming
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build_iphonesimulator.outputs.build }}
          path: sdk-input/team24-apple-sdk-iphonesimulator-f04
          merge-multiple: true
      - name: Original Apple project dependency
        run: ruby -e "require 'xcodeproj'" || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Real iphone application receives Android records and republishes
        run: |
          python3 tests/dot_f04_reading_sync_20261031/run.py iphone-peer --phase iphone-peer --previous build/incoming/state.json --original build/apple-android/original/epub-alice.epub --incoming-prefix F04_ANDROID
          python3 tests/dot_f04_reading_sync_20261031/run.py seal-phase --phase-dir build/apple-android/iphone-peer --build-receipt sdk-input/team24-apple-sdk-iphonesimulator-f04/build-receipt.json --installed-identity sdk-input/team24-apple-sdk-iphonesimulator-f04/sdk342-installed-identity.json
      - uses: actions/upload-artifact@v4
        id: phase
        with:
          name: f04-iphone-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-android/iphone-peer/state.json
            build/apple-android/iphone-peer/result.json
            build/apple-android/iphone-peer/report.json
            build/apple-android/iphone-peer/requests.json
            build/apple-android/iphone-peer/cert.pem
            build/apple-android/iphone-peer/program.bin
            build/apple-android/iphone-peer/build-receipt.json
            build/apple-android/iphone-peer/installed-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Safe diagnostic text
        if: always()
        run: python3 tests/dot_f04_reading_sync_20261031/run.py diagnostics --kind iphone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f04-diagnostic-iphone-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f04-diagnostics/iphone/
          if-no-files-found: warn

  ipad_peer:
    name: F04 ipad peer
    if: ${{ github.ref == 'refs/heads/dot/reader-suite-20261101' && inputs.case == 'f04/six-host' && inputs.controller_sha == github.sha }}
    runs-on: macos-15
    timeout-minutes: 20
    needs: [android_peer, build_iphonesimulator]
    outputs:
      phase: ${{ steps.phase.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated Python environment and toolchain identity
        run: |
          python3 -m venv "$RUNNER_TEMP/f04-python"
          echo "$RUNNER_TEMP/f04-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/f04-python/bin/python" -c "import sys; assert sys.version_info[:2] == (3,12) and sys.prefix != sys.base_prefix; print(sys.executable, sys.version)"
          "$RUNNER_TEMP/f04-python/bin/python" -m pip --version
          command -v ruby
          ruby --version
          command -v cmake
          cmake --version
          xcode-select -p
          xcodebuild -version
      - name: Python and original fixture
        run: |
