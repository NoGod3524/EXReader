name: Platform secure credential storage
on:
  push:
    branches: [codex/reader-credentials]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  START_SHA: 210403d121d6484a8fff4ea7ffd911efa3163535
  FROZEN_SDK: 9854061be331fe603a1822d9b2b36ee357154927
jobs:
  desktop:
    name: credentials (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            key: windows
            generator: Ninja
          - os: ubuntu-22.04
            key: linux
            generator: Ninja
          - os: macos-15
            key: macos
            generator: Unix Makefiles
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen SDK and package-only changes
        run: bash tests/reader_credentials/check_scope.sh
      - name: Install Linux Secret Service, D-Bus and libsecret development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring dbus libglib2.0-bin pkg-config ninja-build
      - name: Enter Windows native compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and install the independent optional module
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "CRED_WS=$ws" >> "$GITHUB_ENV"
          mkdir -p build/credentials/logs
          cmake --version | tee build/credentials/logs/cmake-version.log
          cmake -S extras/credentials -B build/module -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/credentials/stage" 2>&1 | tee build/credentials/logs/configure.log
          cmake --build build/module --config Release --verbose 2>&1 | tee build/credentials/logs/build.log
          cmake --install build/module --config Release 2>&1 | tee build/credentials/logs/install.log
          cp build/module/CMakeCache.txt build/credentials/logs/module-CMakeCache.txt
      - name: Compile an independent consumer from the installed package only
        run: |
          set -o pipefail
          cmake -S tests/reader_credentials/consumer -B build/consumer -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$CRED_WS/build/credentials/stage" 2>&1 | tee build/credentials/logs/consumer-configure.log
          cmake --build build/consumer --config Release --verbose 2>&1 | tee build/credentials/logs/consumer-build.log
          mkdir -p build/credentials/consumer
          cp build/consumer/credentials-consumer* build/credentials/consumer/
          cp build/consumer/CMakeCache.txt build/credentials/logs/consumer-CMakeCache.txt
      - name: Actual native store acceptance with job-generated secrets
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          python3 tests/reader_credentials/check_credentials.py --platform ${{ matrix.key }} --consumer "build/credentials/consumer/credentials-consumer$exe" --module-prefix build/credentials/stage --output build/credentials/evidence --scan build/credentials/logs --scan build/credentials/stage --scan build/credentials/consumer
      - name: Preserve source-bound logs, installed module and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-credentials-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/credentials/
          if-no-files-found: error

  ios:
    name: credentials (ios-simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen SDK and package-only changes
        run: bash tests/reader_credentials/check_scope.sh
      - name: Build and install the module for the iOS simulator
        run: |
          set -o pipefail
          mkdir -p build/credentials/logs
          xcodebuild -version | tee build/credentials/logs/xcode.log
          ios="-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_BUILD_TYPE=Release"
          cmake -S extras/credentials -B build/module -G "Unix Makefiles" $ios -DCMAKE_INSTALL_PREFIX="$PWD/build/credentials/stage" 2>&1 | tee build/credentials/logs/configure.log
          cmake --build build/module --verbose 2>&1 | tee build/credentials/logs/build.log
          cmake --install build/module 2>&1 | tee build/credentials/logs/install.log
          cmake -S tests/reader_credentials/consumer -B build/consumer -G "Unix Makefiles" $ios -DCMAKE_MACOSX_BUNDLE=OFF -DEXReaderCredentials_DIR="$PWD/build/credentials/stage/lib/cmake/EXReaderCredentials" "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-sectcreate,__TEXT,__entitlements,$PWD/tests/reader_credentials/ios/Probe.entitlements" 2>&1 | tee build/credentials/logs/consumer-configure.log
          cmake --build build/consumer --verbose 2>&1 | tee build/credentials/logs/consumer-build.log
          cp build/module/CMakeCache.txt build/credentials/logs/module-CMakeCache.txt
          cp build/consumer/CMakeCache.txt build/credentials/logs/consumer-CMakeCache.txt
      - name: Package an ad-hoc signed simulator probe app
        run: |
          set -o pipefail
          app=build/credentials/consumer/CredentialsProbe.app
          mkdir -p "$app"
          cp build/consumer/credentials-consumer "$app/CredentialsProbe"
          cp tests/reader_credentials/ios/Info.plist "$app/Info.plist"
          # As Xcode does for the simulator: plain ad-hoc signature, entitlements
          # embedded in the binary's __TEXT,__entitlements section at link time.
          codesign --force --sign - "$app" 2>&1 | tee build/credentials/logs/codesign.log
          codesign -dv "$app" 2>&1 | tee -a build/credentials/logs/codesign.log
          otool -s __TEXT __entitlements "$app/CredentialsProbe" | head -3 | tee -a build/credentials/logs/codesign.log
          lipo -info "$app/CredentialsProbe" | tee build/credentials/logs/lipo.log
          otool -l "$app/CredentialsProbe" | grep -A4 LC_BUILD_VERSION | tee -a build/credentials/logs/lipo.log
      - name: Actual simulator Keychain acceptance with job-generated secrets
        run: python3 tests/reader_credentials/check_credentials.py --platform ios --consumer build/credentials/consumer/CredentialsProbe.app/CredentialsProbe --ios-app build/credentials/consumer/CredentialsProbe.app --module-prefix build/credentials/stage --output build/credentials/evidence --scan build/credentials/logs --scan build/credentials/stage --scan build/credentials/consumer
      - name: Preserve source-bound logs, installed module and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-credentials-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/credentials/
          if-no-files-found: error

  android:
    name: credentials (android-emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen SDK and package-only changes
        run: bash tests/reader_credentials/check_scope.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android compiler and emulator
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-34;default;x86_64"
      - name: Build the NDK module, the Java library and the probe from the installed module
        run: |
          set -o pipefail
          mkdir -p build/credentials/logs build/credentials/consumer
          cm="$ANDROID_HOME/cmake/3.22.1/bin"
          "$cm/cmake" -S extras/credentials -B build/module -G Ninja -DCMAKE_MAKE_PROGRAM="$cm/ninja" -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/credentials/stage" 2>&1 | tee build/credentials/logs/configure.log
          "$cm/cmake" --build build/module --verbose 2>&1 | tee build/credentials/logs/build.log
          "$cm/cmake" --install build/module 2>&1 | tee build/credentials/logs/install.log
          cp build/module/CMakeCache.txt build/credentials/logs/module-CMakeCache.txt
          gradle -p extras/credentials/android --no-daemon --stacktrace :credentials:assembleRelease 2>&1 | tee build/credentials/logs/aar.log
          cp extras/credentials/android/credentials/build/outputs/aar/credentials-release.aar build/credentials/stage/exreader-credentials-0.1.0.aar
          gradle -p tests/reader_credentials/android --no-daemon --stacktrace :probe:assembleDebug -PexrCredentials="$PWD/build/credentials/stage" 2>&1 | tee build/credentials/logs/probe.log
          cp tests/reader_credentials/android/probe/build/outputs/apk/debug/probe-debug.apk build/credentials/consumer/
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Actual Keystore store acceptance on the API34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tests/reader_credentials/check_credentials.py --platform android --consumer build/credentials/consumer/probe-debug.apk --module-prefix build/credentials/stage --output build/credentials/evidence --scan build/credentials/logs --scan build/credentials/stage --scan build/credentials/consumer
      - name: Preserve source-bound logs, installed module and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-credentials-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/credentials/
          if-no-files-found: error

  report:
    name: same-source report
    needs: [desktop, ios, android]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/reports
          pattern: reader-credentials-*-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Bind reports to this run's jobs and artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_credentials/aggregate.py --reports build/reports --output build/aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: reader-credentials-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/aggregate/
          if-no-files-found: error
