name: GTK sync account combined evidence
on:
  push:
    branches: [codex/terra-wave-linux-sync]
    paths: ['examples/linux/**', 'tests/reader_gtk_sync_account/check_combined.py', 'tests/reader_gtk_sync_account/inspect_widget.py', 'tests/reader_gtk_sync_account/run.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  EXR_SDK_VERSION: '3.41.0'
jobs:
  combined:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Native GTK accessibility and Secret Service dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev gnome-keyring \
            libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config at-spi2-core libatk-adaptor \
            python3-gi gir1.2-atspi-2.0 xvfb openbox xdotool xclip x11-utils wmctrl imagemagick \
            python3-pil xdg-desktop-portal xdg-desktop-portal-gtk gsettings-desktop-schemas dbus-x11 ninja-build
      - name: Install the exact SDK candidate into one stage
        run: |
          set -o pipefail
          mkdir -p build/c10-logs
          echo "C10_SDK=$PWD/build/reading-library/stage" >> "$GITHUB_ENV"
          echo "C10_PREFIX=$PWD/build/c10-prefix" >> "$GITHUB_ENV"
          cmake --preset reading-library 2>&1 | tee build/c10-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/c10-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/c10-logs/sdk-install.log
      - name: Install every product owner and the five reviewed modules into one prefix
        run: |
          set -o pipefail
          prefix="$C10_PREFIX"
          sdk="$C10_SDK"
          logs=build/c10-logs
          build_module() {
            name="$1"; source="$2"; shift 2
            cmake -S "$source" -B "build/c10-$name" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DEXR_SDK_VERSION="$EXR_SDK_VERSION" -DCMAKE_PREFIX_PATH="$prefix;$sdk" \
              -DCMAKE_INSTALL_PREFIX="$prefix" "$@" 2>&1 | tee "$logs/$name-configure.log"
            cmake --build "build/c10-$name" --parallel 4 2>&1 | tee "$logs/$name-build.log"
            cmake --install "build/c10-$name" 2>&1 | tee "$logs/$name-install.log"
          }
          cmake -S extras/desktop-drop -B build/c10-drop -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/c10-drop-stage" 2>&1 | tee build/c10-logs/drop-configure.log
          cmake --build build/c10-drop --parallel 4 2>&1 | tee build/c10-logs/drop-build.log
          cmake --install build/c10-drop 2>&1 | tee build/c10-logs/drop-install.log
          build_module product apps/reader/store/native
          build_module revisions apps/reader/revisions -DREADER_PRODUCT_PREFIX="$prefix"
          build_module webdav extras/webdav
          build_module credentials extras/credentials
          build_module sideload extras/sideload -DEXR_SDK="$sdk"
          build_module sync apps/reader/sync
          build_module session apps/reader/session
          build_module commands apps/reader/commands
          build_module metadata apps/reader/desktop-metadata
          build_module reading-state apps/reader/reading-state -DEXR_SDK="$sdk"
          build_module search apps/reader/search -DEXR_SDK="$sdk"
          build_module navigation apps/reader/navigation -DEXR_SDK="$sdk"
          build_module reading-commands apps/reader/reading-commands
          build_module annotation-view apps/reader/annotation-view
          build_module annotation-export apps/reader/annotation-export
          build_module batch-import apps/reader/batch-import -DEXR_SDK="$sdk"
          build_module preferences apps/reader/preferences
          build_module font-library apps/reader/font-library -DREADER_FONT_LIBRARY_BUILD=ON -DEXR_SDK="$sdk"
          build_module original-export apps/reader/original-export -DEXR_SDK="$sdk"
          build_module jump-history apps/reader/jump-history -DEXR_SDK="$sdk"
          build_module sync-status-view apps/reader/sync-status-view -DEXR_SDK="$sdk"
          build_module annotation-import apps/reader/annotation-import -DREADER_ANNOTATION_IMPORT_BUILD=ON
      - name: Build the non-compact host with the five tools and every reviewed owner
        run: |
          set -o pipefail
          prefix="$C10_PREFIX"; sdk="$C10_SDK"
          cmake -S apps/reader/desktop -B build/c10-desktop -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEXR_SDK_VERSION="$EXR_SDK_VERSION" -DEXR_SDK="$sdk" \
            -DCMAKE_C_FLAGS=-DEXR_GTK_SYNC_CAPTURE_TEST_GATE=1 \
            -DCMAKE_PREFIX_PATH="$prefix;$sdk" -DEXR_READER_FIXTURES="$PWD/tests/fixtures" \
            -DREADER_METADATA_PREFIX="$prefix" -DREADER_ACCOUNT_PREFIX="$prefix" \
            -DREADER_BATCH_IMPORT_PREFIX="$prefix" -DREADER_PREFERENCES_PREFIX="$prefix" \
            -DREADER_SEARCH_PREFIX="$prefix" -DREADER_NAVIGATION_PREFIX="$prefix" \
            -DREADER_READING_RECORDS_PREFIX="$prefix" \
            -DREADER_DESKTOP_DROP_PREFIX="$PWD/build/c10-drop-stage" \
            -DREADER_WAVE3_PREFIX="$prefix" \
            -DEXR_READER_GTK_ACCOUNT=ON -DEXR_READER_GTK_PREFERENCES=ON -DEXR_READER_GTK_SEARCH=ON \
            -DEXR_READER_GTK_NAVIGATION=ON -DEXR_READER_GTK_READING_RECORDS=ON \
            -DEXR_READER_GTK_BATCH_IMPORT=ON -DEXR_READER_GTK_DROP_IMPORT=ON \
            -DEXR_READER_GTK_WAVE3=ON -DEXR_READER_PAGE_BACKGROUND=ON \
            -DEXR_READER_BUILD_GTK=ON -DEXR_LINUX_REVIEW_TESTS=ON -DEXR_LINUX_FIXED_TESTS=ON \
            2>&1 | tee build/c10-logs/host-configure.log
          cmake --build build/c10-desktop --parallel 4 2>&1 | tee build/c10-logs/host-build.log
          ctest --test-dir build/c10-desktop --output-on-failure --no-tests=error --timeout 180 \
            --output-junit "$PWD/build/c10-logs/desktop-tests.xml" 2>&1 | tee build/c10-logs/host-ctest.log
          python3 tools/build_linux_host.py --sdk "$sdk" --sdk-version "$EXR_SDK_VERSION" \
            --binary build/c10-desktop/gtk-host/exreader-linux --output build/c10-package 2>&1 | tee build/c10-logs/package.log
      - name: Build account test consumers and check dedicated driver syntax
        run: |
          set -o pipefail
          for module in metadata revisions; do
            cmake -S "tests/reader_$module/consumer" -B "build/combined-$module" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$C10_PREFIX;$C10_SDK"
            cmake --build "build/combined-$module" --parallel 4
          done
          python3 -m py_compile tests/reader_gtk_sync_account/*.py
      - name: Actual GTK credentials and status during cancellation failure and retry
        run: |
          xvfb-run -a -s '-screen 0 1440x3600x24' dbus-run-session -- bash -euc '
            openbox >build/c10-logs/account-openbox.log 2>&1 &
            wm=$!
            trap "kill $wm || true" EXIT
            /usr/bin/python3 tests/reader_gtk_sync_account/run.py --payload build/c10-package/EXReader-Linux --metadata-consumer build/combined-metadata/metadata-consumer --revision-consumer build/combined-revisions/revision-consumer --output build/combined-account
          '
      - name: Preserve logs and evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-sync-account-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/c10-logs/
            build/combined-account/
            build/c10-package/build.json
            build/c10-package/EXReader-Linux/bin/exreader-linux
            !build/**/*.key
          if-no-files-found: warn

  authenticate:
    name: Independently authenticate this run's focused evidence
    needs: combined
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify original artifact and exact host identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/auth-artifact
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"gtk-sync-account-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\") | .id")
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > build/original.zip
          unzip -q build/original.zip -d build/auth-artifact
          python3 tests/reader_gtk_sync_account/authenticate.py --artifact build/auth-artifact --archive build/original.zip --output build/auth/identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtk-sync-account-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/auth/identity.json
          if-no-files-found: warn
