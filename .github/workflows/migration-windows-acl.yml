name: Migration Windows ACL path probe
on:
  push:
    branches: [codex/migration-compat-20261028]
    paths:
      - tests/migration/windows_acl_path_checks.py
      - .github/workflows/migration-windows-acl.yml
permissions:
  contents: read
jobs:
  windows-acl:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build installed SDK and path probe
        run: |
          cmake -S . -B build/sdk -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_JNI=OFF -DEXR_BUILD_SHARED_COMPAT=OFF -DEXR_ENABLE_AAC=OFF -DEXR_ENABLE_AUDIO=OFF -DEXR_BUILD_TEXT_INDEX=OFF -DEXR_ENABLE_PDF_EDIT=OFF -DEXR_ENABLE_IMAGE_WEBP=OFF -DEXR_ENABLE_IMAGE_TIFF=OFF -DEXR_ENABLE_IMAGE_AVIF=OFF
          cmake --build build/sdk --config Release --parallel 4
          cmake --install build/sdk --config Release --prefix "$GITHUB_WORKSPACE/stage"
          cmake -S extras/migration -B build/migration -DEXR_SDK="$GITHUB_WORKSPACE/stage" -DEXR_MIGRATION_REVIEW_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/migration --config Release --target migration-path-state --parallel 4
      - name: Exercise and restore temporary ACL
        run: |
          mkdir -p build/evidence
          set -o pipefail
          python tests/migration/windows_acl_path_checks.py --probe build/migration/Release/migration-path-state.exe --work build/acl-test 2>&1 | tee build/evidence/windows-acl.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-windows-acl
          path: build/evidence/
          if-no-files-found: warn
