name: Read-only original raw3 iOS OFF failure inspection
on:
  push:
    branches: [codex/reader-apple-raw3-ios-inspect72]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate original failed producer ZIP and read original assertions and AX
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_raw3_ios_inspect/inspect.py
      - name: System Vision reads both original failed case movies and images
        run: |
          set -o pipefail
          for item in testFixedCbzAndPdfRealPointRecords testRealTerminationAfterCommitReplaysExactlyOnce; do
            ORIGINAL_CASE="$item" swift tests/apple_raw3_ios_inspect/read_images.swift build/apple-raw3-ios-inspection/attachments | tee "build/apple-raw3-ios-inspection/$item-image-text.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-raw3-ios-original-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-raw3-ios-inspection/
          include-hidden-files: true
          if-no-files-found: error
  reproduce:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Original Xcode project dependency
        run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Two unchanged original cases with failure-only target AX observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_raw3_ios_inspect/reproduce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-raw3-ios-failure-target-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-raw3-ios-reproduce/attachments/
            build/apple-raw3-ios-reproduce/two-original-cases.xcresult/
            build/apple-raw3-ios-reproduce/xcodebuild.log
            build/apple-raw3-ios-reproduce/report.json
          include-hidden-files: true
          if-no-files-found: error
