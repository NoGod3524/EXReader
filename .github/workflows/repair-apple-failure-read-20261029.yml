name: Current repair Apple retained original-save assertion
on:
  push:
    branches: [codex/dot-apple-diagnostic-20261030]
    paths: ['tools/reader_composition/dot_apple_original_failure_read_20261030.py', '.github/workflows/repair-apple-failure-read-20261029.yml']
permissions: {contents: read, actions: read}
jobs:
  inspect-original:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/reader_composition/dot_apple_original_failure_read_20261030.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dot-apple-original-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/dot-apple-original-failure/*.json
            build/dot-apple-original-failure/native.log
            build/dot-apple-original-failure/attachments/
          if-no-files-found: error
