name: Retained c46 iPhone native theme preflight diagnosis
on:
  push:
    branches: [codex/dot-apple-diagnostic-20261030]
    paths: ['tools/reader_composition/dot_apple_theme_failure_read_20261030.py', '.github/workflows/repair-apple-failure-read-20261029.yml']
permissions: {contents: read, actions: read}
jobs:
  inspect-theme:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/reader_composition/dot_apple_theme_failure_read_20261030.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dot-apple-theme-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/dot-apple-theme-failure/
          if-no-files-found: error
