name: Current repair Apple retained first assertions
on:
  push:
    branches: [codex/handoff-evidence-resume-20261029]
    paths: ['tools/reader_composition/repair_apple_failure_read_20261029.py', '.github/workflows/repair-apple-failure-read-20261029.yml']
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        input: [features550-iphone]
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/reader_composition/repair_apple_failure_read_20261029.py --input '${{ matrix.input }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-apple-failure-read-${{ matrix.input }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/repair-apple-failure/${{ matrix.input }}/summary.json
            build/repair-apple-failure/${{ matrix.input }}/tests.json
            build/repair-apple-failure/${{ matrix.input }}/legacy-issues.json
            build/repair-apple-failure/${{ matrix.input }}/failure-context.json
            build/repair-apple-failure/${{ matrix.input }}/receipt.json
          if-no-files-found: error
