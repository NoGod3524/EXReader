name: R4 preserved Android frame failure diagnosis
on:
  push:
    branches: ['codex/r4-core-hotspots']
    paths: ['.github/workflows/r4-host-failure.yml', 'tests/r4_core/host_failure.py', 'tests/r4_core/apple_failure.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-frame-diff:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install Pillow==11.3.0
      - name: Verify and compare retained original frame evidence without executing the host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/r4_core/host_failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-original-android-frame-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/host-failure/
          if-no-files-found: error
  original-iphone-import:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv build/diagnostic-venv
          build/diagnostic-venv/bin/python -m pip install Pillow==11.3.0
      - name: Read retained original iPhone import failure attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/diagnostic-venv/bin/python tests/r4_core/apple_failure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-original-iphone-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-original-failure/
          if-no-files-found: error
