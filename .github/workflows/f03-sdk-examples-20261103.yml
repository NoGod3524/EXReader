name: F03 SDK examples bounded verification
'on':
  push:
    branches:
    - codex/f03-six-host-20261103
    paths:
    - tests/f03_sdk_examples_20261103/**
    - tests/windows_sdk342/build.py
    - .github/workflows/f03-sdk-examples-20261103.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: f03-sdk-examples-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  EXR_APPLE_SDK_VERSION: 3.42.0
jobs:
  gtk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Admit exact SDK source and current example sources
      run: |
        python -m pip install PyYAML Pillow
        python tests/f03_sdk_examples_20261103/run.py admit
    - name: Native prerequisites
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev gnome-keyring libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil ninja-build
    - name: Build SDK 3.42 installed product and actual GTK host
      run: python tests/f03_sdk_examples_20261103/run.py build gtk
    - name: Author actual organization history and receive it in fresh GTK examples
      run: |
        python tests/f03_sdk_examples_20261103/run.py legacy fixtures --output build/f03-originals
        xvfb-run -a -s '-screen 0 1440x2000x24' dbus-run-session -- bash -euc '
          openbox >build/f03-openbox.log 2>&1 & wm=$!; trap "kill $wm || true" EXIT
          for i in $(seq 1 100); do wmctrl -m >/dev/null 2>&1 && break; sleep .1; done
          wmctrl -m
          python tests/f03_sdk_examples_20261103/run.py legacy gtk --mode retained --package build/package/EXReader-Linux --command-consumer build/command-consumer/command-consumer --output build/f03-retained-gtk
          previous=""
          for phase in create delete restore member-remove member-restore restart; do
            args=(); if test -n "$previous"; then args=(--previous "build/f03-author/$previous/wire/state.json"); fi
            python tests/f03_sdk_examples_20261103/run.py legacy gtk --mode author --phase "$phase" --profile build/f03-author-profile --book build/f03-originals/gtk-organization.txt --package build/package/EXReader-Linux --output "build/f03-author/$phase" "${args[@]}"
            previous="$phase"
          done
          python tests/f03_sdk_examples_20261103/run.py receive gtk
        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-sdk-gtk-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/f03-*/
          build/f03-*.json
          build/f03-*.log
          build/package/EXReader-Linux/
          !build/**/key.pem
          !build/**/private/**
          !build/**/connection.json

          build/f03-receipts/
          build/f03-sdk-receipts/
          build/f03-sdk-gtk.json
        if-no-files-found: error
    if: (github.run_attempt == 1 && (contains(github.event.head_commit.message, '[F03-SDK-R1]') || contains(github.event.head_commit.message,
      '[F03-SDK-R2]')))
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    needs:
    - gtk
    if: always() && (github.run_attempt == 1 && (contains(github.event.head_commit.message, '[F03-SDK-R1]') || contains(github.event.head_commit.message,
      '[F03-SDK-R2]')))
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Admit current SDK and unfrozen example sources
      run: |
        python -m pip install uiautomation==2.0.29 PyYAML Pillow
        python tests/reader_native_owner_repairs/display.py
        python tests/f03_sdk_examples_20261103/run.py admit
    - name: Build with explicit unlocked SDK 3.42 example builder
      run: python tests/f03_sdk_examples_20261103/run.py build windows
    - uses: actions/download-artifact@v4
      with:
        name: f03-sdk-gtk-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/f03-input
    - name: Receive all six organization checkpoints through native Windows UI
      run: python tests/f03_sdk_examples_20261103/run.py receive windows
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-sdk-windows-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/f03-sdk-*.json
          build/f03-sdk-receipts/
          build/windows-sdk342/logs/
          build/windows-sdk342/package/
          !build/**/key.pem
          !build/**/private/**
          !build/**/connection.json
        if-no-files-found: error
  apple-build:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
        - macos
        - iphone
        - ipad
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Compile installed SDK and shipped Apple example only
      run: python3 tests/f03_sdk_examples_20261103/run.py build '${{ matrix.platform }}'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-sdk-build-only-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/f03-sdk-apple/${{ matrix.platform }}/build.json
          build/f03-sdk-${{ matrix.platform }}.json
        if-no-files-found: warn
    if: (github.run_attempt == 1 && (contains(github.event.head_commit.message, '[F03-SDK-R1]') || contains(github.event.head_commit.message,
      '[F03-SDK-R2]')))
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs:
    - gtk
    - windows
    - apple-build
    if: always() && (github.run_attempt == 1 && (contains(github.event.head_commit.message, '[F03-SDK-R1]') || contains(github.event.head_commit.message,
      '[F03-SDK-R2]')))
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify exact SDK sources and actual example receive evidence
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python tests/f03_sdk_examples_20261103/audit.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-sdk-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/f03-sdk-audit/result.json
        if-no-files-found: error
