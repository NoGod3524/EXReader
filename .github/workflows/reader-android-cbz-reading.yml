name: Android CBZ original artifact read-only proof
on:
  push:
    branches: [codex/reader-android-cbz-reading-proof]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify original actual-renderer evidence ZIP read-only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import ast, datetime, hashlib, io, json, pathlib, struct, subprocess, zipfile, zlib
          source='ee59f8f3aed6cf984cece4501bcac82795c115fd'
          run=40143936053; job=121021215678; artifact=12579788900
          expected_size=145725410
          expected_sha='bc687d9a2b0e430db0b50eeee0f722221800b46421dd8ffc80d7824bdc421d6c'
          repo='repos/NoGod3524/EXReader/'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',repo+path]))
          original=api(f'actions/runs/{run}')
          assert original['head_sha']==source and original['run_attempt']==1
          assert original['status']=='completed' and original['conclusion']=='success'
          jobs=api(f'actions/runs/{run}/jobs')['jobs']
          assert len(jobs)==1 and jobs[0]['id']==job and jobs[0]['conclusion']=='success'
          info=api(f'actions/artifacts/{artifact}')
          assert info['workflow_run']['id']==run and not info['expired']
          assert info['size_in_bytes']==expected_size and info['digest']=='sha256:'+expected_sha
          assert datetime.datetime.fromisoformat(info['expires_at'].replace('Z','+00:00'))>datetime.datetime.now(datetime.timezone.utc)
          raw=subprocess.check_output(['gh','api',repo+f'actions/artifacts/{artifact}/zip'])
          assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
          subprocess.check_call(['git','diff','--exit-code',source,'HEAD','--','apps/reader','examples/android','tests/reader_android_cbz_reading','tests/reader_android_reading','tests/reader_android_preferences'])
          expected=next(ast.literal_eval(node.value) for node in ast.parse(pathlib.Path('tests/reader_android_cbz_reading/run_ui.py').read_text()).body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='expected' for target in node.targets))
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              def member(suffix):
                  names=[name for name in archive.namelist() if name.endswith(suffix)]
                  assert len(names)==1,(suffix,names)
                  return archive.read(names[0])
              def document(suffix):
                  data=member(suffix); assert len(data)<4194304
                  return json.loads(data)
              result=document('android-cbz-reading/ui/result.json')
              assert result['source_sha']==source and result['run_id']==str(run) and result['attempt']=='1'
              assert result['accepted'] is True and result['checks']==10
              assert result['cbz_reading_ui_accepted'] is True and result['physical_device'] is False
              assert result['complete_product'] is False and result['performance_accepted'] is False
              assert [row['phase'] for row in result['phases']]==['first','retry','reopen']
              assert [row['count'] for row in result['phases']]==[8,1,1]
              assert len({row['pid'] for row in result['phases']})==3
              manifest=document('android-cbz-reading/fixtures/manifest.json')
              plan=manifest['cbz_expected']
              assert plan['page_ids']==['001.png','002.png','003.png'] and plan['rgb']==[[40,80,215],[110,80,145],[180,80,75]]
              assert plan['text_bytes']==plan['text_regions']==0 and plan['plan_precedes_sdk_read'] is True
              cbz=next(book for book in manifest['books'] if book['role']=='cbz')
              key='cbz:'+cbz['sha256']
              cbz_bytes=member('android-cbz-reading/fixtures/'+cbz['file'])
              assert len(cbz_bytes)==cbz['bytes'] and hashlib.sha256(cbz_bytes).hexdigest()==cbz['sha256']
              fixture_images=[]
              with zipfile.ZipFile(io.BytesIO(cbz_bytes)) as comic:
                  assert comic.namelist()==plan['page_ids']
                  for index,name in enumerate(plan['page_ids']):
                      png=comic.read(name); assert png.startswith(b'\x89PNG\r\n\x1a\n')
                      at=8; pixels=b''; header=None
                      while at<len(png):
                          size=struct.unpack('>I',png[at:at+4])[0]; kind=png[at+4:at+8]; data=png[at+8:at+8+size]
                          assert len(data)==size and struct.unpack('>I',png[at+8+size:at+12+size])[0]==(zlib.crc32(kind+data)&0xffffffff)
                          if kind==b'IHDR': header=struct.unpack('>IIBBBBB',data)
                          if kind==b'IDAT': pixels+=data
                          at+=size+12
                      assert at==len(png) and header==(60,80,8,2,0,0,0)
                      assert zlib.decompress(pixels)==(b'\x00'+bytes(plan['rgb'][index])*60)*80
                      fixture_images.append({'page_id':name,'rgb':plan['rgb'][index],'bytes':len(png),'sha256':hashlib.sha256(png).hexdigest()})
              observations=[]
              for row in result['phases']:
                  phase=row['phase']
                  assert row['passed'] and all(check['pass'] for check in row['checks'])
                  assert [check['name'] for check in row['checks']]==expected[phase]
                  assert row==document(f'android-cbz-reading/ui/{phase}-report.json')
                  instrument=member(f'android-cbz-reading/ui/{phase}-instrumentation.txt').decode()
                  assert f'CBZ_READING_UI_PASS {phase}' in instrument and 'INSTRUMENTATION_CODE: -1' in instrument
                  assert 'org.exreader.host.CbzReadingUiTest' in instrument
                  for check in expected[phase]:
                      assert check in instrument
                  pages=row['actual_pages']; assert pages
                  for page in pages:
                      index=page['index']; assert 0<=index<3
                      red,green,blue=plan['rgb'][index]
                      expected_argb=0xff000000|(red<<16)|(green<<8)|blue
                      assert page['page_id']==plan['page_ids'][index] and page['argb']==page['expected_argb']==expected_argb
                      assert page['source_key']==key and page['renderer']!=0 and page['text_bytes']==0
                  observations.extend(row['observations'])
              first=result['phases'][0]['actual_pages'][:3]
              assert [page['index'] for page in first]==[0,1,2]
              assert len({page['renderer'] for page in first})==1
              for row in result['captures']:
                  data=member('android-cbz-reading/ui/captures/'+row['phase']+'-'+row['name']+'.png')
                  assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              assert len(result['captures'])==len(observations) and len(result['sources'])==21
              for row in result['sources']:
                  data=member('android-cbz-reading/fixtures/'+row['file'])
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              request_raw=member('android-cbz-reading/ui/killed-pending-request.json')
              request=json.loads(request_raw)
              kill=result['real_postcommit_kill']
              assert kill['actual_postcommit_gate'] is True and kill['pid_before_stop'] and not kill['pid_after_stop']
              assert kill['request_bytes']==len(request_raw) and kill['request_sha256']==hashlib.sha256(request_raw).hexdigest()
              assert request['body']=='CBZ lost response exact request' and request['annotation']==kill['annotation_id'] and request['revision']==kill['revision_id']
              assert request['book']==key
              for stop in result['process_stops']:
                  assert stop['requested'] and not stop['pid_after_stop']
              native=document('android-cbz-reading/native/result.json')
              assert native['accepted'] is True and native['same_actual_renderer_doc_for_paint_and_public_resolve'] is True
              assert native['single_original_shared_sdk'] is True and native['no_new_product_sqlite_or_sdk'] is True
              assert native['source_sha']==source and native['run_id']==str(run) and len(native['checks'])==2
              inherited={}
              for suffix,count in [('host-session-android/ui/result.json',16),('android-search/ui/result.json',15),('android-navigation/ui/result.json',18),('android-reading/ui/result.json',16),('android-preferences/ui/result.json',17)]:
                  value=document(suffix)
                  assert value['accepted'] and value['checks']==count and value['source_sha']==source and value['run_id']==str(run)
                  inherited[suffix]={'accepted':True,'checks':count}
              sdk_export=document('session-android/export/device-report.json')
              assert sdk_export['source_sha']==source and sdk_export['run_id']==str(run) and sdk_export['ok'] is True
              sdk_roundtrip=document('session-android/roundtrip/result.json')
              assert sdk_roundtrip['source_sha']==source and sdk_roundtrip['run_id']==str(run) and sdk_roundtrip['accepted'] is True
              assert len(sdk_roundtrip['checks'])==12 and all(row['passed'] for row in sdk_roundtrip['checks'])
              platform=document('webdav-android/platform/result.json')
              assert platform['source_sha']==source and platform['run_id']==str(run) and platform['platform_probe_recorded'] is True
              assert platform['backend_accepted'] is False
              backend=document('webdav-android/backend/result.json')
              assert backend['source_sha']==source and backend['run_id']==str(run) and backend['accepted'] is True
              assert backend['backend_cases']>0 and backend['restart_cases']==4 and backend['process_killed_after_server_commit'] is True
              inherited['sdk_export']={'ok':True}
              inherited['sdk_roundtrip']={'accepted':True,'checks':12}
              inherited['webdav_platform']={'recorded':True,'backend_accepted':False}
              inherited['webdav_backend']={key:backend[key] for key in ('accepted','backend_cases','restart_cases','process_killed_after_server_commit')}
              prefs=document('android-preferences/ui/result.json')
              assert prefs['page_colors_accepted'] is False
              print(json.dumps({'diagnostic_only':True,'accepted':False,'original_source':source,'original_run':run,'original_attempt':1,
                    'original_job':job,'artifact':{'id':artifact,'bytes':len(raw),'sha256':expected_sha,'expires_at':info['expires_at']},
                    'original_cbz':{key:value for key,value in result.items() if key!='phases'},
                    'phases':[{key:row[key] for key in ('phase','pid','passed','count','checks','actual_pages')} for row in result['phases']],
                    'original_native':native,'fixture_images':fixture_images,'inherited':inherited,'preferences_colors_accepted':False},ensure_ascii=False),flush=True)
