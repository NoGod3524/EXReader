name: Android preferences original artifact read-only proof
on:
  push:
    branches: [codex/reader-android-preferences-proof]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read original accepted ZIP without changing or rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import ast, datetime, hashlib, io, json, pathlib, re, subprocess, zipfile
          source='657ea2ccf37087b608155169a2fcecdf28fe8f33'
          run=40138266576; job=121004337573; artifact=12577914277
          expected_size=141737458
          expected_sha='2bd1a2ac79ef6474bcf8cd272057184b435ac29e97dc4d04ed4261b6fc50c71c'
          repo='repos/NoGod3524/EXReader/'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',repo+path]))
          original=api(f'actions/runs/{run}')
          assert original['head_sha']==source and original['run_attempt']==1
          assert original['status']=='completed' and original['conclusion']=='success'
          jobs=api(f'actions/runs/{run}/jobs')['jobs']
          assert len(jobs)==1 and jobs[0]['id']==job and jobs[0]['conclusion']=='success'
          info=api(f'actions/artifacts/{artifact}')
          assert info['workflow_run']['id']==run and not info['expired']
          assert info['size_in_bytes']==expected_size and info['digest']=='sha256:'+expected_sha
          assert datetime.datetime.fromisoformat(info['expires_at'].replace('Z','+00:00'))>datetime.datetime.now(datetime.timezone.utc)
          raw=subprocess.check_output(['gh','api',repo+f'actions/artifacts/{artifact}/zip'])
          assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
          subprocess.check_call(['git','diff','--exit-code',source,'HEAD','--','apps/reader','examples/android','tests/reader_android_preferences'])
          expected=next(ast.literal_eval(node.value) for node in ast.parse(pathlib.Path('tests/reader_android_preferences/run_ui.py').read_text()).body if isinstance(node,ast.Assign) and any(isinstance(target,ast.Name) and target.id=='expected' for target in node.targets))
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              def member(suffix):
                  names=[name for name in archive.namelist() if name.endswith(suffix)]
                  assert len(names)==1,(suffix,names)
                  return archive.read(names[0])
              def document(suffix):
                  data=member(suffix); assert len(data)<2097152
                  return json.loads(data)
              result=document('android-preferences/ui/result.json')
              assert result['source_sha']==source and result['run_id']==str(run) and result['attempt']=='1'
              assert result['accepted'] is True and result['checks']==17 and result['page_colors_accepted'] is False
              assert [row['phase'] for row in result['phases']]==['first','reopen','night']
              assert [row['count'] for row in result['phases']]==[15,1,1]
              assert len({row['pid'] for row in result['phases']})==3
              assert len(result['captures'])==10 and len(result['sources'])==21
              files=[]
              for row in result['phases']:
                  phase=row['phase']
                  assert row['passed'] and all(check['pass'] for check in row['checks'])
                  assert [check['name'] for check in row['checks']]==expected[phase]
                  assert row==document(f'android-preferences/ui/{phase}-report.json')
                  prefs=member(f'android-preferences/ui/{phase}-preferences.json')
                  value=json.loads(prefs)
                  assert value['font_size']==36 and value['line_spacing']==2 and value['paragraph_spacing']==20 and value['margin']==44
                  assert value['theme']=='system' and value['page_turn_input']=='tap' and value['page_turn_direction']=='ltr' and value['fixed_page_zoom']==150
                  files.append({'phase':phase,'bytes':len(prefs),'sha256':hashlib.sha256(prefs).hexdigest()})
                  instrument=member(f'android-preferences/ui/{phase}-instrumentation.txt').decode()
                  assert f'PREFERENCES_UI_PASS {phase}' in instrument and 'INSTRUMENTATION_CODE: -1' in instrument
                  if phase in ('first','night'):
                      gap=row['retained_color_failure']
                      assert gap['accepted'] is False and gap['actual_corner_rgba']=='ffffffff' and gap['requested_background_rgba']=='101010ff' and gap['user_css_attempted'] and gap['public_api_gap']
              assert len({row['sha256'] for row in files})==1
              for row in result['captures']:
                  data=member('android-preferences/ui/captures/'+row['phase']+'-'+row['name']+'.png')
                  assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              for row in result['sources']:
                  data=member('android-reading/fixtures/'+row['file'])
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
              native=document('android-preferences/native/result.json')
              assert native['accepted'] and native['source_sha']==source and native['run_id']==str(run)
              installed=member('android-preferences/preferences-stage/lib/libreader_preferences.a')
              assert len(installed)==native['archive_bytes'] and hashlib.sha256(installed).hexdigest()==native['archive_sha256']
              header=member('android-preferences/preferences-stage/include/reader_preferences.h')
              assert header==pathlib.Path('apps/reader/preferences/include/reader_preferences.h').read_bytes()
              inherited={}
              for suffix,count in [('host-session-android/ui/result.json',16),('android-search/ui/result.json',15),('android-navigation/ui/result.json',18),('android-reading/ui/result.json',16)]:
                  value=document(suffix)
                  assert value['accepted'] and value['checks']==count and value['source_sha']==source and value['run_id']==str(run)
                  inherited[suffix]={'accepted':True,'checks':count}
              compact={key:value for key,value in result.items() if key!='phases'}
              compact['phases']=[{key:row[key] for key in ('phase','pid','passed','count','checks','page_colors_accepted')} for row in result['phases']]
              compact['retained_color_failure']=result['phases'][0]['retained_color_failure']
              keylog=member('android-preferences/ui/first-logcat.txt').decode(errors='replace')
              keylines=[line for line in keylog.splitlines() if 'preferences key code=20' in line]
              assert any('action=0' in line and 'input=4' in line for line in keylines)
              print(json.dumps({'diagnostic_only':True,'accepted':False,'original_source':source,'original_run':run,'original_attempt':1,
                    'original_job':job,'artifact':{'id':artifact,'bytes':len(raw),'sha256':expected_sha,'expires_at':info['expires_at']},
                    'original_preferences':compact,'saved_files':files,'actual_hardware_key_log':keylines,
                    'original_native':native,'inherited':inherited},ensure_ascii=False),flush=True)
