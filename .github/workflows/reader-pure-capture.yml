name: Explicit pure capture capability focused acceptance
on:
  push:
    branches: [codex/team24-core-pure-capture]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PURE_CAPTURE_SOURCE: a911cd0e8405a362dae1bb489190de02c4c81d51
defaults:
  run:
    shell: bash
jobs:
  consumers:
    name: Pure capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install the existing build tool
        run: python -m pip install ninja==1.11.1.1
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c ('"{0}" >nul && set' -f $bat) | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exact independent source and installed capability consumers
        run: |
          python tests/reader_pure_capture/source.py
          python tests/reader_pure_capture/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-pure-capture-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-pure-capture/
          if-no-files-found: error
          retention-days: 90
  strict:
    needs: consumers
    if: always()
    name: same-source original ZIP and program binding
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Bind all three actual producer reports and programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from check_parallel_integration import fetch, pages, download_artifact_zip
          source, run, attempt = [os.environ[key] for key in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')]
          metadata = fetch('actions/runs/' + run + '/attempts/' + attempt)
          assert metadata['head_sha'] == source and str(metadata['run_attempt']) == attempt
          assert metadata['path'].split('@')[0] == '.github/workflows/reader-pure-capture.yml'
          jobs = pages('actions/runs/' + run + '/attempts/' + attempt + '/jobs', 'jobs')
          artifacts = pages('actions/runs/' + run + '/artifacts', 'artifacts')
          output = Path('build/reader-pure-capture-strict')
          output.mkdir(parents=True, exist_ok=True)
          results, problems = {}, []
          for platform, runner in [('Linux', 'ubuntu-22.04'), ('Windows', 'windows-2022'), ('macOS', 'macos-15')]:
              try:
                  job, = [item for item in jobs if item['name'] == 'Pure capture (' + runner + ')']
                  assert job['head_sha'] == source and str(job['run_attempt']) == attempt
                  name = 'reader-pure-capture-' + platform + '-' + run + '-' + attempt
                  item, = [item for item in artifacts if item['name'] == name]
                  assert item['workflow_run']['head_sha'] == source and str(item['workflow_run']['id']) == run and item['expired'] is False
                  raw = download_artifact_zip(item['id'])
                  assert len(raw) == item['size_in_bytes'] and 'sha256:' + hashlib.sha256(raw).hexdigest() == item['digest']
                  (output / (name + '.zip')).write_bytes(raw)
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      names = archive.namelist()
                      assert len(names) == len(set(names))
                      assert all(not name.startswith('/') and '..' not in name.split('/') and '\\' not in name for name in names)
                      report = json.loads(archive.read('report.json'))
                      assert (report['source_sha'], str(report['run_id']), str(report['attempt']), report['platform']) == (source, run, attempt, platform)
                      assert report['capability_source'] == os.environ['PURE_CAPTURE_SOURCE']
                      assert report['accepted'] is True and job['status'] == 'completed' and job['conclusion'] == 'success'
                      assert set(report['programs']) == {mode + '-' + language for mode in ('default','off','on') for language in ('c','cpp')}
                      assert {control['mode'] for control in report['negative_controls']} == {'zero','undefined','raw-zero','raw-undefined'}
                      assert len(report['negative_controls']) == 4 and all(control['refused'] is True for control in report['negative_controls'])
                      assert {(consumer['mode'],consumer['language']) for consumer in report['consumers']} == {
                          (mode,language) for mode in ('default','off','on') for language in ('c','cpp')}
                      for member, identity in report['files'].items():
                          content = archive.read(member)
                          assert len(content) == identity['bytes'] and hashlib.sha256(content).hexdigest() == identity['sha256'], member
                      for consumer in report['consumers']:
                          actual = json.loads(archive.read(consumer['report']['member']))
                          assert actual['accepted'] is True and actual['language'] == consumer['language']
                          assert [check['name'] for check in actual['checks']] == consumer['checks']
                          assert all(check['pass'] is True for check in actual['checks'])
                      for role, program in report['programs'].items():
                          binary = archive.read(program['member'])
                          assert len(binary) == program['bytes'] and hashlib.sha256(binary).hexdigest() == program['sha256'], role
                      results[platform] = {'artifact': {key: item[key] for key in ('id','name','digest','size_in_bytes','expires_at')},
                                           'report': report, 'producer_job': job['id']}
              except Exception as error:
                  problems.append(platform + ': ' + repr(error))
          evidence = {'source_sha': source, 'run_id': run, 'attempt': attempt, 'capability_source': os.environ['PURE_CAPTURE_SOURCE'],
                      'accepted': not problems and len(results) == 3, 'problems': problems, 'platforms': results,
                      'scope': 'independent pure capture capability only', 'product_accepted': False}
          (output / 'evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          assert evidence['accepted'], problems
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-pure-capture-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reader-pure-capture-strict/
          if-no-files-found: error
          retention-days: 90
