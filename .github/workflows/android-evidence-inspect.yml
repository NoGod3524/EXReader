name: Inspect original Android run evidence
on:
  push:
    branches: [codex/android-evidence-inspect]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reader-wave3-c11-android-40404143400-1
          path: evidence
          run-id: 40404143400
          github-token: ${{ github.token }}
      - name: Verify saved APK, installed bytes, reports and run identity
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('evidence')
          def digest(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          def read(path):return json.loads(path.read_text())
          expected='2bb0c9e1fec118ca9e49b7530b205d5fcb3aed3b'
          app=root/'artifacts/app-debug.apk'; installed=root/'evidence/reading-installed.apk'
          assert digest(app)==digest(installed)=='5aafe17c22328d857e5004956c26e700584e12139e3afd2a9964ab36bbff6020'
          reports={name:read(root/'evidence'/name/'result.json') for name in ('wave3','navigation','reading')}
          for name,count in (('wave3',20),('navigation',18),('reading',19)):
              row=reports[name]
              assert row['source_sha']==expected and row['run_id']=='40404143400' and str(row['attempt'])=='1',name
              assert row['accepted'] is True and row['checks']==count,(name,row.get('checks'),row.get('accepted'))
          walkthrough=read(root/'evidence/walkthrough/execution.json')
          assert walkthrough['source_sha']==expected and walkthrough['run_id']=='40404143400' and str(walkthrough['attempt'])=='1'
          assert walkthrough['completed'] and walkthrough['app_sha256']==digest(app) and walkthrough['installed_sha256']==digest(app)
          matrix=read(root/'result.json');assert matrix['accepted'] is True
          print(json.dumps({'source':expected,'run_id':'40404143400','attempt':1,'app_sha256':digest(app),
             'installed_apk_matches':True,'reports':{k:{'checks':v['checks'],'accepted':v['accepted']} for k,v in reports.items()},
             'walkthrough_completed':walkthrough['completed'],'suites':walkthrough['suites'],'matrix_accepted':matrix['accepted']}))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: android-organization-sync-build-40407771850-1
          path: combined
          run-id: 40407771850
          github-token: ${{ github.token }}
      - name: Verify combined APK and every saved scope
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('combined/wave3');source='51ee764e434678f8f15cc35f7f4996243b934a45'
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def read(p):return json.loads(p.read_text())
          app=root/'artifacts/app-debug.apk'; installed=root/'evidence/reading-installed.apk'
          expected='c2796aeab2e4d92387f2965a593c31ae514d35b9d5ed5b5719b969e3deccaf2a'
          assert sha(app)==sha(installed)==expected
          result={}
          for name,count in (('wave3',20),('navigation',18),('reading',19),('sync-341',16)):
              row=read(root/'evidence'/name/'result.json')
              assert row['source_sha']==source and row['run_id']=='40407771850' and str(row['attempt'])=='1',name
              assert row['accepted'] and row['checks']==count,(name,row.get('accepted'),row.get('checks'))
              result[name]=row['checks']
          org=read(root/'evidence/organization-sync/result.json');assert org['source_sha']==source and org['run_id']=='40407771850' and org['accepted'] and org['host_apk_sha256']==expected and org['device']['count']==5
          original=read(root/'evidence/original-sync/first-report.json');assert original['passed'] is False and original['failed_check']=='explicit_receive_preserves_sdk_and_product' and original['failure']=='same shared public SDK provider'
          walk=read(root/'evidence/walkthrough/execution.json');assert walk['completed'] and walk['source_sha']==source and walk['app_sha256']==sha(app) and walk['installed_sha256']==sha(app)
          print(json.dumps({'source':source,'run_id':'40407771850','attempt':1,'host_sha256':sha(app),'installed_apk_matches':True,'checks':result,'organization_checks':org['device']['count'],'original_sync_failed_check':original['failed_check'],'original_sync_failure':original['failure'],'walkthrough_completed':walk['completed'],'suites':walk['suites']}))
          PY
