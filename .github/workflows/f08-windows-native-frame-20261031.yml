name: F08 Windows native frame production build
on:
  push:
    branches: [codex/f08-windows-agent-20261031]
permissions:
  contents: read
  actions: read
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify frame protocol controls
        run: python tests/reader_f08_windows_native_frame_20261031/replay.py --self-test
      - name: Build the full native product with diagnostic provenance
        run: python tests/reader_f08_windows_native_frame_20261031/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-windows-native-frame-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-windows-native-frame/evidence/
          if-no-files-found: error
          retention-days: 30
