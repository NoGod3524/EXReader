name: Inspect pinned b2f Apple failures
on:
  push:
    branches: [codex/dot-apple-b2f-diagnose-20261030]
    paths: ['tools/reader_composition/dot_apple_b2f_diagnose_20261030.py', '.github/workflows/dot-apple-b2f-diagnose-20261030.yml']
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Exact independent diagnostic-only scope
        run: |
          git diff --exit-code b2f4e6e1363d0ee20fcb87a6acef548e0624318a HEAD -- . ':!tools/reader_composition/dot_apple_b2f_diagnose_20261030.py' ':!.github/workflows/dot-apple-b2f-diagnose-20261030.yml' ':!docs/reader-total-progress/dot-apple-b2f-diagnose-20261030.md'
          python3 -m py_compile tools/reader_composition/dot_apple_b2f_diagnose_20261030.py
      - name: Authenticate original ZIPs and inspect original failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/reader_composition/dot_apple_b2f_diagnose_20261030.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dot-apple-b2f-diagnose-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/dot-apple-b2f-diagnose/
            !build/dot-apple-b2f-diagnose/**/extracted/**/*.xcresult/**
          if-no-files-found: error
          retention-days: 30
