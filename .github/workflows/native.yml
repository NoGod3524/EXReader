name: Native C engine
on:
  push:
    branches: ['codex/framework']
  pull_request:
  workflow_call:
    inputs:
      scope:
        description: Run the full workflow or only P acceptance jobs
        type: string
        default: full
  workflow_dispatch:
    inputs:
      scope:
        description: Run the full workflow or only P acceptance jobs
        type: choice
        options: [full, p-hygiene, p-apple, p-windows]
        default: full
      fault:
        description: P acceptance only - mutate one temporary workflow copy
        type: choice
        options: [none, packaging, failfast, diagnostic, negative, baseline-new, baseline-modified, baseline-stale]
        default: none
      rule:
        description: P hygiene rule to run (use all for the positive control)
        type: choice
        options: [all, packaging, failfast, diagnostic, negative]
        default: all
permissions:
  contents: read
jobs:
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PERF_RUNNER_LABEL: ${{ matrix.os }}
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Configure native C
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_JNI=ON -DEXR_ENABLE_AAC=OFF
      - name: Build
        run: cmake --build build/native --config Release --parallel 4
      - name: Verify compiled layer dependencies
        if: runner.os == 'Linux'
        run: python3 tools/check_layers.py build/native
      - name: Native parsing, pagination, rendering and bookshelf tests
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Table continuation with a platform OpenType font
        shell: bash .github/scripts/ci.sh {0}
        run: |
          if [ "${{ runner.os }}" = Windows ]; then font=C:/Windows/Fonts/arial.ttf; test=./build/native/Release/exreader-table-fragments-test.exe;
          elif [ "${{ runner.os }}" = macOS ]; then font=/System/Library/Fonts/Supplemental/Arial.ttf; test=./build/native/exreader-table-fragments-test;
          else font=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; test=./build/native/exreader-table-fragments-test; fi
          "$test" tests/fixtures --font "$font"
      - name: Measure bounded single chapters and evicted-window recovery
        shell: bash .github/scripts/ci.sh {0}
        run: |
          if [ "${{ runner.os }}" = Windows ]; then probe=build/native/Release/exreader-wp6-chapter-probe.exe;
          else probe=build/native/exreader-wp6-chapter-probe; fi
          python3 tools/generate_bounded_chapter_corpus.py build/wp6-corpus
          python3 tools/run_wp6_bounded_probe.py "$probe" tests/fixtures/fonts/primary.ttf build/wp6-corpus build/wp6-evidence --window-bytes 16384 --sample-pages 64 --random-count 8 --repeats 1
      - name: Preserve bounded chapter measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXReader-WP6-${{ runner.os }}
          path: |
            build/wp6-evidence/
            build/wp6-corpus/manifest.json
          if-no-files-found: warn
      - name: Install portable SDK with license notices
        run: cmake --install build/native --config Release --prefix stage
      - name: Build and run installed static components
        run: |
          cmake -S tests/sdk_components -B build/sdk-components -DEXR_SDK="${{ github.workspace }}/stage" -DEXR_TEST_FONT="${{ github.workspace }}/tests/fixtures/fonts/primary.ttf" -DEXR_TEST_COLOR_FONT="${{ github.workspace }}/tests/fixtures/fonts/colrv1.ttf" -DEXR_TEST_FIXTURES="${{ github.workspace }}/tests/fixtures" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-components --config Release --parallel 4
          ctest --test-dir build/sdk-components -C Release --output-on-failure
      - name: Build and test core without optional components
        run: |
          cmake -S . -B build/core-only -DCMAKE_BUILD_TYPE=Release -DEXR_ENABLE_AUDIO=OFF -DEXR_ENABLE_LIBRARY=OFF -DEXR_BUILD_TEXT_INDEX=OFF -DEXR_ENABLE_PDF=OFF -DEXR_ENABLE_PDF_EDIT=OFF -DEXR_BUILD_SHARED_COMPAT=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_JNI=OFF
          cmake --build build/core-only --config Release --parallel 4
          ctest --test-dir build/core-only -C Release --output-on-failure
          cmake --install build/core-only --config Release --prefix stage-core
          cmake -S tests/sdk_components -B build/sdk-core -DEXR_SDK="${{ github.workspace }}/stage-core" -DEXR_TEST_FONT="${{ github.workspace }}/tests/fixtures/fonts/primary.ttf" -DEXR_TEST_COLOR_FONT="${{ github.workspace }}/tests/fixtures/fonts/colrv1.ttf" -DEXR_TEST_FIXTURES="${{ github.workspace }}/tests/fixtures" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-core --config Release --parallel 4
          ctest --test-dir build/sdk-core -C Release --output-on-failure
      - name: Verify storage without playback or PDF
        run: |
          cmake -S . -B build/core-only -DEXR_ENABLE_LIBRARY=ON
          cmake --build build/core-only --config Release --parallel 4
          ctest --test-dir build/core-only -C Release --output-on-failure
      - name: Build host examples against the installed SDK
        run: |
          cmake -S stage/examples -B build/sdk-example -DEXR_SDK="${{ github.workspace }}/stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-example --config Release --parallel 4
          cmake -S tests/sdk_cpp -B build/sdk-cpp -DEXR_SDK="${{ github.workspace }}/stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-cpp --config Release --parallel 4
      - name: Run the installed Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./stage/bin/exreader-render.exe tests/fixtures/sample.txt C:/Windows/Fonts/arial.ttf stage-page.png
          ./build/sdk-example/Release/exreader-construct-example.exe C:/Windows/Fonts/arial.ttf host-page.png
          ./build/sdk-cpp/Release/exreader-cpp-test.exe stage/examples/fonts/primary.ttf stage/examples/books/table-fragments-12.epub
          ./build/sdk-example/Release/exreader-search-example.exe tests/fixtures/layout.epub build/host-index.sqlite " "
          ./build/sdk-example/Release/exreader-compat-example.exe
          ./build/sdk-example/Release/exreader-anchor-example.exe
          ./build/sdk-example/Release/exreader-shaping-example.exe stage/examples/shaping-fonts/shaping.ttf
          ./build/sdk-example/Release/exreader-fixed-example.exe stage/examples/fixed-pages/pdf-public.pdf fixed-host-page.png
          ./build/sdk-example/Release/exreader-wave-example.exe stage/examples/audio/pcm.wav
          ./build/sdk-example/Release/exreader-pcm-example.exe stage/examples/audio/pcm.wav
          ./build/sdk-example/Release/exreader-text-example.exe
          ./build/sdk-example/Release/exreader-hyphen-example.exe stage/examples/fonts/primary.ttf hyphen-host-page.png
          ./build/sdk-example/Release/exreader-font-example.exe stage/examples/fonts/primary.ttf stage/examples/fonts/fallback.ttf font-host-page.png
          ./build/sdk-example/Release/exreader-page-example.exe stage/examples/books/table-fragments-12.epub stage/examples/fonts/primary.ttf tall-table-host-page.png 1
          ./build/sdk-example/Release/exreader-page-example.exe tests/fixtures/layout.epub C:/Windows/Fonts/arial.ttf pager-host-page.png
          ./build/sdk-example/Release/exreader-lazy-example.exe C:/Windows/Fonts/arial.ttf lazy-host-page.png
          New-Item -ItemType Directory -Path 'build/中文 example' -Force | Out-Null
          Copy-Item -LiteralPath tests/fixtures/layout.epub -Destination 'build/中文 example/示例.epub'
          ./build/sdk-example/Release/exreader-lazy-example.exe C:/Windows/Fonts/arial.ttf 'build/中文 example/页面.png' 'build/中文 example/示例.epub' 1
          ./build/sdk-example/Release/exreader-construct-example.exe C:/Windows/Fonts/arial.ttf 'build/中文 example/构造页面.png'
          Copy-Item -LiteralPath stage/examples/audio/pcm.wav -Destination 'build/中文 example/声音.wav'
          ./build/sdk-example/Release/exreader-wave-example.exe 'build/中文 example/声音.wav'
          Copy-Item -LiteralPath tests/fixtures/pdf-public.pdf -Destination 'build/中文 example/示例.pdf'
          ./build/sdk-example/Release/exreader-fixed-example.exe 'build/中文 example/示例.pdf' 'build/中文 example/固定页面.png'
          Copy-Item -LiteralPath stage/examples/fonts/primary.ttf -Destination 'build/中文 example/主字体.ttf'
          Copy-Item -LiteralPath stage/examples/fonts/fallback.ttf -Destination 'build/中文 example/回退字体.ttf'
          ./build/sdk-example/Release/exreader-font-example.exe 'build/中文 example/主字体.ttf' 'build/中文 example/回退字体.ttf' 'build/中文 example/字体页面.png'
          ./build/sdk-example/Release/exreader-page-example.exe 'build/中文 example/示例.epub' C:/Windows/Fonts/arial.ttf 'build/中文 example/续排页面.png'
          $PSNativeCommandUseErrorActionPreference = $false
          python tools/run_benchmarks.py ./stage/bin/exreader-benchmark.exe C:/Windows/Fonts/arial.ttf build/performance --runs 1 --max-pages 8 --paging
          $perfExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Output "advisory=true accepted=false actual_exit=$perfExit candidate=stage/bin/exreader-benchmark.exe tracking=32"
      - name: Run the installed Linux SDK
        if: runner.os == 'Linux'
        run: |
          ./stage/bin/exreader-render tests/fixtures/sample.txt /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf stage-page.png
          ./build/sdk-example/exreader-construct-example /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf host-page.png
          ./build/sdk-cpp/exreader-cpp-test stage/examples/fonts/primary.ttf stage/examples/books/table-fragments-12.epub
          ./build/sdk-example/exreader-search-example tests/fixtures/layout.epub build/host-index.sqlite " "
          ./build/sdk-example/exreader-compat-example
          ./build/sdk-example/exreader-anchor-example
          ./build/sdk-example/exreader-shaping-example stage/examples/shaping-fonts/shaping.ttf
          ./build/sdk-example/exreader-fixed-example stage/examples/fixed-pages/pdf-public.pdf fixed-host-page.png
          ./build/sdk-example/exreader-wave-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-pcm-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-text-example
          ./build/sdk-example/exreader-hyphen-example stage/examples/fonts/primary.ttf hyphen-host-page.png
          ./build/sdk-example/exreader-font-example stage/examples/fonts/primary.ttf stage/examples/fonts/fallback.ttf font-host-page.png
          ./build/sdk-example/exreader-page-example stage/examples/books/table-fragments-12.epub stage/examples/fonts/primary.ttf tall-table-host-page.png 1
          ./build/sdk-example/exreader-page-example tests/fixtures/layout.epub /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf pager-host-page.png
          ./build/sdk-example/exreader-lazy-example /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf lazy-host-page.png
          ./build/sdk-example/exreader-lazy-example /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf lazy-epub-page.png tests/fixtures/layout.epub 1
          ci_advisory python3 tools/run_benchmarks.py ./stage/bin/exreader-benchmark /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf build/performance --runs 1 --max-pages 8 --paging
      - name: Package and check the Windows reference reader
        if: runner.os == 'Windows'
        run: python tools/build_windows_host.py --sdk stage --binary build/sdk-example/Release/exreader-reader-example.exe --output build/windows-host
      - name: Run the installed macOS SDK
        if: runner.os == 'macOS'
        run: |
          ./stage/bin/exreader-render tests/fixtures/sample.txt /System/Library/Fonts/Supplemental/Arial.ttf stage-page.png
          ./build/sdk-example/exreader-construct-example /System/Library/Fonts/Supplemental/Arial.ttf host-page.png
          ./build/sdk-cpp/exreader-cpp-test stage/examples/fonts/primary.ttf stage/examples/books/table-fragments-12.epub
          ./build/sdk-example/exreader-search-example tests/fixtures/layout.epub build/host-index.sqlite " "
          ./build/sdk-example/exreader-compat-example
          ./build/sdk-example/exreader-anchor-example
          ./build/sdk-example/exreader-shaping-example stage/examples/shaping-fonts/shaping.ttf
          ./build/sdk-example/exreader-fixed-example stage/examples/fixed-pages/pdf-public.pdf fixed-host-page.png
          ./build/sdk-example/exreader-wave-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-pcm-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-text-example
          ./build/sdk-example/exreader-hyphen-example stage/examples/fonts/primary.ttf hyphen-host-page.png
          ./build/sdk-example/exreader-font-example stage/examples/fonts/primary.ttf stage/examples/fonts/fallback.ttf font-host-page.png
          ./build/sdk-example/exreader-page-example stage/examples/books/table-fragments-12.epub stage/examples/fonts/primary.ttf tall-table-host-page.png 1
          ./build/sdk-example/exreader-page-example tests/fixtures/layout.epub /System/Library/Fonts/Supplemental/Arial.ttf pager-host-page.png
          ./build/sdk-example/exreader-lazy-example /System/Library/Fonts/Supplemental/Arial.ttf lazy-host-page.png
          ./build/sdk-example/exreader-lazy-example /System/Library/Fonts/Supplemental/Arial.ttf lazy-epub-page.png tests/fixtures/layout.epub 1
          ci_advisory python3 tools/run_benchmarks.py ./stage/bin/exreader-benchmark /System/Library/Fonts/Supplemental/Arial.ttf build/performance --runs 1 --max-pages 8 --paging
      - name: Measure installed PDF group rendering
        shell: bash .github/scripts/ci.sh {0}
        run: |
          if [ "${{ runner.os }}" = Windows ]; then runtime=./stage/bin/exreader.dll;
          elif [ "${{ runner.os }}" = macOS ]; then runtime=./stage/lib/libexreader.dylib;
          else runtime=./stage/lib/libexreader.so; fi
          ci_advisory python tools/benchmark_pdf_blend.py "$runtime" tests/fixtures/pdf-blend build/performance/pdf --runs 1 --scale 1 --case nonisolated --case ap-nonisolated
      - name: Bound table alignment memory against the installed SDK
        shell: bash .github/scripts/ci.sh {0}
        run: |
          if [ "${{ runner.os }}" = Windows ]; then benchmark=./stage/bin/exreader-benchmark.exe; else benchmark=./stage/bin/exreader-benchmark; fi
          ci_advisory python tools/benchmark_table_layout.py "$benchmark" stage/examples/fonts/primary.ttf build/table-performance --runs 1 --check-memory
      - name: Build and run JNI host against installed SDK
        shell: bash .github/scripts/ci.sh {0}
        run: |
          javac -encoding UTF-8 -d build/jni-java bindings/jni/EXReader.java bindings/jni/EXReaderException.java bindings/jni/Smoke.java
          if [ "${{ runner.os }}" = Windows ]; then native_dir="$PWD/stage/bin"; else native_dir="$PWD/stage/lib"; fi
          export PATH="$PWD/stage/bin:$PATH"
          java -Xcheck:jni -Djava.library.path="$native_dir" -cp build/jni-java org.exreader.Smoke stage/examples build/jni-unicode
      - name: Build and run Swift host against installed SDK
        if: runner.os == 'macOS'
        shell: bash .github/scripts/ci.sh {0}
        run: |
          swiftc -I stage/include -L stage/lib -lexreader -Xlinker -rpath -Xlinker "$PWD/stage/lib" bindings/swift/EXReader.swift bindings/swift/Smoke.swift -o build/swift-sdk-example
          ./build/swift-sdk-example stage/examples
          python3 tools/build_apple_product.py --sdk stage --target macos --build build/apple-products/macos
          python3 tools/build_apple_host.py --sdk stage --platform macos --output build/apple-host
          python3 tools/check_apple_host.py --bundle build/apple-host/EXReader.app --device macos --output build/apple-host-evidence
          ditto -c -k --sequesterRsrc --keepParent build/apple-host/EXReader.app build/EXReader-macOS.zip
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: EXReader-reference-Windows
          path: |
            build/windows-host/EXReader-Windows.zip
            build/windows-host/report.json
            build/windows-host/build.json
            build/windows-host/page.png
            build/windows-host/application.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: EXReader-reference-macOS
          path: |
            build/EXReader-macOS.zip
            build/apple-host/build.json
            build/apple-host-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-performance-${{ runner.os }}
          path: build/performance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXReader-conversion-${{ runner.os }}
          path: build/native/native-convert*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-C-${{ runner.os }}
          path: stage/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ runner.os }}
          path: build/native/Testing/
  sanitizers:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DEXR_SANITIZE=ON -DEXR_ENABLE_AAC=OFF
      - run: cmake --build build/asan --parallel 4
      - run: ctest --test-dir build/asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Preserve sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-native-tests
          path: |
            build/asan/Testing/
            build/asan/native-convert*.json
          if-no-files-found: warn
  fuzz:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Configure the instrumented fuzz driver
        run: cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug -DEXR_SANITIZE=ON -DEXR_BUILD_FUZZ=ON -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF
      - run: cmake --build build/fuzz --parallel 4
      - name: Verify exact crash records and parser routing
        run: ./build/fuzz/exreader-fuzz-test tests/fixtures
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Bounded parser campaign (seeded, reproducible)
        run: ./build/fuzz/exreader-fuzz --seed 1 --iterations 200000 --save build/fuzz/last.bin tests/fixtures/pdf-blend/nonisolated.pdf tests/fixtures/layout.epub tests/fixtures/comic.cbz tests/fixtures/deep.fb2 tests/fixtures/sample.txt
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Verify font, pagination and rendering pipeline contracts
        run: |
          python3 tests/check_reliability_campaign.py
          python3 tests/check_fuzz_pipelines.py build/fuzz/exreader-fuzz build/fuzz/exreader-fuzz-font build/fuzz/exreader-fuzz-layout build/fuzz/exreader-fuzz-render tests/fixtures
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Bounded font, layout and rendering campaigns
        run: |
          ./build/fuzz/exreader-fuzz-font --seed 20261019 --iterations 20000 --save build/fuzz/font.bin tests/fixtures/fonts/primary.ttf tests/fixtures/fonts/pdf-cubic.otf tests/fixtures/fonts/color.ttf tests/fixtures/fonts/bitmap.ttf tests/fixtures/fonts/cbdt.ttf tests/fixtures/fonts/variable.ttf tests/fixtures/shaping/shaping.ttf tests/fixtures/fonts/colrv1.ttf tests/fixtures/fonts/colrv1-var.ttf tests/fixtures/fonts/svgfont.ttf
          ./build/fuzz/exreader-fuzz-layout --font tests/fixtures/fonts/primary.ttf --seed 20261019 --iterations 2000 --save build/fuzz/layout.bin tests/fixtures/sample.txt tests/fixtures/layout.epub tests/fixtures/float-both.epub tests/fixtures/table-fragments-12.epub
          ./build/fuzz/exreader-fuzz-render --font tests/fixtures/fonts/primary.ttf --seed 20261019 --iterations 2000 --save build/fuzz/render.bin tests/fixtures/comic.cbz tests/fixtures/pdf-color/shading-axial.pdf tests/fixtures/layout.epub
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Verify measured CPU evidence and strict aggregation on all four targets
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 tools/run_reliability_campaign.py seal-build --source . --build build/fuzz --require-clean
          for target in parser font layout render; do
            python3 tools/run_reliability_campaign.py run --source . --build build/fuzz --target "$target" --seed 2026101901 --cpu-seconds 1 --wall-seconds 120 --require-clean --output "build/evidence/$target-0"
          done
          python3 tools/run_reliability_campaign.py summarize --reports build/evidence --minimum-cpu-hours 0.0002777777777777778 --expected-shards 1 --first-seed 2026101901 --expected-source-sha "${{ github.sha }}" --build-manifest build/fuzz/build-manifest.json --output build/reliability-smoke-summary.json
          python3 tools/run_reliability_campaign.py run --source . --build build/fuzz --target font --seed 2026101901 --cpu-seconds 60 --wall-seconds 360 --require-clean --output build/font-endurance
      - name: Preserve measured evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-native-smoke
          path: |
            build/evidence/
            build/fuzz/build-manifest.json
            build/reliability-smoke-summary.json
            build/font-endurance/
          if-no-files-found: warn
      - name: Keep the triggering input when the campaign fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-last-input
          path: |
            build/fuzz/*.bin
            build/fuzz/*.bin.format
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Build Android ARM64 shared engine
        shell: bash .github/scripts/ci.sh {0}
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n1)
          cmake -S . -B build/android -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF -DEXR_ENABLE_AAC=OFF
          cmake --build build/android --parallel 4
          cmake --install build/android --prefix stage
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-C-Android-arm64
          path: stage/
  apple-mobile:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Check simulator isolation and failure propagation
        run: python3 tests/check_apple_host.py
      - name: Build iOS and iPadOS device and simulator libraries
        shell: bash .github/scripts/ci.sh {0}
        run: |
          for sdk in iphoneos iphonesimulator; do
            cmake -S . -B "build/$sdk" -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DEXR_ENABLE_AAC=OFF
            cmake --build "build/$sdk" --parallel 4
            cmake --install "build/$sdk" --prefix "stage/$sdk"
            if [ "$sdk" = iphoneos ]; then target=arm64-apple-ios14.0; else target=arm64-apple-ios14.0-simulator; fi
            xcrun --sdk "$sdk" swiftc -target "$target" -sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" -I "stage/$sdk/include" -typecheck bindings/swift/EXReader.swift
          done
      - name: Install iPhone and iPad product dependencies
        run: |
          for sdk in iphoneos iphonesimulator; do
            python3 tools/build_apple_product.py --sdk "stage/$sdk" --target "$sdk" --build "build/apple-products/$sdk"
          done
      - name: Build and run the iPhone and iPad reference host
        run: |
          python3 tools/build_apple_host.py --sdk stage/iphonesimulator --platform simulator --output build/apple-simulator-host
          python3 tools/check_apple_host.py --bundle build/apple-simulator-host/EXReader.app --device iphone --output build/iphone-host-evidence
          python3 tools/check_apple_host.py --bundle build/apple-simulator-host/EXReader.app --device ipad --output build/ipad-host-evidence
          python3 tools/build_apple_host.py --sdk stage/iphoneos --platform iphoneos --output build/apple-device-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EXReader-reference-iPhone-iPad
          path: |
            build/apple-device-host/EXReader-iOS-unsigned.ipa
            build/apple-device-host/build.json
            build/apple-simulator-host/build.json
            build/iphone-host-evidence/
            build/ipad-host-evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-C-iOS-iPadOS-arm64
          path: stage/
  ci-hygiene:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'p-hygiene'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        rule: ${{ fromJSON(inputs.rule && inputs.rule != 'all' && format('["{0}"]', inputs.rule) || '["packaging","failfast","diagnostic","negative"]') }}
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check changed CI and exercise the rule
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/ledger/base-20261103' }}
          HYGIENE_RULE: ${{ matrix.rule }}
          HYGIENE_FAULT: ${{ inputs.fault || 'none' }}
        run: |
          python tools/check_ci_hygiene.py --base "$BASE_SHA" --rule "$HYGIENE_RULE"
          python tests/check_ci_hygiene.py --rule "$HYGIENE_RULE" --fault "$HYGIENE_FAULT"
  apple-packaging:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'p-apple'
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphoneos, iphonesimulator]
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install root SDK then product dependencies
        env:
          APPLE_TARGET: ${{ matrix.target }}
        run: |
          options=(-DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_JNI=OFF -DEXR_ENABLE_AAC=OFF)
          if [ "$APPLE_TARGET" != macos ]; then
            options+=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$APPLE_TARGET" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO)
          fi
          cmake -S . -B build/p-sdk "${options[@]}"
          cmake --build build/p-sdk --parallel 4
          cmake --install build/p-sdk --prefix stage
          python3 tools/build_apple_product.py --sdk stage --target "$APPLE_TARGET" --build build/p-products
          PYTHONPATH=tools python3 -c 'from apple_swift import flags; print("PASS: installed Apple product includes and archives:", *flags("stage"), sep="\n")'
  windows-packaging:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'p-windows'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash .github/scripts/ci.sh {0}
    steps:
      - uses: actions/checkout@v4
      - name: Build and install the Windows SDK including reader inputs
        run: |
          cmake -S . -B build/p-windows-sdk -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_JNI=OFF -DEXR_ENABLE_AAC=OFF
          cmake --build build/p-windows-sdk --config Release --parallel 4
          cmake --install build/p-windows-sdk --config Release --prefix stage
      - name: Build the actual reader against the installed SDK
        run: |
          cmake -S stage/examples -B build/p-windows-example -DEXR_SDK="$PWD/stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/p-windows-example --config Release --target exreader-reader-example --parallel 4
      - name: Package and run the Windows reference host
        run: python tools/build_windows_host.py --sdk stage --binary build/p-windows-example/Release/exreader-reader-example.exe --output build/p-windows-host
      - name: Reject a missing staged include and a missing executable
        run: python tests/check_windows_package_inputs.py --sdk stage --binary build/p-windows-example/Release/exreader-reader-example.exe --package build/p-windows-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P-Windows-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/p-windows-host/
            stage/apps/reader/desktop/windows_accessibility.inc
          if-no-files-found: error
