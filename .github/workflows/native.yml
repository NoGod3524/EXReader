name: Native C engine
on:
  push:
    branches: ['codex/framework']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure native C
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_JNI=ON -DEXR_ENABLE_AAC=OFF
      - name: Build
        run: cmake --build build/native --config Release --parallel 4
      - name: Verify compiled layer dependencies
        if: runner.os == 'Linux'
        run: python3 tools/check_layers.py build/native
      - name: Native parsing, pagination, rendering and bookshelf tests
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Table continuation with a platform OpenType font
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then font=C:/Windows/Fonts/arial.ttf; test=./build/native/Release/exreader-table-fragments-test.exe;
          elif [ "${{ runner.os }}" = macOS ]; then font=/System/Library/Fonts/Supplemental/Arial.ttf; test=./build/native/exreader-table-fragments-test;
          else font=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; test=./build/native/exreader-table-fragments-test; fi
          "$test" tests/fixtures --font "$font"
      - name: Install portable SDK with license notices
        run: cmake --install build/native --config Release --prefix stage
      - name: Build and run installed static components
        run: |
          cmake -S tests/sdk_components -B build/sdk-components -DEXR_SDK="${{ github.workspace }}/stage" -DEXR_TEST_FONT="${{ github.workspace }}/tests/fixtures/fonts/primary.ttf" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-components --config Release --parallel 4
          ctest --test-dir build/sdk-components -C Release --output-on-failure
      - name: Build and test core without optional components
        run: |
          cmake -S . -B build/core-only -DCMAKE_BUILD_TYPE=Release -DEXR_ENABLE_AUDIO=OFF -DEXR_ENABLE_LIBRARY=OFF -DEXR_BUILD_TEXT_INDEX=OFF -DEXR_ENABLE_PDF=OFF -DEXR_ENABLE_PDF_EDIT=OFF -DEXR_BUILD_SHARED_COMPAT=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_JNI=OFF
          cmake --build build/core-only --config Release --parallel 4
          ctest --test-dir build/core-only -C Release --output-on-failure
          cmake --install build/core-only --config Release --prefix stage-core
          cmake -S tests/sdk_components -B build/sdk-core -DEXR_SDK="${{ github.workspace }}/stage-core" -DEXR_TEST_FONT="${{ github.workspace }}/tests/fixtures/fonts/primary.ttf" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-core --config Release --parallel 4
          ctest --test-dir build/sdk-core -C Release --output-on-failure
      - name: Verify storage without playback or PDF
        run: |
          cmake -S . -B build/core-only -DEXR_ENABLE_LIBRARY=ON
          cmake --build build/core-only --config Release --parallel 4
          ctest --test-dir build/core-only -C Release --output-on-failure
      - name: Build host examples against the installed SDK
        run: |
          cmake -S stage/examples -B build/sdk-example -DEXR_SDK="${{ github.workspace }}/stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-example --config Release --parallel 4
          cmake -S tests/sdk_cpp -B build/sdk-cpp -DEXR_SDK="${{ github.workspace }}/stage" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk-cpp --config Release --parallel 4
      - name: Run the installed Windows SDK
        if: runner.os == 'Windows'
        run: |
          ./stage/bin/exreader-render.exe tests/fixtures/sample.txt C:/Windows/Fonts/arial.ttf stage-page.png
          ./build/sdk-example/Release/exreader-construct-example.exe C:/Windows/Fonts/arial.ttf host-page.png
          ./build/sdk-cpp/Release/exreader-cpp-test.exe stage/examples/fonts/primary.ttf stage/examples/books/table-fragments-12.epub
          ./build/sdk-example/Release/exreader-search-example.exe tests/fixtures/layout.epub build/host-index.sqlite " "
          ./build/sdk-example/Release/exreader-compat-example.exe
          ./build/sdk-example/Release/exreader-anchor-example.exe
          ./build/sdk-example/Release/exreader-shaping-example.exe stage/examples/shaping-fonts/shaping.ttf
          ./build/sdk-example/Release/exreader-fixed-example.exe stage/examples/fixed-pages/pdf-public.pdf fixed-host-page.png
          ./build/sdk-example/Release/exreader-wave-example.exe stage/examples/audio/pcm.wav
          ./build/sdk-example/Release/exreader-pcm-example.exe stage/examples/audio/pcm.wav
          ./build/sdk-example/Release/exreader-text-example.exe
          ./build/sdk-example/Release/exreader-hyphen-example.exe stage/examples/fonts/primary.ttf hyphen-host-page.png
          ./build/sdk-example/Release/exreader-font-example.exe stage/examples/fonts/primary.ttf stage/examples/fonts/fallback.ttf font-host-page.png
          ./build/sdk-example/Release/exreader-page-example.exe stage/examples/books/table-fragments-12.epub stage/examples/fonts/primary.ttf tall-table-host-page.png 1
          ./build/sdk-example/Release/exreader-page-example.exe tests/fixtures/layout.epub C:/Windows/Fonts/arial.ttf pager-host-page.png
          ./build/sdk-example/Release/exreader-lazy-example.exe C:/Windows/Fonts/arial.ttf lazy-host-page.png
          New-Item -ItemType Directory -Path 'build/中文 example' -Force | Out-Null
          Copy-Item -LiteralPath tests/fixtures/layout.epub -Destination 'build/中文 example/示例.epub'
          ./build/sdk-example/Release/exreader-lazy-example.exe C:/Windows/Fonts/arial.ttf 'build/中文 example/页面.png' 'build/中文 example/示例.epub' 1
          ./build/sdk-example/Release/exreader-construct-example.exe C:/Windows/Fonts/arial.ttf 'build/中文 example/构造页面.png'
          Copy-Item -LiteralPath stage/examples/audio/pcm.wav -Destination 'build/中文 example/声音.wav'
          ./build/sdk-example/Release/exreader-wave-example.exe 'build/中文 example/声音.wav'
          Copy-Item -LiteralPath tests/fixtures/pdf-public.pdf -Destination 'build/中文 example/示例.pdf'
          ./build/sdk-example/Release/exreader-fixed-example.exe 'build/中文 example/示例.pdf' 'build/中文 example/固定页面.png'
          Copy-Item -LiteralPath stage/examples/fonts/primary.ttf -Destination 'build/中文 example/主字体.ttf'
          Copy-Item -LiteralPath stage/examples/fonts/fallback.ttf -Destination 'build/中文 example/回退字体.ttf'
          ./build/sdk-example/Release/exreader-font-example.exe 'build/中文 example/主字体.ttf' 'build/中文 example/回退字体.ttf' 'build/中文 example/字体页面.png'
          ./build/sdk-example/Release/exreader-page-example.exe 'build/中文 example/示例.epub' C:/Windows/Fonts/arial.ttf 'build/中文 example/续排页面.png'
          python tools/run_benchmarks.py ./stage/bin/exreader-benchmark.exe C:/Windows/Fonts/arial.ttf build/performance --runs 1 --max-pages 8 --paging
      - name: Run the installed Linux SDK
        if: runner.os == 'Linux'
        run: |
          ./stage/bin/exreader-render tests/fixtures/sample.txt /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf stage-page.png
          ./build/sdk-example/exreader-construct-example /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf host-page.png
          ./build/sdk-cpp/exreader-cpp-test stage/examples/fonts/primary.ttf stage/examples/books/table-fragments-12.epub
          ./build/sdk-example/exreader-search-example tests/fixtures/layout.epub build/host-index.sqlite " "
          ./build/sdk-example/exreader-compat-example
          ./build/sdk-example/exreader-anchor-example
          ./build/sdk-example/exreader-shaping-example stage/examples/shaping-fonts/shaping.ttf
          ./build/sdk-example/exreader-fixed-example stage/examples/fixed-pages/pdf-public.pdf fixed-host-page.png
          ./build/sdk-example/exreader-wave-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-pcm-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-text-example
          ./build/sdk-example/exreader-hyphen-example stage/examples/fonts/primary.ttf hyphen-host-page.png
          ./build/sdk-example/exreader-font-example stage/examples/fonts/primary.ttf stage/examples/fonts/fallback.ttf font-host-page.png
          ./build/sdk-example/exreader-page-example stage/examples/books/table-fragments-12.epub stage/examples/fonts/primary.ttf tall-table-host-page.png 1
          ./build/sdk-example/exreader-page-example tests/fixtures/layout.epub /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf pager-host-page.png
          ./build/sdk-example/exreader-lazy-example /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf lazy-host-page.png
          ./build/sdk-example/exreader-lazy-example /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf lazy-epub-page.png tests/fixtures/layout.epub 1
          python3 tools/run_benchmarks.py ./stage/bin/exreader-benchmark /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf build/performance --runs 1 --max-pages 8 --paging
      - name: Run the installed macOS SDK
        if: runner.os == 'macOS'
        run: |
          ./stage/bin/exreader-render tests/fixtures/sample.txt /System/Library/Fonts/Supplemental/Arial.ttf stage-page.png
          ./build/sdk-example/exreader-construct-example /System/Library/Fonts/Supplemental/Arial.ttf host-page.png
          ./build/sdk-cpp/exreader-cpp-test stage/examples/fonts/primary.ttf stage/examples/books/table-fragments-12.epub
          ./build/sdk-example/exreader-search-example tests/fixtures/layout.epub build/host-index.sqlite " "
          ./build/sdk-example/exreader-compat-example
          ./build/sdk-example/exreader-anchor-example
          ./build/sdk-example/exreader-shaping-example stage/examples/shaping-fonts/shaping.ttf
          ./build/sdk-example/exreader-fixed-example stage/examples/fixed-pages/pdf-public.pdf fixed-host-page.png
          ./build/sdk-example/exreader-wave-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-pcm-example stage/examples/audio/pcm.wav
          ./build/sdk-example/exreader-text-example
          ./build/sdk-example/exreader-hyphen-example stage/examples/fonts/primary.ttf hyphen-host-page.png
          ./build/sdk-example/exreader-font-example stage/examples/fonts/primary.ttf stage/examples/fonts/fallback.ttf font-host-page.png
          ./build/sdk-example/exreader-page-example stage/examples/books/table-fragments-12.epub stage/examples/fonts/primary.ttf tall-table-host-page.png 1
          ./build/sdk-example/exreader-page-example tests/fixtures/layout.epub /System/Library/Fonts/Supplemental/Arial.ttf pager-host-page.png
          ./build/sdk-example/exreader-lazy-example /System/Library/Fonts/Supplemental/Arial.ttf lazy-host-page.png
          ./build/sdk-example/exreader-lazy-example /System/Library/Fonts/Supplemental/Arial.ttf lazy-epub-page.png tests/fixtures/layout.epub 1
          python3 tools/run_benchmarks.py ./stage/bin/exreader-benchmark /System/Library/Fonts/Supplemental/Arial.ttf build/performance --runs 1 --max-pages 8 --paging
      - name: Measure installed PDF group rendering
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then runtime=./stage/bin/exreader.dll;
          elif [ "${{ runner.os }}" = macOS ]; then runtime=./stage/lib/libexreader.dylib;
          else runtime=./stage/lib/libexreader.so; fi
          python tools/benchmark_pdf_blend.py "$runtime" tests/fixtures/pdf-blend build/performance/pdf --runs 1 --scale 1 --case nonisolated --case ap-nonisolated
      - name: Bound table alignment memory against the installed SDK
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then benchmark=./stage/bin/exreader-benchmark.exe; else benchmark=./stage/bin/exreader-benchmark; fi
          python tools/benchmark_table_layout.py "$benchmark" stage/examples/fonts/primary.ttf build/table-performance --runs 1 --check-memory
      - name: Build and run JNI host against installed SDK
        shell: bash
        run: |
          javac -encoding UTF-8 -d build/jni-java bindings/jni/EXReader.java bindings/jni/EXReaderException.java bindings/jni/Smoke.java
          if [ "${{ runner.os }}" = Windows ]; then native_dir="$PWD/stage/bin"; else native_dir="$PWD/stage/lib"; fi
          export PATH="$PWD/stage/bin:$PATH"
          java -Xcheck:jni -Djava.library.path="$native_dir" -cp build/jni-java org.exreader.Smoke stage/examples build/jni-unicode
      - name: Build and run Swift host against installed SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          swiftc -I stage/include -L stage/lib -lexreader -Xlinker -rpath -Xlinker "$PWD/stage/lib" bindings/swift/EXReader.swift bindings/swift/Smoke.swift -o build/swift-sdk-example
          ./build/swift-sdk-example stage/examples
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-performance-${{ runner.os }}
          path: build/performance/
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-C-${{ runner.os }}
          path: stage/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ runner.os }}
          path: build/native/Testing/
  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DEXR_SANITIZE=ON -DEXR_ENABLE_AAC=OFF
      - run: cmake --build build/asan --parallel 4
      - run: ctest --test-dir build/asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  fuzz:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure the instrumented fuzz driver
        run: cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug -DEXR_SANITIZE=ON -DEXR_BUILD_FUZZ=ON -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF
      - run: cmake --build build/fuzz --parallel 4
      - name: Verify exact crash records and parser routing
        run: ./build/fuzz/exreader-fuzz-test tests/fixtures
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Bounded parser campaign (seeded, reproducible)
        run: ./build/fuzz/exreader-fuzz --seed 1 --iterations 200000 --save build/fuzz/last.bin tests/fixtures/pdf-blend/nonisolated.pdf tests/fixtures/layout.epub tests/fixtures/comic.cbz tests/fixtures/deep.fb2 tests/fixtures/sample.txt
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Keep the triggering input when the campaign fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-last-input
          path: |
            build/fuzz/last.bin
            build/fuzz/last.bin.format
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Android ARM64 shared engine
        shell: bash
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n1)
          cmake -S . -B build/android -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF -DEXR_ENABLE_AAC=OFF
          cmake --build build/android --parallel 4
          cmake --install build/android --prefix stage
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-C-Android-arm64
          path: stage/
  apple-mobile:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS and iPadOS device and simulator libraries
        shell: bash
        run: |
          for sdk in iphoneos iphonesimulator; do
            cmake -S . -B "build/$sdk" -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DEXR_ENABLE_AAC=OFF
            cmake --build "build/$sdk" --parallel 4
            cmake --install "build/$sdk" --prefix "stage/$sdk"
            if [ "$sdk" = iphoneos ]; then target=arm64-apple-ios14.0; else target=arm64-apple-ios14.0-simulator; fi
            xcrun --sdk "$sdk" swiftc -target "$target" -sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" -I "stage/$sdk/include" -typecheck bindings/swift/EXReader.swift
          done
      - uses: actions/upload-artifact@v4
        with:
          name: EXReader-C-iOS-iPadOS-arm64
          path: stage/
