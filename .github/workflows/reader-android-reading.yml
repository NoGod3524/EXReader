name: Android reading original artifact read-only proof
on:
  push:
    branches: [codex/reader-android-reading-proof]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read original accepted ZIP without changing or rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import datetime, hashlib, io, json, subprocess, zipfile
          source='047648865e509d5835b7d6e1389681e314d94e28'
          run=40131364703; job=120983574659; artifact=12575367601
          expected_size=136598458
          expected_sha='9519c0c26d219322cbd95d3914733661aaff40df6c0c2d7214969a72fa81cbd2'
          repo='repos/NoGod3524/EXReader/'
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',repo+path]))
          original=api(f'actions/runs/{run}')
          assert original['head_sha']==source and original['run_attempt']==1
          assert original['status']=='completed' and original['conclusion']=='success'
          jobs=api(f'actions/runs/{run}/jobs')['jobs']
          assert len(jobs)==1 and jobs[0]['id']==job and jobs[0]['conclusion']=='success'
          info=api(f'actions/artifacts/{artifact}')
          assert info['workflow_run']['id']==run and not info['expired']
          assert info['size_in_bytes']==expected_size and info['digest']=='sha256:'+expected_sha
          assert datetime.datetime.fromisoformat(info['expires_at'].replace('Z','+00:00'))>datetime.datetime.now(datetime.timezone.utc)
          raw=subprocess.check_output(['gh','api',repo+f'actions/artifacts/{artifact}/zip'])
          assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              def member(suffix):
                  names=[name for name in archive.namelist() if name.endswith(suffix)]
                  assert len(names)==1,(suffix,names)
                  return archive.read(names[0])
              def document(suffix):
                  data=member(suffix); assert len(data)<2097152
                  return json.loads(data)
              result=document('android-reading/ui/result.json')
              assert result['source_sha']==source and result['run_id']==str(run) and result['attempt']=='1'
              assert result['accepted'] is True and result['reading_ui_accepted'] is True and result['checks']==16
              assert [row['phase'] for row in result['phases']]==['first','retry','reopen']
              assert [row['count'] for row in result['phases']]==[14,1,1]
              assert len({row['pid'] for row in result['phases']})==3
              assert all(row['passed'] and all(check['pass'] for check in row['checks']) for row in result['phases'])
              assert len(result['captures'])==15 and len(result['sources'])==21
              kill=result['real_postcommit_kill']; pending=member('android-reading/ui/killed-pending-request.json')
              request=json.loads(pending)
              assert kill['actual_postcommit_gate'] and kill['pid_before_stop'] and not kill['pid_after_stop']
              assert kill['request_sha256']==hashlib.sha256(pending).hexdigest() and kill['request_bytes']==len(pending)
              assert kill['revision_id']==request['revision'] and kill['annotation_id']==request['annotation']
              assert request['body']=='lost response exact request'
              native=document('android-reading/native/result.json')
              assert native['accepted'] and native['source_sha']==source and native['run_id']==str(run)
              navigation=document('android-navigation/ui/result.json')
              search=document('android-search/ui/result.json')
              assert navigation['accepted'] and navigation['checks']==18
              assert search['accepted'] and search['checks']==15
              for component in (navigation,search):
                  assert component['source_sha']==source and component['run_id']==str(run)
              compact={key:value for key,value in result.items() if key!='phases'}
              compact['phases']=[{key:row[key] for key in ('phase','pid','passed','count','checks')} for row in result['phases']]
              print(json.dumps({'diagnostic_only':True,'accepted':False,'original_source':source,'original_run':run,'original_attempt':1,
                    'original_job':job,'artifact':{'id':artifact,'bytes':len(raw),'sha256':expected_sha,'expires_at':info['expires_at']},
                    'original_reading':compact,'original_native':native,'original_search':{'accepted':True,'checks':15},
                    'original_navigation':{'accepted':True,'checks':18}},ensure_ascii=False),flush=True)
