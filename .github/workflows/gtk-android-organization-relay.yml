          script: |
            adb install -r -t build/wave3/artifacts/app-debug.apk
            adb install -r -t build/wave3/artifacts/relay-debug-androidTest.apk
            python3 tests/gtk_android_organization/android/run.py --phase android-final --previous build/org-input/state.json --output build/org-android-final --fixture build/wave3/network-fixture
