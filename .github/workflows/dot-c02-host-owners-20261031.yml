name: C02 actual host owner builds
on:
  push:
    branches: [codex/dot-c02-native-journal-20261030]
    paths:
      - examples/android/app/src/main/java/org/exreader/host/NativeLibrary.java
      - examples/android/app/src/main/java/org/exreader/host/BoundedEpub.java
      - examples/android/app/src/main/java/org/exreader/host/NativeSearch.java
      - examples/android/app/src/main/java/org/exreader/host/NativeNavigation.java
      - examples/apple/HostSDK.swift
      - .github/workflows/dot-c02-host-owners-20261031.yml
permissions: {contents: read}
defaults:
  run: {shell: bash}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: {C11_NDK: '27.0.12077973'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Guard frozen SDK and original migration contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 8357eafa28423a7ab93ba08b823af80f01ad1505 HEAD -- src include cmake CMakeLists.txt bindings
          git diff --exit-code a8d0b162d8c21617e4c2c837e3eb2b2174bbf69b HEAD -- extras/migration/windows_coordinator_hardening_20261030 tests/migration/windows_coordinator_hardening_20261030 extras/migration/windows_coordinator_cas_20261030 tests/migration/windows_coordinator_cas_20261030
          git diff --exit-code a8d0b162d8c21617e4c2c837e3eb2b2174bbf69b HEAD -- extras/migration/windows_admission_lease_20261030
          git cat-file -e ccd7fec67eb8aa463b09533ce320820f2da472d9:extras/migration/windows_admission_lease_20261030/src/lm_win_lease.c
      - name: Prepare Android tools
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" 