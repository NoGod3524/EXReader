name: Reader preferences
on:
  push:
    branches: [codex/reader-preferences]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumers:
    name: preferences consumers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-2022
            platform: Windows
          - os: macos-14
            platform: macOS
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source, common start, protected SDK, schema and path ownership
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor c3511a011eefbf1fba1d20908f000cef22b1ced2 HEAD
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code f32bb8aa18ed3de286900f19ce4230fd93435dd0 HEAD -- apps/reader/store/001_catalog.sql
          git diff --exit-code c3511a011eefbf1fba1d20908f000cef22b1ced2 HEAD -- examples apps/reader/commands apps/reader/desktop apps/reader/desktop-metadata apps/reader/reading-state apps/reader/revisions apps/reader/session apps/reader/store apps/reader/sync
          if git diff --name-only c3511a011eefbf1fba1d20908f000cef22b1ced2 HEAD | grep -v -E '^(apps/reader/preferences/|tests/reader_preferences/|\.github/workflows/reader-preferences\.yml$|docs/READER-PREFERENCES\.md$|docs/validation/reader-preferences\.json$)'; then
            echo "files outside the F3 ownership list changed"; exit 1
          fi
      - name: Enter Windows native compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and install the optional preferences package
        run: |
          mkdir -p build/pref-logs
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "S_WS=$ws" >> "$GITHUB_ENV"
          cmake -S apps/reader/preferences -B build/pref -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/pref-stage" 2>&1 | tee build/pref-logs/package-configure.log
          cmake --build build/pref --parallel 4 --verbose 2>&1 | tee build/pref-logs/package-build.log
          cmake --install build/pref 2>&1 | tee build/pref-logs/package-install.log
      - name: Compile isolated C and C++ consumers from the installed package only
        run: |
          cmake -S tests/reader_preferences/consumer -B build/pref-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$S_WS/build/pref-stage" -DEXR_PREFERENCES_SOURCE="$S_WS/apps/reader/preferences/src" -DEXR_PREFERENCES_INCLUDE="$S_WS/apps/reader/preferences/include" 2>&1 | tee build/pref-logs/consumer-configure.log
          cmake --build build/pref-consumer --verbose 2>&1 | tee build/pref-logs/consumer-build.log
      - name: Run installed consumers, cross-process and termination checks
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          python3 tests/reader_preferences/make_preferences_fixtures.py build/pref-fixtures 2>&1 | tee build/pref-logs/fixtures.log
          python3 tests/reader_preferences/check_preferences.py --consumer "build/pref-consumer/preferences-c-consumer$exe" --cpp "build/pref-consumer/preferences-cpp-consumer$exe" --worker "build/pref-consumer/preferences-worker$exe" --fixtures build/pref-fixtures --installed build/pref-stage --output build/preferences-evidence --platform "${{ matrix.platform }}" 2>&1 | tee build/pref-logs/check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-preferences-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pref-logs/
            build/pref-fixtures/
            build/preferences-evidence/
            build/pref-stage/
            build/pref-consumer/preferences-c-consumer*
            build/pref-consumer/preferences-cpp-consumer*
            build/pref-consumer/preferences-worker*
            build/pref/CMakeCache.txt
          if-no-files-found: error
  evidence:
    name: strict preferences evidence
    needs: [consumers]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reader-preferences-*
          path: build/pref-artifacts
      - name: Authenticate all three platform ZIPs and compare named outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_preferences/check_artifacts.py build/pref-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-preferences-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pref-summary/
          if-no-files-found: error
