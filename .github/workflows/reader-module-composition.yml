name: Reader module composition
on:
  push:
    branches: [codex/reader-module-composition]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  START_SHA: f43baf9182d75907c0cb5d6f77048f27bca8c950
  FROZEN_SDK: 9854061be331fe603a1822d9b2b36ee357154927
  COMPOSITION_TESTS: tests/reader_module_composition
jobs:
  compose:
    name: one-prefix composition (${{matrix.key}})
    runs-on: ${{matrix.os}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux
          - os: windows-2022
            key: windows
          - os: macos-15
            key: macos

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
