name: Reader module composition
on:
  push:
    branches: [codex/reader-module-composition]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  START_SHA: f43baf9182d75907c0cb5d6f77048f27bca8c950
  FROZEN_SDK: 9854061be331fe603a1822d9b2b36ee357154927
  COMPOSITION_TESTS: tests/reader_module_composition
jobs:
  compose:
    name: one-prefix composition (${{matrix.key}})
    runs-on: ${{matrix.os}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            key: linux
          - os: windows-2022
            key: windows
          - os: macos-15
            key: macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require this source, the frozen SDK, schema1 and this package's own paths
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{GITHUB_SHA}}"
          git merge-base --is-ancestor "$START_SHA" HEAD
          git diff --exit-code "$FROZEN_SDK" HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings \
            .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code "$START_SHA" HEAD -- apps/reader/store/001_catalog.sql
          changed=$(git diff --name-only "$START_SHA" HEAD)
          for path in $changed; do
            case "$path" in
              tests/reader_module_composition/*|.github/workflows/reader-module-composition.yml|docs/READER-MODULE-COMPOSITION.md|docs/validation/reader-module-composition.json) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          echo "source guard accepted $(echo "$changed" | wc -l) paths"
      - name: Install Linux native TLS XML keyring and SHA dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev libsecret-1-dev pkg-config ninja-build

  aggregate:
    runs-on: ubuntu-22.04
    steps:
      - run: echo aggregate
