name: Windows composed host TXT progress
on:
  push:
    branches: [codex/reader-integrated-progress, codex/windows-wave3-txt-progress, codex/reader-txt-account, codex/reader-txt-select-copy, codex/reader-windows-txt-search, codex/windows-txt-original-export, codex/windows-txt-font-library, codex/windows-txt-reading-records, codex/windows-txt-annotation-exchange, codex/windows-txt-search-history, codex/windows-txt-offset-seek, codex/sdk-txt-span-lookup]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  composed:
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      EXR_COMPOSITION_CONTENT_BOUND: '1'
      EXR_COMPOSITION_TXT_PROGRESS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify source and parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bc9008ab0f1be5aed3ca430535bd2bde6f73b12d HEAD
      - name: Prepare native display
        run: python tests/reader_native_owner_repairs/display.py
      - name: Build and exercise the composed native Windows host
        run: python tests/reader_wave3_c09/build.py
      - name: Verify installed mixed original export API
        shell: pwsh
        run: |
          $prefix = "$pwd/build/c09/raw-stage;$pwd/build/c09/product-stage;$pwd/build/c09/sdk-stage"
          cmake -S tests/reader_txt_mixed_export -B build/txt-mixed-export -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$prefix"
          if ($LASTEXITCODE) { throw 'mixed exporter configure failed' }
          cmake --build build/txt-mixed-export --parallel 4
          if ($LASTEXITCODE) { throw 'mixed exporter build failed' }
          New-Item -ItemType Directory -Path build/txt-mixed-output | Out-Null
          & build/txt-mixed-export/txt-mixed-export.exe "$pwd/build/txt-mixed-output"
          if ($LASTEXITCODE) { throw 'mixed exporter validation failed' }
      - name: Preserve reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wave3-txt-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/c09/report.json
            build/c09/txt-progress/report.json
            build/c09/txt-progress/txt-page-*.bmp
            build/c09/txt-progress/txt-font-*.bmp
            build/c09/logs/
            build/native-owner-preflight/display.json
          if-no-files-found: warn
