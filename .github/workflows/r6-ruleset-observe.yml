name: Observe required reading check publisher
on:
  push:
    branches: [codex/r6-reading-release]
    paths: ['.github/workflows/r6-ruleset-observe.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  publisher:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the actual required-check publisher without changing repository rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'tools')
          from check_parallel_integration import fetch, require
          job = fetch('actions/jobs/120213612946')
          require(job['name'] == 'reading-required' and job['run_id'] == 39890734935 and
                  job['head_sha'] == '76eb39d768559692825b1ee2ac1bab16abc3d10d', 'unexpected observed job')
          check = fetch('check-runs/' + job['check_run_url'].rsplit('/', 1)[1])
          require(check['name'] == 'reading-required' and check['app']['slug'] == 'github-actions' and
                  check['head_sha'] == job['head_sha'] and check['app']['id'] > 0, 'unexpected check publisher')
          print(json.dumps({'diagnostic_only': True, 'rules_changed': False,
                            'observed_job': job['id'], 'check_id': check['id'],
                            'publisher': check['app']['slug'], 'integration_id': check['app']['id']}))
          PY
