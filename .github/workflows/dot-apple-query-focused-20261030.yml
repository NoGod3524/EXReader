name: Apple query helper focused validation
on:
  push:
    branches: [codex/dot-apple-observe-focused-20261031]
permissions:
  contents: read
  actions: read
env:
  EXR_APPLE_SDK_VERSION: '3.42.0'
  EXR_APPLE_PAGE_THEME: 'ON'
  EXR_APPLE_RAW3: 'OFF'
jobs:
  sdk:
    name: Team24 Apple installed ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact qualified Apple source and independent full wrapper
        run: python3 tools/reader_composition/dot_apple_complete_admission_20261029.py
      - name: Original checker and retained runner unchanged
        run: |
          test "$(git rev-parse HEAD:tools/check_apple_product.py)" = ed7f62597e01d4e045f679369805d27abc20b7bc
          git diff --exit-code 4a68d80fbaa524fc28f899d209d795248627080b HEAD -- \
            tests/reader_team24_apple/run_ui.py \
            tests/apple_host/EXReaderHostUITests.swift tests/apple_host/reading/ui \
            tests/apple_host/navigation/ui tests/apple_host/search/ui tests/apple_host/page_theme/ui
          test "$(git rev-parse HEAD:tests/reader_team24_apple/ui/FeaturesUITests.swift)" = fa974c4079e3a4d41322160249619bfb5b66d299
          python3 - <<'PY'
          import subprocess
          path = 'tests/reader_team24_apple/ui/FeaturesUITests.swift'
          marker = b'    func testBorrowedFontRollbackOriginalExportAndReadOnlySnapshot()'
          old = subprocess.check_output(['git', 'show', '622b9558f79eda07211e15c51bffcd728da6c553:' + path])
          new = subprocess.check_output(['git', 'show', 'HEAD:' + path])
          assert old.count(marker) == new.count(marker) == 1
          assert old[old.index(marker):] == new[new.index(marker):], 'original five feature bodies changed'
          PY
          git diff --exit-code 4a68d80fbaa524fc28f899d209d795248627080b HEAD -- \
            tests/apple_host/account tests/apple_host/organization tests/reader_apple_font/ui tests/apple_native_original/ui ':(exclude)tests/apple_native_original/ui/OriginalSaveUITests.swift' ':(exclude)tests/reader_apple_font/ui/FontReaderUITests.swift'
      - name: Checkout isolated original Apple owner
        uses: actions/checkout@v4
        with:
          ref: 937f61057b06c5c9de3b562046e52c91b5be62b9
          path: apple-owner-candidate
          fetch-depth: 0
      - name: Original strict Apple owner guard
        working-directory: apple-owner-candidate
        run: env GITHUB_SHA=937f61057b06c5c9de3b562046e52c91b5be62b9 python3 tests/reader_team24_apple/guard_owner.py
      - name: Actions-only driver syntax
        run: |
          python3 -m compileall -q tests/apple_sdk342_host tests/reader_team24_apple
          ruby -c tests/apple_host/make_xcodeproj.rb
          ruby -c tests/reader_team24_apple/make_project.rb
      - name: Actual frozen 3.42 SDK and same-source installed modules
        run: python3 tests/apple_sdk342_host/build.py --target '${{ matrix.target }}'
      - name: Retain original owner guard
        run: cp apple-owner-candidate/build/team24-apple-guard.json build/raw3-ios-sdk/${{ matrix.target }}/team24-apple-guard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team24-apple-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            build/raw3-ios-sdk/${{ matrix.target }}/sdk/
            build/raw3-ios-sdk/${{ matrix.target }}/raw-products/
            build/raw3-ios-sdk/${{ matrix.target }}/*.json
          retention-days: 30
          if-no-files-found: error
  focused:
    name: Focused original five ${{ matrix.platform }}
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: team24-apple-sdk-*
          path: sdk-input
      - name: Original project generator dependency
        run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Original five cases with bounded app-only observation
        env:
          OBSERVE_PLATFORM: '${{ matrix.platform }}'
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, plistlib, re, subprocess, sys, threading
          from pathlib import Path
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          platform = os.environ['OBSERVE_PLATFORM']
          out = Path('build/apple-observe') / platform
          out.mkdir(parents=True, exist_ok=False)
          evidence = Path('build/team24-apple') / platform / 'evidence'
          report = {'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'platform':platform,'errors':[],'scope':'redacted app/test metadata only; no extra AX or launch'}
          def save(name, value):
              (out/name).write_text(json.dumps(value,indent=2)+'\n')
          def command(argv, timeout=20):
              try:
                  r=subprocess.run(argv,capture_output=True,text=True,timeout=timeout)
                  return r.returncode,r.stdout
              except Exception as e:
                  report['errors'].append({'operation':argv[:3],'exception':type(e).__name__})
                  return -1,''
          def utc():return dt.datetime.now(dt.timezone.utc).isoformat()
          code,version=command(['xcodebuild','-version'])
          report['xcode_version']=version.strip() if code==0 else None
          code,raw=command(['xcrun','simctl','list','devices','available','--json'])
          udid=None
          if code==0:
              try:
                  data=json.loads(raw); prefix='iPhone' if platform=='iphone' else 'iPad'
                  runtime,name,udid=max((runtime,d['name'],d['udid']) for runtime,values in data['devices'].items() for d in values if d.get('isAvailable') and d['name'].startswith(prefix))
                  report['selected_before_runner']={'runtime':runtime,'device':name,'udid':udid}
              except Exception as e:report['errors'].append({'operation':'device-selection','exception':type(e).__name__})
          else:report['errors'].append({'operation':'device-selection','exit':code})
          stop=threading.Event(); samples=[]; window={}
          def observe_body():
              active=False
              for _ in range(1320):
                  if stop.wait(5):return
                  if not (evidence/'wave3-native-ui.log').exists():continue
                  if not active:active=True;window['start_utc']=utc()
                  if len(samples)>=300:report['sampling_capped']=True;return
                  code,text=command(['ps','-axo','pid=,ppid=,stat=,etime=,comm='],5)
                  rows=[]
                  if code:report['errors'].append({'operation':'process-snapshot','exit':code})
                  else:
                      for line in text.splitlines():
                          fields=line.strip().split(None,4)
                          if len(fields)!=5:continue
                          pid,ppid,state,elapsed,executable=fields; base=Path(executable).name
                          if not base.startswith('EXReaderHost') or not pid.isdigit() or not ppid.isdigit():continue
                          rows.append({'pid':int(pid),'ppid':int(ppid),'state':state,'elapsed':elapsed,'name':base})
                  samples.append({'utc':utc(),'processes':rows});save('process-timeline.json',samples)
          def observe():
              try:observe_body()
              except Exception as e:report['errors'].append({'operation':'observer-thread','exception':type(e).__name__})
          watcher=threading.Thread(target=observe,daemon=True)
          report['runner_started_utc']=utc();watcher.start();rc=125
          try:
              rc=subprocess.call([sys.executable,'tests/apple_features_repair_20261029/focused_runner.py','--platform',platform])
          finally:
              report['runner_exit']=rc;report['runner_ended_utc']=utc()
              stop.set();watcher.join(10);window['end_utc']=utc();report['window']=window
              if watcher.is_alive():report['errors'].append({'operation':'observer-thread-not-stopped'})
              save('process-timeline.json',samples)
              try:
                  result=json.loads((evidence/'result.json').read_text())
                  report['runner_identity']={k:result.get(k) for k in ('source_sha','run_id','attempt','platform','destination','accepted')}
                  dest=result.get('destination',{})
                  report['selected_matches_runner']=isinstance(dest,dict) and dest.get('udid')==udid and (result.get('source_sha'),str(result.get('run_id')),str(result.get('attempt'))) == (report['source'],report['run'],report['attempt'])
                  if not report['selected_matches_runner']:report['errors'].append({'operation':'device-identity-mismatch'})
              except Exception as e:report['errors'].append({'operation':'runner-result','exception':type(e).__name__})
              if udid:
                  code,container=command(['xcrun','simctl','get_app_container',udid,'org.exreader.host','app'])
                  report['installed_container_query_exit']=code
                  if code==0:
                      try:
                          info=plistlib.loads((Path(container.strip())/'Info.plist').read_bytes())
                          report['installed_identity']={k:info.get(k) for k in ('CFBundleIdentifier','CFBundleExecutable','CFBundleShortVersionString','EXRSourceSHA')}
                          built=plistlib.loads((Path('build/team24-apple')/platform/'derived-wave3/Build/Products/Debug-iphonesimulator/EXReaderHost.app/Info.plist').read_bytes())
                          report['built_identity']={k:built.get(k) for k in report['installed_identity']}
                          if report['installed_identity']!=report['built_identity']:report['errors'].append({'operation':'installed-built-identity-mismatch'})
                          if info.get('CFBundleIdentifier')!='org.exreader.host' or info.get('EXRSourceSHA')!=report['source']:report['errors'].append({'operation':'installed-identity-mismatch'})
                      except Exception as e:report['errors'].append({'operation':'installed-plist','exception':type(e).__name__})
                  else:report['errors'].append({'operation':'installed-container','exit':code})
              classes=('background assertion','Timed out','terminate','termination','launch','crash','denied')
              if udid and window.get('start_utc'):
                  begin=dt.datetime.fromisoformat(window['start_utc']).strftime('%Y-%m-%d %H:%M:%S%z')
                  end=dt.datetime.fromisoformat(window['end_utc']).strftime('%Y-%m-%d %H:%M:%S%z')
                  predicate='(process BEGINSWITH "EXReaderHost") OR ((process == "runningboardd" OR process == "SpringBoard" OR process == "testmanagerd") AND eventMessage CONTAINS "org.exreader.host")'
                  code,raw=command(['xcrun','simctl','spawn',udid,'log','show','--start',begin,'--end',end,'--style','ndjson','--predicate',predicate],60)
                  report['app_window_log_exit']=code;rows=[]
                  if code==0:
                      for line in raw.splitlines():
                          try:item=json.loads(line)
                          except ValueError:continue
                          message=str(item.get('eventMessage',''));labels=[x for x in classes if x.lower() in message.lower()]
                          if not labels:continue
                          rows.append({'timestamp':item.get('timestamp'),'pid':item.get('processID'),'process':Path(str(item.get('processImagePath',''))).name,'classes':labels,'numeric_error_codes':re.findall(r'(?:Code|code|errno)[=: ]+(-?\d+)',message)[:8]})
                          if len(rows)==1000:report['app_window_log_capped']=True;break
                  else:report['errors'].append({'operation':'app-window-log','exit':code})
                  save('app-window-log-redacted.json',rows)
              crashes=[]
              if window.get('start_utc'):
                  start=dt.datetime.fromisoformat(window['start_utc']).timestamp();finish=dt.datetime.fromisoformat(window['end_utc']).timestamp()
                  roots=[Path.home()/'Library/Logs/DiagnosticReports']
                  if udid:roots.append(Path.home()/'Library/Developer/CoreSimulator/Devices'/udid/'data/Library/Logs/CrashReporter')
                  for root in roots:
                      for path in sorted(root.glob('EXReaderHost*.ips')):
                          if len(crashes)>=20:report['crash_summary_capped']=True;break
                          try:
                              if not start<=path.stat().st_mtime<=finish+5:continue
                              if path.stat().st_size>8*1024*1024:report['errors'].append({'operation':'crash-size-cap'});continue
                              text=path.read_text(errors='replace');decoder=json.JSONDecoder();first,offset=decoder.raw_decode(text)
                              rest=text[offset:].lstrip();body=decoder.raw_decode(rest)[0] if rest else first
                              proc=body.get('procName',first.get('app_name',''))
                              if not str(proc).startswith('EXReaderHost'):continue
                              termination=body.get('termination',{});exception=body.get('exception',{})
                              crashes.append({'process':proc,'pid':body.get('pid'),'timestamp':body.get('captureTime',first.get('timestamp')),'exception_type':exception.get('type'),'signal':exception.get('signal'),'termination_namespace':termination.get('namespace'),'termination_code':termination.get('code')})
                          except Exception as e:report['errors'].append({'operation':'crash-summary','exception':type(e).__name__})
              save('crash-summaries.json',crashes);timeline=[];log=evidence/'wave3-native-ui.log'
              if log.exists():
                  with log.open(errors='replace') as stream:
                      for number,line in enumerate(stream,1):
                          action=None
                          for label in ('Test Case','Start Test','Set Up','Tear Down','Terminate','Launch','Find','Check existence','Tap','Type','snapshot-tap-frame','Exceeded execution time','background assertion','Restarting after'):
                              if label.lower() in line.lower():action=label;break
                          if action is None:continue
                          elapsed=re.search(r't\s*=\s*([0-9.]+)s',line)
                          row={'line':number,'action':action,'elapsed_s':float(elapsed.group(1)) if elapsed else None,'cases':re.findall(r'test[A-Z][A-Za-z0-9_]+',line),'feature_ids':re.findall(r'features\.[A-Za-z0-9_.-]+',line)}
                          if 'snapshot-tap-frame' in line:row['frame_numbers']=re.findall(r'-?\d+(?:\.\d+)?',line.split('snapshot-tap-frame',1)[1])[:20]
                          timeline.append(row)
                          if len(timeline)==20000:report['errors'].append({'operation':'ui-timeline-cap'});break
              else:report['errors'].append({'operation':'missing-ui-log'})
              save('ui-timeline-redacted.json',timeline)
              bundle=evidence/'wave3.xcresult'
              if bundle.exists():
                  code,raw=command(['xcrun','xcresulttool','get','test-results','summary','--path',str(bundle),'--format','json'],120)
                  report['xcresult_summary_exit']=code
                  if code==0:
                      try:
                          summary=json.loads(raw)
                          report['test_totals']={k:summary.get(k) for k in ('totalTestCount','passedTests','failedTests','skippedTests','finishTime','startTime','result')}
                      except ValueError:report['errors'].append({'operation':'xcresult-summary-json'})
                  else:report['errors'].append({'operation':'xcresult-summary','exit':code})
              else:report['errors'].append({'operation':'missing-xcresult'})
              report['complete']=not report['errors'] and not any(report.get(k) for k in ('sampling_capped','app_window_log_capped','crash_summary_capped')) and bool(samples) and bool(timeline) and report.get('selected_matches_runner',False)
              save('receipt.json',report);print(json.dumps(report),flush=True)
          sys.exit(rc if rc else (0 if report['complete'] else 3))
          
          PY
      - name: Preserve bounded observation even when original tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-observe-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-observe/${{ matrix.platform }}/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-original-five-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/team24-apple/${{ matrix.platform }}/evidence/
          retention-days: 30
          if-no-files-found: error
  focused-font:
    name: Focused Apple 3.42 ${{ matrix.suite }} ${{ matrix.platform }}
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, ipad]
        suite: [font]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: team24-apple-sdk-*
          path: sdk-input
      - name: Original project generator dependency
        run: ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
      - name: Unchanged original suite on authenticated same-run 3.42 installation
        run: python3 tests/apple_sdk342_host/supplemental.py --platform '${{ matrix.platform }}' --suite '${{ matrix.suite }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-sdk342-supplemental-${{ matrix.suite }}-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/apple-sdk342-supplemental/${{ matrix.platform }}/${{ matrix.suite }}/
            build/apple-font/${{ matrix.platform }}/evidence/
            build/apple-native-original/${{ matrix.platform }}/*.log
            build/apple-native-original/${{ matrix.platform }}/result.json
            build/apple-native-original/${{ matrix.platform }}/native.xcresult/
            build/apple-native-original/${{ matrix.platform }}/source.epub
            build/apple-native-original/${{ matrix.platform }}/saved.epub
            build/account-terminal/
            !build/**/derived/**
            !build/**/account-derived/**
            !build/**/failure-derived/**
            !build/**/*.key
          retention-days: 30
          if-no-files-found: error
