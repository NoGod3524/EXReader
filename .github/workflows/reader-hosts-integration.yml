  hosts-summary:
    name: authenticate native hosts and retain actual palette failures
    needs: [compose, aggregate, search, summary, gtk, android]
    if: ${{ always() && github.event.inputs.verify_run == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install independent PNG decoding for raw viewport proof
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Reject incomplete source-bound host reports
        run: python3 tests/reader_hosts_integration/final.py --self-test
      - name: Authenticate exact-attempt jobs and raw ZIP reports
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: '${{ toJSON(needs) }}'
        run: python3 tests/reader_hosts_integration/final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-hosts-integration-summary-${{github.run_id}}-${{github.run_attempt}}
          path: build/hosts-summary/result.json
          if-no-files-found: error
  inspect:
    name: inspect preserved source or authenticate six same-source Apple suites
    needs: pin
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.verify_run != '' && github.event.inputs.verify_run != 'syntax' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install independent PNG decoding for raw viewport proof
        if: inputs.verify_run != 'apple'
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Authenticate the preserved source and reports with the repaired verifier
        if: ${{ !startsWith(inputs.verify_run, 'nav:') && inputs.verify_run != 'apple' }}
        env:
          GH_TOKEN: ${{github.token}}
          INSPECT_RUN: ${{inputs.verify_run}}
        run: python3 tests/reader_hosts_integration/final.py --inspect-run "$INSPECT_RUN"
      - name: Authenticate all six original Apple workflows at this exact source
        if: inputs.verify_run == 'apple'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RUNS: ${{ inputs.apple_runs }}
        run: python3 tests/reader_hosts_integration/apple.py
      - name: Install native runtime for original-program navigation diagnostics
        if: startsWith(inputs.verify_run, 'nav:')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libsecret-1-0 libcurl4 libxml2 libssl3 at-spi2-core libatk-adaptor python3-gi gir1.2-atspi-2.0 xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil dbus-x11
      - name: Authenticate original ZIP program and unchanged navigation source
        if: startsWith(inputs.verify_run, 'nav:')
        env:
          GH_TOKEN: ${{github.token}}
          PROBE: ${{inputs.verify_run}}
        run: |
          python3 tests/reader_hosts_integration/probe_navigation.py "${PROBE#nav:}"
          python3 tests/linux_host/generate_fixed.py build/navigation-probe/fixed-inputs
      - name: Diagnose native focus acknowledgment and actual scanning without granting current production
        if: startsWith(inputs.verify_run, 'nav:')
        env:
          GTK_NAVIGATION_DIAGNOSTIC_ONLY: 'true'
        run: |
          mkdir -p build/gtk-atspi-client
          git show 67e2f8c4941205c5581e82fd5a1469d18f696019:tests/reader_a11y_gtk/atspi_client.py > build/gtk-atspi-client/atspi_client.py
          xvfb-run -a -s '-screen 0 1440x3600x24' dbus-run-session -- bash -euc '
            export PYTHONPATH="$PWD/build/gtk-atspi-client"
            openbox >build/navigation-probe/openbox.log 2>&1 &
            wm=$!
            trap "kill $wm || true" EXIT
            gsettings set org.gnome.desktop.interface toolkit-accessibility true
            gsettings set org.gnome.desktop.a11y.applications screen-reader-enabled true
            /usr/bin/python3 tests/reader_gtk_navigation/check_ui.py --payload "$NAV_PROBE_PAYLOAD" --fixtures build/navigation-probe/fixtures --fixed-inputs build/navigation-probe/fixed-inputs --output build/navigation-probe/ui
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-hosts-inspection-${{github.run_id}}-${{github.run_attempt}}
          path: |
            build/hosts-summary/result.json
            build/navigation-probe/input.json
            build/navigation-probe/original-report.json
            build/navigation-probe/openbox.log
            build/navigation-probe/ui/
            build/apple-common-evidence/
          if-no-files-found: error
