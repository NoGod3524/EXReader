name: Android native reader session acceptance
on:
  push:
    branches: [codex/reader-android-sync-session]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Record identity and preserve frozen SDK schema and delivered packages
        run: |
          mkdir -p build/session-android/logs
          git rev-parse HEAD > build/session-android/logs/source.txt
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures .github/workflows/native.yml .github/workflows/reliability.yml bindings
          git diff --exit-code 84b661d4111015441e7501347fa080c01717b0e8 HEAD -- apps/reader extras/webdav tests/webdav_android
          python -m py_compile tests/reader_session_android/run_export.py
      - name: Install Android compiler and API34 emulator
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.1" "ndk;27.2.12479018" "emulator" "system-images;android-34;default;x86_64"
      - name: Build and install the frozen public library SDK targeting API26
        run: |
          toolchain="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          echo "SESSION_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          cmake -S . -B build/session-android/sdk -G Ninja -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/session-android/sdk-stage" -DEXR_BUILD_TOOLS=OFF -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_JNI=OFF -DEXR_ENABLE_LIBRARY=ON -DEXR_ENABLE_AUDIO=OFF -DEXR_ENABLE_PDF=ON -DEXR_ENABLE_PDF_EDIT=OFF -DEXR_ENABLE_PDF_CRYPTO=OFF -DEXR_ENABLE_AAC=OFF -DEXR_ENABLE_TEXT_INDEX=OFF -DEXR_BUILD_TEXT_INDEX=OFF -DEXR_ENABLE_IMAGE_WEBP=OFF -DEXR_ENABLE_IMAGE_TIFF=OFF -DEXR_ENABLE_IMAGE_AVIF=OFF -DEXR_BUILD_SHARED_COMPAT=OFF 2>&1 | tee build/session-android/logs/sdk-configure.log
          cmake --build build/session-android/sdk --parallel 4 --target install 2>&1 | tee build/session-android/logs/sdk-build.log
      - name: Install original sideload package and compile public SDK owner consumer
        run: |
          cmake -S extras/sideload -B build/session-android/sideload -G Ninja -DCMAKE_TOOLCHAIN_FILE="$SESSION_TOOLCHAIN" -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DEXR_SDK="$PWD/build/session-android/sdk-stage" -DCMAKE_INSTALL_PREFIX="$PWD/build/session-android/sideload-stage" 2>&1 | tee build/session-android/logs/sideload-configure.log
          cmake --build build/session-android/sideload --parallel 4 --target install 2>&1 | tee build/session-android/logs/sideload-build.log
          gradle -p tests/reader_session_android/android --no-daemon --stacktrace :session:assembleDebug :session:assembleDebugAndroidTest :session:assembleRelease 2>&1 | tee build/session-android/logs/gradle.log
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Actual SDK owner import and public original export in Android private storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python tests/reader_session_android/run_export.py --output build/session-android/export
      - name: Preserve SDK consumer identity native logs and every export result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-session-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/session-android/logs/
            build/session-android/export/
            build/session-android/sdk-stage/
            build/session-android/sideload-stage/
            tests/reader_session_android/android/session/build/outputs/apk/
          if-no-files-found: error
