name: Reader account profiles
on:
  push:
    branches: [codex/reader-account-profiles, codex/reader-account-profiles-review]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  profiles:
    name: account profiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
          - os: windows-2022
            platform: Windows
          - os: macos-15
            platform: macOS
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fixed start, frozen SDK, unchanged schema and owned paths only
        run: |
          FIXED=f43baf9182d75907c0cb5d6f77048f27bca8c950
          SDK=9854061be331fe603a1822d9b2b36ee357154927
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$FIXED" HEAD
          git diff --exit-code "$SDK" HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code "$FIXED" HEAD -- apps/reader/store/001_catalog.sql apps/reader/store/native
          git diff --exit-code "$FIXED" HEAD -- apps/reader/session apps/reader/sync apps/reader/revisions extras/webdav
          allowed='^(apps/reader/account-profiles/|tests/reader_account_profiles/|\.github/workflows/reader-account-profiles\.yml$|docs/READER-ACCOUNT-PROFILES\.md$|docs/validation/reader-account-profiles\.json$)'
          changed=$(git diff --name-only "$FIXED" HEAD)
          bad=$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)
          test -z "$bad" || { echo "unowned path: $bad"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native TLS and XML development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config
      - name: Use the Apple SDK libcurl through a fixture-only pkg-config entry
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config
          sdkroot=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p build/ap-apple-pkgconfig
          version=$(/usr/bin/curl --version | awk 'NR==1 {print $2}')
          printf 'prefix=%s/usr\nName: libcurl\nDescription: Apple SDK system libcurl\nVersion: %s\nLibs: -L%s/usr/lib -lcurl\nCflags:\n' "$sdkroot" "$version" "$sdkroot" > build/ap-apple-pkgconfig/libcurl.pc
          cat build/ap-apple-pkgconfig/libcurl.pc
          echo "PKG_CONFIG_PATH=$PWD/build/ap-apple-pkgconfig" >> "$GITHUB_ENV"
          /usr/bin/curl --version
          xcodebuild -version
      - name: Enter the native Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c ('"' + $bat + '" >nul && set') | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Record the source and build the unchanged host chain
        run: |
          set -o pipefail
          mkdir -p build/ap-logs
          git rev-parse HEAD > build/ap-logs/source.txt
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "AP_WS=$ws" >> "$GITHUB_ENV"
          echo "AP_PREFIXES=$ws/build/ap-session-stage;$ws/build/ap-sync-stage;$ws/build/ap-rev-stage;$ws/build/ap-dav-stage;$ws/build/ap-product-stage;$ws/build/ap-prefix" >> "$GITHUB_ENV"
          cmake -S apps/reader/store/native -B build/ap-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/ap-product-stage" 2>&1 | tee build/ap-logs/product-configure.log
          cmake --build build/ap-product --parallel 4 2>&1 | tee build/ap-logs/product-build.log
          cmake --install build/ap-product 2>&1 | tee build/ap-logs/product-install.log
          cmake -S extras/webdav -B build/ap-dav -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/ap-dav-stage" 2>&1 | tee build/ap-logs/dav-configure.log
          cmake --build build/ap-dav --parallel 4 2>&1 | tee build/ap-logs/dav-build.log
          cmake --install build/ap-dav 2>&1 | tee build/ap-logs/dav-install.log
          cmake -S apps/reader/revisions -B build/ap-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$ws/build/ap-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/ap-rev-stage" 2>&1 | tee build/ap-logs/revisions-configure.log
          cmake --build build/ap-revisions --parallel 4 2>&1 | tee build/ap-logs/revisions-build.log
          cmake --install build/ap-revisions 2>&1 | tee build/ap-logs/revisions-install.log
          cmake -S apps/reader/sync -B build/ap-sync -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ws/build/ap-rev-stage;$ws/build/ap-dav-stage;$ws/build/ap-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/ap-sync-stage" 2>&1 | tee build/ap-logs/sync-configure.log
          cmake --build build/ap-sync --parallel 4 2>&1 | tee build/ap-logs/sync-build.log
          cmake --install build/ap-sync 2>&1 | tee build/ap-logs/sync-install.log
          cmake -S apps/reader/session -B build/ap-session -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$ws/build/ap-sync-stage;$ws/build/ap-rev-stage;$ws/build/ap-dav-stage;$ws/build/ap-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/ap-session-stage" 2>&1 | tee build/ap-logs/session-configure.log
          cmake --build build/ap-session --parallel 4 2>&1 | tee build/ap-logs/session-build.log
          cmake --install build/ap-session 2>&1 | tee build/ap-logs/session-install.log
      - name: Build and install EXReaderAccountProfiles with no SDK or product dependency
        run: |
          set -o pipefail
          cmake -S apps/reader/account-profiles -B build/ap-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$AP_WS/build/ap-prefix" 2>&1 | tee build/ap-logs/package-configure.log
          cmake --build build/ap-package --parallel 4 --verbose 2>&1 | tee build/ap-logs/package-build.log
          cmake --install build/ap-package 2>&1 | tee build/ap-logs/package-install.log
      - name: Compile independent C and C++ consumers from the installed prefix
        run: |
          set -o pipefail
          cmake -S tests/reader_account_profiles/consumer -B build/ap-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$AP_PREFIXES" -DEXR_ACCOUNT_PROFILES_SOURCE="$AP_WS/apps/reader/account-profiles/src" -DEXR_ACCOUNT_PROFILES_INCLUDE="$AP_WS/apps/reader/account-profiles/include" 2>&1 | tee build/ap-logs/consumer-configure.log
          cmake --build build/ap-consumer --parallel 4 --verbose 2>&1 | tee build/ap-logs/consumer-build.log
      - name: Judge every named contract against the installed package
        run: |
          set -o pipefail
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          python3 tests/reader_account_profiles/check_account_profiles.py --probe "build/ap-consumer/profiles-probe$exe" --session "build/ap-consumer/profiles-session-consumer$exe" --worker "build/ap-consumer/profiles-worker$exe" --prefix build/ap-prefix --work build/ap-work --output build/ap-evidence --platform "${{ matrix.platform }}" 2>&1 | tee build/ap-logs/check.log
      - name: Build the package and probe with address and undefined-behaviour sanitizers
        if: always() && runner.os == 'Linux'
        run: |
          set -o pipefail
          flags="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake -S apps/reader/account-profiles -B build/ap-asan-package -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="$flags" -DCMAKE_INSTALL_PREFIX="$AP_WS/build/ap-asan-prefix" 2>&1 | tee build/ap-logs/asan-package-configure.log
          cmake --build build/ap-asan-package --parallel 4 2>&1 | tee build/ap-logs/asan-package-build.log
          cmake --install build/ap-asan-package 2>&1 | tee build/ap-logs/asan-package-install.log
          cmake -S tests/reader_account_profiles/consumer -B build/ap-asan-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DEXR_ACCOUNT_PROFILES_SESSION=OFF -DCMAKE_PREFIX_PATH="$AP_WS/build/ap-asan-prefix" -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DEXR_ACCOUNT_PROFILES_SOURCE="$AP_WS/apps/reader/account-profiles/src" -DEXR_ACCOUNT_PROFILES_INCLUDE="$AP_WS/apps/reader/account-profiles/include" 2>&1 | tee build/ap-logs/asan-consumer-configure.log
          cmake --build build/ap-asan-consumer --parallel 4 2>&1 | tee build/ap-logs/asan-consumer-build.log
      - name: Exercise the sanitized package and record the result
        if: always() && runner.os == 'Linux'
        run: |
          mkdir -p build/ap-evidence
          export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1"
          export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          set -e
          S=build/ap-asan-work/store
          rm -rf build/ap-asan-work
          mkdir -p "$S"
          P=build/ap-asan-consumer/profiles-probe
          W=build/ap-asan-consumer/profiles-worker
          "$P" info > /dev/null
          "$P" add "$S" a1000000-0000-4000-8000-000000000001 b1000000-0000-4000-8000-000000000001 https://asan.example/reader/ 阅读器 | tee build/ap-logs/asan-add.log
          "$P" load "$S" | tee build/ap-logs/asan-load.log
          "$P" activation "$S" a1000000-0000-4000-8000-000000000001 | tee build/ap-logs/asan-activation.log
          "$P" verify-tampered "$S" a1000000-0000-4000-8000-000000000001 | tee build/ap-logs/asan-verify.log
          "$P" verify-nonterminated | tee build/ap-logs/asan-nonterminated-plan.log
          "$W" add "$S" a1000000-0000-4000-8000-000000000002 b1000000-0000-4000-8000-000000000002 https://asan.example/reader/ two --cancel-before-rename | tee build/ap-logs/asan-cancel.log
          "$P" add-gen "$S" a1000000-0000-4000-8000-000000000003 b1000000-0000-4000-8000-000000000003 https://asan.example/reader/ three 0 | tee build/ap-logs/asan-conflict.log
          printf 'failures=0\n' > build/ap-evidence/sanitizer.txt
          echo "address and undefined sanitizers reported no failure"
      - name: Preserve logs, the work tree, every failure and the installed prefix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-account-profiles-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ap-logs/
            build/ap-work/
            build/ap-evidence/
            build/ap-asan-work/
            build/ap-prefix/
            build/ap-session-stage/
            build/ap-consumer/profiles-probe*
            build/ap-consumer/profiles-session-consumer*
            build/ap-consumer/profiles-worker*
            build/ap-asan-consumer/profiles-probe*
            build/ap-asan-consumer/profiles-worker*
            build/ap-consumer/CMakeCache.txt
            build/ap-package/CMakeCache.txt
            build/ap-product/CMakeCache.txt
          if-no-files-found: error
  evidence:
    name: same-run artifact evidence
    needs: profiles
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifact ids, bytes, digests and report identity in the cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_account_profiles/check_artifacts.py --output build/ap-artifact-evidence
      - name: Preserve the artifact verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-account-profiles-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ap-artifact-evidence/
          if-no-files-found: error
