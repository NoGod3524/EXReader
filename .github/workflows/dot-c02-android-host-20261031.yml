name: C02 actual Android app-UID admission and retained source
on:
  push:
    branches: [codex/dot-c02-native-journal-20261030]
    paths:
      - extras/migration/posix_c02_admission_20261031/**
      - extras/migration/posix_c02_sdk_admission_20261031/**
      - extras/android-import-entry/sample/**
      - tests/reader_android_import_entry/**
      - examples/android/app/src/main/java/org/exreader/host/NativeLibrary.java
      - examples/android/app/src/main/java/org/exreader/host/NativeAdmission.java
      - examples/android/app/src/main/java/org/exreader/host/BookStore.java
      - examples/android/app/src/main/java/org/exreader/host/MainActivity.java
      - examples/android/app/src/main/cpp/**
      - examples/android/app/build.gradle
      - tests/migration/android_c02_host_20261031/**
      - tools/android_c02.py
      - tools/build_android_host.py
      - .github/workflows/dot-c02-android-host-20261031.yml
  workflow_dispatch:
permissions: {contents: read}
defaults:
  run: {shell: bash}
jobs:
  import-entry-sample:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Freeze the SDK used by this installed Context adapter
        run: git diff --exit-code 8357eafa28423a7ab93ba08b823af80f01ad1505 HEAD -- src include cmake CMakeLists.txt bindings
      - name: Record source identity
        run: |
          mkdir -p build/android-import-entry
          python - <<'PY'
          import json, os
          json.dump({k: os.environ[v] for k, v in [('source_sha', 'GITHUB_SHA'), ('run_id', 'GITHUB_RUN_ID'), ('attempt', 'GITHUB_RUN_ATTEMPT')]},
                    open('build/android-import-entry/identity.json', 'w'))
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Android tools
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-34;default;x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
          python -m pip install ninja==1.11.1.1
      - name: Build the frozen SDK, sideload module and import-entry native component (Release and Debug, API 26)
        run: |
          python tests/reader_android_import_entry/stage_sdk.py --prefix "$PWD/stage/entry" --work "$PWD/build/android-import-entry/native"
          cp build/android-import-entry/native/stage.json build/android-import-entry/stage.json
      - name: Compile the Android library and probe apps (API 26, Debug and Release)
        run: |
          gradle -p extras/android-import-entry/android --no-daemon --stacktrace :importentry:assembleDebug :importentry:assembleRelease 2>&1 | tee build/android-import-entry/gradle-library.log
          gradle -p tests/reader_android_import_entry/android --no-daemon --stacktrace :importentry:assembleDebug :importentry:assembleRelease :app:assembleDebug :app:assembleRelease :source:assembleDebug -PexrSdk="$PWD/stage/entry" 2>&1 | tee build/android-import-entry/gradle-probe.log
          python tests/reader_android_import_entry/audit_packages.py --stage "$PWD/stage/entry" --work "$PWD/build/android-import-entry/native" --output build/android-import-entry
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Real DocumentsProvider, share intents, grants, lifecycle and process kills on API 34, then installed-SDK import and read-back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python tests/reader_android_import_entry/run_device.py --importer tests/reader_android_import_entry/android/app/build/outputs/apk/debug/app-debug.apk --source tests/reader_android_import_entry/android/source/build/outputs/apk/debug/source-debug.apk --output build/android-import-entry
      - name: Preserve sample authority and SDK bytes under the app UID
        if: always()
        run: |
          mkdir -p build/android-import-entry
          timeout 20s adb exec-out run-as org.exreader.importprobe tar -cf - no_backup/c02-admission files/library.db > build/android-import-entry/sample-authority-raw.tar 2> build/android-import-entry/sample-authority-pull.stderr || true
      - name: Preserve source-bound evidence and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-android-import-entry-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/android-import-entry/*.json
            build/android-import-entry/*.jsonl
            build/android-import-entry/*.log
            build/android-import-entry/*.txt
            build/android-import-entry/*.tar
            build/android-import-entry/*.stderr
            build/android-import-entry/native/stage.log
            stage/entry/lib/cmake/EXReaderAndroidImportEntry/
            stage/entry/include/exr_android_import_entry.h
            stage/entry/lib/libexr_android_import_entry.a
            extras/android-import-entry/android/importentry/build/outputs/aar/
            tests/reader_android_import_entry/android/app/build/outputs/apk/
            tests/reader_android_import_entry/android/source/build/outputs/apk/
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Frozen SDK and coordinator remain unchanged
        run: |
          set -euo pipefail
          git diff --exit-code 8357eafa28423a7ab93ba08b823af80f01ad1505 HEAD -- src include cmake CMakeLists.txt bindings
          git diff --exit-code a8d0b162d8c21617e4c2c837e3eb2b2174bbf69b HEAD -- extras/migration/windows_coordinator_hardening_20261030 tests/migration/windows_coordinator_hardening_20261030 extras/migration/windows_coordinator_cas_20261030 tests/migration/windows_coordinator_cas_20261030 extras/migration/windows_admission_lease_20261030
          mkdir -p evidence/android-c02
      - name: Install pinned Android compiler and emulator
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-34;default;x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
          python -m pip install ninja==1.11.1.1
      - name: Build installed admission archives and actual app
        run: |
          set -euo pipefail
          python tests/migration/android_c02_host_20261031/build.py 2>&1 | tee evidence/android-c02/build.log
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Actual app UID source lifetime and killed pending owner
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disable-linux-hw-accel: false
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python tests/migration/android_c02_host_20261031/run.py
      - name: Preserve current source and raw native evidence even on failure
        if: always()
        run: |
          mkdir -p evidence/android-c02
          git rev-parse HEAD > evidence/android-c02/source.txt
          timeout 20s adb logcat -d -v threadtime > evidence/android-c02/logcat-final.txt 2>&1 || true
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('evidence/android-c02')
          (root/'artifact-receipt.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],full_c02_acceptance=False),indent=2)+'\n')
          (root/'artifact-file-hashes.json').write_text(json.dumps([dict(path=str(p.relative_to(root)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.rglob('*')) if p.is_file()],indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-actual-android-${{ github.sha }}
          path: evidence/android-c02/
          include-hidden-files: true
          if-no-files-found: error
