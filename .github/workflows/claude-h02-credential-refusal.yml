name: Claude H02 credential worker refusal
on:
  push:
    branches: [codex/claude-h02-credential-refusal-20261030]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  BASE_SHA: bd28d49
jobs:
  probe:
    name: token and spawn feasibility probe (no host)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source scope guard
        run: |
          bad=$(git diff --name-only "$BASE_SHA" HEAD | grep -Ev '^(tests/claude_h02_credential_refusal/|\.github/workflows/claude-h02-credential-refusal\.yml$|docs/CLAUDE-H02-CREDENTIAL-REFUSAL\.md$)' || true)
          if test -n "$bad"; then echo "$bad"; exit 1; fi
      - name: Network-logon token, spawn route and same-token Credential Manager probe
        run: python tests/claude_h02_credential_refusal/check_refusal.py --probe --output build/h02-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-h02-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/h02-probe/
          if-no-files-found: error
  host:
    name: real host under network-logon token
    needs: probe
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enter native Windows compiler environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install one product provider and every native module the host consumes
        run: |
          ws=$(cygpath -m "$PWD")
          prefix="$ws/build/account-stage"
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "ACCOUNT_PREFIX=$prefix" >> "$GITHUB_ENV"
          mkdir -p build/account-logs
          cmake -S apps/reader/store/native -B build/account-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-product --parallel 4
          ctest --test-dir build/account-product --output-on-failure --no-tests=error --timeout 180
          cmake --install build/account-product
          cmake -S extras/webdav -B build/account-dav -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-dav --parallel 4
          cmake --install build/account-dav
          cmake -S apps/reader/revisions -B build/account-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-revisions --parallel 4
          cmake --install build/account-revisions
          for module in commands desktop-metadata sync session; do
            cmake -S "apps/reader/$module" -B "build/account-$module" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix"
            cmake --build "build/account-$module" --parallel 4
            cmake --install "build/account-$module"
          done
          cmake -S extras/credentials -B build/account-credentials -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/account-credentials --parallel 4
          cmake --install build/account-credentials
          cmake -S tests/reader_commands/consumer -B build/account-command-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/account-command-consumer --parallel 4
          cmake -S tests/reader_revisions/consumer -B build/account-revision-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/account-revision-consumer --parallel 4
      - name: Build and install the unmodified reading-library SDK and public original export module
        run: |
          cmake --preset reading-library 2>&1 | tee build/account-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/account-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/account-logs/sdk-install.log
          cmake -S extras/sideload -B build/account-sideload -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$ACCOUNT_PREFIX"
          cmake --build build/account-sideload --parallel 4
          cmake --install build/account-sideload
      - name: Build the installed reading-state adapter
        run: |
          cmake -S apps/reader/reading-state -B build/account-reading-state -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$ACCOUNT_PREFIX" -DCMAKE_INSTALL_PREFIX="$ACCOUNT_PREFIX" 2>&1 | tee build/account-logs/reading-state-configure.log
          cmake --build build/account-reading-state --parallel 4 2>&1 | tee build/account-logs/reading-state-build.log
          cmake --install build/account-reading-state 2>&1 | tee build/account-logs/reading-state-install.log
      - name: Build the actual Win32 host with account integration from examples/reader.c
        run: |
          cmake -S apps/reader/windows-account -B build/account-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DREADER_METADATA_PREFIX="$ACCOUNT_PREFIX" -DREADER_ACCOUNT_PREFIX="$ACCOUNT_PREFIX" 2>&1 | tee build/account-logs/host-configure.log
          cmake --build build/account-host --parallel 4 --verbose 2>&1 | tee build/account-logs/host-build.log
          test -f build/account-host/EXReaderProduct.exe
          test -f build/account-host/EXReaderShelfReview.exe
          test -f build/account-host/windows-host.map
      - name: Package the product
        run: |
          python3 tools/build_windows_host.py --sdk build/reading-library/stage --binary build/account-host/EXReaderProduct.exe --output build/account-package --static-reading
          test -f build/account-package/EXReader/EXReader.exe
      - name: Drive the real account dialog under the network-logon token
        run: python tests/claude_h02_credential_refusal/check_refusal.py --candidate build/account-package/EXReader/EXReader.exe --package build/account-package/EXReader --output build/h02-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-h02-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/h02-run/report.json
            build/account-logs/
            build/h02-run/dev/application.log
          if-no-files-found: warn
