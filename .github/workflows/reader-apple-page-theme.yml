name: Isolated Apple SDK3.41 native page themes
on:
  push:
    branches: [codex/reader-apple-page-theme]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  EXR_APPLE_SDK_VERSION: '3.41.0'
  EXR_APPLE_PAGE_THEME: 'ON'
jobs:
  sdk:
    name: SDK3.41 and installed products ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [macos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate exact SDK source and unchanged original business suites
        run: python3 tests/apple_host/page_theme/guard.py
      - name: Build the one SDK and installed optional products
        run: |
          target='${{ matrix.target }}'
          options=()
          if test "$target" = iphonesimulator; then
            options=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO)
          fi
          cmake -S . -B build/sdk -DCMAKE_BUILD_TYPE=Release -DEXR_BUILD_TESTS=OFF -DEXR_BUILD_TOOLS=OFF -DEXR_ENABLE_AAC=OFF "${options[@]}"
          cmake --build build/sdk --parallel 4
          cmake --install build/sdk --prefix "stage/$target"
          python3 tools/build_apple_product.py --sdk "stage/$target" --target "$target" --build build/product --sdk-version 3.41.0
          python3 tests/apple_host/evidence_contract.py sdk --root "stage/$target" --platform "$target" --output build/sdk-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-theme-sdk-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage/${{ matrix.target }}/
            build/sdk-identity.json
            build/apple-page-theme/guard.json
          include-hidden-files: true
          if-no-files-found: error
  native:
    name: Original OFF ON pixels and theme transaction checks
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apple-theme-sdk-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk-artifact
      - name: Syntax and real installed native consumers
        run: |
          python3 -m compileall -q tests/apple_host/page_theme tools/build_apple_product.py tools/build_apple_host.py
          python3 tests/apple_host/page_theme/test_protocol.py
          python3 tests/apple_host/page_theme/run_native.py --sdk sdk-artifact/stage/macos --resources build/apple-resources --output build/apple-theme-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-theme-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-theme-native/
          if-no-files-found: error
  ui:
    name: Real page theme UI ${{ matrix.platform }}
    needs: [sdk, native]
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: apple-theme-sdk-*
          path: sdk-artifacts
      - name: Prepare authored inputs and real native UI project
        run: |
          mkdir -p stage build/apple-theme-ui
          cp -R sdk-artifacts/*/stage/* stage/
          python3 tests/apple_host/prepare_fixtures.py --resources build/apple-resources
          python3 tests/apple_host/navigation/prepare_navigation_fixture.py --resources build/apple-resources
          python3 tests/apple_host/reading/prepare_reading_fixture.py --resources build/apple-resources
          python3 tests/apple_host/page_theme/prepare_fixtures.py --resources build/apple-resources
          ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          ruby tests/apple_host/make_xcodeproj.rb build/apple-theme-project build/apple-resources tests/apple_host/page_theme/ui
      - name: Native theme selection and real system appearance changes
        id: ui
        continue-on-error: true
        run: |
          target=iphonesimulator
          if test '${{ matrix.platform }}' = macos; then target=macos; fi
          python3 tests/apple_host/page_theme/run_ui.py --platform '${{ matrix.platform }}' \
            --project build/apple-theme-project/EXReaderHost.xcodeproj --sdk "stage/$target" --output build/apple-theme-ui
      - name: Authenticate raw observations installed providers and original attachments
        if: always()
        id: evidence
        continue-on-error: true
        run: |
          target=iphonesimulator
          app=build/ThemeDerivedData/Build/Products/Debug-iphonesimulator/EXReaderHost.app
          if test '${{ matrix.platform }}' = macos; then target=macos; app=build/ThemeDerivedData/Build/Products/Debug/EXReaderHost.app; fi
          python3 tests/apple_host/page_theme/collect_ui.py --platform '${{ matrix.platform }}' \
            --xcresult build/apple-theme-ui/theme.xcresult --output build/apple-theme-ui/evidence --app "$app" \
            --sdk-root "stage/$target" --sdk-identity "sdk-artifacts/apple-theme-sdk-$target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/build/sdk-identity.json" \
            --fixtures build/apple-resources/manifest.json --system-commands build/apple-theme-ui/system-commands.json \
            --destination build/apple-theme-ui/destination.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-theme-ui-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-theme-ui/
          if-no-files-found: error
      - if: always() && (steps.ui.outcome != 'success' || steps.evidence.outcome != 'success')
        run: exit 1
  fast-import:
    name: Real initialization and same-turn import publication
    needs: [sdk, native]
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: apple-theme-sdk-iphonesimulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk-artifact
      - name: Preserve both deterministic actual owner UI assertions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_host/page_theme/fast_import/run.py --sdk sdk-artifact/stage/iphonesimulator --sdk-identity sdk-artifact/build/sdk-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-theme-fast-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-shelf-publication/
          if-no-files-found: error
  summary:
    name: Strict same-source page theme summary
    if: always()
    needs: [sdk, native, ui, fast-import]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate producer jobs actual ZIP identities and raw reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/apple_host/page_theme/summarize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-theme-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-theme-summary/
          if-no-files-found: error
