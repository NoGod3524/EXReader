name: F09 accessibility audits on shared-source hosts
# Self-approved F09 budget (user delegation 2026-10-31): see _studio_ui_seal/F09-PLAN.md.
on:
  push:
    branches: [claude/f09-audit-20261101, claude/f09-joint-20261101]
    paths:
      - tests/f09_audit/**
      - .github/workflows/claude-f09-audit.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  C11_NDK: '27.0.12077973'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Shared candidate and frozen SDK
        shell: bash
        run: |
          git merge-base --is-ancestor 343bb94eb6513beaf5b344e7828342f6602a3b7b HEAD
          # F09 may change host code (examples/, apps/reader/) and its own files; never the frozen SDK,
          # the shared build, fixtures or any retained test or workflow.
          bad=$(git diff --name-only 343bb94eb6513beaf5b344e7828342f6602a3b7b HEAD | grep -Ev '^(tests/f09_audit/|\.github/workflows/claude-f09-(audit|apple)\.yml$|examples/|apps/reader/)' || true)
          test -z "$bad" || { echo "outside F09 audit scope: $bad"; exit 1; }
      - name: Build and install the independent public OPDSHash owner (as the F08 workflows on this base)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S extras/opds -B build/f09-hash-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON -DCMAKE_INSTALL_PREFIX="$PWD/build/f09-hash"
          cmake --build build/f09-hash-build --parallel 4
          cmake --install build/f09-hash-build
          echo "EXREADER_ORIGINAL_HASH_PREFIX=$(cygpath -m "$PWD/build/f09-hash")" >> "$GITHUB_ENV"
      - name: Install the UI Automation client used by the audit
        run: python -m pip install "uiautomation==2.0.29"
      - name: Build the shared-source Windows host and run the existing audit
        run: python tests/f09_audit/baseline.py windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f09/
            build/f06/windows-build/logs/
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shared candidate and frozen SDK
        run: |
          git merge-base --is-ancestor 343bb94eb6513beaf5b344e7828342f6602a3b7b HEAD
          # F09 may change host code (examples/, apps/reader/) and its own files; never the frozen SDK,
          # the shared build, fixtures or any retained test or workflow.
          bad=$(git diff --name-only 343bb94eb6513beaf5b344e7828342f6602a3b7b HEAD | grep -Ev '^(tests/f09_audit/|\.github/workflows/claude-f09-(audit|apple)\.yml$|examples/|apps/reader/)' || true)
          test -z "$bad" || { echo "outside F09 audit scope: $bad"; exit 1; }
      - name: Install the GTK build and AT-SPI audit dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev gnome-keyring libcurl4-openssl-dev libxml2-dev \
            libssl-dev pkg-config ninja-build at-spi2-core libatk-adaptor python3-gi gir1.2-atspi-2.0 gsettings-desktop-schemas \
            dbus dbus-x11 xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil
      - name: Build and install the independent public OPDSHash owner (as the F08 workflows on this base)
        run: |
          set -euo pipefail
          cmake -S extras/opds -B build/f09-hash-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON -DCMAKE_INSTALL_PREFIX="$PWD/build/f09-hash"
          cmake --build build/f09-hash-build --parallel 4
          cmake --install build/f09-hash-build
          echo "EXREADER_ORIGINAL_HASH_PREFIX=$(realpath "$PWD/build/f09-hash")" >> "$GITHUB_ENV"
      - name: Build the shared-source GTK host and run the existing audit on the accessibility bus
        run: |
          set -euo pipefail
          mkdir -p build/f09/logs
          # Same session setup as the retained GTK audit workflow (reader-a11y-gtk.yml).
          xvfb-run -a -s '-screen 0 1440x1100x24' dbus-run-session -- bash -euc '
            openbox > build/f09/logs/openbox.log 2>&1 &
            wm=$!
            trap "kill $wm || true" EXIT
            unset -v NO_AT_BRIDGE || true
            unset -v GTK_MODULES || true
            export GTK_A11Y=atspi
            gsettings set org.gnome.desktop.interface toolkit-accessibility true || true
            gsettings set org.gnome.desktop.a11y.applications screen-reader-enabled true || true
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress || true
            python3 tests/f09_audit/baseline.py linux
          ' 2>&1 | tee build/f09/logs/linux-session.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f09/
            build/f06/linux/
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shared candidate and frozen SDK
        run: |
          git merge-base --is-ancestor 343bb94eb6513beaf5b344e7828342f6602a3b7b HEAD
          # F09 may change host code (examples/, apps/reader/) and its own files; never the frozen SDK,
          # the shared build, fixtures or any retained test or workflow.
          bad=$(git diff --name-only 343bb94eb6513beaf5b344e7828342f6602a3b7b HEAD | grep -Ev '^(tests/f09_audit/|\.github/workflows/claude-f09-(audit|apple)\.yml$|examples/|apps/reader/)' || true)
          test -z "$bad" || { echo "outside F09 audit scope: $bad"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK, NDK and emulator (as F06)
        run: |
          python3 -m pip install 'PyYAML==6.0.3' ninja==1.11.1.1
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/emulator" >> "$GITHUB_PATH"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "cmake;3.22.1" "ndk;${C11_NDK}" "emulator" "system-images;android-34;default;x86_64"
          sudo apt-get update -qq && sudo apt-get install -y patchelf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the shared-source Android host as F06 does
        run: python3 tests/f09_audit/baseline.py android-prepare
      - name: Build the retained audit test APK
        run: |
          set -o pipefail
          mkdir -p build/a11y-android
          gradle -p tests/reader_a11y_android/harness --no-daemon --stacktrace :a11y:assembleDebug :a11y:assembleDebugAndroidTest 2>&1 | tee build/a11y-android/harness-build.log
      - name: Record source, run, host and harness identity
        run: |
          set -euo pipefail
          root=build/a11y-android
          mkdir -p "$root/apks"
          cp tests/reader_a11y_android/harness/a11y/build/outputs/apk/debug/a11y-debug.apk "$root/apks/"
          cp tests/reader_a11y_android/harness/a11y/build/outputs/apk/androidTest/debug/a11y-debug-androidTest.apk "$root/apks/"
          cp build/android-host/build.json "$root/host-build.json"
          git rev-parse HEAD > "$root/source.txt"
          echo "$GITHUB_RUN_ID" > "$root/run-id.txt"
          echo "$GITHUB_RUN_ATTEMPT" > "$root/attempt.txt"
          python3 -c "import hashlib,json; from pathlib import Path; r=Path('build/a11y-android'); json.dump({n:{'file':'apks/'+n,'size':(r/'apks'/n).stat().st_size,'sha256':hashlib.sha256((r/'apks'/n).read_bytes()).hexdigest()} for n in ('a11y-debug.apk','a11y-debug-androidTest.apk')}, open(r/'harness-apks.json','w'), indent=2)"
      - name: Run the retained audit on the installed shared-source host (API34)
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tests/reader_a11y_android/ci/emulator-audit.sh
      - name: Retained checker
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' }}
        run: |
          python3 tests/reader_a11y_android/check_reader_a11y_android.py --evidence build/a11y-android             --source "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"             --output build/a11y-android/audit-check.json || true
          cat build/a11y-android/audit-check.json | head -c 4000 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/a11y-android/
            build/android-host/build.json
            build/f06/android-build-step-*.sh
          if-no-files-found: warn
