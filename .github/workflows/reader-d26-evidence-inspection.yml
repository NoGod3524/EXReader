name: Inspect Windows TXT acceptance evidence
on:
  push:
    branches: [codex/reader-d26-evidence-inspection]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Inspect checks recorded by the existing Windows run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/NoGod3524/EXReader/actions/artifacts/12756054432/zip > evidence.zip
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('evidence.zip') as z:
              matches = [n for n in z.namelist() if n.endswith('txt-progress/report.json')]
              assert len(matches) == 1, matches
              report = json.loads(z.read(matches[0]))
          assert report['source_sha'] == '1d18dfa55f2b1fc712f14be8e0eb0644960ac0b1'
          print(json.dumps({'source_sha': report['source_sha'], 'accepted': report['accepted'],
                            'checks': [{'name': c['name'], 'passed': c['passed']} for c in report['checks']]},
                           ensure_ascii=True, sort_keys=True))
          PY
