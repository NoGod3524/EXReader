name: Inspect GTK relay failure evidence
on:
  push:
    branches: [codex/reader-d26-evidence-inspection]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: List retained failure evidence from the existing relay run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/NoGod3524/EXReader/actions/artifacts/12758475006/zip > evidence.zip
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('evidence.zip') as z:
              paths = [n for n in z.namelist() if 'original-account/' in n]
              print(json.dumps({'source_run': 40555059188, 'artifact': 12758475006, 'paths': paths}))
              for n in paths:
                  if n.endswith(('application.log', 'host.log', 'report.json')):
                      text = z.read(n).decode('utf-8', errors='replace')
                      print('EVIDENCE', n, text[-3000:])
          PY
