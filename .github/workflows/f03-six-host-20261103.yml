name: F03 six-host integration
permissions:
  contents: read
  actions: read
concurrency:
  group: f03-six-host-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[F03-PROJECTION]') && 'projection' || 'native' }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  EXR_APPLE_SDK_VERSION: 3.42.0
jobs:
  android:
    if: always() && (contains(github.event.head_commit.message, '[F03-ANDROID]') || contains(github.event.head_commit.message, '[F03-FULL]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_exrSdkVersion: 3.42.0
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Exact source SDK and frozen parser admission
      run: |
        python -m pip install PyYAML ninja==1.11.1.1
        python tests/f03_six_host_20261103/run.py admit
        sudo apt-get update -qq
        sudo apt-get install -y patchelf
    - name: Build actual raw3 synchronization host and native test APKs
      run: python tests/f03_six_host_20261103/run.py android-build
    - name: Enable actual emulator acceleration
      run: sudo chmod 666 /dev/kvm
    - name: Retain native organization UI recovery and synchronization regressions
      uses: reactivecircus/android-emulator-runner@v2
      with:
        disable-linux-hw-accel: false
        api-level: 34
        target: default
        arch: x86_64
        profile: pixel_6
        ram-size: 4096M
        cores: 4
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
        script: python tests/f03_six_host_20261103/run.py android-retained
    - uses: actions/download-artifact@v4
      if: contains(github.event.head_commit.message, '[F03-FULL]')
      with:
        name: f03-six-gtk-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/f03-input
    - name: Six actual cross-host organization receives and process restarts
      uses: reactivecircus/android-emulator-runner@v2
      with:
        disable-linux-hw-accel: false
        api-level: 34
        target: default
        arch: x86_64
        profile: pixel_6
        ram-size: 4096M
        cores: 4
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
        script: python tests/f03_six_host_20261103/run.py android-receive
      if: contains(github.event.head_commit.message, '[F03-FULL]')
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-six-android-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/f03-android-sync/
          build/wave3/artifacts/
          build/wave3/logs/
          build/wave3/network-fixture/public/
          !build/**/*.key

          build/f03-receipts/
          !build/**/private/**
          !build/**/key.pem
          !build/**/connection.json
        if-no-files-found: error
    needs:
    - gtk
  gtk:
    if: always() && (contains(github.event.head_commit.message, '[F03-SIX-HOST]') || contains(github.event.head_commit.message, '[F03-FULL]'))
      || contains(github.event.head_commit.message, '[F03-APPLE-RECEIVE]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Exact source SDK and frozen parser admission
      run: |
        python -m pip install PyYAML Pillow
        python tests/f03_six_host_20261103/run.py admit
    - name: Native prerequisites
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsecret-1-dev gnome-keyring libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config xvfb openbox xdotool xclip x11-utils wmctrl imagemagick python3-pil ninja-build
    - name: Build SDK 3.42 installed product and actual GTK host
      run: python tests/f03_six_host_20261103/run.py legacy build --host gtk --output build/f03-gtk-build.json
    - name: Original organization assertions and actual six-phase publication
      run: |
        python tests/f03_six_host_20261103/run.py legacy fixtures --output build/f03-originals
        xvfb-run -a -s '-screen 0 1440x2000x24' dbus-run-session -- bash -euc '
          openbox >build/f03-openbox.log 2>&1 & wm=$!; trap "kill $wm || true" EXIT
          for i in $(seq 1 100); do wmctrl -m >/dev/null 2>&1 && break; sleep .1; done
          wmctrl -m
          python tests/f03_six_host_20261103/run.py legacy gtk --mode retained --package build/package/EXReader-Linux --command-consumer build/command-consumer/command-consumer --output build/f03-retained-gtk
          previous=""
          for phase in create delete restore member-remove member-restore restart; do
            args=(); if test -n "$previous"; then args=(--previous "build/f03-author/$previous/wire/state.json"); fi
            python tests/f03_six_host_20261103/run.py legacy gtk --mode author --phase "$phase" --profile build/f03-author-profile --book build/f03-originals/gtk-organization.txt --package build/package/EXReader-Linux --output "build/f03-author/$phase" "${args[@]}"
            previous="$phase"
          done
        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-six-gtk-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/f03-*/
          build/f03-*.json
          build/f03-*.log
          build/package/EXReader-Linux/
          !build/**/key.pem
          !build/**/private/**
          !build/**/connection.json

          build/f03-receipts/
        if-no-files-found: error
  windows:
    if: always() && (contains(github.event.head_commit.message, '[F03-SIX-HOST]') || contains(github.event.head_commit.message, '[F03-WINDOWS]')
      || contains(github.event.head_commit.message, '[F03-FULL]'))
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Native display and UI dependencies
      run: |
        python -m pip install uiautomation==2.0.29 PyYAML Pillow
        python tests/reader_native_owner_repairs/display.py
        python tests/f03_six_host_20261103/run.py admit
    - name: Actual SDK 3.42 composed host with original retained checks
      run: python tests/f03_six_host_20261103/run.py legacy build --host windows --output build/f03-windows-build.json
    - uses: actions/download-artifact@v4
      if: contains(github.event.head_commit.message, '[F03-FULL]')
      with:
        name: f03-six-gtk-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/f03-input
    - name: Original actual Windows organization and cancellation suite
      run: python tests/f03_six_host_20261103/run.py windows-retained
    - name: Six actual cross-host organization receives and process restarts
      if: contains(github.event.head_commit.message, '[F03-FULL]')
      run: python tests/f03_six_host_20261103/run.py windows-receive
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-six-windows-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/c09/report.json
          build/c09/logs/
          build/c09/package/
          build/c09/compact22/
          build/c09/extracted-ui/
          build/f03-windows-build.json

          build/f03-receipts/
          build/organization-ui/
          !build/**/private/**
          !build/**/key.pem
          !build/**/connection.json
        if-no-files-found: error
    needs:
    - gtk
    env:
      EXR_COMPOSITION_CONTENT_BOUND: '1'
  apple:
    if: always() && (contains(github.event.head_commit.message, '[F03-SIX-HOST]') || contains(github.event.head_commit.message, '[F03-FULL]'))
      || contains(github.event.head_commit.message, '[F03-APPLE-RECEIVE]')
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(contains(github.event.head_commit.message, '[F03-APPLE-RECEIVE]') && '["macos"]' || '["macos","iphone","ipad"]')
          }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Native project dependencies and exact source admission
      run: |
        ruby -e "require 'xcodeproj'" >/dev/null 2>&1 || gem install xcodeproj --no-document
        python3 tests/f03_six_host_20261103/run.py admit
    - name: SDK 3.42 real host and unchanged six organization tests
      run: python3 tests/f03_six_host_20261103/run.py apple '${{ matrix.platform }}'
    - uses: actions/download-artifact@v4
      if: contains(github.event.head_commit.message, '[F03-FULL]') || contains(github.event.head_commit.message, '[F03-APPLE-RECEIVE]')
      with:
        name: f03-six-gtk-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/f03-input
    - name: Six actual cross-host organization receives and process restarts
      if: contains(github.event.head_commit.message, '[F03-FULL]') || contains(github.event.head_commit.message, '[F03-APPLE-RECEIVE]')
      run: python3 tests/f03_six_host_20261103/run.py apple-receive '${{ matrix.platform }}'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-six-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/dot-f03-native/${{ matrix.platform }}/
          build/f03-${{ matrix.platform }}-build.json
          build/raw3-ios-sdk/**/sdk342-installed-identity.json
          !build/**/derived/Index.noindex/**
          !build/**/derived/ModuleCache.noindex/**
          !build/**/*.key

          build/f03-receipts/
          !build/**/private/**
          !build/**/key.pem
          !build/**/connection.json
        if-no-files-found: error
    needs:
    - gtk
  android-baseline:
    if: contains(github.event.head_commit.message, '[F03-FULL]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_OWNERSHIP_HEAD: ec11cf862ca3b44483d7e8c4726ae748ab438337
      EXR_F03_INTEGRATION: six-host-20261103
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Admit exact six-host source and unchanged Android baseline profile
      id: admission
      run: |
        python3 tests/dot_f03_production_acceptance_20261102/admission.py admit
        python3 tests/dot_f03_production_acceptance_20261102/check_android_host_v342.py --repo .
        python3 -m py_compile tests/dot_f03_production_acceptance_20261102/admission.py tests/dot_f03_production_acceptance_20261102/android_host_evidence_v342.py tests/dot_f03_production_acceptance_20261102/check_android_host_v342.py tests/dot_f03_production_acceptance_20261102/check_evidence_gate_v342.py tests/dot_f03_production_acceptance_20261102/check_bounded_evidence_gate_v342.py tests/dot_f03_production_acceptance_20261102/check_reader_owner_android_v342.py tests/dot_f03_production_acceptance_20261102/check_owner_evidence_gate_v342.py tests/dot_f03_production_acceptance_20261102/check_reader_organization_android_v342.py tests/dot_f03_production_acceptance_20261102/check_organization_evidence_gate_v342.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Stage only reviewed test overlay and explicit SDK 3.42 Gradle adapter
      id: prepare
      run: python3 tests/dot_f03_production_acceptance_20261102/admission.py prepare
    - name: Install pinned Android compiler and emulator
      run: |
        sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
        echo "$sdk/platform-tools" >> "$GITHUB_PATH"
        echo "$sdk/emulator" >> "$GITHUB_PATH"
        yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-34;default;x86_64"
        sudo apt-get update -qq
        sudo apt-get install -y patchelf
        python -m pip install ninja==1.11.1.1
    - name: Install pinned standalone OPDSHash owner for every native and Gradle consumer
      id: hash_owner
      run: python3 tests/dot_f03_production_acceptance_20261102/admission.py prepare-hash
    - name: Build frozen SDK and actual catalog-driven application
      id: build
      run: |
        set -o pipefail
        mkdir -p build/shelf-android build/owner-android
        git rev-parse HEAD > build/shelf-android/source.txt
        git rev-parse HEAD > build/owner-android/source.txt
        # Superseded branch ancestry is replaced by exact reviewed tree/SDK/JNI admission, not removed.
        python3 tests/dot_f03_production_acceptance_20261102/admission.py admit
        git diff --exit-code f32bb8aa18ed3de286900f19ce4230fd93435dd0 HEAD -- apps/reader/store/001_catalog.sql
        python tests/reader_catalog/check_schema.py --output build/shelf-android/schema.json
        python tests/reader_catalog/check_assets.py
        python tests/dot_f03_production_acceptance_20261102/admission.py build --stage stage/android-x86_64 --build-dir build/android-host --gradle "$F03_GRADLE" 2>&1 | tee build/shelf-android/build.log
        "$F03_GRADLE" -p examples/android --no-daemon --stacktrace :app:assembleRelease -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64
        python tests/dot_f03_production_acceptance_20261102/check_reader_owner_android_v342.py --evidence build/owner-android --collect-native
        python tests/dot_f03_production_acceptance_20261102/check_android_host_v342.py --repo .
        mkdir -p examples/android/app/src/androidTest/assets/mapping
        cp build/android-host/fixtures/Sample.epub examples/android/app/src/androidTest/assets/mapping/
    - name: Verify byte-identical catalog v3 and mapping overlays then compile all retained tests before device
      id: test_compile
      run: |
        python3 tests/dot_f03_production_acceptance_20261102/admission.py admit
        python3 tests/dot_f03_production_acceptance_20261102/admission.py precompile-tests
    - name: Enable emulator acceleration
      run: sudo chmod 666 /dev/kvm
    - name: Verify actual 2202-book UI, mapping recovery and unchanged original 66 on API34
      id: emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        disable-linux-hw-accel: false
        api-level: 34
        target: default
        arch: x86_64
        profile: pixel_6
        ram-size: 4096M
        cores: 4
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
        script: |
          adb shell getprop ro.build.version.sdk > build/shelf-android/device-api.txt
          adb shell getprop ro.product.cpu.abi > build/shelf-android/device-abi.txt
          "$F03_GRADLE" -p examples/android --no-daemon --stacktrace :app:connectedDebugAndroidTest -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -PexrTestRunner=org.exreader.host.ShelfCatalogTest -Pandroid.testInstrumentationRunnerArguments.class=org.exreader.host.ShelfCatalogTest
          cp -r examples/android/app/build/outputs/androidTest-results/connected build/shelf-android/catalog-reports
          python tools/run_reader_shelf_ui.py --output build/shelf-android/ui-execution
          mkdir -p build/import-android
          cp build/shelf-android/source.txt build/import-android/source.txt
          cp build/shelf-android/device-api.txt build/import-android/device-api.txt
          cp build/shelf-android/device-abi.txt build/import-android/device-abi.txt
          "$F03_GRADLE" -p examples/android --no-daemon --stacktrace :app:connectedDebugAndroidTest -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -Pandroid.testInstrumentationRunnerArguments.class=org.exreader.host.CatalogStoreTest
          cp -r examples/android/app/build/outputs/androidTest-results/connected build/import-android/catalog-reports
          "$F03_GRADLE" -p examples/android --no-daemon --stacktrace :app:connectedDebugAndroidTest -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -PexrTestRunner=org.exreader.host.ImportMappingTest -Pandroid.testInstrumentationRunnerArguments.class=org.exreader.host.ImportMappingTest
          cp -r examples/android/app/build/outputs/androidTest-results/connected build/import-android/mapping-reports
          mkdir -p build/import-android/apks
          cp examples/android/app/build/outputs/apk/debug/app-debug.apk build/import-android/apks/
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/import-android/apks/
          adb install -r -t examples/android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -r -e phase seed-before org.exreader.host.test/org.exreader.host.ImportMappingTest > build/import-android/seed-before.txt
          adb shell am instrument -w -r -e phase recover-before org.exreader.host.test/org.exreader.host.ImportMappingTest > build/import-android/recover-before.txt
          adb shell am instrument -w -r -e phase seed-during org.exreader.host.test/org.exreader.host.ImportMappingTest > build/import-android/seed-during.txt
          adb shell am instrument -w -r -e phase recover-during org.exreader.host.test/org.exreader.host.ImportMappingTest > build/import-android/recover-during.txt
          python tools/check_reader_import_android.py --evidence build/import-android
          bash examples/android/ci/emulator.sh
          cp build/shelf-android/device-api.txt build/owner-android/device-api.txt
          cp build/shelf-android/device-abi.txt build/owner-android/device-abi.txt
          "$F03_GRADLE" -p examples/android --no-daemon --stacktrace :app:connectedDebugAndroidTest -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -PexrTestRunner=org.exreader.host.ProductOwnerTest -Pandroid.testInstrumentationRunnerArguments.class=org.exreader.host.ProductOwnerTest -Pandroid.testInstrumentationRunnerArguments.source_sha=$GITHUB_SHA -Pandroid.testInstrumentationRunnerArguments.run_id=$GITHUB_RUN_ID -Pandroid.testInstrumentationRunnerArguments.attempt=$GITHUB_RUN_ATTEMPT
          cp -r examples/android/app/build/outputs/androidTest-results/connected build/owner-android/owner-reports
          mkdir -p build/owner-android/apks
          cp examples/android/app/build/outputs/apk/debug/app-debug.apk build/owner-android/apks/
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/owner-android/apks/
          adb install -r -t build/owner-android/apks/app-debug.apk
          adb install -r -t build/owner-android/apks/app-debug-androidTest.apk
          adb shell am instrument -w -r -e source_sha $GITHUB_SHA -e run_id $GITHUB_RUN_ID -e attempt $GITHUB_RUN_ATTEMPT org.exreader.host.test/org.exreader.host.ProductOwnerTest > build/owner-android/owner-instrumentation.txt
          adb exec-out run-as org.exreader.host cat files/product-owner-report.json > build/owner-android/device-report.json
          test -s build/owner-android/device-report.json
          adb shell am instrument -w -r -e phase seed-before org.exreader.host.test/org.exreader.host.ProductOwnerTest > build/owner-android/seed-before.txt
          adb exec-out run-as org.exreader.host cat files/owner-kill-before/witness.txt > build/owner-android/witness-before.txt
          adb shell am instrument -w -r -e phase recover-before org.exreader.host.test/org.exreader.host.ProductOwnerTest > build/owner-android/recover-before.txt
          adb shell am instrument -w -r -e phase seed-after org.exreader.host.test/org.exreader.host.ProductOwnerTest > build/owner-android/seed-after.txt
          adb exec-out run-as org.exreader.host cat files/owner-kill-after/witness.txt > build/owner-android/witness-after.txt
          adb shell am instrument -w -r -e phase recover-after org.exreader.host.test/org.exreader.host.ProductOwnerTest > build/owner-android/recover-after.txt
          python tests/dot_f03_production_acceptance_20261102/check_reader_owner_android_v342.py --evidence build/owner-android
          mkdir -p build/organization-android
          "$F03_GRADLE" -p examples/android --no-daemon --stacktrace :app:connectedDebugAndroidTest -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -PexrTestRunner=org.exreader.host.OrganizationTest -Pandroid.testInstrumentationRunnerArguments.class=org.exreader.host.OrganizationTest -Pandroid.testInstrumentationRunnerArguments.source_sha=$GITHUB_SHA -Pandroid.testInstrumentationRunnerArguments.run_id=$GITHUB_RUN_ID -Pandroid.testInstrumentationRunnerArguments.attempt=$GITHUB_RUN_ATTEMPT
          cp -r examples/android/app/build/outputs/androidTest-results/connected build/organization-android/reports
          mkdir -p build/organization-android/apks
          cp examples/android/app/build/outputs/apk/debug/app-debug.apk build/organization-android/apks/
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/organization-android/apks/
          cmp build/owner-android/apks/app-debug.apk build/organization-android/apks/app-debug.apk
          adb install -r -t build/organization-android/apks/app-debug.apk
          adb install -r -t build/organization-android/apks/app-debug-androidTest.apk
          adb shell am instrument -w -r -e source_sha $GITHUB_SHA -e run_id $GITHUB_RUN_ID -e attempt $GITHUB_RUN_ATTEMPT org.exreader.host.test/org.exreader.host.OrganizationTest > build/organization-android/instrumentation.txt
          adb exec-out run-as org.exreader.host cat files/organization-report.json > build/organization-android/device-report.json
          adb shell pm clear org.exreader.host
          adb shell am instrument -w -r -e phase seed-ui -e source_sha $GITHUB_SHA -e run_id $GITHUB_RUN_ID -e attempt $GITHUB_RUN_ATTEMPT org.exreader.host.test/org.exreader.host.OrganizationTest > build/organization-android/seed-ui.txt
          adb shell am force-stop org.exreader.host
          adb install -r -t build/android-host/artifacts/uitest-debug.apk
          adb install -r -t build/android-host/artifacts/uitest-debug-androidTest.apk
          adb shell rm -rf /sdcard/Android/data/org.exreader.host.uitest/files/organization-evidence
          adb shell am instrument -w -r -e disableAnalytics true -e class org.exreader.host.uitest.OrganizationWalkthroughTest#organize -e exr_source_sha $GITHUB_SHA -e exr_run_id $GITHUB_RUN_ID -e exr_attempt $GITHUB_RUN_ATTEMPT org.exreader.host.uitest.test/androidx.test.runner.AndroidJUnitRunner > build/organization-android/ui-instrumentation.txt
          adb pull /sdcard/Android/data/org.exreader.host.uitest/files/organization-evidence build/organization-android/ui
          adb pull /sdcard/Android/data/org.exreader.host/files/organization-tests build/organization-android/phases
          python tests/dot_f03_production_acceptance_20261102/check_reader_organization_android_v342.py --evidence build/organization-android
          mkdir -p build/f03-recovery
          "$F03_GRADLE" -p examples/android --no-daemon --stacktrace :app:assembleDebugAndroidTest -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -PexrTestRunner=org.exreader.host.OrganizationBootstrapRecoveryTest
          cmp build/organization-android/apks/app-debug.apk examples/android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -r -e source_sha $GITHUB_SHA -e run_id $GITHUB_RUN_ID -e attempt $GITHUB_RUN_ATTEMPT org.exreader.host.test/org.exreader.host.OrganizationBootstrapRecoveryTest > build/f03-recovery/instrumentation.txt
          adb exec-out run-as org.exreader.host cat files/f03-bootstrap-recovery.json > build/f03-recovery/device-report.json
          python tests/dot_f03_production_acceptance_20261102/admission.py recovery
          mkdir -p build/android-host-import/test-apks
          "$F03_GRADLE" -p examples/android --no-daemon --stacktrace -PexrSdk=$GITHUB_WORKSPACE/stage/android-x86_64 -PexrTestRunner=org.exreader.host.HostImportUiTest :app:assembleDebugAndroidTest :hostimportsource:assembleDebug
          cmp build/organization-android/apks/app-debug.apk examples/android/app/build/outputs/apk/debug/app-debug.apk
          cp examples/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/android-host-import/test-apks/host-import-ui.apk
          adb install -r -t build/android-host-import/test-apks/host-import-ui.apk
          python tests/reader_android_host_import/run_ui.py --output build/android-host-import/ui
          python tests/dot_f03_production_acceptance_20261102/admission.py import20
          adb logcat -d -v threadtime > build/shelf-android/logcat.txt
    - name: Refuse failed, skipped, duplicated or missing catalog shelf cases
      id: catalog
      run: python tools/check_reader_shelf_android.py --evidence build/shelf-android
    - name: Preflight original 45 plus review 10 plus bounded 11
      id: preflight
      if: always()
      continue-on-error: true
      env:
        ANDROID_HOST_UPSTREAM: '{"build":"${{ steps.build.outcome }}","static":"${{ steps.build.outcome }}","emulator":"${{ steps.emulator.outcome
          }}"}'
      run: |
        mkdir -p build/android-host/evidence/artifacts
        if compgen -G 'build/android-host/artifacts/*.apk' > /dev/null; then cp build/android-host/artifacts/*.apk build/android-host/evidence/artifacts/; fi
        python tests/dot_f03_production_acceptance_20261102/check_android_host_v342.py --repo . --evidence build/android-host/evidence --build build/android-host/build.json --stage stage/android-x86_64 --output build/android-host/evidence/preflight.json
    - name: Unchanged original 48 evidence gate checks
      id: gate_review
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
      run: python tests/dot_f03_production_acceptance_20261102/check_evidence_gate_v342.py --evidence build/android-host/evidence --build build/android-host/build.json
        --stage stage/android-x86_64 --output build/android-host/gate-review.json
    - name: Unchanged bounded 20 evidence gate checks
      id: bounded_gate
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
      run: python tests/dot_f03_production_acceptance_20261102/check_bounded_evidence_gate_v342.py --evidence build/android-host/evidence --build
        build/android-host/build.json --stage stage/android-x86_64 --output build/android-host/bounded-gate-review.json
    - name: Final same-source original fail-closed acceptance
      id: host_final
      if: always()
      env:
        ANDROID_HOST_UPSTREAM: '{"build":"${{ steps.build.outcome }}","static":"${{ steps.build.outcome }}","emulator":"${{ steps.emulator.outcome
          }}"}'
        ANDROID_GATE_OUTCOME: ${{ steps.gate_review.outcome }}
        ANDROID_BOUNDED_GATE_OUTCOME: ${{ steps.bounded_gate.outcome }}
      run: python tests/dot_f03_production_acceptance_20261102/check_android_host_v342.py --repo . --evidence build/android-host/evidence --build
        build/android-host/build.json --stage stage/android-x86_64 --gate-review build/android-host/gate-review.json --bounded-gate-review build/android-host/bounded-gate-review.json
        --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --output build/shelf-android/original-result.json
    - name: Require all production shelf exits from this exact source and run
      id: shelf_final
      if: always()
      run: python tools/check_reader_shelf_android.py --evidence build/shelf-android --all-exits
    - name: Refuse altered or incomplete shelf, mapping and original evidence
      id: shelf_gate
      run: python tests/android_host/check_shelf_evidence_gate.py --evidence build/shelf-android
    - name: Require native owner plus unchanged 112 functional and 87 strict gate checks
      id: owner_final
      if: always()
      run: python tests/dot_f03_production_acceptance_20261102/check_reader_owner_android_v342.py --evidence build/owner-android --all-exits
    - name: Refuse altered owner provider process and original evidence
      id: owner_gate
      run: python tests/dot_f03_production_acceptance_20261102/check_owner_evidence_gate_v342.py --evidence build/owner-android
    - name: Require actual organization UI and exact saved-intent recovery plus all original exits
      id: organization_final
      if: always()
      run: python tests/dot_f03_production_acceptance_20261102/check_reader_organization_android_v342.py --evidence build/organization-android
        --all-exits
    - name: Refuse altered incomplete or skipped organization evidence
      id: organization_gate
      run: python tests/dot_f03_production_acceptance_20261102/check_organization_evidence_gate_v342.py --evidence build/organization-android
    - name: Require the complete actual host shelf owner organization and recovery chain
      if: always()
      env:
        F03_UPSTREAM: '{"admission":"${{ steps.admission.outcome }}","prepare":"${{ steps.prepare.outcome }}","hash_owner":"${{ steps.hash_owner.outcome
          }}","test_compile":"${{ steps.test_compile.outcome }}","build":"${{ steps.build.outcome }}","emulator":"${{ steps.emulator.outcome }}","catalog":"${{
          steps.catalog.outcome }}","preflight":"${{ steps.preflight.outcome }}","gate48":"${{ steps.gate_review.outcome }}","gate20":"${{ steps.bounded_gate.outcome
          }}","host":"${{ steps.host_final.outcome }}","shelf":"${{ steps.shelf_final.outcome }}","shelf_gate":"${{ steps.shelf_gate.outcome }}","owner":"${{
          steps.owner_final.outcome }}","owner_gate":"${{ steps.owner_gate.outcome }}","organization":"${{ steps.organization_final.outcome }}","organization_gate":"${{
          steps.organization_gate.outcome }}"}'
      run: python3 tests/dot_f03_production_acceptance_20261102/admission.py final
    - name: Preserve source, native build and original catalog reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: f03-six-android-baseline-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/f03-production/
          build/f03-recovery/
          build/android-host-import/
          build/organization-android/
          build/owner-android/
          build/shelf-android/
          build/android-host/build.json
          build/android-host/artifacts/
          build/android-host/evidence/
          build/android-host/gate-review.json
          build/android-host/bounded-gate-review.json
          build/import-android/
          !build/**/private/**
          !build/**/key.pem
          !build/**/connection.json
        if-no-files-found: error
  audit:
    if: always() && contains(github.event.head_commit.message, '[F03-FULL]')
    needs:
    - gtk
    - windows
    - android
    - apple
    - android-baseline
    - projection-regression
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check verifier fixture and WAL preservation regression
      run: python tests/f03_six_host_20261103/test_audit.py
    - name: Authenticate current-attempt archives and require all six real hosts
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python tests/f03_six_host_20261103/audit.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-six-final-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/f03-six-audit/*.json
        if-no-files-found: error
  projection-regression:
    if: contains(github.event.head_commit.message, '[F03-PROJECTION]') || contains(github.event.head_commit.message, '[F03-FULL]')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        raw:
        - 'OFF'
        - 'ON'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Admit pinned source and build installed hash owner
      run: |
        python tests/f03_six_host_20261103/run.py admit
        cmake -S extras/opds -B build/projection/hash-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX="$PWD/build/projection/hash"
        cmake --build build/projection/hash-build --parallel 4 --target install
        echo "EXREADER_ORIGINAL_HASH_PREFIX=$PWD/build/projection/hash" >> "$GITHUB_ENV"
    - name: Build actual catalog revisions and original installed projection consumer
      run: |
        cmake -S apps/reader/store/native -B build/projection/catalog-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/projection/product"
        cmake --build build/projection/catalog-build --parallel 4 --target install
        ctest --test-dir build/projection/catalog-build --output-on-failure --no-tests=error
        cmake -S apps/reader/revisions -B build/projection/revisions-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$PWD/build/projection/product" -DCMAKE_INSTALL_PREFIX="$PWD/build/projection/revisions" -DEXR_READER_SELECTOR_BYTES_CANDIDATE=${{ matrix.raw }}
        cmake --build build/projection/revisions-build --parallel 4 --target install
        cmake -S tests/reader_organization_projection -B build/projection/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/projection/revisions;$PWD/build/projection/product"
        cmake --build build/projection/consumer --parallel 4
        python tests/reader_organization_projection/check.py build/projection/consumer/organization-consumer build/projection/original
        cmake -S tests/reader_revisions/consumer -B build/projection/retained-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/projection/revisions;$PWD/build/projection/product"
        cmake --build build/projection/retained-consumer --parallel 4
        python tests/reader_projection/check_projection.py --consumer build/projection/retained-consumer/revision-consumer --output build/projection/retained
    - name: Compare fresh and previously synchronized native deletion projections
      run: python tests/f03_six_host_20261103/projection_replay.py --consumer build/projection/consumer/organization-consumer --output build/projection/replay
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: f03-projection-${{ matrix.raw }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/projection/replay/
          build/projection/original/
          build/projection/**/CMakeCache.txt
          build/projection/**/Testing/
          build/projection/retained/
        if-no-files-found: error
'on':
  push:
    branches:
    - codex/f03-six-host-20261103
    paths:
    - tests/f03_six_host_20261103/**
    - tests/dot_f03_same_source_20261031/**
    - examples/apple/HostCatalog.swift
    - examples/apple/HostModel.swift
    - examples/apple/HostViews.swift
    - .github/workflows/f03-six-host-20261103.yml
