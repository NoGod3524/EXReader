name: Actual Apple reading record sender and receiver
on:
  push:
    branches: [codex/reader-apple-record-interop]
  workflow_dispatch:
    inputs:
      direction:
        type: choice
        options: [android-to-apple, apple-loopback]
        default: android-to-apple
        description: Explicit receive-only proof or original Apple sender (known PDF NUL gap)
      inspect_run:
        type: string
        default: ''
        description: Authenticate a completed failed sender and read its actual pending request
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    if: ${{github.event.inputs.inspect_run == ''}}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged actual owners SDK and every original control
        run: |
          python3 - <<'PY'
          import os,subprocess
          base='b1a7b7891cd394671842164a07a86c8e316dace3'
          assert os.environ.get('GITHUB_ACTIONS')=='true'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--','apps','examples','extras','src','include','cmake','CMakeLists.txt','bindings','tests/fixtures','tests/apple_host/record_compatibility'],check=True)
          allowed=('tests/apple_host/record_interop/','.github/workflows/reader-apple-record-interop.yml','docs/READER-APPLE-RECORD-INTEROP.md')
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert all(p.startswith(allowed[0]) or p in allowed[1:] for p in paths),paths
          PY
          python3 -m py_compile tests/apple_host/record_interop/run.py tests/apple_host/record_interop/verify.py tests/apple_host/record_interop/incoming.py
      - name: Authenticate sealed real Android sender and complete raw graph
        if: ${{github.event.inputs.direction != 'apple-loopback'}}
        env:
          GH_TOKEN: ${{github.token}}
        run: python3 tests/apple_host/record_interop/incoming.py --output build/apple-record-peer
      - name: Build both exact SDKs and retain every actual original owner control
        run: python3 tests/apple_host/record_compatibility/run.py
      - name: Exercise actual Apple receiver and new-process reopen of real Android packet
        if: ${{github.event.inputs.direction != 'apple-loopback'}}
        run: python3 tests/apple_host/record_interop/run.py --sdk build/apple-record-compatibility/sdk-new --resources build/apple-record-compatibility/resources-new --output build/apple-record-interop --incoming build/apple-record-peer
      - name: Exercise original actual Apple sender and loopback without replacing NUL PDF
        if: ${{github.event.inputs.direction == 'apple-loopback'}}
        run: python3 tests/apple_host/record_interop/run.py --sdk build/apple-record-compatibility/sdk-new --resources build/apple-record-compatibility/resources-new --output build/apple-record-interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-host-record-interop-${{github.run_id}}-${{github.run_attempt}}
          path: build/apple-record-interop/
          if-no-files-found: error
  evidence:
    needs: native
    if: ${{always() && github.event.inputs.inspect_run == ''}}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate actual native program library raw wires and original controls
        env:
          GH_TOKEN: ${{github.token}}
        run: python3 tests/apple_host/record_interop/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-host-record-interop-summary-${{github.run_id}}-${{github.run_attempt}}
          path: build/apple-record-interop-summary/
          if-no-files-found: error
  inspect:
    if: ${{github.event_name == 'workflow_dispatch' && inputs.inspect_run != ''}}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect original retained sender request in Actions only
        env:
          GH_TOKEN: ${{github.token}}
          INSPECT_RUN: ${{inputs.inspect_run}}
        run: python3 tests/apple_host/record_interop/verify.py --inspect-run "$INSPECT_RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-host-record-interop-inspection-${{github.run_id}}-${{github.run_attempt}}
          path: build/apple-record-interop-summary/
          if-no-files-found: error
