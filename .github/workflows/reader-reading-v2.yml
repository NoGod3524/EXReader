name: Reader reading state v2
on:
  push:
    branches: [codex/reader-reading-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/reader-commands.yml
    with:
      reading_v2: true
      session: true
  sdk:
    name: real v2 capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged SDK and schema plus the accepted v1 audit ancestor
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a403fee5f0cdb120840cd6fe0ef24e5fc2c0ce96 HEAD
          git diff --exit-code 9854061be331fe603a1822d9b2b36ee357154927 HEAD -- src include cmake CMakeLists.txt tests/fixtures bindings .github/workflows/native.yml .github/workflows/reliability.yml
          git diff --exit-code f32bb8aa18ed3de286900f19ce4230fd93435dd0 HEAD -- apps/reader/store/001_catalog.sql
      - name: Install Linux native HTTPS XML and SHA dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config
      - name: Enter Windows native compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install one product provider and separate current and actual legacy revisions
        run: |
          mkdir -p build/v2-logs build/v1-source
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -m "$PWD"); else ws="$PWD"; fi
          echo "V2_WS=$ws" >> "$GITHUB_ENV"
          cmake -S apps/reader/store/native -B build/v2-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$ws/build/v2-product-stage"
          cmake --build build/v2-product --parallel 4
          cmake --install build/v2-product
          cmake -S apps/reader/revisions -B build/v2-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$ws/build/v2-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/v2-stage"
          cmake --build build/v2-revisions --parallel 4
          cmake --install build/v2-revisions
          git archive 210403d121d6484a8fff4ea7ffd911efa3163535 apps/reader/revisions extras/opds | tar -x -C build/v1-source
          cmake -S build/v1-source/apps/reader/revisions -B build/v1-revisions -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADER_PRODUCT_PREFIX="$ws/build/v2-product-stage" -DCMAKE_INSTALL_PREFIX="$ws/build/v1-stage"
          cmake --build build/v1-revisions --parallel 4
          cmake --install build/v1-revisions
      - name: Build and install the frozen reading SDK once
        run: |
          cmake --preset reading-library 2>&1 | tee build/v2-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/v2-logs/sdk-build.log
          cmake --install build/reading-library
      - name: Install adapter against each revision implementation and compile isolated consumers
        run: |
          cmake -S apps/reader/reading-state -B build/v2-adapter -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$V2_WS/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$V2_WS/build/v2-stage;$V2_WS/build/v2-product-stage" -DCMAKE_INSTALL_PREFIX="$V2_WS/build/v2-stage"
          cmake --build build/v2-adapter --verbose
          cmake --install build/v2-adapter
          cmake -S tests/reader_reading_v2/consumer -B build/v2-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$V2_WS/build/v2-stage;$V2_WS/build/v2-product-stage;$V2_WS/build/reading-library/stage"
          cmake --build build/v2-consumer --verbose
          cmake -S apps/reader/reading-state -B build/v1-adapter -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$V2_WS/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$V2_WS/build/v1-stage;$V2_WS/build/v2-product-stage" -DCMAKE_INSTALL_PREFIX="$V2_WS/build/v1-stage"
          cmake --build build/v1-adapter --verbose
          cmake --install build/v1-adapter
          cmake -S tests/reader_reading_state/consumer -B build/v1-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$V2_WS/build/v1-stage;$V2_WS/build/v2-product-stage;$V2_WS/build/reading-library/stage"
          cmake --build build/v1-consumer --verbose
      - name: Preserve original 121 cases and verify v2 product round trips from real captures
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          python3 tests/reader_reading_state/make_fixtures.py build/v2-fixtures
          python3 tests/reader_reading_v2/check_sdk.py --probe "build/v2-consumer/reading-v2-probe$exe" --legacy-probe "build/v1-consumer/reading-state-probe$exe" --legacy-c-consumer "build/v1-consumer/reading-state-c-consumer$exe" --fixtures build/v2-fixtures --font tests/fixtures/fonts/primary.ttf --legacy-map build/v1-consumer/reading-state-link.map --link-map build/v2-consumer/reading-v2-link.map --output build/v2-sdk-evidence
      - name: Install optional source export and compile an independent C C++ consumer
        run: |
          cmake -S extras/sideload -B build/v2-sideload -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$V2_WS/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$V2_WS/build/v2-sideload-stage"
          cmake --build build/v2-sideload --verbose
          cmake --install build/v2-sideload
          cmake -S tests/reader_source_export -B build/v2-export-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$V2_WS/build/v2-sideload-stage;$V2_WS/build/reading-library/stage"
          cmake --build build/v2-export-consumer --verbose
      - name: Real owner original export cancellation invalidation and atomic no-replace publication
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          python3 tests/reader_source_export/check_export.py --consumer "build/v2-export-consumer/original-export-consumer$exe" --fixtures build/v2-fixtures --output build/v2-export-evidence
      - name: Install native sync and compile the complete original export and reading consumer
        run: |
          cmake -S extras/webdav -B build/v2-dav -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$V2_WS/build/v2-dav-stage"
          cmake --build build/v2-dav --verbose
          cmake --install build/v2-dav
          cmake -S apps/reader/sync -B build/v2-sync -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$V2_WS/build/v2-dav-stage;$V2_WS/build/v2-stage;$V2_WS/build/v2-product-stage" -DCMAKE_INSTALL_PREFIX="$V2_WS/build/v2-sync-stage"
          cmake --build build/v2-sync --verbose
          cmake --install build/v2-sync
          cmake -S tests/reader_reading_v2/consumer -B build/v2-webdav-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DREADING_V2_WEBDAV=ON -DCMAKE_PREFIX_PATH="$V2_WS/build/v2-dav-stage;$V2_WS/build/v2-sync-stage;$V2_WS/build/v2-sideload-stage;$V2_WS/build/v2-stage;$V2_WS/build/v2-product-stage;$V2_WS/build/reading-library/stage"
          cmake --build build/v2-webdav-consumer --verbose
      - name: Real native HTTPS transfers SDK-exported originals and all eighteen reading captures
        run: |
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; else exe=; fi
          python3 tests/reader_reading_v2/check_webdav.py --probe "build/v2-webdav-consumer/reading-v2-probe$exe" --fixtures build/v2-fixtures --font tests/fixtures/fonts/primary.ttf --link-map build/v2-webdav-consumer/reading-v2-link.map --output build/v2-webdav-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-reading-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/v2-logs/
            build/v2-fixtures/
            build/v2-sdk-evidence/
            build/v2-export-evidence/
            build/v2-sideload-stage/
            build/v2-export-consumer/original-export-consumer*
            build/v2-webdav-evidence/
            !build/**/certificates/*.key
            build/v2-webdav-consumer/reading-v2-probe*
            build/v2-webdav-consumer/reading-v2-link.map
            build/v2-sync-stage/
            build/v2-dav-stage/
            build/v2-stage/
            build/v2-product-stage/
            build/v1-stage/
            build/v2-consumer/reading-v2-probe*
            build/v2-consumer/reading-v2-link.map
            build/v1-consumer/reading-state-probe*
            build/v1-consumer/reading-state-c-consumer*
            build/v1-consumer/reading-state-link.map
            build/reading-library/CMakeCache.txt
          if-no-files-found: error
  evidence:
    name: strict reading v2 evidence
    needs: [native, sdk]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate all four ZIPs and compare original SDK captures across platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_reading_v2/check_artifacts.py build/reading-v2-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-reading-v2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reading-v2-evidence/
          if-no-files-found: error
