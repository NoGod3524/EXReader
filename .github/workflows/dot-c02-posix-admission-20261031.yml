name: C02 native POSIX admission and owner custody
on:
  workflow_dispatch:
  push:
    branches: [codex/dot-c02-native-journal-20261030]
    paths:
      - extras/migration/posix_c02_admission_20261031/**
      - tests/migration/posix_c02_admission_20261031/**
      - .github/workflows/dot-c02-posix-admission-20261031.yml
permissions: {contents: read}
defaults:
  run: {shell: bash}
jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preserve frozen SDK, C01 and original coordinator contracts
        run: |
          set -euo pipefail
          git diff --exit-code 8357eafa28423a7ab93ba08b823af80f01ad1505 HEAD -- src include cmake CMakeLists.txt bindings
          git diff --exit-code a8d0b162d8c21617e4c2c837e3eb2b2174bbf69b HEAD -- extras/migration/windows_coordinator_hardening_20261030 tests/migration/windows_coordinator_hardening_20261030 extras/migration/windows_coordinator_cas_20261030 tests/migration/windows_coordinator_cas_20261030 extras/migration/windows_admission_lease_20261030
          git cat-file -e ccd7fec67eb8aa463b09533ce320820f2da472d9:extras/migration/windows_admission_lease_20261030/src/lm_win_lease.c
          mkdir -p evidence/build-logs
          echo "C02_POSIX_EVIDENCE=$HOME/c02-posix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install frozen digest and new native admission library
        run: |
          set -euo pipefail
          cmake -S extras/migration/windows_coordinator_hardening_20261030 -B build/abi2 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/abi2 --parallel 4 2>&1 | tee evidence/build-logs/abi2.log
          cmake --install build/abi2 --prefix "$GITHUB_WORKSPACE/stage-abi2"
          cmake -S extras/migration/posix_c02_admission_20261031 -B build/pc02 -DCMAKE_BUILD_TYPE=Release -DWH_PREFIX="$GITHUB_WORKSPACE/stage-abi2"
          cmake --build build/pc02 --parallel 4 2>&1 | tee evidence/build-logs/pc02.log
          cmake --install build/pc02 --prefix "$GITHUB_WORKSPACE/stage-pc02"
      - name: Build separate installed consumer and execute actual process cuts
        run: |
          set -euo pipefail
          cmake -S tests/migration/posix_c02_admission_20261031 -B build/pc02-check -DCMAKE_BUILD_TYPE=Release -DPC02_PREFIX="$GITHUB_WORKSPACE/stage-pc02" -DWH_PREFIX="$GITHUB_WORKSPACE/stage-abi2" -DSOURCE_SHA="$GITHUB_SHA"
          cmake --build build/pc02-check --parallel 4 2>&1 | tee evidence/build-logs/consumer.log
          python tests/migration/posix_c02_admission_20261031/run.py --tool build/pc02-check/posix-c02-admission-check --output "$C02_POSIX_EVIDENCE" 2>&1 | tee evidence/native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c02-posix-${{ matrix.os }}-${{ github.sha }}
          path: |
            evidence/
            ${{ env.C02_POSIX_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: error
