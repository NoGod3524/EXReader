name: Windows native reading records and retained host checks
on:
  push:
    branches: [codex/reader-windows-reading-records-ui]
  workflow_dispatch:
    inputs:
      inspect_artifact:
        description: "Read a preserved initial-search ZIP in an isolated diagnostic job"
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  search:
    if: ${{github.event.inputs.inspect_artifact == ''}}
    name: installed F1 and native Windows search controls and lifecycle
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      artifact_id: ${{steps.upload.outputs.artifact-id}}
      artifact_digest: ${{steps.upload.outputs.artifact-digest}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate frozen SDK, original F1 and root-owned host paths
        run: python3 tests/reader_windows_records/guard.py
      - name: Enter the Windows native compiler environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $bat)) { throw 'MSVC environment not found' }
          cmd /c "`"$bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          'CC=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'CXX=cl' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check source syntax in Actions
        run: python3 -m py_compile tests/reader_windows_search/guard.py tests/reader_windows_search/check_ui.py tests/reader_windows_search/check_formats.py tests/reader_windows_search/check_keyboard.py tests/reader_windows_search/verify.py
      - name: Check records syntax and strict protocol in Actions
        run: |
          python3 -m py_compile tests/reader_windows_records/guard.py tests/reader_windows_records/check_ui.py tests/reader_windows_records/verify.py
          python3 tests/reader_windows_records/verify.py --protocol-selftest
      - name: Reject malformed current and legacy report contracts before building
        run: python3 tests/reader_windows_navigation/verify.py --protocol-selftest
      - name: Build and install the frozen SDK and one product provider
        run: |
          set -o pipefail
          ws=$(cygpath -m "$PWD")
          prefix="$ws/build/winsearch-stage"
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "WS_PREFIX=$prefix" >> "$GITHUB_ENV"
          mkdir -p build/winsearch-logs
          cmake --preset reading-library 2>&1 | tee build/winsearch-logs/sdk-configure.log
          cmake --build --preset reading-library 2>&1 | tee build/winsearch-logs/sdk-build.log
          cmake --install build/reading-library 2>&1 | tee build/winsearch-logs/sdk-install.log
          cmake -S apps/reader/store/native -B build/ws-product -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build build/ws-product --parallel 4
          ctest --test-dir build/ws-product --output-on-failure --no-tests=error --timeout 180
          cmake --install build/ws-product
      - name: Install unchanged public dependencies into one prefix
        run: |
          set -o pipefail
          prefix="$WS_PREFIX"
          for module in extras/webdav extras/credentials extras/sideload apps/reader/revisions apps/reader/commands apps/reader/desktop-metadata apps/reader/sync apps/reader/session apps/reader/reading-state apps/reader/reading-commands apps/reader/annotation-view apps/reader/search apps/reader/navigation; do
            name=$(basename "$module")
            cmake -S "$module" -B "build/ws-$name" -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DREADER_PRODUCT_PREFIX="$prefix" -DCMAKE_PREFIX_PATH="$prefix;$WS/build/reading-library/stage" -DCMAKE_INSTALL_PREFIX="$prefix" 2>&1 | tee "build/winsearch-logs/$name-configure.log"
            cmake --build "build/ws-$name" --parallel 4 --verbose 2>&1 | tee "build/winsearch-logs/$name-build.log"
            cmake --install "build/ws-$name"
          done
      - name: Build actual account host with the optional native search UI
        run: |
          set -o pipefail
          cmake -S apps/reader/windows-account -B build/ws-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$WS_PREFIX;$WS/build/reading-library/stage" -DREADER_METADATA_PREFIX="$WS_PREFIX" -DREADER_ACCOUNT_PREFIX="$WS_PREFIX" -DEXR_READER_WINDOWS_SEARCH=ON -DEXR_READER_WINDOWS_NAVIGATION=ON -DEXR_READER_WINDOWS_RECORDS=ON 2>&1 | tee build/winsearch-logs/host-configure.log
          cmake --build build/ws-host --parallel 4 --verbose 2>&1 | tee build/winsearch-logs/host-build.log
          cmake -S tests/reader_search/consumer -B build/ws-search-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WS_PREFIX;$WS/build/reading-library/stage"
          cmake --build build/ws-search-consumer --parallel 4 --verbose
      - name: Execute installed original F1 C and C++ consumers
        run: |
          python3 tests/reader_search/make_search_fixtures.py build/ws-search-fixtures
          python3 tests/reader_search/check_search.py --probe build/ws-search-consumer/search-probe.exe --c-consumer build/ws-search-consumer/search-c-consumer.exe --fixtures build/ws-search-fixtures --font tests/fixtures/fonts/primary.ttf --installed build/winsearch-stage --output build/ws-search-module-evidence
      - name: Package and execute initial real Win32 TXT controls
        id: initial
        run: |
          python3 tools/build_windows_host.py --sdk build/reading-library/stage --binary build/ws-host/EXReaderProduct.exe --output build/ws-package --static-reading
          python3 tests/reader_windows_search/check_ui.py --candidate build/ws-package/EXReader/EXReader.exe --font build/ws-package/EXReader/Reader.otf --output build/ws-search-ui
      - name: Execute EPUB, PDF, provider refusal and live cancellation on the shared native host
        id: formats
        run: |
          python3 tests/reader_windows_search/check_formats.py --candidate build/ws-package/EXReader/EXReader.exe --review build/ws-host/EXReaderShelfReview.exe --font build/ws-package/EXReader/Reader.otf --fixtures build/ws-search-fixtures --output build/ws-search-formats
      - name: Execute real keyboard and UI Automation search controls
        id: keyboard
        if: ${{always() && steps.initial.outcome == 'success'}}
        run: |
          python3 -m pip install "uiautomation==2.0.29"
          python3 tests/reader_windows_search/check_keyboard.py --candidate build/ws-package/EXReader/EXReader.exe --review build/ws-host/EXReaderShelfReview.exe --font build/ws-package/EXReader/Reader.otf --output build/ws-search-keyboard
      - name: Compile navigation without optional search
        run: |
          set -o pipefail
          cmake -S apps/reader/windows-account -B build/ws-navigation-only -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXR_SDK="$WS/build/reading-library/stage" -DCMAKE_PREFIX_PATH="$WS_PREFIX;$WS/build/reading-library/stage" -DREADER_METADATA_PREFIX="$WS_PREFIX" -DREADER_ACCOUNT_PREFIX="$WS_PREFIX" -DEXR_READER_WINDOWS_SEARCH=OFF -DEXR_READER_WINDOWS_NAVIGATION=ON
          cmake --build build/ws-navigation-only --parallel 4 --verbose
      - name: Execute installed F2 and real native directory controls
        run: |
          set -o pipefail
          python3 -m py_compile tests/reader_windows_navigation/guard.py tests/reader_windows_navigation/check_ui.py tests/reader_windows_navigation/verify.py
          cmake -S tests/reader_navigation/consumer -B build/ws-navigation-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WS_PREFIX;$WS/build/reading-library/stage"
          cmake --build build/ws-navigation-consumer --parallel 4
          python3 tests/reader_navigation/make_navigation_fixtures.py build/ws-navigation-fixtures
          python3 tests/reader_navigation/check_navigation.py --probe build/ws-navigation-consumer/navigation-probe.exe --c-consumer build/ws-navigation-consumer/navigation-c-consumer.exe --fixtures build/ws-navigation-fixtures --installed build/winsearch-stage --output build/ws-navigation-module-evidence
          cmake -S tests/reader_windows_navigation/consumer -B build/ws-navigation-cfi -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WS_PREFIX;$WS/build/reading-library/stage"
          cmake --build build/ws-navigation-cfi --parallel 4
          python3 tests/reader_windows_navigation/check_ui.py --candidate build/ws-package/EXReader/EXReader.exe --review build/ws-host/EXReaderShelfReview.exe --font build/ws-package/EXReader/Reader.otf --cfi build/ws-navigation-cfi/navigation-fixture-cfi.exe --output build/ws-navigation-ui
      - name: Build retained installed consumers and authored fixtures
        id: retained_build
        if: ${{always() && steps.initial.outcome == 'success' && steps.formats.outcome == 'success' && steps.keyboard.outcome == 'success'}}
        run: |
          for module in commands revisions; do
            cmake -S "tests/reader_$module/consumer" -B "build/account-$module-consumer" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WS_PREFIX;$WS/build/reading-library/stage"
            cmake --build "build/account-$module-consumer" --parallel 4
          done
          cmake -S tests/reader_windows_account/consumer -B build/account-capture -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$WS_PREFIX;$WS/build/reading-library/stage"
          cmake --build build/account-capture --parallel 4
          python3 tests/windows_host/make_fixtures.py --output build/account-fixtures
          python3 tests/reader_reading_state/make_fixtures.py build/account-reading-fixtures
      - name: Execute native reading records and real process recovery
        if: ${{always() && steps.retained_build.outcome == 'success'}}
        run: |
          python3 tests/reader_windows_records/check_ui.py --candidate build/ws-package/EXReader/EXReader.exe --review build/ws-host/EXReaderShelfReview.exe --font build/ws-package/EXReader/Reader.otf --capture-probe build/account-capture/reading-capture-probe.exe --revision-consumer build/account-revisions-consumer/revision-consumer.exe --output build/ws-records-ui
      - name: Run every retained Windows account host regression
        if: ${{always() && steps.retained_build.outcome == 'success'}}
        env:
          EXREADER_HOST_ACCEPTANCE: '1'
        run: |
          set -o pipefail
          python3 tests/windows_host/check_evidence.py --package build/ws-package/EXReader --sdk build/reading-library/stage --manifest build/ws-package/build.json --fixtures build/account-fixtures --selftest-report build/ws-package/report.json --consumer-binary build/ws-host/EXReaderProduct.exe --static-link-map build/ws-host/windows-host.map --output build/account-negative
          python3 tools/check_windows_host.py --package build/ws-package/EXReader --output build/account-ui158 --sdk build/reading-library/stage --manifest build/ws-package/build.json --steps tests/windows_host --fixtures build/account-fixtures --selftest-report build/ws-package/report.json --consumer-binary build/ws-host/EXReaderProduct.exe --static-link-map build/ws-host/windows-host.map
          python3 tests/reader_catalog/check_windows_product.py --package build/ws-package/EXReader --original-evidence build/account-ui158 --fixtures build/account-fixtures --output build/account-product10
          python3 tests/windows_host/check_shelf_worker.py --candidate build/ws-host/EXReaderShelfReview.exe --package build/ws-package/EXReader --output build/account-worker5
          python3 tests/reader_windows_account/run_retained_shelf.py --candidate build/ws-package/EXReader/EXReader.exe --seed build/ws-host/reader-windows-shelf-seed.exe --package build/ws-package/EXReader --output build/account-shelf-ui
          python3 tests/windows_host/check_metadata_ui.py --candidate build/ws-package/EXReader/EXReader.exe --package build/ws-package/EXReader --command-consumer build/account-commands-consumer/command-consumer.exe --output build/account-metadata-ui
          python3 tests/reader_windows_account/check_account_ui.py --candidate build/ws-package/EXReader/EXReader.exe --package build/ws-package/EXReader --fixtures build/account-fixtures --revision-consumer build/account-revisions-consumer/revision-consumer.exe --capture-probe build/account-capture/reading-capture-probe.exe --reading-fixtures build/account-reading-fixtures --reading-font tests/fixtures/fonts/primary.ttf --link-map build/ws-host/windows-host.map --output build/account-ui
          python3 tests/reader_windows_account/check_a11y_ui.py --candidate build/ws-package/EXReader/EXReader.exe --package build/ws-package/EXReader --fixtures build/account-reading-fixtures --output build/account-a11y
      - name: Preserve source-bound initial evidence without granting broader scope
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-search-initial-${{github.run_id}}-${{github.run_attempt}}
          path: |
            build/winsearch-logs/
            build/ws-records-ui/
            build/account-capture/reading-capture-probe.exe
            build/account-revisions-consumer/revision-consumer.exe
            build/ws-navigation-module-evidence/
            build/ws-navigation-ui/
            build/ws-navigation-consumer/navigation-probe.exe
            build/ws-navigation-consumer/navigation-c-consumer.exe
            build/ws-navigation-cfi/navigation-fixture-cfi.exe
            build/ws-navigation-only/windows-host.map
            build/ws-navigation-only/EXReaderProduct.exe
            build/ws-search-module-evidence/
            build/ws-search-ui/
            build/ws-search-formats/
            build/ws-search-keyboard/
            build/ws-search-consumer/search-probe.exe
            build/ws-search-consumer/search-c-consumer.exe
            build/ws-host/EXReaderShelfReview.exe
            build/ws-host/EXReaderProduct.exe
            build/account-negative/
            build/account-ui158/
            build/account-product10/
            build/account-worker5/
            build/account-shelf-ui/
            build/account-metadata-ui/
            build/account-ui/
            build/account-a11y/
            build/ws-host/windows-host.map
            build/ws-host/CMakeCache.txt
            build/ws-package/
          if-no-files-found: error
  summary:
    if: ${{always() && github.event.inputs.inspect_artifact == ''}}
    needs: search
    name: same-source native Windows search artifact authentication
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate candidate and isolated worker evidence from this exact run
        env:
          GH_TOKEN: ${{github.token}}
          SEARCH_RESULT: ${{needs.search.result}}
          ARTIFACT_ID: ${{needs.search.outputs.artifact_id}}
          UPLOAD_DIGEST: ${{needs.search.outputs.artifact_digest}}
        run: python3 tests/reader_windows_records/verify.py
      - name: Preserve strict summary including rejections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-search-summary-${{github.run_id}}-${{github.run_attempt}}
          path: |
            build/winsearch-summary/verified.json
            build/winnav-summary/verified.json
            build/winrecords-summary/verified.json
          if-no-files-found: error
  inspect:
    if: ${{github.event.inputs.inspect_artifact != '' && github.event_name == 'workflow_dispatch'}}
    name: read preserved Windows search failure evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate and inspect the original failure ZIP without acceptance
        env:
          GH_TOKEN: ${{github.token}}
          INSPECT_ARTIFACT: ${{inputs.inspect_artifact}}
        run: python3 tests/reader_windows_search/inspect_artifact.py
