name: F08 final same-source Linux cohorts
on:
  push:
    branches: [codex/f08-final-validation-20261031, codex/f08-final-adapter-check-20261031]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: f08-final-linux-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  control:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libx11-dev xvfb openbox dbus-x11
      - name: Prove worker delays and missing generations survive the boundary
        run: |
          Xvfb :98 -screen 0 1440x900x24 -nolisten tcp > /tmp/f08-control-xvfb.log 2>&1 &
          f08_xvfb=$!
          trap 'kill $f08_xvfb 2>/dev/null || true' EXIT
          sleep 2
          DISPLAY=:98 dbus-run-session -- python3 tests/reader_f08_final_20261031/linux.py control
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check integrated Android association and Windows coverage/sealing
        run: |
          python3 -m unittest discover -s tests/reader_f08_android_binding_20261031 -v
          python3 tests/reader_f08_windows_native_frame_20261031/native_audit.py --self-test
          mkdir -p build/f08-native-control/integration-latch
          javac -d build/f08-native-control/integration-latch examples/android/app/src/main/java/org/exreader/host/CatalogFrameLatch.java tests/reader_f08_android_binding_20261031/CatalogFrameLatchControl.java
          java -cp build/f08-native-control/integration-latch org.exreader.host.CatalogFrameLatchControl > build/f08-native-control/integration-latch/state-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-linux-native-cost-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-native-control/
          if-no-files-found: warn
  sample:
    if: github.ref != 'refs/heads/codex/f08-final-adapter-check-20261031'
    needs: control
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.raw.outputs.artifact-id }}
      artifact_digest: ${{ steps.raw.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the fixed full product toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libx11-dev libsecret-1-dev gnome-keyring libcurl4-openssl-dev libxml2-dev libssl-dev pkg-config ninja-build xvfb openbox xdotool xclip x11-utils dbus dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0
      - name: Build the admitted complete product and native observer
        run: python3 tests/reader_f08_final_20261031/linux.py build
      - name: Run 44 original, six causal and four body/jump launches on the same binary
        run: |
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp > /tmp/f08-native-xvfb.log 2>&1 &
          f08_xvfb=$!
          trap 'kill $f08_xvfb 2>/dev/null || true' EXIT
          sleep 2
          DISPLAY=:99 dbus-run-session -- bash -euo pipefail -c '
            openbox > /tmp/f08-native-openbox.log 2>&1 &
            f08_wm=$!
            trap "kill $f08_wm 2>/dev/null || true" EXIT
            sleep 1
            python3 tests/reader_f08_final_20261031/linux.py sample
          '
      - name: Seal every sample and failure
        if: always()
        run: |
          mkdir -p build/f08-linux-product/evidence
          cp /tmp/f08-native-*.log build/f08-linux-product/evidence/ 2>/dev/null || true
          python3 tests/reader_f08_final_20261031/linux.py seal
      - uses: actions/upload-artifact@v4
        id: raw
        if: always()
        with:
          name: f08-linux-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f08-linux-product/evidence/
          include-hidden-files: true
          if-no-files-found: error
  audit:
    needs: sample
    if: always() && needs.sample.outputs.artifact_id != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate full ZIP and replay original scenarios and every generation
        env:
          GH_TOKEN: ${{ github.token }}
          F08_ARTIFACT_ID: ${{ needs.sample.outputs.artifact_id }}
          F08_ARTIFACT_DIGEST: ${{ needs.sample.outputs.artifact_digest }}
        run: python3 tests/reader_f08_final_20261031/linux.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-linux-native-cost-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f08-linux-product-audit/audit.json
            build/f08-linux-product-audit/metadata.json
            build/f08-linux-product-audit/final-linux-audit.json
            build/f08-linux-product-audit/*.log
          if-no-files-found: error
