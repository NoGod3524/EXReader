name: Dot F10 fixed producer audit correction
on:
  push:
    branches: [dot/f10-stale-owner-20261031]
    paths: [.github/workflows/dot-f10-stale-owner-20261031.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact four-file audit-only scope
        run: |
          python - <<'PY'
          import json,subprocess
          m=json.load(open('tests/product/f10_stale_owner_20261031/manifest.json'))
          changed=subprocess.check_output(['git','diff','--name-only',m['reaudit_base'],'HEAD'],text=True).splitlines()
          assert sorted(changed)==sorted(m['reaudit_paths']),changed
          print(json.dumps({'audit_only_paths':changed,'product_runs':0}))
          PY
      - name: Verify fixed original artifact and safely materialize evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/stale-download build/stale-audit
          gh api repos/NoGod3524/EXReader/actions/artifacts/13066057477 > build/original-metadata.json
          gh api repos/NoGod3524/EXReader/actions/artifacts/13066057477/zip > build/original.zip
          python - <<'PY'
          import hashlib,json,stat,zipfile
          from pathlib import Path,PurePosixPath
          expected=json.load(open('tests/product/f10_stale_owner_20261031/manifest.json'))['fixed_producer']
          m=json.load(open('build/original-metadata.json'));b=Path('build/original.zip').read_bytes()
          assert m['id']==expected['id'] and m['name']==expected['name']
          assert len(b)==m['size_in_bytes']==expected['size']
          assert m['workflow_run']['id']==expected['run'] and m['workflow_run']['head_sha']==expected['source']
          assert m['digest']=='sha256:'+expected['sha256'] and hashlib.sha256(b).hexdigest()==expected['sha256']
          root=Path('build/stale-download')
          with zipfile.ZipFile('build/original.zip') as z:
              members=z.infolist()
              assert len(members)<=2048 and len({i.filename for i in members})==len(members)
              assert sum(i.file_size for i in members)<=128*1024*1024
              for i in members:
                  path=PurePosixPath(i.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in i.filename
                  assert not stat.S_ISLNK(i.external_attr>>16) and i.file_size<=32*1024*1024
              z.extractall(root)
          print(json.dumps({'fixed_producer':expected,'original_zip_preserved':True,'product_execution':False}))
          Path('build/stale-audit/original-identity.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Re-audit original observations with original assertions
        env:
          F10_FIXED_PRODUCER_AUDIT: '1'
        run: python tests/product/f10_stale_owner_20261031/verify.py --input build/stale-download --output build/stale-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10-fixed-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/stale-audit/
          if-no-files-found: error
# Prepared skip-ci; one approved five-minute audit, never a product rerun.

