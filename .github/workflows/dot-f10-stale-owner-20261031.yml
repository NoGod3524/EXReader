name: Dot F10 stale owner additive API
on:
  push:
    branches: [dot/f10-stale-owner-20261031]
    paths: [.github/workflows/dot-f10-stale-owner-20261031.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact ownership and unchanged SDK guard
        run: |
          python - <<'PY'
          import json,subprocess
          m=json.load(open('tests/product/f10_stale_owner_20261031/manifest.json'))
          changed=subprocess.check_output(['git','diff','--name-only',m['base'],'HEAD'],text=True).splitlines()
          assert sorted(changed)==sorted(m['allowed_paths']),changed
          subprocess.run(['git','diff','--exit-code',m['base'],'HEAD','--','src','include','cmake','CMakeLists.txt','bindings'],check=True)
          PY
          python -m py_compile tests/product/f10_stale_owner_20261031/{run,verify}.py
      - name: Build installed production library and labelled boundary variant
        run: |
          set -euo pipefail
          mkdir -p build/stale/logs build/stale/prefix
          p="$(realpath build/stale/prefix)"
          trap 'rc=$?; for f in build/stale/logs/*.log; do echo "--- $f"; tail -n 80 "$f"; done; exit "$rc"' ERR
          cmake -S extras/webdav-cleanup -B build/stale/core -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$p" 2>&1 | tee build/stale/logs/core-config.log
          cmake --build build/stale/core 2>&1 | tee build/stale/logs/core-build.log
          cmake --install build/stale/core 2>&1 | tee -a build/stale/logs/core-build.log
          cmake -S tests/product/f10_stale_owner_20261031 -B build/stale/probe -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$p" 2>&1 | tee build/stale/logs/probe-config.log
          cmake --build build/stale/probe 2>&1 | tee build/stale/logs/probe-build.log
      - name: Real process death permissions identities and unchanged limits
        run: python tests/product/f10_stale_owner_20261031/run.py --bin build/stale/probe --output build/stale/evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10-stale-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/stale/evidence/
            build/stale/logs/
            build/stale/prefix/
            build/stale/probe/f10-stale-probe
            build/stale/probe/f10-stale-boundary-probe
          if-no-files-found: error
  audit:
    needs: linux
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: f10-stale-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/stale-download
      - name: Independent raw log and identity acceptance with negative controls
        run: python tests/product/f10_stale_owner_20261031/verify.py --input build/stale-download --output build/stale-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f10-stale-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/stale-audit/
          if-no-files-found: error
# Prepared only; one approved activation follows independent static review.
