name: Native sync macOS adoption
on:
  push:
    branches: [codex/reader-sync-apple]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/reader-commands.yml
    with:
      platforms: '["ubuntu-22.04","windows-2022","macos-15"]'
      session: true
  evidence:
    name: strict native sync platform evidence
    needs: [native]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate all three platform ZIPs and every retained native report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/reader_sync/check_apple_artifacts.py build/sync-apple-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-sync-apple-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/sync-apple-evidence/
          if-no-files-found: error
