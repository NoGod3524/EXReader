name: F02 same-source Windows to Android
on:
  push:
    branches: [codex/gpt-f02-same-source-win-android-20261031]
permissions:
  contents: read
  actions: read
concurrency:
  group: gpt-f02-same-source-win-android
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
defaults:
  run:
    shell: bash
jobs:
  admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact6 source, SDK8357 and frozen shared-module admission
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python -m py_compile tests/reader_f02_win_android_20261031/*.py
          python tests/reader_f02_win_android_20261031/fetch_sender.py guard
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          base='3ba9dbefe975b60cd6d3b6d2dac6d186f43c637b'
          java='tests/reader_f02_win_android_20261031/java/org/exreader/host/F02ReceiveTest.java'
          old=subprocess.check_output(['git','show',base+':'+java],text=True)
          now=Path(java).read_text()
          match=re.search(r'(?ms)^    // F02_COLD_CACHE_PRECONDITION_BEGIN\n(.*?)^    // F02_COLD_CACHE_PRECONDITION_END\n',now)
          assert match and now.count('F02_COLD_CACHE_PRECONDITION_BEGIN')==now.count('F02_COLD_CACHE_PRECONDITION_END')==1
          normalized=now[:match.start()]+now[match.end():]
          for call in ('prepareColdCache();','coldCacheMustRemainAbsent();','normalDownloadStart();','normalDownloadEnd();','duplicateGetStart();','duplicateGetEnd();'):
              normalized=normalized.replace(call,'')
          assert re.findall(r'need\((.*?)\);',old,re.S)==re.findall(r'need\((.*?)\);',normalized,re.S), 'all original Java assertions'
          for fragment in ['get(45,TimeUnit.SECONDS)','null,120000','this::tap,30000','SystemClock.sleep(80)']:
              assert old.count(fragment)==normalized.count(fragment), 'original timeouts/polling'
          group='check("corrupt_original_rejected",()->{mode("corrupt");receive();status("完整性校验失败");empty();});'
          assert group in normalized, 'original corrupt calls retained after explicit new preparation'
          assert 'Files.delete' not in match[1] and 'Files.move(active.toPath(),isolated.toPath(),java.nio.file.StandardCopyOption.ATOMIC_MOVE)' in match[1], 'single atomic isolation without deletion'
          run=Path('tests/reader_f02_win_android_20261031/run.py').read_text()
          assert 'self.send(200,bytes([original[0]^1])+original[1:])' in run, 'original xor1 payload'
          expected={
           '.github/workflows/dot-f02-win-android-transfer-20261031.yml',
           'docs/reader-total-progress/DOT_F02_WIN_ANDROID_TRANSFER_20261031.md',
           'tests/reader_f02_win_android_20261031/fetch_sender.py',
           'tests/reader_f02_win_android_20261031/authenticate.py','tests/reader_f02_win_android_20261031/run.py','tests/reader_f02_win_android_20261031/source_lock.json'}
          source_base='86d38aec32a53bafff80d8f01fd677e10a4e5e64'
          changed=set(subprocess.check_output(['git','diff','--name-only',source_base,'HEAD'],text=True).splitlines())
          assert changed==expected, 'exact six changed paths'
          audit_path='tests/reader_f02_win_android_20261031/authenticate.py'
          original_audit=subprocess.check_output(['git','show',source_base+':'+audit_path],text=True)
          audit=Path(audit_path).read_text()
          assert audit.split('def compare(',1)[1].split('def current_artifact(',1)[0]==original_audit.split('def compare(',1)[1].split('def current_artifact(',1)[0], 'original20 audit semantics'
          assert audit.split('def negatives(',1)[1].split('def provenance_negatives(',1)[0]==original_audit.split('def negatives(',1)[1].split('def main(',1)[0], 'original12 controls unchanged'
          old_run=subprocess.check_output(['git','show',source_base+':tests/reader_f02_win_android_20261031/run.py'],text=True)
          marker=" sys.path.insert(0,str(ROOT/'tests/reader_session_android'));from run_roundtrip import Dav"
          assert run[run.index(marker):]==old_run[old_run.index(marker):], 'original receive, faults, timeouts and offline sequence unchanged'
          print('F02_COLD_SOURCE_GUARD original20 assertions/timeouts/input retained; explicit cold precondition only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02-android-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f02-android/admission.json
          if-no-files-found: warn
  windows:
    needs: admission
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      EXREADER_ORIGINAL_HASH_PREFIX: ${{ github.workspace }}/build/f02-hash
    outputs:
      artifact_id: ${{ steps.sender.outputs.artifact-id }}
      artifact_digest: ${{ steps.sender.outputs.artifact-digest }}
      sdk_artifact_id: ${{ steps.sdk.outputs.artifact-id }}
      sdk_artifact_digest: ${{ steps.sdk.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install the existing public hash owner
        shell: pwsh
        run: |
          cmake -S extras/opds -B build/f02-hash-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEXREADER_OPDS_HASH_ONLY=ON "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/build/f02-hash"
          if ($LASTEXITCODE) { throw 'hash configure' }
          cmake --build build/f02-hash-build --parallel 4
          if ($LASTEXITCODE) { throw 'hash build' }
          cmake --install build/f02-hash-build
          if ($LASTEXITCODE) { throw 'hash install' }
      - name: Export canonical installed original-hash prefix
        shell: pwsh
        run: |
          @'
          file(REAL_PATH "$ENV{GITHUB_WORKSPACE}/build/f02-hash" prefix)
          if(NOT IS_ABSOLUTE "${prefix}" OR NOT IS_DIRECTORY "${prefix}")
            message(FATAL_ERROR "Installed original hash prefix missing")
          endif()
          file(APPEND "$ENV{GITHUB_ENV}" "EXREADER_ORIGINAL_HASH_PREFIX=${prefix}\n")
          '@ | Set-Content -Encoding utf8 build/f02-canonical-prefix.cmake
          cmake -P build/f02-canonical-prefix.cmake
          if ($LASTEXITCODE) { throw 'canonical prefix export' }
      - name: Verify SDK candidate identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 8357eafa28423a7ab93ba08b823af80f01ad1505 HEAD -- src include cmake CMakeLists.txt
      - name: Prepare native display
        run: python tests/reader_native_owner_repairs/display.py
      - name: Install UI automation
        run: python -m pip install uiautomation==2.0.29
      - name: Build and package the 3.42 native host
        id: build
        run: python tests/windows_sdk342/build.py
      - name: Build existing installed public SDK original inspector
        shell: pwsh
        run: |
          cmake -S tests/reader_gtk_receive -B build/f02-inspector -G Ninja -DCMAKE_BUILD_TYPE=Release "-DEXR_SDK_VERSION:STRING=3.42.0" "-DCMAKE_PREFIX_PATH=$pwd/build/windows-sdk342/sdk"
          if ($LASTEXITCODE) { throw 'inspector configure' }
          $versionLines = @(Select-String -LiteralPath build/f02-inspector/CMakeCache.txt -Pattern '^EXR_SDK_VERSION:STRING=3\.42\.0$')
          if ($versionLines.Count -ne 1) { throw 'F02 actual CMake SDK version differs' }
          Write-Output 'F02_CMAKE_VERSION build/f02-inspector=3.42.0 STRING'
          cmake --build build/f02-inspector --parallel 4
          if ($LASTEXITCODE) { throw 'inspector build' }
      - name: Retain installed static SDK, configs, link map and actual program identity
        id: sdk_proof
        run: python tests/reader_f02_win_android_20261031/fetch_sender.py windows-proof
      - name: Native Windows import and actual HTTPS PUT
        id: sender_driver
        run: python tests/reader_f02_win_gtk_20261031/windows_send.py
      - name: Preserve actual server upload and sender evidence
        id: sender
        if: always() && steps.sender_driver.outputs.safe_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f02-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f02-windows/
          if-no-files-found: warn
      - name: Preserve installed Windows SDK proof on success or failure
        id: sdk
        if: always() && steps.sdk_proof.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: f02-windows-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f02-windows-sdk/
          if-no-files-found: error
      - name: Preserve bounded Windows build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f02-windows-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/windows-sdk342/logs/
            build/windows-sdk342/package/report.json
            build/windows-sdk342/package/build.json
            build/native-owner-preflight/display.json
          if-no-files-found: warn
  android:
    needs: [admission, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Authenticate this run's Windows original and installed SDK ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          F02_WINDOWS_ARTIFACT_ID: ${{ needs.windows.outputs.artifact_id }}
          F02_WINDOWS_ARTIFACT_DIGEST: ${{ needs.windows.outputs.artifact_digest }}
          F02_WINDOWS_SDK_ARTIFACT_ID: ${{ needs.windows.outputs.sdk_artifact_id }}
          F02_WINDOWS_SDK_ARTIFACT_DIGEST: ${{ needs.windows.outputs.sdk_artifact_digest }}
        run: python tests/reader_f02_win_android_20261031/fetch_sender.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: f02-android-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f02-android-input/
          include-hidden-files: true
          if-no-files-found: error
      - name: Build fixed SDK342 and matched real Activity/instrumentation APKs
        id: build
        run: python tests/reader_f02_win_android_20261031/build.py
      - name: Retain installed shared SDK and actual APK JNI proof
        run: python tests/reader_f02_win_android_20261031/fetch_sender.py android-proof
      - name: Enable the original emulator accelerator
        run: sudo chmod 666 /dev/kvm
      - name: Actual receive, public original readback and offline process reopen
        id: receive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python tests/reader_f02_win_android_20261031/run.py
      - name: Preserve safe build evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f02-android-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/f02-android/build.json
            build/f02-android/*.log
            build/f02-android/recipe-*.sh
            build/f02-android/artifacts/
          if-no-files-found: warn
      - name: Preserve credential-scanned receiver evidence
        if: always() && steps.receive.outputs.safe_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: f02-android-receiver-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f02-android/
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve bounded public terminal status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f02-android-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f02-android-status/
          if-no-files-found: warn
  authenticate:
    needs: [admission, windows, android]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Authenticate same-source originals, retain12 and add4 provenance controls
        env:
          GH_TOKEN: ${{ github.token }}
          F02_WINDOWS_ARTIFACT_ID: ${{ needs.windows.outputs.artifact_id }}
          F02_WINDOWS_ARTIFACT_DIGEST: ${{ needs.windows.outputs.artifact_digest }}
          F02_WINDOWS_SDK_ARTIFACT_ID: ${{ needs.windows.outputs.sdk_artifact_id }}
          F02_WINDOWS_SDK_ARTIFACT_DIGEST: ${{ needs.windows.outputs.sdk_artifact_digest }}
        run: python tests/reader_f02_win_android_20261031/authenticate.py
      - name: Recompute cold isolation and target original GET boundaries
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0,'tests/reader_f02_win_android_20261031')
          from fetch_sender import OUT, identity, sha, unpack_current, old_verifier
          target=OUT/'independent'
          result=dict(identity=identity(),passed=False,errors=[],F02_accepted=False,formal='95/108')
          def require(value,code):
              if not value:raise AssertionError(code)
          try:
              previous=json.loads((target/'summary.json').read_text())
              require(previous['passed'] and len(previous['controls'])==12,'original_independent_audit_and12_controls')
              inputs=unpack_current((target/'input.zip').read_bytes())
              files=unpack_current((target/'receiver.zip').read_bytes())
              frozen=old_verifier();windows=frozen.unpack(inputs['sender.zip']);sender=frozen.verify_sender(windows)
              original=windows['objects/'+sender['original_sha256']]
              require(len(original)==sender['original_bytes']==12000 and sha(original)==sender['original_sha256'],'fixed_original_bytes')
              report=json.loads(files['report.json'])
              cold=report['phases'][0]['observed']['cold_cache_preparation']
              epochs=[]
              for name in ('owner_before','owner_fenced','owner_after'):
                  owner=cold[name];epochs.append(owner['epoch'])
                  require(owner['session_present'] is True and owner['controller_state']==owner['native_state']==4
                          and owner['native_code']==0 and owner['completed_shards']==256 and owner['target_present'] is True
                          and owner['target_local_id']==0 and owner['target_receivable'] is True,'cold_owner_finished')
                  require(all(owner[k] is False for k in ('preparing','receiving','projecting','closingOwned','pollQueued','sdk_task_present')),'cold_owner_idle')
              require(len(set(epochs))==1 and cold['sdk_books_before']==0 and cold['directory_mode']==0o700,'cold_setup_identity_and_owner')
              before=cold['before'];isolated=cold['isolated']
              require(cold['status']=='ready' and cold['active_after']['exists'] is False
                      and cold['quarantine_relative']=='f02-cold-cache-isolation/'+sender['original_sha256']+'.txt','cold_atomic_move_record')
              for value in (before,isolated):
                  require(value['exists'] is True and value['regular'] is True and value['symbolic'] is False
                          and value['nlink']==1 and value['uid']==report['phases'][0]['uid']>0
                          and value['size']==12000 and value['sha256']==sha(original),'cold_file_identity')
              require(all(before[k]==isolated[k] for k in ('dev','ino','nlink','uid','size','mode','sha256')),'atomic_rename_preserves_identity')
              guards=cold['guards']
              require(len(guards)>=9 and all(g['active_exists'] is False for g in guards),'cold_cache_never_rebuilt_at_boundaries')
              raw=files['cold-cache-isolated-original.txt'];native=report['cold_cache_isolation']['native']
              require(raw==original and report['cold_cache_isolation']['identity']==identity()
                      and native['exists'] is True and native['sha256']==sha(raw),'retained_isolation_raw_bytes')
              values=files['cold-cache-isolated-native-stat.txt'].decode().strip().split()
              require(len(values)==6 and all(v.isdigit() for v in values),'raw_isolation_stat_shape')
              parsed=dict(zip(('dev','ino','nlink','uid','size'),map(int,values[:5])));parsed['mode']=int(values[5],8)
              require(all(parsed[k]==isolated[k] for k in parsed) and all(native[k]==isolated[k] for k in ('dev','ino','nlink','uid','size')),'raw_stat_recomputes_isolation_identity')
              events=json.loads(files['events.json']);requests=json.loads(files['original-get-requests.json'])
              require(requests==report['original_get_requests'] and [q['id'] for q in requests]==list(range(1,len(requests)+1)),'original_get_request_inventory')
              target_events=[e for e in events if e['method']=='GET' and e['path']==sender['object_path']]
              require(len(target_events)==len(requests),'original_get_requests_have_raw_responses')
              for request in requests:
                  event=events[request['response_event_seq']-1]
                  require(event['seq']==request['response_event_seq'] and event['method']=='GET'
                          and event['path']==sender['object_path'] and event['original_get_request_id']==request['id']
                          and request['authenticated'] is True and event['authenticated'] is True,'original_get_request_response_binding')
              history=report['original_get_counter_history'];count=0
              for publication,value in enumerate(history,1):
                  require(value['identity']==identity() and value['original_sha256']==sender['original_sha256']
                          and value['publication']==publication,'counter_publication_identity')
                  if value['kind']=='request':
                      count+=1;require(requests[count-1]['start_publication']==publication,'counter_request_publication')
                  else:
                      require(value['kind']=='response','counter_publication_kind')
                      event=events[value['last_event_seq']-1]
                      require(event['original_get_request_id']==value['response_request_id']
                              and all(value[k]==event[v] for k,v in (('authenticated','authenticated'),('response_status','status'),('response_bytes','response_bytes'),('response_sha256','response_sha256'))),'counter_response_recomputed')
                  require(value['count']==value['last_request_id']==count,'counter_request_count_recomputed')
              require(count==len(requests),'counter_complete')
              def snapshot(value):
                  require(value in history and value['count']>0 and value['last_event_seq']>0,'snapshot_is_atomic_counter_publication')
                  return value['count']
              faults=report['fault_observations']
              require([f['mode'] for f in faults]==['corrupt','truncate','block'] and all(f['mode_consumed'] is True and f['authenticated'] is True for f in faults),'all_original_fault_modes_consumed')
              corrupt=faults[0];event=events[corrupt['event_seq']-1]
              corrupted=bytes([original[0]^1])+original[1:]
              require(corrupt['corrupt_sent'] is True and event['method']=='GET' and event['path']==sender['object_path']
                      and event['status']==200 and event['response_bytes']==12000 and event['response_sha256']==sha(corrupted)
                      and corrupt['response_sha256']==sha(corrupted),'exact_xor1_original_response')
              normal=report['phases'][0]['observed']['normal_download']
              n0=snapshot(normal['before']);n1=snapshot(normal['after'])
              require(n1>n0,'normal_download_added_original_request')
              candidates=[q for q in requests if n0<q['id']<=n1 and q['fault_mode']=='none']
              require(any(events[q['response_event_seq']-1]['status']==200 and events[q['response_event_seq']-1]['response_bytes']==12000
                          and events[q['response_event_seq']-1]['response_sha256']==sha(original) for q in candidates),'normal_download_received_original_bytes')
              duplicate=report['phases'][0]['observed']['duplicate_original_gets']
              d0=snapshot(duplicate['before']);d1=snapshot(duplicate['after'])
              require(d0==d1,'duplicate_added_no_original_get')
              for value in (duplicate['cache_before'],duplicate['cache_after']):
                  require(value['exists'] is True and value['size']==12000 and value['sha256']==sha(original),'duplicate_valid_cache_identity')
              result.update(passed=True,original_controls=12,isolated_original_bytes=len(raw),isolated_dev=parsed['dev'],isolated_ino=parsed['ino'],
                            original_get_requests=len(requests),normal_get_before=n0,normal_get_after=n1,duplicate_get_before=d0,duplicate_get_after=d1,
                            exact_corrupt_xor1_verified=True,cold_owner_finished=True)
          except AssertionError as error:
              result['errors'].append(str(error))
          except Exception as error:
              result['errors'].append(type(error).__name__)
          finally:
              (target/'cold-cache-verification.json').write_text(json.dumps(result,indent=2)+'\n')
              print('F02_COLD_CACHE_AUDIT '+json.dumps(result),flush=True)
          if not result['passed']:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02-android-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/f02-android/independent/
          if-no-files-found: error
